    renderMyGames(document.getElementById('main'));
  });
  /* ★v16-A：分页条。翻页只重渲染本页（数据已在内存，不需要异步取）。 */
  bindPager(main, 'myGames', totalN, () => renderMyGames(document.getElementById('main')));
  /* 行内按钮与整行点击共用同一套事件委托（见下方 document 级监听），这里不重复绑 */
  syncImgs(main);
}

async function scanMyGames(){
  if(!HAS_SHELL || LOCAL.scanning) return;
  LOCAL.scanning = true;
  if(cur === 'myGames') renderMyGames(document.getElementById('main'));
  let res = null;
  try{ res = await SHELL.scanGames(); }catch(e){ res = { ok:false, error:String(e && e.message || e) }; }
  const games = (res && res.games) || [];
  LOCAL.note = (res && res.note) || '';
  /* 与全量库匹配：每条只取一个（并发限流 6），命中就挂上库内条目 */
  await matchLocal(games);
  /* ★ 顺序很重要（2026-10-16 实拍时量出来的）：
     scanMyGames() 其实是**两段**——① 壳扫盘（本机实测 20 ms，很快）
     ② 与全量库匹配（67 条各发一个 /api/library?q=，实测约 2 秒）。
     原先 `LOCAL.scanning = false` 写在①之后、②之前，于是有一段**中间态**：
     `scanning` 已是 false 而 `LOCAL.games` 还是空 —— 界面上就是「扫描已停、列表全空」。
     实测 trace = `-0,-0,-0,-0,-67`（前 2 秒全是 0），说明这个窗口真实存在、还不短。
     ⇒ 现在把 games / scanned / scanning **三件事都放到匹配之后**，
        `scanning` 的含义变成「整件事做完了」，与用户看到的界面一致。 */
  LOCAL.games = games;
  LOCAL.scanned = true;
  LOCAL.scanning = false;
  refreshCounts();
  if(cur === 'myGames') renderMyGames(document.getElementById('main'));
  shellSay('扫描完成 · ' + games.length + ' 款');
}

/* ★v15 相似度闸门 —— 为什么不能只看 `/api/library?q=` 返回了东西：
   它是**模糊搜索**，对任何字符串都会给出「最像的一条」。实测把本机快捷方式
   （「设置向导」「项目管理器」这类）也匹配上了库里的同名/近似条目。
   所以必须再比一次名字：归一化后**相等或互相包含**才算数。
   归一化口径：小写、去括号补充、去空白与常见分隔符；
   `b` 若是「中文名/英文名」形式，则按 `/` 分段逐一比对。 */
/* 整串归一化：小写、去括号补充、去空白与常见分隔符（用于「整串相等」判定） */
function normTitle(s){
  return String(s || '').toLowerCase()
    .replace(/[（(【\[].{0,20}?[)）】\]]/g, '')
    .replace(/[\s\-_:：·・!！?？.,，'’"“”]+/g, '');
}

/* 词级切分：先把驼峰与「字母↔数字」边界断开，再按非字母数字汉字切分。
   只服务于 simName 的「词集完全相同」判定（见下）。
   ★ 括号这里只当**分隔符**、内容要保留（「仁王（完全版）」→ 仁王 / 完全版）——
     和 normTitle 的「整串去掉括号补充」是两种不同用途，别抄错。 */
function words(s){
  return String(s || '')
    .replace(/[（(【\[）)】\]]/g, ' ')
    .replace(/([a-z])([A-Z])/g, '$1 $2')
    .replace(/([A-Za-z])(\d)|(\d)([A-Za-z])/g, '$1$3 $2$4')
    .toLowerCase()
    .split(/[^0-9a-z\u4e00-\u9fa5]+/)
    .filter(Boolean);
}

/* ★v15 相似度闸门（2026-10-16 **收紧**）——
   为什么不能只看 `/api/library?q=` 返回了东西：它是**模糊搜索**，对任何串都会给出
   「最像的一条」。而用字符级 includes 去确认时，**短名几乎总能被长名包含住** ——
   实拍本机 6 条「命中」里 4 条以上是把无关快捷方式认成了游戏：
       Run      → Runehaven              （'runehaven'.includes('run')）
       Paint    → City Painter           （'citypainter'.includes('paint')）
       Chen     → Kitchen Sync: Aloha!   （'kitchensyncaloha'.includes('chen')）
       QQ       → EQQO                   （'eqqo'.includes('qq')）
       services → Car Service Simulator  （'carservicesimulator'.includes('services')）
       computer → Computer Shrilow       （词能对上，仍显然不是一个游戏）
   判据收紧为两条，**任一成立才算命中**：
     ① 归一化后**整串相等**（最可靠；真命中实测就是这种，如 Kitchen Sync: Aloha! ↔ 自身）
     ② **词集完全相同**（顺序无关，容得下「A B」↔「B A」这类换序）
   同时保留「库标题形如『中文名/英文名』时按 / 分段逐一比」的口径。
   ⇒ 宁可少报也不要假报：扫盘的意义是「帮你找到这游戏有资源」，
     认错了反而让人白高兴一场。 */
function simName(a, b){
  const x = normTitle(a);
  if(!x) return false;
  const xs = words(a);
  const parts = String(b || '').split('/');
  for(const p of parts){
    if(normTitle(p) === x) return true;                                   /* ① 整串相等 */
    const ys = words(p);
    /* ② 词集相同：个数一致且逐词可对上（用长度卡住「短名被长名包含」那类假阳性） */
    if(xs.length && xs.length === ys.length && xs.every(w => ys.includes(w))) return true;
  }
  return false;
}

/* ================= ★v16-D 本机游戏 ↔ 库记录 关联 =================
   用户 2026-10-16：「记得本地的游戏我需要进行能够关联，通过游戏名/游戏在steam的id等方式」。

   ★ 为什么必须**两条路**（id + 名字），而不是只用一条：
     · **只靠名字**：库标题是「中文名/英文名」混排（「剑星/Stellar Blade」），
       本机侧是 Steam 的 `"name"`（可能英文、可能中文、可能带 ™）—— 改名 / 繁简 /
       后缀差异都会漏。
     · **只靠 appid**：上游**只有 `sort=hot` / `sort=score` / `/api/library?q=` 三条路径返回 appid**
       （`sort=updated` 是 11 字段、**没有 appid**）；且实测 `q=3489700` → `count=0`
       ⇒ **appid 不能直接当搜索词**，只能在「按名字搜回来的候选里」做硬比对。
     ⇒ 顺序：**按名字搜 → 候选里先找 appid 相等（硬命中）→ 没有再用名字闸门**。
   ★ 关联结果**落盘**（`LOCAL.links`）⇒ 下次扫描**零请求**套回去；用户手动改过的不被自动覆盖。
   ★ 全程**零新增爬虫**（用户口径「先零新增获取，没有再爬取兜底」）—— 只调上游已有的
     `/api/library?q=`；连它都拿不到（离线）时只套已存关联，**不猜**。 */

const LINK_KEY = 'gi-local-links';

function linkLoad(){
  try{
    const raw = localStorage.getItem(LINK_KEY);
    const o = raw ? JSON.parse(raw) : null;
    if(o && typeof o === 'object' && !Array.isArray(o)) LOCAL.links = o;
  }catch(e){ /* 存储不可用（隐私模式 / 严格环境）⇒ 退化为会话内关联 */ }
}
function linkSave(){
  try{ localStorage.setItem(LINK_KEY, JSON.stringify(LOCAL.links)); }catch(e){ /* 同上 */ }
}
/* 本机侧键：Steam appid 最硬（改名字也不影响）；没有 appid 才退回归一化名 */
function linkKeyOfGame(g){
  g = g || {};
  const sid = String(g.steamId || g.appid || '').trim();
  if(sid) return 'sid:' + sid;
  const nm = normTitle(g.name || g.title);
  return nm ? 'nm:' + nm : '';
}
/* 库记录快照：只留关联与展示要用的字段 —— 不整条塞进 localStorage（15 个字段太长） */
function linkSnap(rec){
  rec = rec || {};
  return { title: rec.title || '', cover: rec.cover || '',
           liveId: rec.liveId || rec.recId || '',
           appid: rec.appid ? String(rec.appid) : '',
           score: rec.score, genre: rec.genre || '',
           url: rec.url || '', alt: rec.alt || '', res: rec.res || null };
}
function linkSet(g, rec, via){
  const k = linkKeyOfGame(g);
  if(!k) return false;
  const snap = linkSnap(rec);
  snap.via = via || 'auto';
  LOCAL.links[k] = snap;
  linkSave();
  return true;
}
function linkDel(g){
  const k = linkKeyOfGame(g);
  if(k && LOCAL.links[k]){ delete LOCAL.links[k]; linkSave(); return true; }
  return false;
}
/* 零请求把已存关联套回扫盘结果；返回**还没关联上**的那些（留给网络那一段） */
function linkApply(games){
  const rest = [];
  (games || []).forEach(g => {
    const k = linkKeyOfGame(g);
    const rec = k ? LOCAL.links[k] : null;
    if(rec){ g.hit = rec; g.via = rec.via || 'auto'; }
    else rest.push(g);
  });
  return rest;
}
/* via 的人类可读标签（`appid` 是唯一「不必再看名字」的硬证据，所以要能一眼分辨） */
const VIA_TXT = { appid: '🔗 Steam ID', name: '🔗 名称', manual: '🔗 手动', auto: '🔗 已关联', link: '🔗 已关联' };

/* 匹配：走 /api/library?q= 拿候选 → **先 appid 硬命中，再名字闸门**（见上）。
   ★ `limit=20` 而不是 1：名字搜回来的第一条未必对（续作 / 重制版会排在正作前面），
     而 appid 硬命中可能落在第 5、第 10 条 —— 只取 1 条就等于没得挑。 */
async function matchLocal(games){
  linkLoad();
  /* ① 零请求：先把已存关联（含用户手动改过的）套回去 */
  const rest = linkApply(games);
  if(!rest.length) return;
  const base = (typeof dlBoot === 'function') ? await dlBoot().catch(() => null) : null;
  if(!base) return;                       /* 离线：只认已存关联，**不猜** */
  const q = rest.slice(0);
  const limit = 6;                        /* 并发限流：上游是本地服务，6 路够快也不至于打满 */
  const worker = async () => {
    while(q.length){
      const it = q.shift();
      const nm = String(it.name || '').trim();
      if(!nm || nm.length < 2) continue;
      const sid = String(it.steamId || '').trim();
      try{
        const r = await fetch(base + '/api/library?q=' + encodeURIComponent(nm) + '&limit=20', { cache:'no-store' });
        if(!r.ok) continue;
        const j = await r.json();
        const hits = (j && j.items) || [];
        let pick = null, via = '';
        /* ② appid 硬命中：本机 Steam id 与库记录 appid 完全相等 ⇒ 不必再看名字 */
        if(sid){
          const m = hits.find(h => String(h.appid || '') === sid);
          if(m){ pick = m; via = 'appid'; }
        }
        /* ③ 名字闸门（归一化整串相等 / 词集相同），与 v15 同一条口径 */
        if(!pick){
          const m = hits.find(h => simName(nm, h.title));
          if(m){ pick = m; via = 'name'; }
        }
        if(pick){
          it.hit = livePC(pick); it.via = via;
          linkSet(it, it.hit, via);       /* 自动命中同样落盘 ⇒ 下次扫描零请求 */
        }
      }catch(e){ /* 单条失败不影响其它 */ }
    }
  };
  await Promise.all(Array.from({ length: limit }, worker));
}

/* ---- 手动关联 / 手动加入：都复用**同一个搜索弹窗**（不另做一个 picker）----
   ★ 用户已经会用「Ctrl+K 搜游戏」；关联只是「这次点结果不是看详情、而是绑到本机这条」。
   ★ 用 `LOCAL.pendingLink` / `LOCAL.adding` 这两个**状态**切换语义，而不是复制一份弹窗 ——
     复制必然与主搜索漂移（改了一处忘了另一处，本项目已经栽过这个跟头）。 */
function linkStart(gi){
  const g = (LOCAL.games || [])[gi];
  if(!g) return;
  LOCAL.pendingLink = g; LOCAL.adding = false;
  pgReset('search');
  openSearch(g.name || '');
  const sm = smaskEl(); if(sm) sm.classList.add('linkmode');
  searchRun(g.name || '', 1);
}
function addGameStart(){
  LOCAL.pendingLink = null; LOCAL.adding = true;
  pgReset('search');
  openSearch('');
  const sm = smaskEl(); if(sm) sm.classList.add('linkmode');
  searchRender();
}
function linkModeEnd(){
  LOCAL.pendingLink = null; LOCAL.adding = false;
  const sm = smaskEl(); if(sm) sm.classList.remove('linkmode');
}
/* 选中一条 → 与本机这条绑定（`manual` 优先级最高：它不会被下一次自动匹配改掉） */
function linkCommit(a){
  const g = LOCAL.pendingLink;
  if(!g || !a) return false;
  linkSet(g, a, 'manual');
  g.hit = a; g.via = 'manual';
  linkModeEnd();
  closeSearch();
  refreshCounts();
  if(cur === 'myGames') renderMyGames(document.getElementById('main'));
  shellSay('已关联：' + (a.title || ''));
  return true;
}
/* 「自定义加入」：把库里的游戏直接加进「我的游戏」，不依赖扫盘结果（用户 ③ 的一半） */
function addCommit(a){
  if(!a) return false;
  const g = { name: a.title || '', source: '手动加入', dir: '', exe: '',
              steamId: a.appid ? String(a.appid) : '', manual: true };
  LOCAL.games = LOCAL.games || [];
  LOCAL.games.push(g);
  linkSet(g, a, 'manual');
  g.hit = a; g.via = 'manual';
  LOCAL.scanned = true;
  linkModeEnd();
  closeSearch();
  refreshCounts();
  if(cur === 'myGames') renderMyGames(document.getElementById('main'));
  shellSay('已加入：' + (a.title || ''));
  return true;
}
/* 搜索弹窗里点了一条结果时，按当前模式分派（详情 / 关联 / 加入）——
   三处入口共用**一个**分派点，避免「加了模式却忘了改某一处的点击」。 */
function searchPick(a){
  if(!a) return;
  if(LOCAL.pendingLink){ linkCommit(a); return; }
  if(LOCAL.adding){ addCommit(a); return; }
  openDetailRec(a, 'lib');     /* 与点卡片走**同一段**弹窗代码，不另写一份 */
}

/* ======================= 3) 下载管理 ======================= */
/* 任务形状：{id, name, url, kind:'file'|'netdisk', state, got, total, dest, err}
   state: waiting | running | done | fail | pause | manual（网盘：需用户手动转存） */
/* ================= ★v24 任务表持久化（N-36）=================
   改前 `DL_JOBS` 只在内存 ⇒ **重启就空**，「历史」等于没有；而 aria2 那边的 session 是存盘的
   —— 引擎记得、界面忘了，两边不对称。用户口径（2026-10-22）：「可以，优化」。

   ★ 存哪：`localStorage`（key `gi-dljobs`）。主题与 OpenList 配置都存这儿，已证明 `file://` 下能持久；
     不新增 IPC，浏览器 demo 也能用。
   ★ 何时写：**只在状态变化时写**（`dlJobTouch`）。一次下载会推几十次进度事件，
     每次都 `JSON.stringify` 整表纯属自残。
   ★ 读回来之后**必须和引擎对账**（`dlReconcile`）—— 引擎才是真相。 */
const DLJOB_KEY = 'gi-dljobs';
const DLJOB_MAX = 200;
let dlJobTimer = null;
function dlJobsSave(now){
  const doIt = () => {
    dlJobTimer = null;
    try{
      const keep = (DL_JOBS || []).slice(0, DLJOB_MAX).map(j => ({
        id:j.id, name:j.name, url:j.url, kind:j.kind, state:j.state,
        got:j.got, total:j.total, dest:j.dest, err:j.err, engine:j.engine, gid:j.gid, at:j.at,
      }));
      localStorage.setItem(DLJOB_KEY, JSON.stringify(keep));
    }catch(e){ /* 存储不可用 ⇒ 退化为本次会话，不抛（不能因为存不了把下载搞挂） */ }
  };
  if(now){ if(dlJobTimer){ clearTimeout(dlJobTimer); dlJobTimer = null; } doIt(); return; }
  if(dlJobTimer) return;
  dlJobTimer = setTimeout(doIt, 800);
}
function dlJobsLoad(){
  try{
    const raw = localStorage.getItem(DLJOB_KEY);
    const arr = raw ? JSON.parse(raw) : null;
    if(!Array.isArray(arr)) return 0;
    DL_JOBS = arr.filter(x => x && x.id).map(x => Object.assign({
      name:'下载', url:'', kind:'file', state:'done', got:0, total:0, speed:0, dest:'', err:'', at:0,
    }, x));
    return DL_JOBS.length;
  }catch(e){
    /* 坏数据绝不能把启动搞挂 —— 直接当空表 */
    return 0;
  }
}
/* 只有状态真的变了才落盘（进度 tick 不写） */
function dlJobTouch(j){
  if(!j) return;
  if(j._ls === j.state) return;
  j._ls = j.state;
  dlJobsSave();
}

let DL_RECONCILED = false;
/* ★ 与引擎对账：以引擎为准。三种情况分别处理 ——
   ① 引擎有、界面有 ⇒ 用引擎的 state / got / total / dest 覆盖，并记下 gid（移除时要传它）
   ② 引擎有、界面没有 ⇒ 补一条（可能是上次运行留下的）
   ③ 界面有、引擎没有 ⇒ 这条**不能假装还在下**：标 fail 并写明原因 */
async function dlReconcile(){
  if(DL_RECONCILED) return;
  if(!HAS_SHELL || !SHELL || typeof SHELL.dlList !== 'function') return;
  DL_RECONCILED = true;
  let r = null;
  try{ r = await SHELL.dlList(); }catch(e){ return; }
  const tasks = (r && r.tasks) || [];
  const byUrl = new Map(), byGid = new Map();
  for(const t of tasks){
    if(!t) continue;
    if(t.url) byUrl.set(String(t.url), t);
    if(t.id) byGid.set(String(t.id), t);
  }
  let changed = false;
  for(const j of DL_JOBS){
    if(j.state === 'done' || j.state === 'fail' || j.state === 'manual') continue;
    /* ★v28：**先按 gid 认，再按 url 认**。
       磁力任务在取元数据阶段 `url` 是空的（aria2 的 `files[0].uris` 还没填），
       只按 url 匹配 ⇒ 重启后活着好好的磁力任务会被判成「不在引擎中」并标失败。
       gid 是引擎自己给的主键，比 url 稳。 */
    const t = (j.gid && byGid.get(String(j.gid))) || byUrl.get(String(j.url || ''));
    if(t){
      if(t.id && !j.gid) j.gid = t.id;
      if(t.state && t.state !== j.state){ j.state = t.state; changed = true; }
      if(t.got) j.got = t.got;
      if(t.total) j.total = t.total;
      if(t.dest) j.dest = t.dest;
      if(t.name && !j.name) j.name = t.name;
      if(t.err && t.state === 'fail') j.err = t.err;
    }else{
      j.state = 'fail';
      j.err = '重启后未在引擎中找到该任务（可能已被清理）';
      changed = true;
    }
  }
  for(const t of tasks){
    if(!t || !t.url) continue;
    if(DL_JOBS.some(j => String(j.url || '') === String(t.url) || (j.gid && String(j.gid) === String(t.id)))) continue;
    const j = dlJobAdd({ name:t.name || '下载', url:t.url, kind:t.kind || 'file',
                         state:t.state || 'done', got:t.got || 0, total:t.total || 0,
                         dest:t.dest || '', engine:'aria2' });
    j.gid = t.id;
    changed = true;
  }
  if(changed){
    dlJobsSave(true);
    if(cur === 'downloads') renderDownloads(document.getElementById('main'));
    refreshCounts();
  }
}

function dlJobAdd(o){
  const j = Object.assign({
    id: 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: o.name || '下载', url: o.url || '', kind: o.kind || 'file',
    state: 'waiting', got: 0, total: 0, dest: '', err: '',
    at: Date.now(),
  }, o);
  DL_JOBS.unshift(j);
  dlJobsSave();
  refreshCounts();
  return j;
}

function renderDownloads(main){
  if(!main) main = document.getElementById('main');
  const act = DL_JOBS.filter(j => j.state === 'running' || j.state === 'waiting').length;
  const right = DL_JOBS.length ? '<button type="button" class="pbtn sm" id="dlclear">清空已完成</button>' : '';
  /* ★v16-A：页头**不报数字**（① 口径）—— 原来写「共 12 个任务 · 进行中 1」，
     条数统一交给底部分页条说一次。 */
  const sub = DL_JOBS.length ? (act ? '有任务进行中' : '任务已完成') : '暂无任务';

  /* ★v16-A：任务列表同样分页（与其它列表同一套控件，用户不用学两套心智）。
     DL_JOBS 是内存数组，翻页只重渲染，不需要异步。 */
  const totalN = DL_JOBS.length;
  const pageJobs = pgSlice(DL_JOBS, 'downloads');

  const body = totalN ? `<div class="dllist">` + pageJobs.map(j => {
    const p = jobPct(j);
    const canOpen = j.state === 'done' && j.dest;
    const stTxt = { waiting:'排队中', running:(j.total ? p + '%' : '下载中'), done:'已完成',
                    fail:'失败', pause:'已暂停',
                    /* ★v28：专用链不是「转存」，别用一个词盖住两件事 */
                    manual:(j.kind === 'client' ? '需本机对应客户端' : '需手动转存') }[j.state] || j.state;
    /* ★ manual 态**总是**给「复制链接」（2026-10-16 实拍发现）——
       原来下面那行判的是 `j.kind === 'netdisk'`，于是落进 manual 的**非网盘**任务
       一个按钮都没有：源站只给「帖子页 / 无后缀的接口地址」时 kind 仍是 'file'，
       而 isDirectFile() 判它非直链 ⇒ manual ⇒ 用户拿不到任何操作。
       manual 的本质就是「壳下不了、得你手动处理」，所以复制链接无条件给；
       只有「打开网盘」才需要看 kind。
       （注：这段注释必须写在模板字符串**外面** —— 写进去会变成字面文本渲染到页面上。） */
    const meta = [];
    if(j.total) meta.push(fmtBytes(j.got) + ' / ' + fmtBytes(j.total));
    else if(j.got) meta.push(fmtBytes(j.got));
    if(j.speed) meta.push(fmtBytes(j.speed) + '/s');
    if(j.err) meta.push(esc(j.err));
    return `<div class="dljob ${j.state}">
      <div class="jhd">
        <span class="jic">${j.kind === 'netdisk' ? '☁️' : (j.kind === 'client' ? '🔗' : (j.kind === 'magnet' ? '🧲' : (j.state === 'done' ? '✅' : (j.state === 'fail' ? '⚠️' : '⬇️'))))}</span>
        <span class="jnm" title="${esc(j.name)}">${esc(j.name)}</span>
        <span class="jst">${esc(stTxt)}</span>
      </div>
      ${j.state === 'running' || (j.total && j.state !== 'done') ? `<div class="jbar"><i style="width:${p}%"></i></div>` : ''}
      <div class="jmt">${meta.map(x => `<span>${x}</span>`).join('')}
        <div class="spacer"></div>
        ${j.state === 'running' && j.engine === 'aria2' ? `<button type="button" class="pbtn sm" data-dlpause="${j.id}">暂停</button>` : ''}
        ${j.state === 'running' ? `<button type="button" class="pbtn sm" data-dlcancel="${j.id}">取消</button>` : ''}
        ${j.state === 'pause' && j.engine === 'aria2' ? `<button type="button" class="pbtn sm" data-dlresume="${j.id}">继续</button>` : ''}
        ${j.state === 'manual' && j.url ? `<button type="button" class="pbtn sm" data-dlcopy="${j.id}">复制链接</button>` : ''}
        ${j.kind === 'netdisk' && j.url ? `<button type="button" class="pbtn sm" data-dlopen="${j.id}">打开网盘</button>` : ''}
        ${canOpen ? `<button type="button" class="pbtn sm" data-dlfile="${j.id}">打开文件</button><button type="button" class="pbtn sm" data-dldir="${j.id}">所在文件夹</button>` : ''}
        ${j.state === 'fail' || (j.state === 'pause' && j.engine !== 'aria2') ? `<button type="button" class="pbtn sm" data-dlretry="${j.id}">重试</button>` : ''}
        ${j.state === 'done' && j.dest ? `<button type="button" class="pbtn sm" data-dlpath="${j.id}">复制路径</button>` : ''}
        ${(j.state === 'done' || j.state === 'fail') ? `<button type="button" class="pbtn sm" data-dlremove="${j.id}">移除</button>` : ''}
      </div>
    </div>`;
  }).join('') + `</div>` : `<div class="empty"><div class="big">⬇️</div>还没有下载任务
    <br><span style="font-size:12px">在游戏详情里点「⬇ 下载」会把任务登记到这里；<br>网盘链接也会登记，但需要你点「打开网盘」转存。</span></div>`;

  /* ★v16-H：网盘直链配置块挂在下载管理页**底部**（分页条之后、页脚之前）。
     放这里而不是顶部，是因为它的主次关系明确 —— 这页的主体是任务列表，
     配置块是「一次性设好就不用再管」的东西。 */
  /* ★v19：引擎卡与磁力入口放在**任务列表之前** —— 这页的主体动作是「加任务」，
     列表是结果。压在底部会让人先滚一屏才发现能加磁力。 */
  main.innerHTML = phHead('下载管理', HAS_SHELL ? '● 已连接' : '', sub, right)
    + dlMagnetHTML() + body
    + (totalN ? pagerHTML('downloads', totalN, '个任务') : '') + dlSetHTML() + footNote();
  /* ★v23：折叠态写回变量（否则翻页/清空后整页重渲染会把它收起来） */
  const ds = document.getElementById('dlset');
  if(ds) ds.addEventListener('toggle', () => { DLSET_OPEN = ds.open; });
  const c = document.getElementById('dlclear');
  if(c) c.addEventListener('click', () => {
    /* ★v23 修：只清「已完成 / 失败」。
       原来是把所有非 running/waiting 的都清掉 ⇒ 连 `manual`（需你手动转存的那些，
       身上还带着分享链接）也一起没了，等于把**你还没处理的线索**删了。 */
    DL_JOBS = DL_JOBS.filter(j => !(j.state === 'done' || j.state === 'fail'));
    dlJobsSave(true);
    pgReset('downloads');
    refreshCounts(); renderDownloads(main);
  });
  bindPager(main, 'downloads', totalN, () => renderDownloads(main));
  /* ★v16-H：这个页面会随「清空 / 翻页」整块重渲染 ⇒ 绑定必须跟着渲染走
     （绑在 main 上而不是 document，避免每次重渲染都往 document 上叠监听）。 */
  olBind(main);
  /* ★v19：引擎卡与磁力入口的绑定也必须**跟着渲染走**（同 olBind 的理由 ——
     这页会随「清空 / 翻页 / 探测完成」整块重渲染，绑在 document 上会越绑越多）。
     探测**首次进入这一页才跑一次**：`dlEngine()` 会 spawn 一次 `aria2c --version`，
     没必要每个页面都跑。 */
  dlEngineBind(main);
  dlMagnetBind(main);
  if(DLENG.state === 'idle') dlEngineProbe();
  /* ★v24：引擎就绪后**对账一次**（以引擎为准）。放在渲染末尾而不是启动时 ——
     启动时引擎还没探测完，早对账会拿不到 dlList。 */
  if(DLENG.state === 'ready' && !DL_RECONCILED) dlReconcile();
  /* ★v16-H：配置已落盘、但本次会话还没验过 ⇒ 自动补一次连接测试。
     不是为了「假装已连接」，恰恰相反：**只有真的拿到返回才会变绿**。
     一处 `tried` 闸门防止壳推进度时反复重试（失败也是立即失败，不轮询）。 */
  if(OL.base && !OL.probed && !OL.tried) olProbe();
  /* ★v18：上游服务卡是**异步填内容**的（先渲染空壳，再拉两个只读接口）。
     与 `olCardHTML()` 不同 —— 那张卡的字段同步可得（localStorage），这张要等网络。 */
  upFill(main);
}

/* ======================= 下载动作（供详情弹窗与下载页共用） ======================= */
/* 判断一个链接是不是「能直接下的文件」：http(s) 且路径以常见文件后缀结尾。 */
const DL_FILE_RE = /^https?:\/\/.+\.(zip|rar|7z|exe|msi|tar|gz|pak|bin|iso|dmg|psarc|dat)(\?.*)?$/i;
const DL_MAG_RE  = /^magnet:\?/i;
/* ★v28：迅雷专用链 / 电驴链 —— **我们下不了**，只能复制给本机对应客户端。
   刻意不并进「直链」：`electron/aria2.js` 的 `add()` 只收 `http(s)|ftp|magnet`，
   把 thunder:// 交过去必然回 `bad-url`。与其画个点了没反应的按钮，不如如实标成「复制」。 */
const DL_CLI_RE  = /^(thunder|ed2k):\/\//i;
function isDirectFile(u){ return typeof u === 'string' && DL_FILE_RE.test(u); }

/** ★v28 链接四分类 —— 决定「这条能不能交给下载引擎」。
 *    file     http(s) + 文件后缀      ⇒ aria2 直下
 *    magnet   磁力链                  ⇒ aria2（先取元数据再下，可回下载管理里选文件）
 *    client   `thunder://` / `ed2k://` ⇒ 只能复制给本机对应客户端
 *    netdisk  其余 http(s)（分享页）  ⇒ 跳转 + 用户自己转存
 *
 *  ⚠️ 为什么要单列一个函数、而不是继续只判 `isDirectFile`：
 *     那样磁力链会**掉进 netdisk 分支**（v27 及以前就是这样）——
 *     拿到一条磁力链，程序去「复制链接 + 唤起网盘客户端」，**永远不会下载**。
 *     用户 2026-10-23 的口径就是「如果获取到磁力链则可以拉起 app 那样」。 */
function dlKindOf(u){
  if (typeof u !== 'string' || !u) return 'netdisk';
  if (DL_MAG_RE.test(u)) return 'magnet';
  if (DL_CLI_RE.test(u)) return 'client';
  if (DL_FILE_RE.test(u)) return 'file';
  return 'netdisk';
}

/** 复制任意文本：壳里走主进程剪贴板，网页版退到 `navigator.clipboard`。
 *  ★ 网页版没有 `SHELL`，而 `data-dlcopy` 那条路要**任务 id** ⇒ 磁力/专用链没法复用它。 */
function copyAny(t){
  const v = String(t || '');
  if (!v) return false;
  if (SHELL && typeof SHELL.copyText === 'function') { SHELL.copyText(v); return true; }
  try {
    if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v);
      return true;
    }
  } catch (_) { /* 无剪贴板权限：往下走 execCommand */ }
  /* 网页版兜底：`navigator.clipboard` 在非安全上下文 / 无权限时会拒，
     这时用一次性的 textarea + `execCommand('copy')`（已废弃但仍是唯一通用退路）。 */
  try {
    if (typeof document !== 'undefined' && document.body) {
      const ta = document.createElement('textarea');
      ta.value = v;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand && document.execCommand('copy');
      ta.remove();
      return !!ok;
    }
  } catch (_) { /* 彻底失败：调用方负责把文本显示出来 */ }
  return false;
}

/* ★v15：下载入口统一渲染。
   ————————————————————————————————————————————————————————————————
   用户的诉求原话是「**我需要的是全都能够通过 exe 进行直链下载**」——
   而 v14 这里全是 `<a href target="_blank">`：点一下就把人踢到浏览器去了。
   现在每个下载地址都给**两个**动作，且推荐动作在前：

     · 真直链（路径以 .zip/.rar/.7z/.exe… 结尾）→ 「⬇ 客户端下载」
         交给壳的内置下载器，落盘并把任务登记进「下载管理」；
     · **磁力链**（v28）→ 「🧲 磁力下载」，交给 aria2（取元数据 → 选文件 → 下）；
     · 迅雷 / 电驴专用链（v28）→ 「🔗 复制」，明确说引擎不支持，不画假按钮；
     · 网盘分享页（不是文件）→ 「☁️ 打开网盘 · 手动转存」
         复制链接 + 唤起本机网盘客户端，同样登记，状态标「需手动转存」；
     · 「浏览器打开 ↗」保留（次要样式）—— 有些站点的链接只能在浏览器里走。

   ★ 如实说明边界（不吹成「什么都能直下」）：实测 MOD 的 200 条链接里
     **199 条是迅雷网盘分享页**，源站没给直链的，壳也变不出来 —— 这种就明确标「转存」，
     而不是画一个点了没反应、或者偷偷跳浏览器的按钮。
   ★v28 用户口径（2026-10-23）：「**网盘还是之前那样，通过跳转自己转存**；
     如果获取到磁力链则可以拉起 app 那样」。⇒ 网盘不做自动转存（OpenList 保留为可选外挂），
     磁力链则必须真正喂给引擎 —— 而 v27 及以前它是被当成分享页处理的，**永远不会下载**。 */
function dlBtns(url, name, label){
  if(!url) return '';
  const kd = dlKindOf(url);
  const u = esc(url), nm = esc(name || '');
  /* ★v28：磁力链只给**一个**动作 —— 交给引擎。
     不给「浏览器打开」次链接：把 `magnet:` 当 href 交出去只会被壳的
     `setWindowOpenHandler` 拦下或弹系统选择框，点了没反应比没按钮更糟。 */
  if(kd === 'magnet'){
    return HAS_SHELL
      ? `<button type="button" data-dlstart="1" data-url="${u}" data-name="${nm}" title="交给本机 aria2：先取元数据再下，可在「下载管理」里暂停 / 选文件">🧲 磁力下载</button>`
      : `<button type="button" data-mgcopy="1" data-url="${u}" title="网页版没有 aria2 引擎，只能复制给本机 BT 客户端">🧲 复制磁力链</button>`;
  }
  /* 迅雷 / 电驴专用链：引擎不支持，如实标成「复制」，不画假按钮 */
  if(kd === 'client'){
    const cnm = /^thunder:/i.test(url) ? '迅雷链' : 'eD2K 链';
    return `<button type="button" data-mgcopy="1" data-url="${u}" title="这不是 http 直链，本客户端下载引擎不支持；复制后交给对应客户端">🔗 复制${cnm}</button>`;
  }
  const direct = (kd === 'file');
  /* 网盘分享页的文案必须说清「手动转存」—— 原来写「转存下载」听着像会自动转，
     实际是复制链接 + 唤起本机网盘客户端，一步都不会替用户做。 */
  const txt = direct
    ? (HAS_SHELL ? '⬇ 客户端下载' : '⬇ 下载')
    : (HAS_SHELL ? '☁️ 打开网盘 · 手动转存' : '☁️ 复制转存链接');
  /* ⚠️ `data-dlstart="1"` 必须带值：委托里判的是 `if(b.dataset.dlstart)`，
     写成空属性的话 dataset.dlstart === '' 是 **falsy** ⇒ 按钮点了没反应。 */
  return `<button type="button" data-dlstart="1" data-url="${u}" data-name="${nm}">${txt}</button>`
       + ((!direct && olReady()) ? `<button type="button" data-olput="1" data-url="${u}" data-name="${nm}" title="用你本机的 OpenList 把分享链转存、取出直链，然后直接交给下载引擎">↪ ${DLENG.state === 'ready' ? '转存并下载' : '转存到网盘'}</button>` : '')
       + `<a class="sec" href="${u}" target="_blank" rel="noopener">${esc(label || '浏览器打开')} ↗</a>`;
}

/* ================= ★v16-H 网盘直链外挂（OpenList / AList） =================
   用户 2026-10-16 ③：「可以升级，可以通过 github 的开源项目优化」
   → 拍板「**外挂 OpenList / AList，App 只调它的 API**」（AskUserQuestion）。

   ★★ 为什么不把 OpenList 打进包里（这是本模块最关键的决策）：
     **它是 AGPL-3.0**。AGPL 的传染性顺着「分发」传导 —— 而这个 exe 是要
     **闭源分发**的桌面应用。把它的代码或二进制塞进包里，等于把整个包拖进 AGPL。
     但「**调用**一个用户自己跑起来的服务」完全不受影响。
     ⇒ 所以形态定成：**App 是客户端，OpenList 是你自己的服务**；
       我们不打包、不代管、不上传任何数据，只往 `127.0.0.1`/你的地址发 HTTP。

   ★ 连接方式（对齐 OpenList / AList 的正式 API）：
     · **自检** `POST {base}/api/fs/list`
       body `{path:'/', password:'', page:1, per_page:0, refresh:false}`
       → 顶层存储列表。这是文档里最稳的一个端点，用来回答「地址 + token 通不通」。
     · **转存** `POST {base}/api/fs/add_offline_download`
       body `{path, urls:[分享链], tool, delete_policy}`

   ⚠️⚠️ **转存这一步是「实验性」，默认关闭** —— 理由（这条不许省）：
     不同 OpenList/AList 版本 + 不同网盘驱动的转存契约并不一致
     （有的走 offline_download、有的得走 fs/copy 的分享链、有的根本要对应的驱动）。
     **我们手上没有你的实例可验**，凭记忆写一个「一定是这样」的请求体，就是红线里
     明确禁止的那件事（「不接受我记得」）。
     ⇒ 因此：① 默认关；② 必须你点过「连接测试」拿到**真实存储列表**后手动勾选才启用；
        ③ 失败时把**上游原始报错**原样显示，绝不替它编一句「暂不支持」；
        ④ 界面上写清「怎么验」，而不是假装已经验过。 */

const OL_KEY = 'gi-openlist';
/* ★ `probed` / `tried` **刻意不落盘**：它们代表「本次会话真的跟 OpenList 通过话」，
   不是配置。落盘就等于下次启动**不验证**也自称已连接 —— 那是编状态。
   配置（address / token / 目录 / 实验开关）才落盘。 */
const OL = { base:'', token:'', dir:'/转存', exp:false, probed:false, tried:false, note:'' };

function olLoad(){
  try{
    const raw = localStorage.getItem(OL_KEY);
    const o = raw ? JSON.parse(raw) : null;
    if(o && typeof o === 'object'){
      OL.base = String(o.base || ''); OL.token = String(o.token || '');
      OL.dir = String(o.dir || '/转存'); OL.exp = !!o.exp;
    }
  }catch(e){ /* 存储不可用 ⇒ 退化为本次会话 */ }
}
function olSave(){
  try{ localStorage.setItem(OL_KEY, JSON.stringify({ base:OL.base, token:OL.token, dir:OL.dir, exp:OL.exp })); }catch(e){}
}
/* 「能不能调转存」的唯一判据：地址填了 **且** 自检通过 **且** 用户显式打开实验开关。
   三个条件缺一不可 —— 少任何一个都会给用户一个「点了必然报错」的按钮。 */
function olReady(){ return !!(OL.base && OL.probed && OL.exp); }
function olNormBase(){
  let b = String(OL.base || '').trim();
  if(!b) return '';
  if(!/^https?:\/\//i.test(b)) b = 'http://' + b;      /* 用户多半只填 127.0.0.1:5244 */
  return b.replace(/\/+$/, '');
}
/* 统一入口：带 token 头、超时、以及「把上游原始报错带出来」的约定。
   ★ 绝不把失败吞成 `null` 就完事 —— 那是让上层只能编文案的根源。 */
async function olApi(path, body, ms){
  const base = olNormBase();
  if(!base) throw new Error('未填写 OpenList 地址');
  const ctl = (typeof AbortController === 'function') ? new AbortController() : null;
  const tm = ctl ? setTimeout(() => ctl.abort(), ms || 8000) : null;
  try{
    const r = await fetch(base + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(OL.token ? { Authorization: OL.token } : {}) },
      body: JSON.stringify(body || {}),
      cache: 'no-store',
      ...(ctl ? { signal: ctl.signal } : {}),
    });
    const txt = await r.text();
    let j = null;
    try{ j = txt ? JSON.parse(txt) : null; }catch(e){ /* 非 JSON（网关页 / 报错页）*/ }
    if(!r.ok) throw new Error('HTTP ' + r.status + (j && j.message ? ' · ' + j.message : (txt ? ' · ' + txt.slice(0, 120) : '')));
    if(j && j.code !== undefined && Number(j.code) !== 200) throw new Error('code=' + j.code + ' · ' + (j.message || ''));
    if(!j) throw new Error('返回不是 JSON（可能地址填到了别的服务）');
    return j;
  }finally{ if(tm) clearTimeout(tm); }
}
/* 连接自检：真发一次请求，把**真实结果**（存储名或原始报错）报出来。 */
async function olProbe(){
  OL.probed = false; OL.note = ''; OL.tried = true;
  try{
    const j = await olApi('/api/fs/list', { path:'/', password:'', page:1, per_page:0, refresh:false });
    const names = ((j && j.data && j.data.content) || []).map(x => x && x.name).filter(Boolean);
    OL.probed = true;
    OL.note = names.length ? ('已连接 · ' + names.length + ' 个存储：' + names.slice(0, 4).join(' / ') + (names.length > 4 ? ' …' : '')) : '已连接，但根目录下没有挂载任何存储';
  }catch(e){
    OL.note = '连接失败：' + String((e && e.message) || e);
  }

}
/* 转存（实验性）：把网盘分享链交给 OpenList 处理成一个可直链的文件。
   ★ 失败**原样抛上游报错**，调用方负责展示 —— 不许在这一层编「暂不支持」之类的话。 */
async function olTransfer(url, name){
  if(!olReady()) return { ok:false, err:'OpenList 未就绪（需先连接测试并勾选实验开关）' };
  try{
    const j = await olApi('/api/fs/add_offline_download', {
      path: OL.dir || '/',
      urls: [String(url)],
      delete_policy: 'delete_on_upload_succeed',
    }, 20000);
    return { ok:true, data:j };
  }catch(e){
    return { ok:false, err:String((e && e.message) || e) };
  }
}

/* ================= ★v22 把「转存」接成一条链：转存 → 轮询落盘 → 取直链 → 交给引擎 =================
   为什么必须做这一段：实测上游 `/api/download` 给的 **192/192 全是网盘分享页**，aria2 打不开；
   而 OpenList 的 `/api/fs/get` 能给出 `raw_url` —— 那个才是 aria2 吃得下的**真直链**。
   所以「exe 也能下网盘」的唯一可实现形态就是：**让 OpenList 去转存并产出直链，我们负责下**。

   ★ 诚实边界（三条，不许含糊）：
     ① 转存那一步**依赖你的 OpenList 实例 + 对应网盘驱动**，我们只能验到「管路通」；
     ② 有些驱动要求特定 UA / Referer / Cookie，OpenList 会把它们放在 `data.header` ——
        我们**原样透传**给 aria2（`--header`），**不自己编**；
     ③ 拿不到 `raw_url` 就如实报「该驱动可能不支持直链」，不假装能下。
*/
let OL_POLL_MS = 90000;          /* 网盘转存是异步的；90 s 是「等它落盘」的上限 */
async function olChainToEngine(shareUrl, name){
  const t0 = Date.now();
  /* ① 转存 */
  const tr = await olTransfer(shareUrl, name);
  if(!tr || !tr.ok) return { ok:false, err:String((tr && tr.err) || '转存失败') };
  if(!HAS_SHELL || !SHELL || typeof SHELL.startDownload !== 'function'){
    return { ok:true, submitted:true, note:'转存已提交（浏览器没有下载引擎，无法接力下载）' };
  }
  /* ② 轮询目录等落盘。`refresh:true` 是关键 —— 不刷新会读到 OpenList 的缓存列表。 */
  const want = String(name || '').trim();
  let hit = null;
  const deadline = Date.now() + OL_POLL_MS;
  while(Date.now() < deadline){
    await new Promise(r => setTimeout(r, 1500));
    let j = null;
    try{
      j = await olApi('/api/fs/list', { path: OL.dir || '/', password:'', page:1, per_page:0, refresh:true }, 12000);
    }catch(e){ continue; }
    const arr = ((j && j.data && j.data.content) || []).filter(x => x && !x.is_dir);
    if(!arr.length) continue;
    if(want){
      hit = arr.find(x => String(x.name).indexOf(want) >= 0) || null;
    }
    if(!hit){
      /* 名字对不上时取「最新的一个」，但只有它**确实是这次转存产生的**才认（防止命中老文件） */
      const cand = arr[arr.length - 1];
      const ts = cand && cand.modified ? Date.parse(cand.modified) : 0;
      if(ts && ts >= t0 - 5000) hit = cand;
    }
    if(hit) break;
  }
  if(!hit){
    return { ok:false, err:'转存已提交，但 ' + Math.round(OL_POLL_MS / 1000) + ' 秒内没等到文件落盘（OpenList 侧可能还在排队或已失败）' };
  }
  /* ③ 取直链 */
  const gp = String(OL.dir || '/').replace(/\/+$/, '') + '/' + hit.name;
  let g = null;
  try{ g = await olApi('/api/fs/get', { path: gp, password:'' }, 20000); }
  catch(e){ return { ok:false, err:'取直链失败，OpenList 原话：' + String((e && e.message) || e) }; }
  const dd = (g && g.data) || {};
  const raw = String(dd.raw_url || '');
  if(!/^https?:\/\//i.test(raw)){
    return { ok:false, err:'OpenList 没给 raw_url（该网盘驱动可能不支持直链）' };
  }
  /* ④ 交给引擎。★ `header` 原样透传（OpenList 给的），我们不猜也不拼。 */
  const j2 = dlJobAdd({ url: raw, name: String(hit.name || '网盘文件'), kind: 'netdisk', engine: 'aria2' });
  j2.state = 'waiting';
  SHELL.startDownload({ id: j2.id, url: raw, name: j2.name, header: String(dd.header || '') || undefined })
    .then(r => {
      if(r && r.ok === false){
        j2.state = 'fail';
        j2.err = String(r.error || '引擎拒绝').slice(0, 140);
        if(cur === 'downloads') renderDownloads(document.getElementById('main'));
      }
    })
    .catch(e => {
      j2.state = 'fail';
      j2.err = String((e && e.message) || e).slice(0, 140);
      if(cur === 'downloads') renderDownloads(document.getElementById('main'));
    });
  renderDownloads(document.getElementById('main'));
  return { ok:true, engine:'aria2', file: hit.name, raw: raw, header: String(dd.header || '') };
}

/* ================= ★v18 「上游服务」卡：工作台 → App 的只读回读 =================
   用户口径（2026-10-16）：「后续我想将工作台变成该 APP 的管理页面」；关联深度拍板「双向」。
   本卡是「上游 → App」那一半：App **不写上游、不猜上游**，只把**实测核对过形状**的
   两个只读接口拉回来显示 ——

     GET /api/library/progress?          → { ok, run, runJ,
                                             state:{ xdgame:{nextPage,maxKnown,lastFullAt,lastIncrAt,updatedAt},
                                                     jidi:{synced,added,total,lastSyncAt} } }
     GET /api/extract/history?n=6        → { ok, file, total, max,
                                             items:[{ id,at,game,cat,url,dir,state,sniffed,layers,files,bytes,error }] }

   ★ 形状**全部实测核对**（2026-10-16，curl 真值），不是照文档猜的：
     实测 progress = {"run":null,"runJ":null,"state":{"xdgame":{"nextPage":434,"maxKnown":433,…},
                     "jidi":{"synced":30,"added":0,"total":19590,…}}}
     实测 history  = {"total":48,"max":200,"items":[{"state":"done","layers":3,"files":3,…}]}

   另一半（「工作台页面上的本机动作条」）由壳注入 —— 见 electron/main.js 的 `ADMIN_BAR_JS`。
   ★ 探测式契约（与 `ddHydrate` 同）：探不到本机服务 ⇒ **整卡摘掉**，线上静态部署零副作用。 */
/* ★v23 「查看」解压历史：向上游发一次 `POST /api/extract/open {dir}`。
   ★ 上游源码里写死了安全边界：「只允许打开解压目录内的路径：<root>」——
     所以**很多历史条目会被 400 拒**（我们的测试条目就落在 `_test-out` 下）。
     被拒时**不静默**：把路径复制到剪贴板 + 把上游原话贴出来，用户至少能自己粘到资源管理器。
   ★ 也不去绕过这个限制（比如自己调 shell.openPath 开任意路径）—— 那是上游明确不授权的面。 */
async function upPost(base, path, body, ms){
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const t = ctl ? setTimeout(() => ctl.abort(), ms || 12000) : null;
  try{
    const r = await fetch(base + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
      cache: 'no-store',
      ...(ctl ? { signal: ctl.signal } : {}),
    });
    const txt = await r.text();
    let j = null;
    try{ j = txt ? JSON.parse(txt) : null; }catch(_){ /* 非 JSON */ }
    if(!r.ok) throw new Error('HTTP ' + r.status + (j && j.error ? ' · ' + j.error : ''));
    return j;
  }finally{ if(t) clearTimeout(t); }
}
async function upOpenPath(dir, btn){
  const d = String(dir || '').trim();
  if(!d) return;
  const old = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '打开中…'; }
  try{
    const base = await dlBoot();
    if(!base) throw new Error('没连上本机上游服务');
    const r = await upPost(base, '/api/extract/open', { dir: d }, 12000);
    if(!r || !r.ok) throw new Error((r && r.error) || '上游没返回 ok');
    shellSay('已在文件管理器中打开');
  }catch(e){
    if(SHELL && SHELL.copyText){ SHELL.copyText(d); }
    shellSay('打不开，路径已复制：' + String((e && e.message) || e).slice(0, 70));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = old; }
  }
}

/* ================= ★v19 下载引擎（aria2）—— **契约先定，引擎后接** =================
   用户口径（2026-10-22）：「将页面的内容以及后台管理页面都优化，以及接口调用（管理页面）预留，
                              后续我将接入磁力链下载」。

   ⇒ 本轮**不装引擎、不下载一首歌**，只做三件事：
     ① 把「引擎状态」如实显示出来（现在没装 ⇒ 「未接入（预留）」）；
     ② 把「磁力任务」的入口先摆在页面上（粘贴 → 解析文件清单 → 选文件 → 开始）；
     ③ 把**接口契约**定死：`SHELL.dlEngine() / dlMagnetPreview(magnet) / dlPause(id) / dlResume(id)`。
        将来接 aria2 时，**这一页一行都不用改**，只换主进程实现。

   ★ 三条不许破的纪律（沿用 v18 的「绝不出点了必然报错的按钮」）：
     ① 没有壳（浏览器 / 线上静态部署）⇒ **整块不渲染**，不留一个注定失败的入口；
     ② 引擎没装 ⇒ 按钮**在位但标注「预留」**，点了给的是**如实回执**（引擎未接入），
        不是转圈、不是假装解析中；
     ③ 页面**永远拿不到**落盘目录与 RPC secret —— 磁力只传字符串，目录由主进程算。 */
/* ★ 初值就按有没有壳定好 —— 不能让首帧停在「待检测」上：
   无壳时 `dlEngineProbe()` 会**立即短路返回**（它没 DOM 可重画之前就 return 了），
   若初值仍是 `idle`，徽标会永远显示「○ 待检测」（假的状态，比没有更糟）。 */
const DLENG = { state: HAS_SHELL ? 'idle' : 'noshell', info:null, err:'' };   /* idle | probing | ready | none | noshell */

function dlEngineBadge(){
  if(DLENG.state === 'ready')   return '<span class="olbadge ok"   id="engbadge">● 引擎就绪</span>';
  if(DLENG.state === 'probing') return '<span class="olbadge"      id="engbadge">○ 探测中…</span>';
  if(DLENG.state === 'none')    return '<span class="olbadge warn" id="engbadge">○ 未接入（预留）</span>';
  if(DLENG.state === 'noshell') return '<span class="olbadge"      id="engbadge">— 需桌面版</span>';
  return '<span class="olbadge" id="engbadge">○ 待检测</span>';
}
function dlEngineDesc(){
  if(DLENG.state === 'noshell')
    return '<b>需桌面版</b>：下载引擎只在 <b>GameIntel.exe</b> 里可用 —— 浏览器里没有本机进程，磁力与多线程下载都做不了。';
  if(DLENG.state === 'ready'){
    const v = (DLENG.info && DLENG.info.version) ? esc(DLENG.info.version) : '';
    const s = DLENG.stats && DLENG.stats.global;

      ? '<br>当前 <b>' + fmtBytes(Number(s.speed) || 0) + '/s</b> · 活动 <b>' + (s.active || 0)
        + '</b> · 等待 <b>' + (s.waiting || 0) + '</b> · 已结束 <b>' + (s.stopped || 0) + '</b>'
      : '';
    return '已检测到 <b>aria2 ' + v + '</b>：磁力 / BT、多线程直链、断点续传都可用。' + extra;
  }

      + (DLENG.err ? '<br><span style="color:var(--sub)">' + esc(DLENG.err) + '</span>' : '');
  return '正在检测本机下载引擎…';
}
function dlEngineHTML(){

/* ================= ★v23 精简「下载管理」页 =================

   ★ 折叠态记在 `DLSET_OPEN` 里而不是交给 `<details>` 自己保留 ——
     这页会因为「翻页 / 清空 / 探测完成」整块重渲染，不记的话每次都会被收起。 */

/* 探测引擎 —— **只调一次，除非用户点「重新检测」**（引擎版本不会在运行期变）。 */
async function dlEngineProbe(force){
  if(!HAS_SHELL || !SHELL || typeof SHELL.dlEngine !== 'function'){
    DLENG.state = 'noshell'; dlEnginePaint(); return;
  }
  if(DLENG.state === 'probing') return;
  if(DLENG.state === 'ready' && !force) return;
  DLENG.state = 'probing'; DLENG.err = '';
  dlEnginePaint();
  let r = null;
  try { r = await SHELL.dlEngine(!!force); } catch(e){ r = { ok:false, error:String((e && e.message) || e) }; }
  DLENG.info = (r && r.engine) || null;
  DLENG.state = (r && r.ok && r.engine && r.engine.available) ? 'ready' : 'none';
  DLENG.err = String((r && r.error) || (r && r.engine && r.engine.reason) || '');
  /* 就绪时顺带拉一次全局统计（速度 / 活动数）—— 只读，失败不影响状态 */
  DLENG.stats = null;
  if(DLENG.state === 'ready' && typeof SHELL.dlStats === 'function'){
    try { const st = await SHELL.dlStats(); if(st && st.ok) DLENG.stats = st; } catch(e){ /* */ }
  }
  dlEnginePaint();
  /* ★v24：**这里**才是对账唯一能可靠触发的时机。
     之前写在 `renderDownloads()` 末尾（判 `DLENG.state === 'ready'`），但渲染发生时 probe 才刚发起、
     状态还是 'probing' ⇒ 那次判断永远为假，对账**一次都没跑过**（实测 `RECON=false` 抓到的）。
     引擎状态是异步变的，必须在**变完**的地方接着做。 */
  if(DLENG.state === 'ready' && !DL_RECONCILED) dlReconcile();
}
/* 只改这两块的状态文字，**不整页重渲染** —— 否则磁力输入框里已粘好的链接会被清掉。 */
function dlEnginePaint(){
  const b = document.getElementById('engbadge');
  if(b){ const n = document.createElement('span'); n.innerHTML = dlEngineBadge(); const s = n.firstChild; b.className = s.className; b.textContent = s.textContent; }
  const d = document.getElementById('engdesc');
  if(d) d.innerHTML = dlEngineDesc();
  const mb = document.getElementById('mgbadge');
  /* ★ 只在「还没解析过」的两个状态之间切换 —— 否则一次「重新检测」会把
     用户刚解析出来的「已解析 N 个文件」冲掉（徽标与下面的清单自相矛盾）。 */
  if(mb && (mb.textContent === '预留' || mb.textContent === '可解析')){
    const ready = DLENG.state === 'ready';
    mb.textContent = ready ? '可解析' : '预留';
    mb.className = 'olbadge' + (ready ? ' ok' : ' warn');
  }
  /* ★ 这条提示也必须跟着状态走：首帧是在「还没探测完」时渲染的，
     若不在 paint 里改，引擎起来了它还会挂着「引擎未接入」—— 与徽标自相矛盾。 */
  const hint = document.getElementById('mghint');
  if(hint) hint.innerHTML = (DLENG.state === 'ready') ? '' : '<br>⚠️ 引擎未接入时，这里会<b>如实</b>回「引擎未接入」，不会假装在解析。';
  /* ★v23：折叠头那行状态也要跟着变（它就是这页的常驻状态条） */
  const st = document.getElementById('dlsumtext');
  if(st) st.textContent = dlSumText();
  const dot = document.querySelector('#dlset .dlsumdot');
  if(dot) dot.className = 'dlsumdot' + (DLENG.state === 'ready' ? ' ok' : (DLENG.state === 'none' ? ' warn' : ''));
}

function dlEngineBind(main){
  const btn = main.querySelector('#engreprobe');
  if(!btn) return;
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    await dlEngineProbe(true);
    btn.disabled = false;
  });
}

/* 磁力解析：**唯一目的是验证契约**，不是假装能下。
   `SHELL.dlMagnetPreview` 现在会回 `{ ok:false, code:'engine-not-ready' }` ⇒
   页面按 `code` 说话，而不是笼统报「失败」。 */
function dlMagnetBind(main){
  const inp = main.querySelector('#mgin');
  const btn = main.querySelector('#mgparse');
  const box = main.querySelector('#mgfiles');
  const badge = main.querySelector('#mgbadge');
  if(!inp || !btn || !box) return;
  const say = (t, cls) => { if(badge){ badge.textContent = t; badge.className = 'olbadge' + (cls ? ' ' + cls : ''); } };

  const run = async () => {
    const mg = String(inp.value || '').trim();
    box.hidden = false;
    if(!mg){
      say('请输入磁力链', 'warn');
      box.innerHTML = '<div class="olres bad">先粘贴一条 magnet 链接。</div>';
      return;
    }
    if(!/^magnet:\?/i.test(mg)){
      say('不是磁力链', 'warn');
      /* ★v28：贴进来的是网页链接时，直接给一个「打开它」的出口 ——
         用户口径是「网盘通过跳转自己转存」，那就别只报错、什么都不给。 */
      const isHttp = /^https?:\/\//i.test(mg);
      box.innerHTML = '<div class="olres bad">磁力链必须以 <code>magnet:?</code> 开头。'
        + (isHttp
            ? '你贴的是<b>网页链接</b>：网盘分享页要在浏览器里<b>自己转存</b>，下载引擎打不开它。'
              + '<div class="lks"><a class="sec" href="' + esc(mg) + '" target="_blank" rel="noopener">打开这个链接 ↗</a></div>'
            : '网盘分享页（迅雷 / 百度 / 夸克）<b>不是</b>磁力链，下载引擎也打不开它们。')
        + '</div>';
      return;
    }
    if(!SHELL || typeof SHELL.dlMagnetPreview !== 'function'){
      say('需桌面版', 'warn');
      box.innerHTML = '<div class="olres bad">只能在桌面版里解析。</div>';
      return;
    }
    btn.disabled = true;
    say('解析中…');
    box.innerHTML = '<div class="olres">正在取元数据（只取种子信息，不下载正文）…</div>';
    let r = null;
    try { r = await SHELL.dlMagnetPreview(mg); }
    catch(e){ r = { ok:false, error:String((e && e.message) || e) }; }
    btn.disabled = false;

    if(r && r.ok && (r.files || []).length){
      const files = r.files || [];
      const tot = files.reduce((s, f) => s + (Number(f.length) || 0), 0);
      say('已解析 ' + files.length + ' 个文件', 'ok');
      box.innerHTML = `<div class="mghd"><b>${files.length}</b> 个文件 · 共 <b>${fmtBytes(tot || Number(r.totalBytes) || 0)}</b></div>`
        + files.map(f => `<label class="mgf"><input type="checkbox" class="mgcb" data-mgidx="${Number(f.idx) || 0}" checked>`
            + `<span class="nm" title="${esc(f.path || '')}">${esc(f.path || '')}</span>`
            + `<span class="sz">${fmtBytes(Number(f.length) || 0)}</span></label>`).join('')
        + `<div class="olrow"><button type="button" class="pbtn sm" id="mgstart">开始下载选中的文件</button>`
        + `<span class="mgsel" id="mgsel"></span></div>`;
      mgSelPaint();
      /* 绑定跟着这次渲染走（清单是动态生成的） */
      box.querySelectorAll('.mgcb').forEach(cb => cb.addEventListener('change', mgSelPaint));
      const sb = box.querySelector('#mgstart');
      if(sb) sb.addEventListener('click', () => {
        const picked = [];
        box.querySelectorAll('.mgcb').forEach(cb => { if(cb.checked) picked.push(Number(cb.dataset.mgidx)); });
        if(!picked.length){ say('没选文件', 'warn'); return; }
        startMagnet(mg, picked, (r && r.name) || '磁力任务');
        say('已提交 ' + picked.length + ' 个文件', 'ok');
      });
      return;
    }
    /* ★「预留」的诚实之处就在这里：引擎没装就明说「未接入」，
       绝不笼统报「解析失败，请重试」—— 那会让用户以为是链接坏了。 */
    const code = (r && r.code) || '';
    say(code === 'engine-not-ready' ? '引擎未接入（预留）'
        : (code === 'bad-magnet' ? '磁力链格式不合法' : '未能解析'), 'warn');
    box.innerHTML = '<div class="olres bad">' + esc((r && r.error) || '未知错误') + '</div>';
  };

  btn.addEventListener('click', run);
  /* 回车即解析 —— 磁力链接很长，粘完顺手回车是本能操作。 */
  inp.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); run(); } });
}

/* 勾选计数（按钮文案与可用态跟着走 —— 一个文件都没选时不该还能点「开始」） */
function mgSelPaint(){
  const box = document.getElementById('mgfiles');
  if(!box) return;
  const all = box.querySelectorAll('.mgcb').length;
  const on = [];
  box.querySelectorAll('.mgcb').forEach(cb => { if(cb.checked) on.push(Number(cb.dataset.mgidx)); });
  const s = box.querySelector('#mgsel');
  if(s) s.textContent = '已选 ' + on.length + ' / ' + all;
  const b = box.querySelector('#mgstart');
  if(b){
    b.textContent = on.length ? ('开始下载选中的 ' + on.length + ' 个') : '请先勾选文件';
    b.disabled = !on.length;
  }
}

/* 起一个磁力任务。
   ★ 走的是**同一个** `SHELL.startDownload`：主进程按「有没有引擎」自己决定交给 aria2 还是内置下载器。
     页面不判断后端 —— 这就是「关联」该有的样子（一个入口、两个后端）。 */
function startMagnet(mg, idxs, name){
  const j = dlJobAdd({ url: mg, name: name || '磁力任务', kind: 'magnet', engine: 'aria2' });
  j.state = 'waiting';
  if(!HAS_SHELL || !SHELL || typeof SHELL.startDownload !== 'function'){
    j.state = 'manual';
    j.err = '需要桌面版（浏览器没有下载引擎）';
    renderDownloads(document.getElementById('main'));
    return j;
  }
  /* `selectFile` 是 aria2 的 `select-file`（1 基、逗号分隔，如 "1,3,5"） */
  SHELL.startDownload({ id: j.id, url: mg, name: j.name, selectFile: (idxs || []).join(',') })
    .then(r => {
      if(r && r.ok === false){
        j.state = 'fail';
        j.err = String(r.error || '提交失败').slice(0, 140);
        if(cur === 'downloads') renderDownloads(document.getElementById('main'));
      }
    })
    .catch(e => {
      j.state = 'fail';
      j.err = String((e && e.message) || e).slice(0, 140);
      if(cur === 'downloads') renderDownloads(document.getElementById('main'));
    });
  renderDownloads(document.getElementById('main'));
  return j;
}

/* 解压任务的 state 是上游原话（done / error / need-password / running…）⇒ 只做**着色**不做改写 */
function upStateCls(s){
  const v = String(s || '');
  return v === 'done' ? 'done' : (v === 'error' || v === 'need-password' ? 'bad' : '');
}
const upT = (ts) => { try { return new Date(Number(ts) || 0).toLocaleString('zh-CN', { hour12: false }); } catch(e){ return '—'; } };

async function upFill(scope){
  /* ★★v18 实拍抓出来的真 bug（**692 条断言全绿都没拦住**）：
     `getElementById` 只在 `Document` / `DocumentFragment` 上，**`Element` 上没有这个方法**。
     原写法是 `(scope || document).getElementById('upcard')`，而调用处传进来的是 `#main` 这个 **Element**
     ⇒ 抛 `TypeError: scope.getElementById is not a function`，被 async 函数吞掉（无 catch）
     ⇒ 卡片永远停在初始的「○ 探测中…」，而**函数本身完全正确**（手动 `upFill(document)` 立刻就填上了）。
     ⇒ 改成 `querySelector`：Document 与 Element 上都有，语义不变（「这张卡在不在这次渲染的范围里」）。 */
  const card = (scope && scope.querySelector) ? scope.querySelector('#upcard') : document.getElementById('upcard');
  if(!card) return;
  const base = await dlBoot();
  if(!base){ card.remove(); return; }        /* 探不到本机服务 ⇒ 整卡摘掉（不留空壳） */
  const badge = document.getElementById('upbadge');
  if(badge){ badge.textContent = '● 已连接'; badge.classList.add('ok'); }

  /* 实例归属：只有 **v18 壳**才拿得到（describe 的 upOwner / upPid / listenPort） */
  let d = null;
  try{ d = (SHELL && typeof SHELL.describe === 'function') ? await SHELL.describe() : null; }catch(e){ d = null; }
  const owner = d && d.upOwner;
  const ownerTx = owner === 'shell' ? '由 App 托管（本壳 fork 的）'
    : owner === 'external' ? '外部实例（App 只复用，不冒认）'
    : owner === 'unknown' ? '未知 —— 对方是旧版上游，health 里没有 pid'
    : '未知（没有壳，取不到自述）';

  const [pr, hi] = await Promise.all([
    ddJson(base, '/api/library/progress', 8000),
    ddJson(base, '/api/extract/history?n=6', 8000),
  ]);

  const pd = document.getElementById('updesc');
  if(pd){
    pd.innerHTML = '上游在线 · 实例归属：<b>' + esc(ownerTx) + '</b>'
      + (d && d.upPid ? '（pid ' + esc(String(d.upPid)) + '）' : '')
      + (d && d.listenPort ? ' · 监听端口 ' + esc(String(d.listenPort)) : '');
  }
  const st = document.getElementById('upstats');
  if(st){
    const g = (pr && pr.state && pr.state.xdgame) || {};
    const jj = (pr && pr.state && pr.state.jidi) || {};
    const rows = [
      ['库总量', jj.total ? Number(jj.total).toLocaleString('en-US') + ' 条' : '—'],
      ['机地已同步', jj.synced != null ? jj.synced + ' 页' : '—'],
      ['上次库同步', jj.lastSyncAt ? upT(jj.lastSyncAt) : '—'],
      ['XD 已翻页', (g.nextPage != null ? String(g.nextPage) : '—') + (g.maxKnown ? ' / 上限 ' + g.maxKnown : '')],
    ];
    st.innerHTML = rows.map(r => '<div class="uprow"><span>' + esc(r[0]) + '</span><b>' + esc(String(r[1])) + '</b></div>').join('');
  }
  const hh = document.getElementById('uphist');
  if(hh){
    const items = (hi && hi.items) || [];
    hh.innerHTML = items.length
      ? '<div class="upt">解压历史（最近 ' + items.length + ' 条 / 共 ' + esc(String(hi.total || items.length)) + ' 条）</div>'
        + items.map(it => '<div class="upit">'
            + '<span class="uptag ' + upStateCls(it.state) + '">' + esc(String(it.state || '?')) + '</span>'
            + '<span class="upg">' + esc(it.game || '（未标游戏）') + '</span>'
            + '<span class="upm">' + (it.files != null ? it.files + ' 文件' : '')
              + (it.layers ? ' · ' + it.layers + ' 层' : '') + '</span>'
            + '<span class="upa">' + esc(upT(it.at)) + '</span>'
            /* ★v23：给了「打开」——用户口径「历史为什么不能…查看」。
               注意上游这个接口**只允许打开解压目录内**的路径，被拒时我们复制路径并贴原话。 */
            + (it.dir ? '<button type="button" class="pbtn sm" data-exopen="' + esc(it.dir) + '" title="' + esc(it.dir) + '">打开</button>' : '')
          + '</div>').join('')
        + '<div class="upnote">这些记录是<b>上游</b>落盘的（<code>_下载历史.json</code>，最多 '
          + esc(String(hi.max || 200)) + ' 条，满了自动挤掉最老的）。<b>上游没有删除接口</b>'
          + '（整个服务端 0 条 DELETE 路由），所以这里只能看、不能删 —— 我们不假装能删。</div>'
      : '<div class="upempty">还没有解压记录 —— 在工作台的「解压助手」里跑一次，这里就会出现。</div>';
  }

  /* 「打开管理页」按钮：**只在有 v18 壳时**出现（无壳点了必然没反应 ⇒ 干脆不渲染） */
  const btn = document.getElementById('upadmin');
  if(btn && ADMIN_OPEN){
    btn.hidden = false;
    btn.addEventListener('click', () => ADMIN_OPEN('toggle'));
  }
}

/* 下载管理页里的 OpenList 配置块（.olcard）。只在桌面版有意义，但网页版也可配
   —— 网页版没有壳、拿不到本机地址也照样能连局域网里的 OpenList，所以不做形态限制。 */
function olCardHTML(){
  const on = olReady();
  return `<div class="olcard">
    <div class="olhd"><b>网盘直链（OpenList / AList）</b>
      <span class="olbadge ${OL.probed ? 'ok' : ''}">${OL.probed ? '● 已连接' : '○ 未连接'}</span></div>
    <div class="oldesc">本机自己跑一个 OpenList，把网盘分享链转成可直链的文件。
      App 只调它的 API，<b>不打包、不代管、不上传</b>（OpenList 是 AGPL-3.0，只调用不分发）。</div>
    <div class="olrow">
      <input id="olbase" placeholder="地址，如 http://127.0.0.1:5244" value="${esc(OL.base)}">
      <input id="oltoken" placeholder="Token（OpenList 后台 → 其他 → 令牌）" value="${esc(OL.token)}">
      <input id="oldir" placeholder="转存目录，如 /转存" value="${esc(OL.dir)}" style="max-width:130px">
      <button type="button" class="pbtn sm" id="olprobe">连接测试</button>
      <button type="button" class="pbtn sm" id="olsave">保存</button>
    </div>
    <div class="olrow">
      <label class="olchk"><input type="checkbox" id="olexp"${OL.exp ? ' checked' : ''}${OL.probed ? '' : ' disabled'}>
        启用「转存到网盘」（<b>实验性</b>：不同 OpenList 版本 / 网盘驱动的转存契约不一致，
        本 App 没有你的实例可验 ⇒ 请先用「连接测试」确认能列出存储，再自行验证一次转存）</label>
    </div>
    <div class="olnote" id="olnote">${esc(OL.note || '未测试。填好地址与 Token 后点「连接测试」，会把 OpenList 的真实返回原样报出来。')}</div>
    <div class="olres" id="olres"></div>
  </div>`;
}
/* 转存结果落点。★ 只写**上游原话**：ok 时写「已提交」+ 上游返回的摘要；
   失败时把 `olTransfer` 抛出的原始 message（含 HTTP 状态 / OpenList 的 code+message）
   原样贴出来。这一层**不许**做任何「翻译成友好话术」的动作 ——
   我们没验过用户的实例，编一句「暂不支持该网盘」就是把猜测当事实（红线）。
   取不到 #olres（比如从详情弹窗里点的）时退化为顶栏闪一下，不报错。 */
function olRes(text, ok){
  const el = document.getElementById('olres');
  if(el){ el.textContent = text || ''; el.className = 'olres' + (ok ? ' ok' : (text ? ' bad' : '')); }
  shellSay(text ? text.slice(0, 80) : '');
}
function olRenderStatus(){
  const n = document.getElementById('olnote');
  if(n) n.textContent = OL.note || '—';
  const c = document.getElementById('olexp');
  if(c){
    c.disabled = !OL.probed;
    /* ★ 状态与视图必须一致：自检没过时把实验开关**真的关掉**（并落盘），
       而不是「看着是关的、OL.exp 还是 true」。否则一旦 olReady() 因为别的原因
       成立，按钮就会在用户以为功能关着的时候冒出来。 */
    if(!OL.probed && OL.exp){ OL.exp = false; olSave(); }
    c.checked = !!(OL.probed && OL.exp);
  }
  const b = document.querySelector('.olcard .olbadge');
  if(b){ b.textContent = OL.probed ? '● 已连接' : '○ 未连接'; b.classList.toggle('ok', OL.probed); }
}
function olBind(scope){
  const q = (s) => (scope || document).querySelector(s);
  const base = q('#olbase'), tok = q('#oltoken'), dir = q('#oldir');
  if(base) base.addEventListener('change', () => { OL.base = base.value.trim(); olSave(); });
  if(tok) tok.addEventListener('change', () => { OL.token = tok.value.trim(); olSave(); });
  if(dir) dir.addEventListener('change', () => { OL.dir = dir.value.trim() || '/'; olSave(); });
  const sv = q('#olsave');
  if(sv) sv.addEventListener('click', () => {
    OL.base = (base && base.value.trim()) || OL.base;
    OL.token = (tok && tok.value.trim()) || OL.token;
    OL.dir = (dir && dir.value.trim()) || OL.dir;
    olSave(); shellSay('已保存 OpenList 配置');
  });
  const pb = q('#olprobe');
  if(pb) pb.addEventListener('click', async () => {
    OL.base = (base && base.value.trim()) || OL.base;
    OL.token = (tok && tok.value.trim()) || OL.token;
    olSave();
    pb.disabled = true; pb.textContent = '测试中…';
    await olProbe();
    pb.disabled = false; pb.textContent = '连接测试';
  });
  const ex = q('#olexp');
  if(ex) ex.addEventListener('change', () => { OL.exp = !!ex.checked; olSave(); });
}

/* 真直链 → 交给壳的内置下载器；网盘 → 登记为 manual 并复制链接 + 唤起客户端 */
function startDownload(o){
  /* ★v28：**磁力链先分流**。
     它必须交给引擎（aria2 支持 magnet：先取元数据、再按 `select-file` 下），
     绝不能进下面 netdisk 那条「复制链接 + 唤起网盘客户端」的路 ——
     v27 及以前就是这个 bug：拿到磁力链会当成分享页，永远不会下载。
     `startMagnet` 内部会自己登记任务，所以这里**直接 return**，不再 `dlJobAdd` 第二次。 */
  const kd = dlKindOf(o.url);
  if (kd === 'magnet' && HAS_SHELL && SHELL && typeof SHELL.startDownload === 'function'){
    return startMagnet(o.url, o.sel || [], o.name);
  }
  const j = dlJobAdd(o);
  /* ★v28：任务 kind **以链接形态为准**，不信任调用方传进来的值 ——
     `renderDownloads` 靠它决定图标与「打开网盘」按钮是否出现。 */
  j.kind = kd;
  if(!HAS_SHELL){
    j.state = 'manual';
    j.err = kd === 'magnet'
      ? '网页版没有 aria2 引擎，磁力链只能复制给本机 BT 客户端'
      : '网页版没有内置下载器，请复制链接用浏览器下载';
    if(kd !== 'file') copyAny(o.url);
    renderDownloads(document.getElementById('main'));
    return j;
  }
  if(kd === 'netdisk' || kd === 'client'){
    j.state = 'manual';
    if(kd === 'client'){
      /* 迅雷 / 电驴专用链：复制是唯一能做的事，且必须说清「不是我们下不了，
         是这条链本身只认对应客户端」—— 别让用户以为是软件坏了。 */
      j.err = '专用链（thunder:// / ed2k://）本客户端引擎不支持，已复制';
      copyAny(o.url);
      shellSay('专用链已复制，请交给对应的下载客户端');
    } else {
      if(o.url) copyAny(o.url);
      if(o.url && SHELL.openNetdisk) SHELL.openNetdisk(o.url);
      shellSay('网盘链接已复制，并尝试唤起本机客户端（转存要你手动点）');
    }
    renderDownloads(document.getElementById('main'));
    return j;
  }
  j.state = 'running';
  SHELL.startDownload({ id: j.id, url: o.url, name: o.name }).catch(e => {
    j.state = 'fail'; j.err = String(e && e.message || e).slice(0, 120);
    if(cur === 'downloads') renderDownloads(document.getElementById('main'));
  });
  renderDownloads(document.getElementById('main'));
  return j;
}

/* 壳推进度 → 更新任务（下载页可见时实时重绘）
   ★ 这里判 `SHELL` 而不是 `HAS_SHELL`：两者本该等价，但直接对 `SHELL` 判空更硬 ——
     否则一旦 HAS_SHELL 与实际不符（反证 M38 就是这种情形），`SHELL.onDownload` 会在
     **页面加载时就抛 TypeError**，整页脚本停摆，报出来的是「崩溃」而不是「断言红」。 */
if(SHELL && typeof SHELL.onDownload === 'function'){
  SHELL.onDownload(msg => {
    const j = (DL_JOBS || []).find(x => x.id === msg.id);
    if(!j) return;
    /* ★★v28 实拍抓出的真 bug（一条断言也拦不住，因为它只在**引擎回推**时才发生）：
       进度消息里的 `url` / `name` / `dest` 来自 aria2 的 `files[0].uris[0].uri`，
       而磁力任务在**取元数据阶段** `uris` 就是空的 ⇒ `Object.assign(j, msg)` 会把页面
       自己存的 magnet 地址**覆盖成空串**。后果全在「事后」才发作：
         · 「复制链接」复制到一个空串；
         · 「重试」拿空 url 去提交，必然失败；
         · 重启后 `dlReconcile` 按 url 匹配也对不上，任务被判「不在引擎中」。
       实测证据：探针任务重开后 `{"url":"","kind":"magnet","state":"fail","dest":"[METADATA]…"}`。
       ⇒ 空值一律**不覆盖**（保留页面已有的值）。 */
    const patch = Object.assign({}, msg);
    for(const k of ['url', 'name', 'dest']){ if(!patch[k]) delete patch[k]; }
    Object.assign(j, patch);
    dlJobTouch(j);        /* ★v24 只有状态变了才落盘（进度 tick 不写） */
    if(cur === 'downloads') renderDownloads(document.getElementById('main'));
    refreshCounts();
  });
}

/* 下载页与详情弹窗里的「⬇ 下载」按钮统一走这里（document 级委托，只绑一次）
   ★v16-H：`data-olput`（转存到网盘）**必须挂进同一个 closest**，否则点了没反应
   —— 页面里没有第二处 download 委托，漏在这里就是死按钮。 */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-dlstart],[data-dlcopy],[data-dlopen],[data-dlcancel],[data-dlfile],[data-dldir],[data-dlretry],[data-dlpause],[data-dlresume],[data-dlremove],[data-dlpath],[data-olput],[data-mgcopy],[data-exopen]');
  if(!b) return;
  /* ★v16-H：转存分支**必须排在下面 `if(!job) return` 之前** ——
     它是「链接上的动作」，身上没有任何下载任务 id，落到那条判空就被静默挡掉了。 */
  if(b.dataset.olput){
    e.preventDefault(); e.stopPropagation();
    if(b.disabled) return;
    /* 双保险：按钮本来只在 olReady() 为真时才渲染（dlBtns），这里再判一次 ——
       万一配置在渲染之后被改掉（比如用户在另一个页签里清了缓存），
       也应当是**明确说清差什么**，而不是发一个必然失败的请求。 */
    if(!olReady()){
      olRes('OpenList 未就绪：请到「下载管理」页填好地址、点「连接测试」，再勾选实验开关。', false);
      return;
    }
    const url = b.dataset.url || '', nm = b.dataset.name || '';
    const old = b.textContent;
    b.disabled = true; b.textContent = '转存中…';
    olRes('正在把分享链交给 OpenList，等它落盘后自动接力下载…', true);
    /* ★v22：不再是「转存完就结束」—— 转存 → 轮询落盘 → 取直链 → 交给 aria2，一条链走完。
       拿不到直链时才停在中途，并把 **OpenList 的原话**贴出来（不翻译、不粉饰）。 */
    olChainToEngine(url, nm).then(res => {
      b.disabled = false; b.textContent = old;
      if(res && res.ok && res.engine === 'aria2'){
        olRes('已转存并交给下载引擎：' + res.file + '　（到「下载管理」看进度）', true);
        shellSay('已交给下载引擎');
      }else if(res && res.ok && res.submitted){
        olRes(String(res.note || '转存已提交'), true);
      }else{
        olRes('转存 / 取直链失败，OpenList 原话：' + String((res && res.err) || '未知错误'), false);
      }
    });
    return;
  }
  /* ★v23：解压历史的「打开」也是**链接上的动作**（不挂任务 id）⇒ 同样要排在那条判空之前 */
  if(b.dataset.exopen){
    e.preventDefault(); e.stopPropagation();
    upOpenPath(b.dataset.exopen, b);
    return;
  }
  const jid = b.dataset.dlcopy || b.dataset.dlopen || b.dataset.dlcancel || b.dataset.dlfile || b.dataset.dldir || b.dataset.dlretry
    || b.dataset.dlpause || b.dataset.dlresume || b.dataset.dlremove || b.dataset.dlpath;
  const job = jid ? (DL_JOBS || []).find(x => x.id === jid) : null;
  if(b.dataset.dlstart){
    const url = b.dataset.url || '';
    startDownload({ url, name: b.dataset.name || '下载' });
    e.preventDefault(); e.stopPropagation(); return;
  }
  /* ★v28：磁力 / 专用链的「复制」—— 它**没有任务 id**（不是某个 job 的按钮），
     所以必须在 `if(!job) return` 之前处理，否则会被那一行直接吞掉。 */
  if(b.dataset.mgcopy){
    const u = b.dataset.url || '';
    const ok = copyAny(u);
    shellSay(ok ? ('已复制：' + u.slice(0, 56) + (u.length > 56 ? '…' : '')) : ('复制失败，请手动复制：' + u.slice(0, 80)));
    e.preventDefault(); e.stopPropagation(); return;
  }
  if(!job) return;
  e.preventDefault(); e.stopPropagation();
  if(b.dataset.dlcopy && SHELL && SHELL.copyText){ SHELL.copyText(job.url); shellSay('链接已复制'); }
  else if(b.dataset.dlopen && SHELL && SHELL.openNetdisk){ SHELL.openNetdisk(job.url); }
  else if(b.dataset.dlcancel && SHELL && SHELL.cancelDownload){ SHELL.cancelDownload(job.id); job.state = 'pause'; renderDownloads(document.getElementById('main')); }
  /* ★v19：暂停 / 继续只对**引擎里的任务**有效（内置下载器只有取消）。
     按钮本身只在 `j.engine === 'aria2'` 时渲染，这里再判一次是为了「失败也说话」。 */
  else if(b.dataset.dlpause && SHELL && SHELL.dlPause){
    SHELL.dlPause(job.id).then(r => {
      if(r && r.ok) shellSay('已暂停');
      else shellSay((r && r.error) || '暂停失败');
      if(cur === 'downloads') renderDownloads(document.getElementById('main'));
    });
  }
  else if(b.dataset.dlresume && SHELL && SHELL.dlResume){
    SHELL.dlResume(job.id).then(r => {
      if(r && !r.ok) shellSay((r && r.error) || '继续失败');
      if(cur === 'downloads') renderDownloads(document.getElementById('main'));
    });
  }
  /* ★v23：完成任务的「复制路径」——比复制 URL 有用（URL 是网盘分享页，路径才是你真正要的） */
  else if(b.dataset.dlpath){
    if(SHELL && SHELL.copyText){ SHELL.copyText(job.dest || ''); shellSay('路径已复制'); }
  }
  /* ★v23：单条移除（用户口径「历史为什么不能删」）。只从**列表**里移除；
     若该任务还在引擎里，同时把它从引擎删掉，免得下次 dl-list 又冒出来。 */
  else if(b.dataset.dlremove){
    /* ★v24：优先传 gid —— 重启后主进程的内存映射（gidAlias）是空的，
       传页面自己的 id 主进程查不到 gid，就删不掉引擎里那条。 */
    if(job.engine === 'aria2' && SHELL && typeof SHELL.dlRemove === 'function'){
      SHELL.dlRemove(job.gid || job.id).catch(() => { /* 引擎里已没有它也无所谓 */ });
    }
    DL_JOBS = DL_JOBS.filter(x => x.id !== job.id);
    dlJobsSave(true);
    pgReset('downloads');
    refreshCounts();
    renderDownloads(document.getElementById('main'));
    return;
  }
  else if(b.dataset.dlfile && SHELL && SHELL.openPath){ SHELL.openPath(job.dest); }
  else if(b.dataset.dldir && SHELL && SHELL.revealPath){ SHELL.revealPath(job.dest); }
  else if(b.dataset.dlretry){ job.state = 'waiting'; job.err = ''; startDownload({ url:job.url, name:job.name, kind:job.kind }); }
});

/* ---------------- ★v13 结果列表：筛选 + 搜索 + 排序 + 建网格 ----------------
   抽成独立函数，是因为它现在有**两个调用方**、且必须共用同一份实现（否则两处必然漂移）：
     · render()       —— 整页渲染（切 Tab / 点排序 / 点筛选）
     · refreshList()  —— 只换结果列表（搜索框输入时）
   返回 { grid, n }：grid 是可直接塞进 #listbox 的片段，n 是命中条数。 */
function listSection(tab, all){
  const cfg = TABS[tab];
  let list = all.slice();

  // 筛选（★v5：字段可能是数组，如手游多平台 srcKeys）
  for(const g of (FILTERS[tab]||[])){
    const set=fx[g.k];
    if(set && set.size) list = list.filter(a=>{
      const v=a[g.field];
      return Array.isArray(v) ? v.some(x=>set.has(x)) : set.has(v);
    });
  }

  /* 搜索（★v13：字段白名单 + 加权，取代 JSON.stringify 全量匹配） */
  let sc = null;                       /* 命中打分表；无搜索词时为 null（不参与排序） */
  if(kw){
    const k = kw.trim().toLowerCase();
    if(k){
      sc = new Map();
      const hit = [];
      for(const a of list){
        const s = searchScore(a, k);
        if(s > 0){ sc.set(a, s); hit.push(a); }
      }
      list = hit;
    }
  }

  // 排序（分榜页没有排序按钮，榜单自带排序）
  const cmp=CMP[sortK];
  if(cmp) list.sort(cmp);
  /* ★v13：搜索命中按得分降序。**放在 cmp 之后**，且 Array#sort 是稳定的 ⇒
     同分结果保留用户选的排序，只把「主名命中」这类强信号顶到前面。 */
  if(sc) list.sort((a,b)=>sc.get(b)-sc.get(a));

  /* ★v16-A：分页。`total` 的取法见 pgTotal() —— 无筛选时是「还能往下翻多少」，
     有筛选/搜索时是「命中多少」。两者都只描述**这张列表**，不与上游总量混在一起。 */
  const hasCond = !!((kw || '').trim()) || Object.keys(fx).some(k => fx[k] && fx[k].size);
  const total = pgTotal(tab, list.length, hasCond);
  const p = pgOf(tab);
  const pages = Math.max(1, Math.ceil(total / p.size));
  if(p.page > pages) p.page = pages;                 /* 越界纠正（换页长/换筛选后可能落到空页） */
  const pageList = pgSlice(list, tab);

  let grid;
  if(!pageList.length){
    /* ★v16-A：翻到「已加载范围之外」那一瞬间（pgEnsure 还没回来）会短暂为空 ——
       这时说「没有匹配的结果」是**假话**（数据在上游，只是还没取）。
       所以按「总量 > 已加载」判成取数中态，别让用户以为搜不到。 */
    grid = (!hasCond && total > list.length)
      ? `<div class="empty"><div class="big">⏳</div>正在从实时库取第 ${p.page} 页…<br><span style="font-size:12px">离线时请切回前面几页</span></div>`
      : `<div class="empty"><div class="big">🔍</div>没有匹配的结果<br><span style="font-size:12px">试试清空筛选或搜索词</span></div>`;
  }else{
    /* ★v17：pcNew / pcHot 与游戏库取的是**同一份双源混排库** ⇒ 同一套页内合并。
       ⚠️ 只跳过渲染、不压数组：curList 仍取 pageList（data-i 是页内下标）。 */
    const MG = (tab==='pcNew'||tab==='pcHot') ? libMergeIndex(pageList) : null;
    const body=pageList.map((a,i)=>{
      if(MG && MG.skip.has(i)) return '';
      if(tab==='pcNew'||tab==='pcHot') return cardPC(a,i,false,tab, MG ? MG.note.get(i) : null);
      /* ★v10：pcRank 已在 render 的 rankBoard 分支里早退，不会再走到这里 */
      if(tab==='pcTrainer')return cardTrainer(a,i,tab);
      if(tab==='pcMod')    return cardMod(a,i,tab);
      if(tab==='mPlay')    return cardPlay(a,i,tab);     /* ★ 与 PC 端游同骨架 */
      if(tab==='mEvent')   return cardMEvent(a,i,tab);
      return cardMNew(a,i,tab);
    }).join('');
    grid=`<div class="grid ${cfg.kind==='mb'?'mb':'pc'}">${body}</div>`;
  }

  /* ★ curList 必须是**屏幕上那一页**（openDetail 用 curList[i] 取数，
     而 data-i 是页内下标）—— 这里若给整表，翻到第 2 页点第 1 张就会开成第 1 页那条。 */
  curList = pageList;
  return { grid, n: pageList.length, hit: list.length, total, pager: pagerHTML(tab, total) };
}

/* ★v13：只重刷结果列表，**不动 #main 的外壳**（页头 / 提示条 / 筛选栏 / 页脚一律原样留着）。
   这是「搜索框不再丢焦点」的根治办法 —— 详见 bindMain 里那段说明。 */
function refreshList(){
  const main=document.getElementById('main'); if(!main) return;
  const box=main.querySelector('#listbox');
  if(!box) return;                     /* 首页 / 排行榜页没有列表区，直接退出 */
  const all = D[cur] || [];
  /* ★v16-A：搜索词一变就回第 1 页 —— 否则会出现「在第 7 页搜一个只有 3 条命中的词」
     然后看到空列表，用户会以为「搜不到」。 */
  pgReset(cur);
  const sec = listSection(cur, all);
  box.innerHTML = sec.grid;
  /* 分页条必须跟着换：页码高亮 / 「共 N 条」都依赖新的命中数，
     只换 #listbox 的话分页条会停在上一次的结果上（数字与页码自相矛盾）。 */
  const old = main.querySelector('.pager');
  if(old) old.outerHTML = sec.pager;
  else box.insertAdjacentHTML('afterend', sec.pager);
  updateCount(sec.n, sec.total);
  /* ★v16-A：翻页回调分两步 —— **先同步 render()**，再视需要异步补货。
     只写 `await pgEnsure(); render();` 的话，翻页会整体退到一个微任务之后，
     用户点「下页」与实际出页之间会有一帧空档（本地内存分页时这一帧纯属白等）。
     同步那一步在「数据已加载」时就是全部工作；只有翻到边界外才会再补一批。 */
  bindPager(main, cur, sec.total, () => {
    render();
    if(LIVE_SRC[cur]) pgEnsure(cur).then(grew => { if(grew && cur) render(); });
  });
  /* ★v16-E：`box.innerHTML` 刚把标签 pill 换成了新节点 ⇒ 必须重新绑（见 bindTagPills 注释②） */
  bindTagPills(box);
  syncImgs(box);
}

/* 结果计数（`显示 N / 共 M 条`）—— render 与 refreshList 共用 */
function updateCount(n, total){
  const fc=document.getElementById('fcount');
  if(fc) fc.textContent = `显示 ${n} / 共 ${total} 条`;
}

/* 统一的交互绑定（列表页与报告页共用；报告页也必须走这里，否则折叠点击不会生效） */
function bindMain(main){
  const inp=document.getElementById('kw');
  if(inp){
    /* ★v13：搜索框不再整页重渲染。
       原实现（v8~v12）：
         kw = e.target.value; render();
         const n=document.getElementById('kw'); if(n){ n.focus(); n.setSelectionRange(p,p); }
       —— 两个毛病其实是**同一个根因**：
         · render() 会重建整个 #main，输入框节点本身也被替换 ⇒ 焦点与光标必然丢失，
           于是只能在渲染后「把焦点和光标手工捞回来」，这就是那两行 hack；
         · 而重建的代价远不止输入框 —— 页头 / 提示条 / 筛选栏 / 页脚全部重算并重新绑定，
           长列表下每敲一个字都要跑一遍。
       现在改为只替换 #listbox（见 refreshList）：输入框节点原样保留，
       ⇒ **焦点与光标天然不丢，hack 整段删除**；筛选栏也不重建，不会出现重复绑定。

       ★ 刻意**不做防抖**：防抖只是把「渲染太频繁」这个表象压下去，根因是「渲染范围过大」；
         而且防抖会把 DOM 更新推到定时器里 —— 输入与结果不再同步，
         依赖「派发 input 后立即读 DOM」的同步断言会读到旧 DOM。根治范围问题后，同步更新不再有代价。 */
    inp.addEventListener('input', e=>{
      kw = e.target.value;
      refreshList();
    });
  }
  /* ★v16-A：排序 / 筛选一变也必须回第 1 页 —— 同 refreshList 的理由
     （否则会停在一个对新结果集无意义的页码上，甚至落到空页）。 */
  main.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{ sortK=b.dataset.sort; pgReset(cur); render(); }));
  main.querySelectorAll('[data-fg]:not(.tap)').forEach(b=>b.addEventListener('click',e=>{
    /* ★v16-E：这里排除了 `.tap`（卡片上的标签 pill）——
       它们由 bindTagPills() 单独绑，且**必须**排除：
       两处都绑的话一次点击会 `fxToggle` 两次，等于没点（toggle 是自反的）。 */
    e.stopPropagation(); e.preventDefault();
    fxToggle(b.dataset.fg, b.dataset.fv); pgReset(cur); render();
  }));
  bindTagPills(main);
  /* ★v8 首页：轮播翻页 / 指示点 / 条目「查看详情」/ 区块「查看全部」 */
  main.querySelectorAll('[data-hero-nav]').forEach(b=>b.addEventListener('click',()=>{
    stopHero(); heroGo(heroIdx + Number(b.dataset.heroNav));
  }));
  main.querySelectorAll('[data-hero-dot]').forEach(d=>d.addEventListener('click',()=>{
    stopHero(); heroGo(Number(d.dataset.heroDot));
  }));
  main.querySelectorAll('[data-hero-d]').forEach(b=>b.addEventListener('click',()=>{
    openDetail(b.dataset.heroD, Number(b.dataset.heroI));
  }));
  main.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>goTab(b.dataset.go)));
  /* ★v27：首页榜单「展开全部 / 收起」。只切 class、**不重渲染** ——
     榜单落在页面最底部，整页重渲染会把滚动位置拉回顶部，用户点一下就"跳走了"。 */
  main.querySelectorAll('[data-rbmore]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const bd = b.closest('.rankboard');
    if(!bd) return;
    const k = b.dataset.rbmore;
    RB_OPEN[k] = !RB_OPEN[k];
    bd.classList.toggle('open', !!RB_OPEN[k]);
    b.textContent = RB_OPEN[k]
      ? '收起（只显示 Top ' + b.dataset.rbfold + '）'
      : '展开全部 ' + b.dataset.rbtotal + ' 条';
  }));
  /* ★v25：布局就绪后折叠放不下的元信息胶囊（见 foldMeta 注释） */
  foldMeta(main);
}

/* ★v23：这段本来是 5 段**开发者实现说明**，直接平铺在页尾 —— 实测占了大半屏，
   也是「这页有点复杂」的另一半来源。⇒ 收进折叠，默认收起，摘要只有一行。
   （内容一字未删：需要看依据的人点开就有。） */
function footNote(){
  return `<details class="footfold">
    <summary>关于数据来源与实现（点开查看）</summary>
    <div class="foot"><b>说明</b>：数据取自 ${esc((D.meta&&D.meta.builtAt)||'')} 的本机真实源。
    <b>网页版</b>读内置快照；<b>桌面版（exe）</b>启动时并发拉本机实时库（PC 侧 6 路、各 300 条），断网才回落到快照 ——
    顶栏那一行会写明当前用哪种，鼠标悬停可看快照时间。
    正式版将改为只读 BFF 契约层 <code>/api/cli/intel/*</code>（既有路由一行不改，只加只读出口）；端游报告走 GitHub Pages 旁路。<br>
    <b>图片处理</b>：<b>卡片与轮播</b>一律「容器定比 + <code>object-fit:cover</code> 满幅」——
    卡位定 <b>3:2</b>（实测源图只有 1:1 与 2.14 两簇，16:9 正好卡在两簇中间的空档，最狠裁切 43.8%；改 3:2 后降到 33.3%）；
    <b>详情弹窗的大图尺寸完全由 CSS 决定</b>（宽图铺满整宽、方图 / 竖图限高后完整显示），不做任何比例判断 ——
    旧写法用 <code>onload</code> 读原图宽高判比例，图片命中缓存时该回调可能早于节点入树触发而静默失效，方形图会退回
    <code>cover</code> 被裁成一条横带，这就是「弹窗大图被截」的根因。
    所有图片统一带 <code>referrerpolicy="no-referrer"</code>（实测 TapTap 图床对 localhost 来源头返回 HTTP 567）。<br>
    <b>交互</b>：首页为<b>大图轮播</b>（5 秒自动切换、悬停暂停、箭头 / 指示点手动翻页）+ PC 新游 / PC 热游 / 手游新游三块精选；
    <b>排行榜</b>为 <b>PC 新游 / PC 热游 / 手机新游 / 手机热游</b> 四个分榜（各 Top 12，不设搜索与筛选）；
    <b>所有卡片与排行榜行点击均弹窗</b>显示详情（不再直接跳走），弹窗内含大图、评分 / 热度、参数字段、平台直达按钮。<br>
    <b>桌面版独有</b>：全量游戏库（19,590 款、分页浏览 + 搜索）、扫盘「我的游戏」（识别本机 Steam 库与快捷方式，再与全量库过闸门匹配）、
    统一下载管理（真直链由内置下载器落盘，网盘做复制链接 + 唤起客户端）。<br>
    <b>未实现（规划中）</b>：跨源统一搜索、apk 壳、更新链路（exe 静默升级 / APK 引导安装）。</div>
  </details>`;
}

/* ================= 详情弹窗（★v6：版式对齐 PC 游戏工作台详情抽屉） =================
   结构（自上而下）：hero 大图 + 渐变 + 标题压图 + 来源徽标
                   → 黄色口径提示条 → 大号数字行 → KV 卡片网格 → 分区块（介绍/标签）
                   → 平台直达按钮组 → 底部说明
   ★ 与 v5 的差别：v5 只有「标题 + 标签 + 5 格 KV + 一个链接」，用户反馈「内容太少了」；
     本版把各 Tab 的原项目字段尽可能带出（PC 端游 9 格 KV + 最多 4 个直达入口）。      */
/* 取值兜底：空/0/undefined 一律显示 "—"（注意：别用 T 这个名字，顶部已有 const T = D.totals） */
const nz = (v, d) => (v === undefined || v === null || v === '' || v === 0) ? (d === undefined ? '—' : d) : v;

/* 各来源徽标配色（弹窗右上角） */
const DSRC_CLS = {xd:'src-xd', jidi:'src-jidi', steam:'src-steam',
                  taptap:'src-taptap', haoyou:'src-haoyou', x7:'src-x7',
                  gamersky:'src-gamersky', gcores:'src-gcores'};

function detailOf(tab, a){
  const scls = SRC_CLS[a.srcKey] || '';
  const nm = nameParts(a.title || a.game || '');

  /* ---------------- 手游新游（三源合并卡） ---------------- */
  if(tab === 'mNew'){
    const plats = (a.sources || []);
    let big;
    if(Number(a.score) > 0){
      big = {v: fmtScore(a.score), lab: '评分（源站评分 · 满分 10）',
             chips: [['收录 ' + (a.n || 1) + ' 条', ''],
                     ...(a.hot ? [['热度 ' + fmtHot(a.hot) + '（' + (a.hotLabel || '') + '）', 'wn']] : [])]};
    }else if(a.hot){
      big = {v: fmtHot(a.hot), hm: true, lab: '热度（' + (a.hotLabel || '关注 / 预约数') + '）',
             chips: [['收录 ' + (a.n || 1) + ' 条', '']]};
    }else{

    }
    return {
      img: a.img, title: a.game || a.title, en: '',
      src: {nm: plats.map(p => p.src).join(' + ') || a.src, cls: scls},
      notice: '本卡由<b>同一游戏</b>在三源（TapTap / 好游快爆 / 小七）的资讯记录<b>合并</b>而成，多平台会并列多个来源标签；下方列出全部原始链接。',

      big: null,

        ['所属游戏', nz(a.game)],

      links: a.url ? [{t: '打开原页', url: a.url}] : [],
      foot: '来自本机 <code>mobilehub.json</code> 的「模拟器可玩性」实测数据（3,264 条游戏 / 16,148 套配置）。',
    };
  }

  /* ---------------- PC 修改器 ---------------- */
  if(tab === 'pcTrainer'){
    return {
      img: a.cover, title: a.title, en: a.en || '',
      src: {nm: a.src || '修改器', cls: scls},
      big: a.version ? {v: a.version, unit: '', lab: '修改器版本', small: true,
                        chips: a.steamId ? [['Steam ' + a.steamId, '']] : []} : null,
      kv: [
        ['中文名', nz(a.title)],
        ['英文名', a.en || ''],
        ['修改器版本', nz(a.version)],
        ['Steam ID', nz(a.steamId)],
        ['来源', nz(a.src)],
        ['类型', '修改器'],
      ],
      blocks: [],
      links: a.url ? [{t: '打开修改器页', url: a.url}] : [],
      foot: '修改器数据来自本机 <code>trainers.json</code>（3,660 条 / 5 个来源），Demo <b>按来源轮询取样</b>避免单一来源淹没。',
    };

  /* ---------------- PC MOD ---------------- */
  if(tab === 'pcMod'){
    return {
      img: a.cover, title: a.title, en: a.game || '',
      /* ★v10：来源是「机地」（单一源），不是「MOD」——MOD 是类型。 */
      src: {nm: a.src || '机地', cls: SRC_CLS[a.srcKey] || ''},
      big: a.pv ? {v: fmtHot(a.pv), lab: '浏览量',
                   chips: [['附带链接 ' + (a.nlink || 0) + ' 条', '']]} : null,
      kv: [
        ['所属游戏', nz(a.game)],
        ['类型', nz(a.kind)],
        ['来源', nz(a.src, '机地')],

        ['附带链接', a.nlink ? a.nlink + ' 条' : ''],
      ],
      blocks: [],
      /* ★v10：「原帖」与「游戏页」是**两个不同的东西**，必须分别给。
         原实现写成 `url = libUrl or url`，把机地原帖覆盖成了匹配到的库页面 ⇒
         弹窗上那个「打开原帖」实际打开的是 **XD 的游戏页**（实测 Top60 里 51 条有 libUrl）。

      links: [

        a.libUrl ? {t: '打开游戏页（' + (a.libSrc === 'xd' ? 'XD' : '机地') + '）', url: a.libUrl} : null,
      ].filter(Boolean).map((l, k) => Object.assign(l, {sec: k > 0})),
      foot: 'MOD 帖采集自 <b>机地</b>（单一来源）；「游戏页」是匹配到的端游库条目，两者不是同一页。'
          + '「附带链接」指该帖附带的网盘 / 下载链接条数，仅展示不跳转网盘。',

  }

  /* ---------------- PC 端游（新游 / 热游 / 排行） ---------------- */
  const links = [
    a.url ? {t: '打开源站详情页', url: a.url} : null,

  return {
    img: a.cover, title: nm.main, en: nm.en,
    src: {nm: a.src || '', cls: scls},
    notice: 'PC 端游来自本机 game-aggregator 的 <b>xdgamer + jidi</b> 游戏库（19,239 条），<b>不含 Steam 商店源</b>；Steam 链接为按封面 AppID 拼出的商店页。',
    big: Number(a.score) > 0
      ? {v: a.score, unit: '/ 10', lab: '玩家评分', small: false,
         chips: [a.hot ? ['热度 ' + fmtHot(a.hot), 'wn'] : null, [a.src + ' 收录', '']].filter(Boolean)}
      : (a.hot ? {v: fmtHot(a.hot), hm: true, lab: '热度（入库热度值）', chips: [[a.src + ' 收录', '']]} : null),
    kv: [
      ['游戏类型', (a.genres && a.genres.length) ? a.genres.join(' / ') : (a.genre || '')],
      ['游戏大小', nz(a.size)],

      ['源发布时间', a.published || ''],
      ['入库来源', nz(a.src)],
      ['Steam AppID', a.appid ? String(a.appid) : ''],

    ],
    blocks: [],
    links,
    foot: '全部字段取自本机 <code>games.json</code> 的既有字段（未新增抓取）：<code>appid</code> / <code>jidiId</code> / <code>publishTs</code> / <code>updatedTs</code>。',
  };
