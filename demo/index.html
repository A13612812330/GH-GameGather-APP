<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ★ 关键：禁止发送 Referer。实测 TapTap 图床对 localhost 来源头返回 HTTP 567，加此即可正常加载 -->
<meta name="referrer" content="no-referrer">
<title>游戏情报客户端 · Demo</title>
<!-- ★v9：主题必须在 CSS 解析之前就定下来，否则首帧会先画出浅色再跳深色（闪一下）。
     所以这段同步脚本放在 <head>，而不是 body 末尾 —— 那里已经太晚。 -->
<script>
(function(){
  var t = 'dark';   /* 深色为默认（对齐 TapTap 官网） */
  try{ var v = localStorage.getItem('gi-theme'); if(v === 'light' || v === 'dark') t = v; }catch(e){}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{
  /* ===== 视觉基线：沿用端游看板「浅色优雅风」，未新造风格 ===== */
  --bg:#f4f6fb; --card:#ffffff; --txt:#1c2333; --sub:#667085; --line:#e4e8f0;
  --accent:#1e4ed8; --up:#e03e3e; --down:#12a150; --hdr:#1e3a6e; --hdr-txt:#fff;
  --hover:#f0f4ff; --warn:#b45309; --warnbg:#fff8ed; --ok:#12a150; --okbg:#eefaf3;
  --imgbg:linear-gradient(160deg,#eef2f9 0%,#e2e9f6 100%);

  /* ===== ★v9 主题化补充 token =====
     把原先写死在规则里的浅色/灰度收到变量上。浅色下的取值**逐条等于原硬编码**，
     所以切到浅色时外观与 v8 完全一致（可用截图 md5 反证）；深色只覆盖这一层，
     布局与规则结构一行不碰 ⇒ 两套主题共用同一份代码。
     这里刻意用 --sub2/--ph/--dimtxt 三级灰阶，而不是一个 --sub 包打天下。 */
  --raise:#ffffff;          /* 浮起面：激活分段钮 / 次要按钮 / 大号数字块 */
  --sunken:#f0f3f9;         /* 内嵌底：分段控件槽 / 名次胶囊 / 比例槽 / kbd */
  --soft:#f8f9fc;           /* 次级面板底：KV 小卡 / 分区块 / 折叠正文 */
  --input:#fbfcfe;          /* 输入框常态底 */
  --panel-a:#f8fafd;        /* 榜头渐变起 */
  --panel-b:#f2f6fd;        /* 榜头渐变止 */
  --divider:#f1f4f9;        /* 行级淡分隔线（比 --line 更轻） */
  --hairline:#c9d6f0;       /* hover 时的边框 */
  --ph:#b6c1d4;             /* 占位图标 / 极弱文字 */
  --sub2:#98a2b3;           /* 比 --sub 更弱一档 */
  --dimtxt:#c3cad8;         /* 「—」这类占位文字 */
  --dotoff:#c8d3e6;         /* 轮播指示点（未激活） */
  /* ★ 关键拆分：--hdr 同时被顶栏底与 .hname 标题色引用。深色下顶栏是近黑、
     标题必须发亮，两者不可能同值 ⇒ 拆出 --title-strong 专管标题。 */
  --title-strong:#1e3a6e;
  /* ★ 主色底上的文字色。深色下主色变青绿（亮），白字对比不足 ⇒ 反成深色。 */
  --on-accent:#ffffff;
  --ok-line:#bfe8d2;
  --or:#e0642e; --or-bg:#fff1f0;                        /* 橙：热度 / 关注 */
  --or2:#c2410c; --or2-bg:#fff5ed; --or2-line:#fadfc8;  /* 深橙：定档 / 预约 */
  --accent-2:#3b6ef5; --accent-h:#1b45c0;               /* 主色渐变尾 / hover 加深 */
  --sh1:rgba(30,58,110,.13); --sh2:rgba(30,58,110,.1); --sh3:rgba(18,26,51,.13);
  --sh-hero:rgba(30,58,110,.06);
  --ring:rgba(30,78,216,.10); --sh-accent:rgba(30,78,216,.26);
  --or-line:#fbd0cb;
  --warn-line:#fadfae; --warn-tx:#7c4a03; --warn-tx-b:#8a4b03; --warn-chip:#fef3c7;
  /* .dnotice（弹窗内提示）与 .notice 原先**不是同一组棕色**，各自保留原值：
     统一它们会造成可测的色差，也就不可能拿到「浅色零退化」的结论。 */
  --note-bg:#fff8e6; --note-line:#f5de9c; --note-tx:#8a5b00; --note-tx-b:#7a4f00;
  --ok-tint:#f7fdfa;
  --gn-tx:#047857; --gn-chip:#d1fae5;
  --info-tx:#0369a1; --info-chip:#e0f2fe;
  --info-panel:#eef4ff; --info-panel-line:#c9d9f7;
  --bad-bg:#fef3f2; --bad-line:#fbd0cb; --bad-tx:#b42318;
  --bar-from:#6f9bff;
  --tag-bg:rgba(30,58,110,.86);
  /* ★ 半透明叠色单独保留 α —— 换成不透明纯色会在浅色下产生可测的色差，
     这几处必须沿用原 α 值，才能保证「浅色像素零退化」 */
  --code-bg:rgba(255,255,255,.6);
  --badge-bg:rgba(255,255,255,.95);
  --dsrc-bg:rgba(30,58,110,.84);

  /* ===== 卡片尺寸基线（做法取自 PC 游戏工作台）===== */
  --th-ar:16 / 9;      /* 缩略图容器比例【基线】。★v11：此值现在只对 pcNew 生效，
                          混源 Tab 由 #main 覆盖为 3/2 —— 覆盖规则与实测依据见样式表 §v11 */
  --cd-lh:1.4;         /* 卡片标题行高 */
  --cd-t2:2.8em;       /* 标题「固定预留两行」高度 = 2 × --cd-lh */
  --cd-th-r:9px;       /* 缩略图圆角 */
  --cd-meta:20px;      /* 元信息区 / 底栏固定高度（单行）⇒ 卡片严格等高 */
  --mb-th:72px;        /* 手游新游 icon 边长 */
  --mb-tw:112px;       /* 手游活动 banner 宽（★v16-F：88 → 112。用户 ⑦「放大一点图片和标题」） */
  --mb-thw:78px;       /* ★v16-F：活动图**本身是正方 icon** 时改用的正方框边长 */
  --mb-sub:1.55em;     /* 手游新游时效行固定高度（单行）⇒ 卡片等高 */
  --mb-note:2.8em;     /* 手游活动副标题「固定预留两行」 */

  /* ===== ★v25 圆角级差 =====
     v24 及以前全仓散落 10 种 ad-hoc 圆角（2/3/4/5/6/7/8/9/10/12px），同类组件取值不统一。
     v25 收敛成 6 级，规则：徽标=sm、缩略图/图标块=sm、输入与按钮=md、中号块=m、
     面板与分区块=lg、**游戏卡=xl**（对齐参考站 1rem 卡片）。
     2px/3px 仅用于 6px 小方块与 6px 高进度槽，属「微件」，不进级差。 */
  --r-xs:4px;
  --r-sm:6px;
  --r-md:8px;
  --r-m:10px;
  --r-lg:12px;
  --r-xl:16px;
}

/* ===== ★深色主题（v9 建立，v25 换色板）=====
   v9 取值对齐 TapTap：页面底 #161616 / 面板 #1f1f1f / 主色青绿 #00D9C5 / 次要文字 #90969C。
   **v25 起改参考 games.gg 的深蓝黑 slate 阶**：底 #060d17 / 面板 #101828 / 主色春绿 #23db8c /
   次要文字 #99a1af（2026-10-23 用户拍板，**推翻 v9「保持中性灰」的拍板**，v9 值仅作历史留档）。
   这里**只覆盖 token，不动任何规则** —— 布局、间距、段序与浅色共用一份代码，
   所以两套主题不会漂移；改版式时两套一起变。
   ⚠️ 深色下「主色底 + 深字」：--accent 是亮绿，白字对比不足，
   故 --on-accent 用深墨绿 #04170e，而不是白字。 */
html[data-theme="dark"]{
  /* ===== ★v25 深蓝黑（参考 games.gg，2026-10-23 用户拍板）=====
     【口径】下面带「=gg」的是 **games.gg 实测值**（抓其 CSS 的 tailwind 语义变量所得）；
     其余是按该 slate 色阶推导的 **本项目采纳值**，两者不同不是错误。
     games.gg 实测：bg #060d17 / card #101828 / popover #1e2939 / border #1e2939 /
                    input #364153 / type-1 #f9fafb / type-2 #99a1af / primary #23db8c
     推导规则：旧中性灰按**相对亮度**映射到 slate 阶，主色青绿按同亮度换到春绿。
     ⚠️ 本块是深色外观的**唯一来源** —— 全仓无第二处硬编码深色（v25 已核）。
     回退点：index.v24.bak.html（中性灰 #161616 版）。 */
  --bg:#060d17;            /* =gg background */
  --card:#101828;          /* =gg gray-900（surface-1） */
  --txt:#f9fafb;           /* =gg gray-50（type-1） */
  --sub:#99a1af;           /* =gg gray-400（type-2） */
  --line:#1e2939;          /* =gg gray-800（border） */
  --accent:#23db8c;        /* =gg brand-logo-green */
  --up:#ff6f38; --down:#10b981;
  --hdr:#0a1220; --hdr-txt:#f9fafb;
  --hover:#182338; --warn:#f5b544; --warnbg:#2a2113; --ok:#23db8c; --okbg:#0f2a20;
  --imgbg:linear-gradient(160deg,#182638 0%,#0d1626 100%);

  --raise:#1e2939;
  --sunken:#0b1524;
  --soft:#16202f;
  --input:#0e1a28;
  --panel-a:#16202f; --panel-b:#101828;
  --divider:#17222f;
  --hairline:#2b3a4d;
  --ph:#4a5a6e;
  --sub2:#8b95a6;
  --dimtxt:#647084;
  --dotoff:#34425a;
  --title-strong:#ffffff;
  --on-accent:#04170e;
  --ok-line:#1d6b47;
  --or:#ff9e64; --or-bg:#2a1d13;
  --or2:#ffab70; --or2-bg:#2a1d13; --or2-line:#43301f;
  --accent-2:#1cc47e; --accent-h:#19b474;
  --sh1:rgba(2,6,15,.6); --sh2:rgba(2,6,15,.5); --sh3:rgba(2,6,15,.55);
  --sh-hero:rgba(2,6,15,.4);
  --ring:rgba(35,219,140,.2); --sh-accent:rgba(35,219,140,.28);
  --or-line:#43301f;
  --warn-line:#453720; --warn-tx:#f0c674; --warn-tx-b:#f5d48a; --warn-chip:#33280f;
  --note-bg:#2a2113; --note-line:#453720; --note-tx:#f0c674; --note-tx-b:#f5d48a;
  --ok-tint:#0f2a20;
  --gn-tx:#6ee7a8; --gn-chip:#0f2a20;
  --info-tx:#7cc4f0; --info-chip:#102336;
  --info-panel:#121e2e; --info-panel-line:#24344a;
  --bad-bg:#2a1618; --bad-line:#452326; --bad-tx:#f09595;
  --bar-from:#1bb774;
  --tag-bg:rgba(4,9,17,.78);
  --code-bg:#26313f;
  --badge-bg:#26313f;
  --dsrc-bg:rgba(4,9,17,.78);
}

/* ===== ★v9 深色主题的「规则级」补丁 =====
   上面那层是纯 token 覆盖；下面这几条无法靠换变量解决，必须单独写：
   来源 pill 在浅色主题是「浅底(.1α) + 深字」，这套配色放到深色背景上会**两头失效**
   （浅底几乎不可见 + 深字在黑底上看不清）⇒ 深色下反成「半透明底 + 亮字」。 */
html[data-theme="dark"] .pill.src-xd{background:rgba(11,123,255,.16);border-color:rgba(11,123,255,.34);color:#6aabff}
html[data-theme="dark"] .pill.src-jidi{background:rgba(230,65,93,.16);border-color:rgba(230,65,93,.34);color:#ff8095}
html[data-theme="dark"] .pill.src-steam{background:rgba(120,160,220,.16);border-color:rgba(120,160,220,.34);color:#9dbbdf}
html[data-theme="dark"] .pill.src-taptap{background:rgba(0,151,167,.18);border-color:rgba(0,151,167,.36);color:#43cfdd}
html[data-theme="dark"] .pill.src-haoyou{background:rgba(234,88,12,.18);border-color:rgba(234,88,12,.36);color:#ff9c5c}
html[data-theme="dark"] .pill.src-x7{background:rgba(225,29,72,.18);border-color:rgba(225,29,72,.36);color:#ff7a99}
html[data-theme="dark"] .pill.src-gamersky{background:rgba(99,102,241,.18);border-color:rgba(99,102,241,.36);color:#a5a8f5}
html[data-theme="dark"] .pill.src-gcores{background:rgba(16,185,129,.18);border-color:rgba(16,185,129,.36);color:#4fd6a8}
/* 遮罩与弹窗 hero 在深色下要更沉，否则跟页面底分不出层次 */
html[data-theme="dark"] .mask{background:rgba(2,6,15,.72)}
html[data-theme="dark"] .dtop{background:#08111d}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg); color:var(--txt); font-size:13px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ===== 顶部栏 ===== */
.topbar{
  height:52px;flex:0 0 52px;background:var(--hdr);color:var(--hdr-txt);
  display:flex;align-items:center;gap:14px;padding:0 16px;user-select:none;
}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.3px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:#63e6be;box-shadow:0 0 8px #63e6be}
.ver{font-size:11px;opacity:.72;background:rgba(255,255,255,.14);padding:2px 7px;border-radius:var(--r-xs)}
.topbar .spacer{flex:1}
.svc{display:flex;align-items:center;gap:6px;font-size:11.5px;opacity:.9}
.svc i{width:7px;height:7px;border-radius:50%;background:#63e6be;display:block}
.btn{
  border:none;border-radius:var(--r-sm);padding:6px 12px;font-size:12px;cursor:pointer;
  font-family:inherit;background:rgba(255,255,255,.16);color:#fff;transition:.15s;
}
.btn:hover{background:rgba(255,255,255,.28)}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.35)}

/* ===== 布局 ===== */
.body{flex:1;display:flex;overflow:hidden}
.nav{
  width:200px;flex:0 0 200px;background:var(--card);border-right:1px solid var(--line);
  padding:10px 0;overflow-y:auto;
}
.nav h4{font-size:11px;color:var(--sub);padding:9px 18px 5px;font-weight:600;letter-spacing:.6px}
.nav a{
  display:flex;align-items:center;gap:9px;padding:8px 18px;color:var(--txt);
  text-decoration:none;font-size:13px;border-left:3px solid transparent;transition:.12s;
}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--hover);border-left-color:var(--ok);font-weight:700;color:var(--accent)}
.nav a .ico{width:16px;text-align:center;font-size:14px}
.nav a .cnt{margin-left:auto;font-size:11px;color:var(--sub);background:var(--bg);padding:1px 6px;border-radius:var(--r-md)}
/* ★v18：「管理页」条目右侧的「开在新窗口」提示。
   ⚠️ 不能复用 `.cnt` —— v16-A 后 `.nav .cnt { display:none }`（数量全下线），会连这个箭头一起藏掉。
   ★ 注意上面这句**刻意写成带空格的形态**：反证 `_counterproof.py` 的 M47 用
     `.nav .cnt{display:none}`（无空格）当打坏点锚串，而它的启动自检要求该串**全文唯一**。
     这里若照抄成无空格版本，锚串就会先命中这行注释 ⇒ 打坏落在注释上、真 CSS 没动、
     反证出现盲区。（v18 实测踩到过，自检当场拦下。） */
.nav a .ext{margin-left:auto;font-size:12px;color:var(--sub);opacity:.75}
.nav .grp{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
/* ★v14：`hidden` 属性靠 UA 样式表生效，而作者样式表里的 `.nav a{display:flex}` 会盖掉它。
   这里显式兜底，保证「探测失败」时整块 PC 工作台入口确实消失（不是只隐藏子项）。 */
.nav .grp[hidden]{display:none}
/* ★v16-G：侧栏底部状态条 —— **默认不显示**，只在桌面客户端形态（`html.has-shell`）出现
   （样式见样式表 §v16-G ④）。网页形态下它连占位都不占。 */
.navfoot{display:none}

.main{flex:1;overflow-y:auto;padding:16px 20px 32px}
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.crumb h2{font-size:17px;font-weight:700}
.srcbadge{
  font-size:11px;padding:2px 8px;border-radius:var(--r-m);border:1px solid var(--line);
  background:var(--card);color:var(--sub);
}
.srcbadge.real{background:var(--okbg);border-color:var(--ok-line);color:var(--ok);font-weight:600}
.srcbadge.gap{background:var(--warnbg);border-color:var(--warn-line);color:var(--warn);font-weight:600}
.notice{
  background:var(--warnbg);border:1px solid var(--warn-line);border-left:3px solid var(--warn);
  color:var(--warn-tx);padding:9px 12px;border-radius:var(--r-sm);margin-bottom:14px;font-size:12.5px;
}
.notice b{color:var(--warn-tx-b)}
.notice code{background:var(--code-bg);padding:1px 5px;border-radius:var(--r-xs);font-size:11.5px}
.notice.info{background:var(--info-panel);border-color:var(--info-panel-line);border-left-color:var(--accent);color:var(--title-strong)}
.notice.info b{color:var(--accent)}

/* ===== 筛选 / 排序栏（结构参考 PC 游戏工作台 .filter-bar）===== */
.filter-bar{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:10px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;
}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
.flb{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.5px;flex:none;min-width:28px}
.pills{display:inline-flex;align-items:center;gap:3px;background:var(--sunken);border-radius:var(--r-m);padding:3px;flex:none;flex-wrap:wrap}
.pill-b{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;color:var(--sub);
  border-radius:var(--r-md);padding:5px 12px;cursor:pointer;transition:.14s;white-space:nowrap;
  font-family:inherit;border:none;background:transparent;line-height:1.35;
}
.pill-b:hover{color:var(--accent)}
.pill-b.on{background:var(--raise);color:var(--accent);box-shadow:0 1px 4px var(--sh3)}
.pill-b .lb{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:#9aa3b5;opacity:.7}
.pill-b.on .lb{color:var(--accent);opacity:.62}
.tg{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--sub);
  background:var(--raise);border:1px solid var(--line);border-radius:var(--r-md);padding:5px 11px;cursor:pointer;
  transition:.15s;font-family:inherit;white-space:nowrap;line-height:1.35;flex:none;
}
.tg:hover{border-color:var(--accent);color:var(--accent)}
.tg.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent;box-shadow:0 3px 10px var(--sh-accent)}
.tg .n{font-size:10px;opacity:.7;font-weight:600}
.fcount{margin-left:auto;font-size:11.5px;color:var(--sub);white-space:nowrap}
.search{flex:1;min-width:180px;max-width:100%;position:relative}
.search input{
  width:100%;padding:7px 12px 7px 30px;border:1px solid var(--line);border-radius:var(--r-md);
  font-family:inherit;font-size:12.5px;background:var(--input);color:var(--txt);outline:none;transition:.15s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);background:var(--raise)}
.search .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:12px;pointer-events:none}

/* ===== 卡片网格 ===== */
.grid{display:grid;gap:14px}
/* ★ 统一骨架：PC 端游 5 个 Tab（新游/热游/排行/修改器/MOD）+ 手游「可玩端游」共用 .card */
.grid.pc{grid-template-columns:repeat(auto-fill,minmax(224px,1fr))}
/* 手游两个 Tab 走「左侧缩略图 + 右侧文字」的横向紧凑卡；新游右侧多一列大号评分，故列宽更宽 */
.grid.mb{grid-template-columns:repeat(auto-fill,minmax(336px,1fr));gap:10px}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;
  transition:transform .2s ease,box-shadow .2s ease,border-color .16s;cursor:pointer;display:flex;flex-direction:column;position:relative;
}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 26px var(--sh1);border-color:var(--hairline)}

/* 图片：容器定比（--th-ar）＋一律 cover 铺满。
   ★v7：不再按原图比例切 contain/blur —— 见下方「为什么废掉模糊铺底」。
   ★v8：**图片可见性完全交给 CSS，不再依赖 onload**。
   原来 `.cv img{opacity:0}` + `.cv img.ready{opacity:1}`（靠 onload 加 .ready）有一个
   必然踩中的坑：图片命中缓存（含本地 file:// 与回访）时，`load` 事件可能在节点入树**之前**
   就已派发 ⇒ `reveal()` 根本不执行 ⇒ `.ready` 永远不加 ⇒ **图加载完了却一直透明**。
   （实测：mEvent 98 张图 `complete=true / naturalWidth=1080`，`opacity` 却全为 0，截图整片空白。）
   现在的做法：img 直接可见 + `z-index:1` 压在占位 `.ph` 之上；`reveal()` 只做
   「把占位标 .gone」这一件优化性的事，**不再决定图能不能看见**。 */
/* ===== ★v11 按 Tab 自适应的卡位比例（2026-10-15 · 实测驱动）=====
   实测 651 张图的**原始比例只有两簇**：1:1 方图 297 张（46%）、2.14 宽图 282 张（44%）；
   而 1.2~1.6 与 ≥2.3 两个区间**一张图都没有**。16:9（1.778）正落在两簇之间的空档里，
   于是方图被上下切、宽图被左右切 —— 两类都不能幸免，最狠都是 43.8%。

   按「实测的每张图原比例」逐个代入试算（不是按假设的 1:1 / 2.14 手算），
   格式为 均值裁 / 最狠裁：
     · 16:9 ： 22~37% / **43.8%**   ← 均值看着不差，但每一屏都有图被裁掉四成
     · 3:2  ： 30~32% / **33.3%**   ← 均值涨 2~10pp，换最狠降 10.5pp
     · 1.46 ： 31.6%  / 31.7%       ← 更均匀，但一刀切、且比例不「整」

   ⇒ 混源 Tab 用 3/2；**唯独 pcNew 保留 16:9** ——
     该页 60 张的源比例区间是 2.14~2.14（纯宽图），16:9 对它已经是最优（裁 16.9%），
     改成 3:2 反而恶化到 29.9%。

   ⚠️ 挂载点必须放在 #main 上：`--th-ar` 只被 `.cv` 消费，而 `.cv` 全都在 `#main` 内；
      详情弹窗 `.mask` 挂在 `#main` **之外**，因此不受影响（它自带 contain + 模糊铺底那套逻辑）。
   ⚠️ 与 JS 的约定：`render()` 会把当前 Tab 写进 `#main.dataset.tab`，作为下面选择器的锚点。 */
#main{--th-ar:3 / 2}
#main[data-tab="pcNew"]{--th-ar:16 / 9}
.cv{position:relative;overflow:hidden;background:var(--imgbg);aspect-ratio:var(--th-ar)}
.cv img{
  width:100%;height:100%;object-fit:cover;object-position:center;display:block;
  position:relative;z-index:1;
}
/* ★v7 废掉「近方形原图 → contain + 同图模糊铺底」（v5–v6 的写法）。
   为什么废：
     ① 观感差 —— 16:9 卡位里，方图经 contain 只占 **184/327 = 56% 宽**，两侧是
        模糊底。模糊底再像原图也是一块「脏色条」，一屏里一半满幅一半脏条，
        用户口径：「端游模块的图片还是未适配，很奇怪」。
     ② 与基线不一致 —— 本机 PC 游戏工作台（game-aggregator）的**主列表卡**
        `.row-card .th img` 一直是 `object-fit:cover`；`contain` 只用在它 106px 的
        小号「同类推荐」横滑卡上（那里太小，裁切会看不清）。本页卡位 224px+，
        属主线场景 ⇒ 跟 `cover`。
     ③ 机制本身脆 —— 判比例要读 naturalWidth，缓存命中时 onload 可能早于入树，
        需要一路空值防御 + syncImgs 补跑（见 §1.2.2）。既然结论是 cover，
        这一整套判断就不必存在了。
   代价（明说）：方图用 cover 进 16:9 会**纵向裁掉约 44%**（215×215 → 只见中间一条），
   方图上的标题/logo 可能被切。这是「满幅统一」换来的，取的是统一。
   ★v11 变更（2026-10-15）：**已采纳 3:2** —— 理由不是「更看重不裁不切」，
   而是实测发现 16:9 的「**最狠单张裁切**」恒为 43.8%（每一屏都能挑出被裁掉四成的图），
   换成 3:2 后降到 33.3%。四档对照见 demo/图片适配对照.html，
   651 张全量实测与候选对照见 exe-preview/imgfit-review.html。 */
/* 图挂掉时 .ph 占位：onerror 直接 this.remove()，占位由 .ph 顶上 */
.cv .ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--ph);font-size:30px;
}
.cv .ph.gone{display:none}

.tag{
  position:absolute;top:7px;left:7px;background:var(--tag-bg);color:#fff;z-index:2;
  font-size:10.5px;padding:2px 7px;border-radius:var(--r-xs);font-weight:600;letter-spacing:.2px;
  max-width:66%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* 来源色标：按源区分，与 PC 工作台 src-badge 思路一致 */
.tag.src-xd{background:rgba(11,123,255,.9)}
.tag.src-jidi{background:rgba(230,65,93,.9)}
.tag.src-steam{background:rgba(23,55,94,.9)}
.tag.src-taptap{background:rgba(0,151,167,.9)}
.tag.src-haoyou{background:rgba(234,88,12,.9)}
.tag.src-x7{background:rgba(225,29,72,.9)}
.tag.src-gamersky{background:rgba(99,102,241,.9)}
.tag.src-gcores{background:rgba(16,185,129,.9)}
/* 修改器 5 个来源（原来没配色，与其它 Tab 不一致 → v4 补齐） */
.tag.src-ce{background:rgba(120,113,108,.9)}
.tag.src-fling{background:rgba(220,38,38,.9)}
.tag.src-community{background:rgba(100,116,139,.9)}
.tag.src-xiaoxing{background:rgba(13,148,136,.9)}
.tag.src-gcm{background:rgba(147,51,234,.9)}
.tag.tier{background:rgba(18,161,80,.9)}
.tag.tier.gray{background:rgba(102,112,133,.85)}
.tag.modk{background:rgba(180,83,9,.88)}
.badge-tr{
  position:absolute;top:7px;right:7px;background:var(--badge-bg);color:var(--accent);
  font-size:11px;font-weight:700;padding:2px 7px;border-radius:var(--r-xs);z-index:2;
}
.badge-tr.hot{color:var(--up)}
.rankno{
  position:absolute;bottom:0;left:0;background:var(--accent);color:var(--on-accent);font-size:11px;
  font-weight:700;padding:2px 9px;border-radius:0 6px 0 0;z-index:2;
}

/* ===== 卡片正文：固定内容布局 ===== */
.cbody{padding:9px 10px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.ctitle{
  font-size:12.5px;font-weight:600;line-height:var(--cd-lh);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:var(--cd-t2);           /* ★ 固定预留两行，卡片等高 */
}
/* ★v8：英文名统一用（）包含（用户需求①）。括号内的英文比中文小半号、灰度降一档，
   保证「中文名」仍是视觉主体。例：007 初露锋芒（007 First Light） */
.ctitle .en{font-weight:500;color:var(--sub);font-size:11.5px}
.cmeta{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;overflow:hidden;min-height:var(--cd-meta)}
.crow{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--sub);flex-wrap:nowrap;overflow:hidden}
.crow.bottom{margin-top:auto;min-height:var(--cd-meta)}
/* 底栏里的长文本（如「帧数不显示，轻微卡顿」）单行省略，不撑高卡片 */
.ell{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-xs);padding:1px 6px;font-size:10.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.pill.hot{background:var(--or-bg);border-color:var(--or-line);color:var(--up);font-weight:600}
/* ★v25 折叠计数胶囊：比普通 pill 更「弱」但又得能看出是交互提示 ⇒ 主色描边 + 主色字 */
.pill.foldn{background:transparent;border-style:dashed;border-color:var(--hairline);color:var(--accent);font-weight:700;letter-spacing:.2px;cursor:help}
/* ★v16-C：资源角标（MOD / 修改器 / 存档）。用中性 token，不抢「热度」的橙色语义。 */
.pill.rz{background:var(--sunken);border-color:var(--line);color:var(--sub);font-weight:600}
/* ★v16-E：卡片上可点的标签（点 = 按该标签筛选）。给个手型与 hover 描边，
   否则用户根本看不出「这个小胶囊能点」—— 与筛选栏里不可点的展示型 pill 区分开。 */
.pill.tap{cursor:pointer}
.pill.tap:hover{border-color:var(--accent);color:var(--accent)}
.pill.ok{background:var(--okbg);border-color:var(--ok-line);color:var(--ok);font-weight:600}
/* ★v17：跨源同款合并标记（列表里「⊕ 另有 N 条同款」）。
   刻意用**中性信息色**而不是热度橙 / 资源灰 —— 它描述的是「这条是怎么来的」，
   不是游戏本身的属性，不该抢属性胶囊的视觉权重。 */
.pill.mg{background:var(--info-chip);border-color:var(--info-chip);color:var(--info-tx);font-weight:600}
.pill.score{background:var(--warnbg);border-color:var(--warn-line);color:var(--warn);font-weight:700}
/* 来源标签：与缩略图上的角标同色系，浅底深字（用于手游横向卡） */
.pill.src-xd{background:rgba(11,123,255,.1);border-color:rgba(11,123,255,.24);color:#0b7bff;font-weight:650}
.pill.src-jidi{background:rgba(230,65,93,.1);border-color:rgba(230,65,93,.24);color:#d92f4f;font-weight:650}
.pill.src-steam{background:rgba(23,55,94,.1);border-color:rgba(23,55,94,.24);color:#17375e;font-weight:650}
.pill.src-taptap{background:rgba(0,151,167,.1);border-color:rgba(0,151,167,.24);color:#00808f;font-weight:650}
.pill.src-haoyou{background:rgba(234,88,12,.1);border-color:rgba(234,88,12,.24);color:#c2410c;font-weight:650}
.pill.src-x7{background:rgba(225,29,72,.1);border-color:rgba(225,29,72,.24);color:#be123c;font-weight:650}
.pill.src-gamersky{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.24);color:#4f46e5;font-weight:650}
.pill.src-gcores{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.24);color:#059669;font-weight:650}

/* ===== 手游横向卡 =====
   · 新游 .mcard.nw —— v5 按参考图重做；★v6 起**整卡定高 + 逐行定高**：
     游戏名长短、标签个数、状态词长短、热度位数都不许改变卡片高度与各行位置
   · 活动 .mcard    —— banner + 游戏名 + 上线时间 + 活动标题（类目移到右上角） */
.mcard.nw{align-items:center;padding:26px 12px 11px;gap:12px;height:106px}
.mcard.nw .mth{border-radius:var(--r-m)}
/* ★v8：卡高 96 → 106px、顶部留出 26px「标签带」—— 平台标签改成卡片右上角的绝对定位后，
   正文整体下移，两者在垂直方向彻底分开（不再靠宽度互相挤）。 */
.mcard .mtop{
  position:absolute;top:6px;right:12px;z-index:2;
  display:flex;gap:3px;align-items:center;justify-content:flex-end;
  flex-wrap:nowrap;overflow:hidden;max-width:calc(100% - 104px);height:16px;
}
.mcard .mtop .pill{font-size:9.5px;line-height:15px;height:16px;padding:0 5px;border-radius:var(--r-xs);flex:none}
.mcard .mtop .pill.more{color:var(--sub);font-weight:700;background:var(--sunken)}
/* ★v6：逐行锁定高度 —— 内容再长也只在自己那一行内省略，不挤动相邻行 */
.mrow{display:flex;align-items:center;gap:7px;min-width:0;height:20px}
/* ★v8：这里只放**状态词**（定档 / 预约中 / 已上线），不带日期 ——
   日期统一由下一行的绿色时效行承载，避免同一时间在卡上出现两次（用户反馈「时间重复」） */
.mst{flex:none;font-size:11.5px;font-weight:650;color:var(--sub2);white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.mst.pre{color:var(--or2);background:var(--or2-bg);border:1px solid var(--or2-line);border-radius:var(--r-xs);padding:0 5px}
.mhot{flex:none;font-size:11px;font-weight:700;color:var(--or);white-space:nowrap;font-variant-numeric:tabular-nums}
/* 时效信息行：绿色（对应参考图「10月15日 开启…资格招募」那一行）—— 卡上唯一的日期出处 */
.msub.gn{
  font-size:11.5px;font-weight:650;color:var(--ok);line-height:18px;height:18px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* 右侧大号数字：有评分用绿色 ★；无评分回落到热度（橙色 🔥）；都没有时占位「—」
   ★v6：**定宽右对齐** —— 数字 1~5 位、有无小数点都不改变左侧正文的可用宽度 */
.mscore{
  flex:none;width:76px;display:flex;align-items:baseline;justify-content:flex-end;gap:1px;
  color:var(--ok);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:24px;
}
.mscore .ic{font-size:12px;font-weight:700}
.mscore .v{font-size:20px;letter-spacing:-.4px}
.mscore.hm{color:var(--or)}
.mscore.none{color:var(--dimtxt);font-size:18px;font-weight:700}

.mcard{
  display:flex;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);
  padding:10px;cursor:pointer;transition:.16s;align-items:center;position:relative;overflow:hidden;
}
.mcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px var(--sh1);border-color:var(--hairline)}
.mth{
  flex:none;border-radius:var(--r-md);overflow:hidden;background:var(--imgbg);position:relative;
  display:grid;place-items:center;color:var(--ph);font-size:20px;
}
.mth.sq{width:var(--mb-th);height:var(--mb-th)}                 /* 新游：方形 icon */
.mth.wd{width:var(--mb-tw);aspect-ratio:16 / 10}                 /* 活动：横版 banner */
.mth .ph{
  position:absolute;inset:0;display:grid;place-items:center;color:var(--ph);font-size:22px;
}
.mth .ph.gone{display:none}
.mth img{width:100%;height:100%;display:block;position:relative;z-index:1}
.mth.sq img{object-fit:contain;padding:2px}                      /* icon 完整显示，不裁切 */
.mth.wd img{object-fit:cover}
/* ★v16-F：活动图**本身接近正方**（游戏 icon）时 —— 容器也变成正方 + 图完整显示。
   ★ 两条必须**成对**出现：
     · 只改成 contain：宽容器里左右各留 21px 衬底（v11 已实测排除过「contain + 衬底」）；
     · 只改容器比例（把所有活动图容器都变 1:1）：实测会让 48/60 的横版图
       从「均值裁 15.4%」变成「均值裁 35%」—— 修好 20%、弄坏 80%。
   ⇒ 所以是**逐图**判（见 fitThumb()），只对那 12/60 张 icon 生效。 */
.mth.wd.fit{width:var(--mb-thw);aspect-ratio:1 / 1}
.mth.wd.fit img{object-fit:contain}
.mbd{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mtl{display:flex;align-items:center;gap:7px;min-width:0;height:20px}
.mt{flex:1;min-width:0;font-size:13px;font-weight:700;line-height:20px;height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msub{
  font-size:11.5px;color:var(--sub);line-height:var(--cd-lh);min-height:var(--mb-note);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;
}
/* ★v6：标签行恒高 —— 标签 0 个 / 5 个都不改变卡片高度（超出部分裁掉，不换行） */
.mtags{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;overflow:hidden;height:20px}
/* ★v8 活动卡：游戏名右侧固定「上线/开始时间」（用户需求④）。
   定宽不换行 + 游戏名 flex:1 省略 ⇒ 时间再长也挤不动左侧标题区外框。 */
.mtime{
  flex:none;font-size:10.5px;font-weight:700;color:var(--ok);white-space:nowrap;
  font-variant-numeric:tabular-nums;letter-spacing:-.1px;
}
/* 活动卡同样逐行锁定（游戏名一行 + 活动标题固定两行）；
   ★v8：两类手游卡统一 106px 高 + 顶部 26px「标签带」（右上角平台/类目标签专用）。
   ★v16-F：活动卡抬到 **118px**、标题放大到 14.5px —— 用户 ⑦ 要「图片和标题放大一点」
     （参考 gcores.com/news 的大图+大标题）。新游卡不受影响（`.mcard.nw` 两个类，
     优先级更高，仍是 106px）。 */
.mcard{height:118px;padding-top:26px}
.mcard.ev .mt{font-size:14.5px;line-height:22px;height:22px}
.mcard.ev .mtl{height:22px}

/* ===== ★v8 排行榜：列表式（用户需求②）=====
   原本是网格缩略图卡，与「排行榜」语义不符。改为**按维度分榜**的列表：
   每个榜一个区块（榜头 + 若干行），行 = 名次 + 小缩略图 + 名称 + 指标值。
   各榜内部固定排序，因此不再提供排序按钮（榜单本身就是排序）。 */
/* ★v9：分榜**并排**（对齐 TapTap 的多列榜）。窄列下行内元素同步精简 ——
   当时去掉了来源 pill 与比例条，340px 里塞 6 个元素只会挤成一团。 */
/* ★v10：分榜固定 2 列（2×2），列宽回到 ~590px ⇒ **行内重新放得下「口径标签」**，
   .rpill 于是被复用为「热度口径标签」（TapTap 关注 / 好游预约…），见 rankBoardsHTML。
   注意别再用 auto-fit：4 个榜配 3 列会变成 3+1 孤行。 */
/* ★v10：4 个分榜 ⇒ 固定 2 列（2×2）。
   不能再沿用 auto-fit/minmax(340px) —— 那个在 1424 宽下排成 3 列，4 个榜就变成 3+1 孤行，
   和首页精选块原来是同一个毛病。固定 2 列后每榜约 590px，行也终于放得下「口径」小标签。 */
.rankboards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start;margin-bottom:16px}
/* ★v26：排行榜下沉到首页底部后间距要重算 —— `.rankboards` 的 margin-bottom:16px 原本是
   给**独立页**收尾用的，嵌进 `.hsec`（自带 margin-bottom:18px）会叠成 34px，尾部空白过厚。
   只在自己的分节里清零，独立页（goTab('pcRank') 深链）行为不变。 */
.hsec.hrank .rankboards{margin-bottom:0}
/* ★v27：首页榜单默认只露 Top 5（见 rankBoardsHTML 的 fold 参数）。
   折叠靠「隐藏类 + 容器状态」实现 —— **不删行、不重渲染**，展开/收起只切一个 class：
   ① 行数口径不变（DOM 里仍是 12 行/榜），既有「48 行」断言与深链页面都不受影响；
   ② 重渲染会丢滚动位置，而榜单正好在页面最底部，一重渲染就跳回顶部。 */
.rankboard .rrow.rb{display:none}
.rankboard.open .rrow.rb{display:flex}
.rbmore{
  display:block;width:100%;padding:9px 14px;background:transparent;border:0;
  color:var(--sub);font-size:12.5px;font-family:inherit;cursor:pointer;transition:.14s;text-align:center;
}
/* 收起时第 5 行自带下边框，展开后末行没有下边框 ⇒ 只在展开态给按钮补一条上边框，
   两种状态下都不会出现双线。 */
.rankboard.open .rbmore{border-top:1px solid var(--divider)}
.rbmore:hover{background:var(--hover);color:var(--txt)}
.rankboard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.rbhead{
  display:flex;align-items:center;gap:9px;padding:11px 14px;
  background:linear-gradient(180deg,var(--panel-a) 0%,var(--panel-b) 100%);border-bottom:1px solid var(--line);
}
.rbhead .rbic{
  width:24px;height:24px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:13px;
  background:var(--accent);color:var(--on-accent);flex:none;
}
.rbhead h3{font-size:13.5px;font-weight:700}
.rbhead .rbsub{font-size:11px;color:var(--sub);margin-left:auto;flex:none}
/* ★v12：`.rlist` 是「排行榜分榜 + 报告列表」共用的类名 —— 历史上这两处各写了一行同名规则，
   它们**在合并而不是覆盖**（一行给 flex 布局、一行给卡片外观），所以一直没暴露问题。
   ⇒ 报告模块移除时**不能把报告段落里的那行一起删掉**，否则排行榜分榜会连带丢掉背景与边框。
   故把卡片外观**归位**到此处，职责合一。 */
.rlist{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.rrow{
  display:flex;align-items:center;gap:11px;padding:8px 14px;cursor:pointer;
  border-bottom:1px solid var(--divider);transition:.14s;position:relative;
}
.rrow:last-child{border-bottom:none}
.rrow:hover{background:var(--hover)}
.rno{
  flex:none;width:24px;height:24px;border-radius:var(--r-sm);display:grid;place-items:center;
  font-size:11.5px;font-weight:800;color:var(--sub);background:var(--sunken);
  font-variant-numeric:tabular-nums;
}
.rno.g1{background:linear-gradient(160deg,#ffd76e,#f0a92c);color:#5a3a00}
.rno.g2{background:linear-gradient(160deg,#e3e9f2,#bcc7d8);color:#3b4657}
.rno.g3{background:linear-gradient(160deg,#f0c8a0,#d59a66);color:#5a3210}
.rth{
  /* ★v11：原为硬编码 aspect-ratio:16 / 9，它会**压住** `.cv` 的 var(--th-ar)（见下），
     导致排行榜 4 个分榜的 48 张图不跟随卡位比例 —— 实测改前/改后都是 43.8%，是本轮
     唯一「改了没生效」的地方。改为 var(--th-ar) 后随 Tab 一起走。
     `.rrow` 的高度由内容撑开（只有 padding，无固定 height）⇒ 行高 48.6px → 54.7px（+6.1px）。 */
  flex:none;width:58px;aspect-ratio:var(--th-ar);border-radius:var(--r-sm);overflow:hidden;
  background:var(--imgbg);position:relative;
}
.rth img{width:100%;height:100%;object-fit:cover;display:block}
/* ★ 命名注意：排行榜行名用 .rgname —— 历史上是为了与报告页的 .rname（报告名）区隔；
   v12 移除报告模块后 .rname 已不存在，此名保持不变（改名无收益，且会牵动断言）。 */
.rgname{
  flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.rgname .en{font-weight:500;color:var(--sub);font-size:11.5px}
/* ★v10：这个 class 原来挂「来源 pill」（v9 因窄列放不下而摘掉），现在改挂
   **热度口径标签**（TapTap 关注 / 好游快爆预约 / 小七预约…）。
   存在的理由：手机热游榜是跨源归一化排序，不标口径就看不懂「2.2 万为什么排在 800 万前面」。 */
.rpill{
  flex:none;font-size:10.5px;font-weight:650;color:var(--sub);white-space:nowrap;
  background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-xs);padding:1px 6px;
}
.rval{
  flex:none;min-width:74px;text-align:right;font-weight:800;color:var(--accent);
  font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px;
}
.rval .u{font-size:11px;font-weight:700;opacity:.62;margin-left:1px}
.rval.hm{color:#e0642e}
.rval.dim{color:var(--sub2);font-size:12.5px;font-weight:600}
.rbarwrap{flex:none;width:96px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.rbarwrap i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--bar-from),var(--accent))}

/* ===== ★v8 首页 + 大图轮播（用户需求⑤）=====
   轮播条目：左「大图」+ 右「信息」，图片区固定 16 / 10 定比 ⇒ 高度可控、切换不抖。
   图片一律 cover 满幅（与卡片同一决策），信息区承载名称 / 指标 / 简介 / 按钮。 */
/* ★v9：Hero 由「单张全宽」改为「1 大 + 2 小」（对齐 TapTap 首页的轮播组合）。
   左侧 .hmain 沿用原来「大图 + 信息」，右侧 .hside 是两张竖排预览小卡。
   ⚠️ .hside 用「绝对定位 + opacity」而不是 display:none 切换 ——
   display:none 的子元素里，浏览器可能**跳过图片加载**，切换时会闪一下空白。 */
.hero{display:flex;gap:12px;margin-bottom:18px}
.hmain{
  position:relative;flex:1;min-width:0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-xl);overflow:hidden;box-shadow:0 4px 16px var(--sh-hero);
}
/* ★v11：272px → 240px。原值下小卡容器比例会随窗口宽度漂移 ——
   实测 1280 宽时 **2.367**（方图被纵裁 57.8%）、1440 时 1.930、1600 时 1.630、1920 时 1.600。
   根因：`.hside` 宽度固定、而 `.hmain` 的高度随宽度变化，两者不同步 ⇒ 比例必然漂；
   再叠加 `.hpic{flex:0 0 52%;max-width:560px}` 在内容宽约 1077px 处的「悬崖」，漂移是非单调的。
   收窄到 240px 后：漂移带收窄，且 1440 恰好落在 **1.62**（≈16:10，理想值）。
   （已排除的两条错路：`object-fit:contain` 两侧留 65px 黑边像字幕；
     一刀切 `object-position` 实测《赛博朋克2077》变好、《生化危机9》反而更差。） */
.hside{flex:0 0 240px;position:relative;min-height:0}
.hside-set{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.hside-set.on{opacity:1;pointer-events:auto}
.hsitem{
  position:relative;flex:1;min-height:0;border-radius:var(--r-lg);overflow:hidden;cursor:pointer;
  border:1px solid var(--line);background:var(--imgbg);transition:.16s;
}
.hsitem:hover{border-color:var(--hairline);transform:translateY(-2px)}
.hsitem img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
.hsitem .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ph);font-size:26px}
.hsitem .ph.gone{display:none}
.hsitem .cap{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 10px 8px;
  background:linear-gradient(180deg,rgba(9,14,32,0),rgba(9,14,32,.82));
  color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hsitem .cap .bd{
  display:inline-block;font-size:9.5px;font-weight:700;line-height:14px;padding:0 5px;border-radius:var(--r-xs);
  background:var(--accent);color:var(--on-accent);margin-right:5px;vertical-align:1px;
}
.hslide{display:none}
.hslide.on{display:flex}
.hpic{
  flex:0 0 52%;max-width:560px;aspect-ratio:16 / 10;position:relative;
  background:var(--imgbg);overflow:hidden;
}
.hpic img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
.hpic .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ph);font-size:34px}
.hpic .ph.gone{display:none}
.hpic .hsrc{
  position:absolute;top:10px;left:10px;color:#fff;font-size:11px;font-weight:650;z-index:2;
  padding:3px 9px;border-radius:var(--r-sm);background:var(--tag-bg);letter-spacing:.2px;
}
.hpic .hsrc.src-xd{background:rgba(11,123,255,.92)}
.hpic .hsrc.src-jidi{background:rgba(230,65,93,.92)}
.hpic .hsrc.src-taptap{background:rgba(0,151,167,.92)}
.hpic .hsrc.src-haoyou{background:rgba(234,88,12,.92)}
.hpic .hsrc.src-x7{background:rgba(225,29,72,.92)}
.hinfo{
  flex:1;min-width:0;padding:20px 22px;display:flex;flex-direction:column;gap:9px;justify-content:center;
}
.htagrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hbadge{
  font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:2px 8px;border-radius:var(--r-xs);
  background:var(--accent);color:var(--on-accent);
}
.hbadge.mb{background:#0e9384}
.hbadge.hot{background:var(--or)}
.hname{
  font-size:19px;font-weight:800;line-height:1.32;color:var(--title-strong);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.hname .en{font-size:13px;font-weight:600;color:var(--sub);margin-left:6px}
.hstat{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.hstat .k{font-size:10.5px;color:var(--sub);display:block;letter-spacing:.3px}
.hstat .v{font-size:17px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.hstat .v.up{color:var(--up)}
.hstat .v.dim{color:var(--sub2);font-size:14px;font-weight:600}
.hintro{
  font-size:12px;color:var(--sub);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.hbtns{display:flex;gap:8px;margin-top:2px}
.hbtns button{
  font:inherit;font-size:12px;font-weight:700;border-radius:var(--r-md);padding:7px 15px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);transition:.15s;
}
.hbtns button:hover{filter:brightness(1.08)}
.hbtns button.sec{background:var(--raise);color:var(--accent)}
.hbtns button.sec:hover{background:var(--hover)}
/*「打开原页」用 <a> 实现（语义正确 + 可中键新窗），外观与 button 保持一致 */
.hbtns a{
  font-size:12px;font-weight:700;border-radius:var(--r-md);padding:7px 15px;cursor:pointer;
  border:1px solid var(--accent);background:var(--raise);color:var(--accent);text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;transition:.15s;
}
.hbtns a:hover{background:var(--hover)}
/* 轮播控件：右下角「上一张 / 指示点 / 下一张」 */
.hctrl{
  position:absolute;right:16px;bottom:14px;display:flex;align-items:center;gap:9px;z-index:3;
}
.hctrl button{
  font:inherit;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
  background:var(--raise);color:var(--accent);cursor:pointer;display:grid;place-items:center;
  font-size:13px;font-weight:700;line-height:1;box-shadow:0 1px 5px var(--sh2);
}
.hctrl button:hover{background:var(--hover)}
.hdots{display:flex;align-items:center;gap:5px}
.hdots i{
  width:7px;height:7px;border-radius:50%;background:var(--dotoff);cursor:pointer;
  transition:.2s;display:block;
}
.hdots i.on{background:var(--accent);width:17px;border-radius:var(--r-xs)}
.hprog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0;z-index:3}
/* 首页精选区块 */
.hsec{margin-bottom:18px}
.hsechd{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.hsechd .ic{
  width:22px;height:22px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:12px;
  background:var(--hover);color:var(--accent);flex:none;
}
.hsechd h3{font-size:14px;font-weight:700}
.hsechd .sub{font-size:11.5px;color:var(--sub)}
.hsechd .more{
  margin-left:auto;font-size:11.5px;color:var(--accent);font-weight:650;cursor:pointer;
  background:none;border:none;font-family:inherit;padding:3px 8px;border-radius:var(--r-sm);
}
.hsechd .more:hover{background:var(--hover)}
.hseclist{display:grid;gap:12px}
/* ★v10：**固定列数**，不再 auto-fill。
   根因（像素实测，不是推断）：auto-fill + minmax(212px) 在 1424 宽下恰好排成 **5 列**，
   而每块取 6 张卡 ⇒ 排成 5+1：第二行只有 1 张、右侧一整条空白 —— 这就是首页参差的根因。
   偏差是**确定性**的（列数由宽度定、卡片数写死 6），不是偶发，换宽度也不会自愈。
   改成「固定 5 列 + 每块 10 张」后：任何宽度都是 5×2 两行排满，永不出现孤行。 */
.hseclist.pc{grid-template-columns:repeat(5,minmax(0,1fr))}
.hseclist.mb{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* ===== 详情弹窗（★v6：版式对齐 PC 游戏工作台详情抽屉）=====
   hero 的尺寸**完全由 CSS 决定、不做任何比例判断**：
     · 宽图：width:100% + height:auto ⇒ 铺满整宽、高度自然展开，**不裁切**
     · 方图 / 竖图：自然高度会超过 max-height，此时 object-fit:contain 让图**完整显示**，
       两侧留白由「同图模糊铺底」填满
   ★ 为什么不再用 onload 读 naturalWidth 判比例（v5 写法）：图片命中浏览器缓存时，
     onload 可能早于节点入树触发，此时 img.parentElement 为 null ⇒ 读取抛错中断、
     hero 退回默认 cover，方形图被裁成一条横带（用户截图反馈的「图片被截了」就是这个）。
     现在把判断从 JS 挪到 CSS，这个时序坑从根上不存在。 */
.mask{
  position:fixed;inset:0;background:rgba(12,18,38,.58);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;z-index:90;padding:22px;
}
.mask.on{display:flex}
.dlg{
  background:var(--card);border-radius:var(--r-xl);width:min(760px,100%);max-height:88vh;overflow:auto;
  box-shadow:0 26px 70px rgba(9,16,40,.4);animation:pop .2s ease;position:relative;
}
@keyframes pop{from{transform:translateY(12px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.dtop{
  position:relative;background:#101A38;overflow:hidden;border-radius:var(--r-xl) var(--r-xl) 0 0;
  min-height:240px;display:flex;align-items:center;justify-content:center;
}
.dbg{
  position:absolute;left:-8%;top:-8%;width:116%;height:116%;z-index:0;
  object-fit:cover;object-position:center;
  filter:blur(28px) saturate(1.35);opacity:.55;
}
.dfg{
  position:relative;z-index:1;display:block;width:100%;height:auto;
  max-height:min(50vh,420px);object-fit:contain;
}
.phbig{position:relative;z-index:1;display:grid;place-items:center;height:240px;width:100%;color:#8da0c6;font-size:46px}
.dgrad{
  position:absolute;left:0;right:0;bottom:0;height:120px;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(9,14,32,0) 0%,rgba(9,14,32,.5) 46%,rgba(9,14,32,.93) 100%);
}
.dhtitle{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 18px 14px;color:#fff;pointer-events:none}
.dhtitle h2{
  font-size:20px;font-weight:800;line-height:1.34;text-shadow:0 2px 14px rgba(0,0,0,.6);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.dhtitle .hen{
  font-size:12px;color:rgba(255,255,255,.68);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dsrc{
  position:absolute;top:12px;right:12px;z-index:4;font-size:10.5px;font-weight:750;color:#fff;
  border-radius:var(--r-sm);padding:3px 9px;background:var(--dsrc-bg);backdrop-filter:blur(6px);
}
/* 来源徽标配色：与卡片左上角 .tag 同一套色系 */
.dsrc.src-xd{background:rgba(11,123,255,.92)}
.dsrc.src-jidi{background:rgba(230,65,93,.92)}
.dsrc.src-steam{background:rgba(23,55,94,.92)}
.dsrc.src-taptap{background:rgba(0,151,167,.92)}
.dsrc.src-haoyou{background:rgba(234,88,12,.92)}
.dsrc.src-x7{background:rgba(225,29,72,.92)}
.dsrc.src-gamersky{background:rgba(99,102,241,.92)}
.dsrc.src-gcores{background:rgba(16,185,129,.92)}
.dsrc.modk{background:rgba(180,83,9,.92)}
.dclose{
  position:absolute;top:12px;left:12px;z-index:4;width:32px;height:32px;border-radius:var(--r-m);
  border:1px solid rgba(255,255,255,.22);background:rgba(10,16,36,.55);color:#fff;font-size:14px;
  cursor:pointer;font-family:inherit;line-height:1;backdrop-filter:blur(6px);
}
.dclose:hover{background:rgba(220,38,38,.88)}

.dbody{padding:15px 18px 18px}
.dnotice{
  display:flex;gap:8px;align-items:flex-start;background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-tx);
  border-radius:var(--r-m);padding:9px 12px;font-size:12px;line-height:1.62;margin-bottom:14px;
}
.dnotice b{color:var(--note-tx-b)}
.dnotice code{background:var(--code-bg);padding:1px 5px;border-radius:var(--r-xs);font-size:11.5px}
/* 大号数字行（对齐工作台 .score-line） */
.sline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:13px}
.sbig{
  font-size:27px;font-weight:800;color:var(--accent);background:var(--raise);border:1px solid var(--line);
  border-radius:var(--r-m);padding:1px 15px;line-height:1.32;box-shadow:0 2px 8px var(--sh2);
  font-variant-numeric:tabular-nums;
}
.sbig.hm{color:var(--or)}
.sbig.dim{color:var(--sub2);font-size:22px}
.sbig.sm{font-size:20px;padding:4px 15px;letter-spacing:0}
.sbig .u{font-size:13px;font-weight:700;opacity:.62;margin-left:4px}
.smeta{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub);line-height:1.34}
.smeta i{font-style:normal;align-self:flex-start;font-size:10.5px;font-weight:750;color:var(--info-tx);
  background:var(--info-chip);border-radius:var(--r-xs);padding:1.5px 8px}
.smeta i.wn{color:var(--warn);background:var(--warn-chip)}
.smeta i.gn{color:var(--gn-tx);background:var(--gn-chip)}
/* KV 卡片网格（对齐工作台 .kv：浅灰底小卡，恒 3 列） */
.dkv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dkv .it{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-m);padding:7px 10px;min-width:0}
.dkv .k{font-size:10.5px;color:var(--sub);letter-spacing:.2px}
.dkv .v{font-size:12.5px;font-weight:650;margin-top:2px;line-height:1.4;word-break:break-word}
/* 分区块 */
.dblock{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 13px;margin-bottom:12px}
.dblock h4{font-size:12.5px;font-weight:750;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.dblock h4 .ic{width:6px;height:6px;border-radius:2px;background:var(--accent);flex:none}
.dblock h4 .cnt{margin-left:auto;font-size:11px;color:var(--sub);font-weight:600}
.dblock p{
  font-size:12.5px;color:var(--sub);line-height:1.8;white-space:pre-line;
  word-break:break-word;max-height:186px;overflow:auto;
}
.dtags{display:flex;gap:6px;flex-wrap:wrap}
.dlinks{display:flex;gap:8px;flex-wrap:wrap}
.dlinks a{
  font-size:12px;text-decoration:none;padding:6px 13px;border-radius:var(--r-md);background:var(--accent);
  color:var(--on-accent);font-weight:700;transition:.15s;
}
.dlinks a:hover{background:var(--accent-h)}
.dlinks a.sec{background:var(--raise);color:var(--accent);border:1px solid var(--accent)}
.dlinks a.sec:hover{background:var(--hover)}
.dfoot{font-size:11.5px;color:var(--sub);line-height:1.72;padding-top:10px;border-top:1px dashed var(--line)}

/* ================= ★v17 详情页内容块（对齐工作台 paintDetail） =================
   逐块对齐 GameHub 工作台详情抽屉的**内容**（介绍 / 版本 / 游戏预览画廊 / 配置要求 /
   同分类更多 / 另一源收录），**唯独不做「手机模拟器配置」那一块** ——
   用户 2026-10-16 口径：「同步工作台的详情页内容，不需要手机模拟器配置这些」。

   ★ 三条自我约束：
     ① 所有块都是**探测式**的：先在 DOM 里放空占位，探到本机服务再由 ddHydrate() 填；
        填不到就把整块从 DOM 摘掉 —— 纯静态部署（线上 demo）不会多出任何死块，
        与 #dlBlock 同一策略。
     ② 色值**全部复用既有 token**（--card/--soft/--raise/--line/--sub/--accent/--sunken…），
        一个新色值都不造 ⇒ 浅/深主题自动跟随，不参与退化对比。
     ③ 画廊的图片尺寸只由 CSS 决定（aspect-ratio + object-fit），不做任何比例判断 ——
        这条与 hero 同理（v5 的 onload 读 naturalWidth 踩过缓存时序坑）。 */
/* 「来自另一源」小标（版本介绍 / 游戏介绍可能由另一源补来，必须标出来源口径） */
.dfrom{margin-left:auto;flex:none;font-size:10px;font-weight:750;color:var(--info-tx);
  background:var(--info-chip);border-radius:var(--r-xs);padding:1.5px 7px}
/* ---- 游戏预览画廊（大图 + 左右翻页 + 计数 + 缩略图条）---- */
.dgal-vp{position:relative;border-radius:var(--r-m);overflow:hidden;background:#0d1424;border:1px solid var(--line)}
.dgal-trk{display:flex;transition:transform .26s cubic-bezier(.4,0,.2,1)}
.dgal-sld{flex:0 0 100%;min-width:0}
.dgal-sld img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#0d1424}
.dgal-nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;
  border:none;background:rgba(10,16,36,.62);color:#fff;font-size:13px;cursor:pointer;font-family:inherit;
  display:grid;place-items:center;backdrop-filter:blur(4px);opacity:0;transition:.15s}
.dgal-vp:hover .dgal-nav{opacity:1}
.dgal-nav:disabled{opacity:0;pointer-events:none}
.dgal-nav.prev{left:8px}
.dgal-nav.next{right:8px}
.dgal-num{position:absolute;right:8px;bottom:8px;font-size:10.5px;font-weight:750;color:#fff;
  background:rgba(10,16,36,.6);border-radius:var(--r-sm);padding:2px 8px;backdrop-filter:blur(4px);
  font-variant-numeric:tabular-nums}
.dgal-thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:3px;scrollbar-width:thin}
.dgal-th{flex:none;width:64px;height:36px;border-radius:var(--r-sm);overflow:hidden;padding:0;cursor:pointer;
  border:2px solid transparent;background:var(--sunken);opacity:.62;transition:.15s}
.dgal-th img{width:100%;height:100%;object-fit:cover;display:block}
.dgal-th:hover{opacity:.9}
.dgal-th.on{border-color:var(--accent);opacity:1}
/* ---- 配置要求（最低配置恒来自源站；推荐配置来自 Steam 官方接口）---- */
.dreq{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dreq .rc{background:var(--raise);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;min-width:0}
.dreq .rc-h{font-size:10.5px;font-weight:800;color:var(--sub);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.dreq .rc-h::before{content:'';width:3px;height:10px;border-radius:2px;background:var(--hairline);flex:none}
.dreq .rc.rec .rc-h::before{background:var(--gn-tx)}
.dreq .rr{display:flex;gap:7px;font-size:11px;line-height:1.55;padding:2.5px 0}
.dreq .rr i{flex:none;width:38px;font-style:normal;color:var(--sub2);font-weight:700}
.dreq .rr span{flex:1 1 auto;min-width:0;color:var(--txt);word-break:break-word}
.dhint{margin-top:8px;font-size:10.5px;color:var(--sub2);line-height:1.65}
.dhint a{color:var(--accent);text-decoration:none}
.dhint b{color:var(--sub)}
/* ---- 同分类更多（两列小卡，点了换到那一款）---- */
.drel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.drelit{display:flex;gap:8px;align-items:center;background:var(--raise);border:1px solid var(--line);
  border-radius:var(--r-md);padding:6px 8px;cursor:pointer;min-width:0;transition:.15s;text-align:left;
  font-family:inherit;color:inherit}
.drelit:hover{border-color:var(--hairline);background:var(--hover)}
.drelit .th{flex:none;width:52px;height:30px;border-radius:var(--r-xs);overflow:hidden;background:var(--sunken)}
.drelit .th img{width:100%;height:100%;object-fit:cover;display:block}
.drelit .bd{min-width:0;flex:1}
/* ⚠️ 这两行必须 display:block —— 外层是 <button>，内容模型只允许 phrasing content，
   所以里面的文本用的是 <span>；不块化的话 text-overflow:ellipsis 不会生效。 */
.drelit .tt{display:block;font-size:11.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drelit .mm{display:block;font-size:10px;color:var(--sub2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- 另一源收录（合并的来源凭证；点「打开另一源详情页」）---- */
.dtwin{display:flex;gap:10px;align-items:flex-start}
.dtwin .th{flex:none;width:76px;height:44px;border-radius:var(--r-sm);overflow:hidden;background:var(--sunken)}
.dtwin .th img{width:100%;height:100%;object-fit:cover;display:block}
.dtwin .bd{flex:1;min-width:0}
.dtwin .tt{font-size:12.5px;font-weight:700;line-height:1.4}
.dtwin .mm{font-size:11px;color:var(--sub2);margin-top:2px;line-height:1.55}
.dtwin a{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:700;color:var(--accent);
  text-decoration:none;border:1px solid var(--accent);border-radius:var(--r-sm);padding:3.5px 11px}
.dtwin a:hover{background:var(--hover)}
/* ---- 吸顶小标题条（滚过大图后显形；对齐工作台 .d-mini）----
   ★ 为什么用 display 切换而不是 opacity 过渡：位移+过渡会在「显/隐」临界点
     反复触发重排，用户看到的是「忽大忽小地闪一下」（工作台那条注释里踩过）。 */
.dmini{position:sticky;top:0;z-index:7;display:none;align-items:center;gap:9px;
  padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);margin:0 0 12px}
.dmini.on{display:flex}
.dmini .th{flex:none;width:38px;height:38px;border-radius:var(--r-md);overflow:hidden;background:var(--sunken)}
.dmini .th img{width:100%;height:100%;object-fit:cover;display:block}
.dmini .tt{flex:1;min-width:0;font-size:12.5px;font-weight:750;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmini .sb{flex:none;font-size:10px;font-weight:750;color:#fff;border-radius:var(--r-xs);padding:2px 7px;background:var(--sub2)}
/* ---- 底部固定操作条（对齐工作台 .d-dock）----
   ★ sticky 而非 fixed：fixed 要自己算 .dlg 的宽度与圆角，窄窗下必然错位；
     sticky 天然吃父容器的盒。 */
.ddock{position:sticky;bottom:0;z-index:6;display:flex;gap:8px;align-items:center;
  padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:var(--card);
  border-top:1px solid var(--line);margin:12px -18px -18px}
.ddock .dsp{flex:1;min-width:0;font-size:11.5px;color:var(--sub2)}
.ddock button{font-family:inherit;font-size:12.5px;font-weight:750;cursor:pointer;border-radius:var(--r-md);
  padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);transition:.15s}
.ddock button:hover{background:var(--accent-h)}
.ddock button.sec{background:var(--raise);color:var(--accent)}
.ddock button.sec:hover{background:var(--hover)}
.ddock button:disabled{opacity:.5;cursor:default}

.empty{padding:60px 20px;text-align:center;color:var(--sub)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.5}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--sub);line-height:1.8}
/* ★v23 页脚说明折叠：默认只占一行，点开才是原来那 5 段实现说明 */
.footfold{margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
.footfold>summary{cursor:pointer;list-style:none;font-size:11.5px;color:var(--sub2);user-select:none}
.footfold>summary::-webkit-details-marker{display:none}
.footfold>summary:hover{color:var(--sub)}
.footfold>summary::before{content:'▸ ';opacity:.7}
.footfold[open]>summary::before{content:'▾ '}
.footfold[open]>summary{margin-bottom:6px}
.footfold .foot{margin-top:6px;padding-top:0;border-top:none}
.foot code{background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:var(--r-xs);font-size:11px}

/* ===== ★v13 响应式：3 档断点（NEXT P0-3，此前全表 @media 数量 = 0）==========
   背景：v8~v12 的外观只在 **1424 宽（默认窗口）** 下被实拍验证过；窗口一窄，
   200px 定宽侧栏 + 5 列定宽网格只能硬扛，卡片被挤到 190px 以下。

   ★ 三条自我约束（踩过的坑都在这里）：
     ① **所有断点都取在 1424 以下** —— 默认窗口 1424×861 必须与 v12 逐像素一致，
        否则本轮实拍与 jsdom 基线不可比。故最宽的一档是 1200。
     ② **列数只走「能整除卡片数」的分流**：PC 精选块 10 张、手游精选块 6 张，
        收窄时只切到 2 列 / 1 列 ⇒ 任何宽度下都是整行排满，
        v10 定下的「不留孤行」不变式继续成立（不要改成 auto-fill，就是它会排成 5+1）。
     ③ **只覆盖，不动基础规则** —— `.hseclist.pc{...repeat(5...)}` / `.hseclist.mb{...repeat(3...)}`
        两行原样保留，故 _t_demo.js 里那 4 条「固定列数」断言仍然命中，无需改动。 */

/* ---- 档 1：≤1200px（窄窗 / 左右分屏）---- */
@media (max-width:1200px){
  .nav{width:168px;flex:0 0 168px}
  .hside{flex:0 0 208px}
  .hseclist.pc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hseclist.mb{grid-template-columns:repeat(2,minmax(0,1fr))}
  .main{padding:14px 16px 28px}
}

/* ---- 档 2：≤1040px ---- */
@media (max-width:1040px){
  .nav{width:150px;flex:0 0 150px}
  .search{min-width:150px}
}

/* ---- 档 3：≤920px（打包窗口最小 900×600，这一档同时兜住「浏览器里直接打开」的情形）---- */
@media (max-width:920px){
  /* 首页 hero 由「左大图 + 右小卡」改为上下叠放 —— 窄窗下 240px 定宽小卡会把主图压没 */
  .hero{flex-direction:column}
  .hside{flex:none;height:154px}
  .hside-set{flex-direction:row}
  .hpic{flex:0 0 46%;max-width:420px}
  .hinfo{padding:16px}
  .rankboards{grid-template-columns:minmax(0,1fr)}
  .hseclist.mb{grid-template-columns:minmax(0,1fr)}
  .dkv{grid-template-columns:repeat(2,1fr)}
}

/* ===== ★v14 下载与资源（本体 / Mod / 修改器 / 存档）==========================
   只在「探测到本机服务」时才由 JS 渲染，所以这里**不参与浅色/深色的退化对比** ——
   两套主题都只引用既有 token（--raise/--sunken/--accent/--on-accent/--divider…），
   一个新色值都没造，切换主题时与全站一起自动跟随。

   ★ 为什么不复用上游 resources.html 里那套 `.dlpop` 样式：
     上游是浅色工作台皮肤（--c-primary / --c-t1…），demo 是另一套 token 名。
     硬搬过来要么补几十个别名变量、要么在弹窗里出现两块割裂的皮肤。
     这里只借它的**信息结构**（页签 + 行 + 通道胶囊），视觉按 demo 自己的 token 写。 */
.dlmod{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.dlmod::-webkit-scrollbar{display:none}
.dlm{
  display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:12px;font-weight:700;
  color:var(--sub);background:var(--raise);border:1px solid var(--line);border-radius:var(--r-md);
  padding:5px 11px;cursor:pointer;white-space:nowrap;flex:none;transition:.15s;
}
.dlm:hover{border-color:var(--hairline);color:var(--txt)}
.dlm.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.dlm i{font-style:normal;font-size:10px;font-weight:800;opacity:.78}
.dlbody{max-height:296px;overflow:auto}
.dlrow{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--divider)}
.dlrow:last-child{border-bottom:none}
.dlrow .bd{flex:1;min-width:0}
.dlrow .tt{font-size:12.5px;font-weight:650;line-height:1.5;word-break:break-word}
.dlrow .mt{font-size:10.5px;color:var(--sub);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.dlrow .lk{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dlrow .lk a{
  font-size:11.5px;text-decoration:none;font-weight:700;padding:4px 11px;border-radius:var(--r-sm);
  background:var(--accent);color:var(--on-accent);transition:.15s;
}
.dlrow .lk a:hover{background:var(--accent-h)}
.dlrow .lk a.na{background:var(--sunken);color:var(--sub2);cursor:default}
.dlrow .lk a.na:hover{background:var(--sunken)}
/* ★v15：客户端下载按钮与 .lk a 同尺寸同观感；「浏览器打开」退成次要样式 ——
   否则两个主色按钮并排，看不出哪个才是推荐动作（用户要的是「在 APP 里下」）。 */
.dlrow .lk button{
  font-family:inherit;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:var(--r-sm);
  border:none;background:var(--accent);color:var(--on-accent);cursor:pointer;transition:.15s;
}
.dlrow .lk button:hover{background:var(--accent-h)}
.dlrow .lk a.sec{background:var(--raise);border:1px solid var(--line);color:var(--sub)}
.dlrow .lk a.sec:hover{background:var(--hover);border-color:var(--hairline);color:var(--txt)}
.dl-empty{padding:22px 6px;text-align:center;font-size:12px;line-height:1.8;color:var(--sub)}
.dl-empty .big{font-size:26px;opacity:.5;margin-bottom:6px}
/* ★v16-C：空态里的「重试」—— 限流这类**临时**故障必须给出口，不能只报错 */
.dlretry{margin-top:10px}
.dlmore{
  display:block;width:100%;margin-top:9px;font-family:inherit;font-size:12px;font-weight:700;
  color:var(--accent);background:var(--raise);border:1px solid var(--line);border-radius:var(--r-md);
  padding:7px;cursor:pointer;transition:.15s;
}
.dlmore:hover{background:var(--hover)}
.dlnote{font-size:11px;color:var(--sub);line-height:1.7;margin-bottom:8px}

/* ★v12：原「端游报告」样式段落（.rstats / .rstat / .ritem / .rhead / .rarrow / .rname /
   .rmeta / .rbody / .kd）已随报告模块一并移除。
   ⚠️ 唯一的例外是 `.rlist` 的卡片外观：它曾在本段定义，却被排行榜分榜共用，
   整段删除会让排行榜掉背景 —— 已上移到排行榜段落（见 `.rlist`），此处不再保留。 */

/* ================= ★v15 本机三页：游戏库 / 我的游戏 / 下载管理 =================
   口径出处：用户 2026-10-16「UI 跟组件能不能优化」→ 拍板**桌面客户端风格**。
   ★ 取值纪律：本段**只用既有 token**（--card/--line/--sunken/--raise/--soft/--input/
     --accent/--hover/--hairline/--ring/--sh2/--sub2/--ph/--dimtxt…），**不新造色值**。
     这样浅色与深色两套主题自动跟随，不需要把本段各写一遍（与 v9 的主题化做法一致）。
   ★ 类名归属：`.phead/.pbadge/.psub/.pbar/.pin/.seg/.pbtn/.pmore` 是**页级**通用件，
     与顶栏的 `.btn`（深底白字、只在 .topbar 里用）互不影响。 */

/* ---- 页头（三页共用；对应 JS 的 phHead()）---- */
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;min-height:32px}
.phead h2{font-size:17px;font-weight:700;letter-spacing:.2px}
.phead .spacer{flex:1;min-width:8px}
.pbadge{
  font-size:11px;padding:2px 8px;border-radius:var(--r-m);border:1px solid var(--line);
  background:var(--card);color:var(--sub);font-weight:600;white-space:nowrap;
}
/* 「● 实时 / ● 已连接 / ● 已扫描」共用：亮绿点 + 绿底，与顶栏服务指示灯同一语义 */
.pbadge.live{background:var(--okbg);border-color:var(--ok-line);color:var(--ok)}
.psub{font-size:12px;color:var(--sub)}
.psub b{color:var(--txt);font-weight:700}

/* ---- 分段控件（作用域 / 排序）：槽体做法与既有 .pills 一致 ---- */
.seg{display:inline-flex;align-items:center;gap:3px;background:var(--sunken);border-radius:var(--r-m);padding:3px;flex:none}
.seg button{
  font-family:inherit;font-size:12px;font-weight:650;color:var(--sub);border:none;background:transparent;
  border-radius:var(--r-md);padding:5px 11px;cursor:pointer;transition:.14s;white-space:nowrap;line-height:1.35;
}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--raise);color:var(--accent);box-shadow:0 1px 3px var(--sh2)}

/* ---- 页内按钮 ---- */
.pbtn{
  font-family:inherit;font-size:12.5px;font-weight:650;cursor:pointer;transition:.14s;
  background:var(--raise);color:var(--txt);border:1px solid var(--line);border-radius:var(--r-md);
  padding:7px 14px;white-space:nowrap;
}
.pbtn:hover{background:var(--hover);border-color:var(--hairline)}
.pbtn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.pbtn.primary:hover{background:var(--accent-h)}
.pbtn.sm{padding:4px 10px;font-size:11.5px;font-weight:600}

/* ---- 游戏库：搜索条（图标定位做法与既有 .search 一致）---- */
.pbar{position:relative;display:flex;align-items:center;margin-bottom:14px}
.pbar .pic{position:absolute;left:11px;font-size:12px;color:var(--sub);pointer-events:none;z-index:1}
.pin{
  width:100%;font-family:inherit;font-size:13px;color:var(--txt);background:var(--input);
  border:1px solid var(--line);border-radius:var(--r-md);padding:9px 12px 9px 30px;outline:none;transition:.15s;
}
.pin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);background:var(--raise)}
.pin::placeholder{color:var(--ph)}
/* 加载更多：外观沿用既有 .dlmore 的做法，只是宽度吃满内容区 */
.pmore{
  display:block;width:100%;margin-top:14px;font-family:inherit;font-size:12.5px;font-weight:700;
  color:var(--accent);background:var(--raise);border:1px solid var(--line);border-radius:var(--r-md);
  padding:10px;cursor:pointer;transition:.15s;
}
.pmore:hover{background:var(--hover);border-color:var(--hairline)}

/* ---- 我的游戏：本机游戏行 ---- */
.mglist{display:flex;flex-direction:column;gap:8px}
.mgrow{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-m);padding:10px 12px;transition:.15s;
}
/* 只有「匹配到资源」的行才可点（未匹配的没有 data-d，光标保持默认，不给假交互） */
.mgrow.ok{cursor:pointer}
.mgrow.ok:hover{background:var(--hover);border-color:var(--hairline);transform:translateX(2px)}
.mthumb{
  position:relative;width:52px;height:52px;flex:none;border-radius:var(--r-md);overflow:hidden;
  background:var(--imgbg);display:flex;align-items:center;justify-content:center;
}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
.mthumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;opacity:.45}
.mbd{flex:1;min-width:0}
.mtt{font-size:13.5px;font-weight:650;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmt{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;color:var(--sub2);flex-wrap:wrap}
.mmt span{max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msrc{background:var(--sunken);border-radius:var(--r-sm);padding:1px 7px;color:var(--sub);font-weight:600;flex:none}
.mact{flex:none}
.pmiss{font-size:11.5px;color:var(--dimtxt)}
/* ★v16-D：本机游戏 ↔ 库记录的**关联证据**角标。
   关联方式必须可见（Steam ID / 名称 / 手动）—— 否则用户没法判断这条「命中」可信不可信；
   本地库只有「有资源 / 没资源」两态，而「为什么说它俩是同一个游戏」才是关联的全部价值。 */
.mvia{background:var(--sunken);border-radius:var(--r-sm);padding:1px 7px;color:var(--sub);font-weight:600;flex:none}
.mvia.sid{color:var(--accent)}
.mvia.man{color:var(--warn, #e0a33c)}
.mact{display:flex;gap:6px;align-items:center}

/* ---- 下载管理：任务列表 ---- */
.dllist{display:flex;flex-direction:column;gap:9px}
.dljob{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;
  border-left:3px solid var(--line);
}
/* 左侧竖条 = 状态色。用既有语义 token：主色=进行中 / 绿=完成 / 红=失败 / 橙=需手动 / 黄=暂停 */
.dljob.running{border-left-color:var(--accent)}
.dljob.done{border-left-color:var(--ok)}
.dljob.fail{border-left-color:var(--up)}
.dljob.manual{border-left-color:var(--or)}
.dljob.pause{border-left-color:var(--warn)}
.jhd{display:flex;align-items:center;gap:8px}
.jic{font-size:14px;flex:none}
.jnm{font-size:13px;font-weight:650;color:var(--txt);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jst{font-size:11px;color:var(--sub);flex:none;font-weight:600}
.jbar{height:5px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:9px}
.jbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.jmt{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--sub2)}
.jmt .spacer{flex:1}

/* ---- ★v16-H 网盘直链配置块（.olcard）----
   与 .dljob 同一套语汇（卡片 + 细边 + 左侧竖条），但竖条用中性色：
   它不是一个「有状态的任务」，只是一块配置。 */
.olcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);
  border-left:3px solid var(--line);padding:12px 13px;margin-top:14px;
}
.olhd{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--txt)}
.olhd b{font-weight:650}
.olbadge{
  font-size:10.5px;font-weight:700;color:var(--sub2);background:var(--sunken);
  border-radius:var(--r-xs);padding:1px 7px;flex:none;
}
.olbadge.ok{color:var(--ok)}
.oldesc{font-size:11.5px;color:var(--sub);line-height:1.62;margin-top:6px}
.oldesc b{color:var(--txt);font-weight:650}
.olrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
.olrow input{
  background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--txt);font:inherit;font-size:11.5px;padding:6px 9px;flex:1;min-width:150px;
}
.olrow input:focus{outline:none;border-color:var(--accent)}
.olchk{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--sub);line-height:1.55;cursor:pointer}
.olchk input{width:auto;flex:none;min-width:0;accent-color:var(--accent)}
.olchk b{color:var(--txt);font-weight:650}
.olnote{
  font-size:11px;color:var(--sub);line-height:1.6;margin-top:9px;
  background:var(--sunken);border-radius:var(--r-sm);padding:7px 10px;
  white-space:pre-wrap;word-break:break-word;
}
.olres{font-size:11px;line-height:1.6;margin-top:7px;color:var(--sub);white-space:pre-wrap;word-break:break-word}
.olres.ok{color:var(--ok)}
.olres.bad{color:var(--up)}
/* ★v18「上游服务」卡（工作台 → App 的只读回读）。复用 .olcard 外壳，只补内部排版。 */
.upstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin-top:9px}
/* ⚠️ `.spacer` 在别处都是**带作用域**的（.topbar/.phead/.jmt）⇒ 这里必须自己声明，
    否则 `.olhd` 里的 spacer 不生效，「打开管理页」会被挤到标题旁边。 */
.olhd .spacer{flex:1}
.uprow{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--sub)}
.uprow span{flex:0 0 auto}
.uprow b{margin-left:auto;color:var(--txt);font-weight:650;font-variant-numeric:tabular-nums}
.uphist{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.upt{font-size:11.5px;color:var(--sub);margin-bottom:6px}
.upit{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--sub);padding:3px 0}
/* ---- ★v23 下载管理的折叠设置区：折叠头当状态条用 ---- */
.dlset{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--card);overflow:hidden}
.dlsum{display:flex;align-items:center;gap:9px;padding:10px 14px;cursor:pointer;list-style:none;font-size:12px;color:var(--sub);user-select:none}
.dlsum::-webkit-details-marker{display:none}
.dlsum:hover{background:var(--hover)}
.dlsumdot{width:7px;height:7px;border-radius:50%;background:var(--sub2);flex:none}
.dlsumdot.ok{background:var(--ok)}
.dlsumdot.warn{background:#d9a13b}
.dlsum #dlsumtext{color:var(--txt)}
.dlsummore{font-size:11px;color:var(--sub2)}
.dlset[open] .dlsum{border-bottom:1px solid var(--line)}
.dlsetbody{padding:12px 14px 4px}
.dlsetbody .olcard{border:none;background:transparent;padding:0 0 14px;margin:0}
.dlsetbody .olcard+.olcard{border-top:1px solid var(--line);padding-top:14px}
.upnote{margin-top:8px;font-size:11px;line-height:1.6;color:var(--sub2)}
.upnote code{font-size:10.5px;background:var(--sunken);padding:1px 5px;border-radius:var(--r-xs)}
/* 历史行右侧的「打开」按钮：`margin-left:auto` 把它顶到最右，避免挤在时间后面 */
.upit .pbtn{margin-left:auto;flex:none}
.uptag{flex:0 0 auto;font-size:10.5px;padding:1px 6px;border-radius:var(--r-sm);background:var(--bg);color:var(--sub)}
/* ★v19 磁力「文件清单」预览 —— 复用 .olcard/.olrow/.olres，只补清单排版与告警徽标。
   为什么单独一段：磁力包常有几十上百个文件，必须给**定高滚动**，否则整页被撑爆。 */
.olbadge.warn{color:var(--up)}
.mgfiles{margin-top:9px;border-top:1px solid var(--line);padding-top:8px;max-height:220px;overflow:auto}
.mgf{display:flex;align-items:baseline;gap:9px;font-size:11.5px;color:var(--sub);padding:3px 0;min-width:0}
.mgf .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.mgf .sz{flex:0 0 auto;font-variant-numeric:tabular-nums}
/* ★v19 文件勾选框：`flex:none;min-width:0` 必须显式写 —— `.olrow input` 那条通用规则
   是给「撑满的文本框」用的，勾选框继承到 `flex:1;min-width:150px` 会变成一条长条。 */
.mgf input[type="checkbox"]{flex:none;min-width:0;width:auto;accent-color:var(--accent);cursor:pointer}
.mgf{cursor:pointer}
.mgsel{font-size:11px;color:var(--sub2);flex:none;font-variant-numeric:tabular-nums}
.mghd{display:flex;align-items:baseline;gap:9px;font-size:11.5px;color:var(--sub);margin-bottom:4px}
.mghd b{color:var(--txt);font-weight:650}
.uptag.done{color:var(--ok)}
.uptag.bad{color:var(--up)}
.upg{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upm{flex:0 0 auto;opacity:.85}
.upa{margin-left:auto;flex:0 0 auto;font-variant-numeric:tabular-nums}
.upempty{font-size:11.5px;color:var(--sub);line-height:1.6}

/* ================= ★v15 桌面客户端形态（**只在壳里生效**）=================
   用户 2026-10-16：「目前 exe 更像是一个网站，比如 UI 跟组件，能不能进行优化」
   → 拍板「桌面客户端风格（推荐）」。

   ★ 做法：全部收在 `html.has-shell` 作用域下（该 class 由 JS 在探测到壳桥时挂上）。
     这样**线上 demo（浏览器）保持网页形态** —— 网页形态对网页是对的，
     两边各自符合预期，也不会让线上 demo 变成一个「假桌面应用」。 */

/* ---- ① 自定义标题栏：整条可拖拽，右侧给系统窗口按钮让位 ---- */
html.has-shell .topbar{-webkit-app-region:drag;height:48px;flex:0 0 48px;padding-right:142px}
html.has-shell .topbar button,
html.has-shell .topbar a,
html.has-shell .topbar input{-webkit-app-region:no-drag}

/* ---- ①.5 ★v20 桌面手感：禁选中 + 斜切角（借鉴迅雷游戏助手）----
   ★ 为什么禁选中：浏览器里拖选文字是本能，但桌面应用里「选中一片蓝」非常掉价。
     迅雷是 `body{user-select:none}` + 局部放开 —— 我们照这个思路：
     **内容区禁选中，详情弹窗与输入框放开**（详情里的介绍/配置要能复制）。
   ★ 为什么斜切角：迅雷的卡片/面板用「切掉一个角」的图形语言（它用 PNG 素材，
     我们用 `clip-path` 画 —— **不需要任何素材、也就没有素材版权问题**）。
     只切 `.dlg` 与 `.olcard` 这类**低密度面板**；50 张一屏的卡片网格不切，否则太吵。 */
html.has-shell .body{user-select:none}
html.has-shell .dlg,
html.has-shell input,
html.has-shell textarea{user-select:text}
/* ★ 斜切角**只给面板卡**（`.olcard`：引擎卡 / 磁力卡 / 上游服务卡 / 网盘配置卡）。
   ⚠️ 踩过的坑：一开始也切了 `.dlg`（详情抽屉）—— 但抽屉是**整屏高**，
      切掉的右上角正好落在**系统窗口按钮**那一带，实拍两张都**看不出来**，
      还会压到右上角的来源胶囊（XD）。
      ⇒ 视觉语言必须放在「四角都在视野里」的元素上，否则等于没做。 */
html.has-shell .olcard{
  clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
}

/* ---- ② 详情 → 右侧抽屉（Steam / Epic 的形态），不再盖满整屏 ---- */
html.has-shell .mask{
  align-items:stretch;justify-content:flex-end;padding:0;
  backdrop-filter:none;background:rgba(0,0,0,.45);
}
html.has-shell .dlg{
  width:min(820px,64vw);height:100%;max-height:none;border-radius:0;
  border-left:1px solid var(--line);box-shadow:-18px 0 50px rgba(0,0,0,.35);
  animation:slidein .22s cubic-bezier(.22,.61,.36,1);
}
html.has-shell .dtop{border-radius:0;min-height:200px}
@keyframes slidein{from{transform:translateX(30px);opacity:.45}to{transform:none;opacity:1}}

/* ---- ③ 细滚动条：网页那种粗白条是「网站感」最大的来源之一 ----
   ★v20：宽度 10 → **6px**、并补出 track —— 对齐迅雷游戏助手的实测值
     （track rgba(255,255,255,.06) / thumb rgba(255,255,255,.12) / 圆角 36px·3px）。
     我们用 `color-mix` 从 `--txt` 推导，这样深色/浅色两套主题都不用各写一遍。 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{
  background:color-mix(in srgb, var(--txt) 5%, transparent);border-radius:36px;
}
::-webkit-scrollbar-thumb{
  background:color-mix(in srgb, var(--txt) 12%, transparent);border-radius:3px;
}

/* ---- ④ ★v16-G 桌面客户端骨架 ----
   用户 2026-10-16 ⑤：「为什么 UI 还是很页面化，没有 APP 那种感觉」；
   拍板方向 =「**暗色高质感桌面客户端**（Steam / Playnite 式）」（AskUserQuestion）。

   ★ 先认清「网站味」到底从哪来，再逐条掐（都不改结构，只加作用域规则）：
     ⓐ **一层到底的平铺**：网页 = 顶栏 + 左边栏 + 白底内容；客户端 = 标题栏 + 侧栏 +
        **内容区自成一块面板**（与侧栏分层、有明确边界）。
     ⓑ **导航是「链接」**：网页 nav 是 `<a>` 文本流（下划线语义、行高随内容）；
        客户端是**固定 32px 行高 + 圆角项 + 悬停底色 + 选中竖条**。
     ⓒ **信息密度太低**：网页留白宽松、滚动条粗；客户端更密、滚动条更细（见 ③）。
   ★ 全部收在 `html.has-shell` ⇒ **线上 demo 的网页形态一字不变**（这是既定纪律：
     网页形态对网页是对的，别把线上 demo 变成一个「假桌面应用」）。 */

/* ⓐ 两层底色：侧栏更暗，内容区成为独立面板 */
html.has-shell .nav{
  width:216px;flex:0 0 216px;padding:8px 8px 0;
  background:var(--sunken);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
html.has-shell .main{
  background:var(--card);border-left:1px solid var(--line);padding:18px 22px 40px;
}
/* ⓑ 导航项：固定行高 + 圆角 + 选中竖条（不再依赖 border-left 蹭在容器边上） */
html.has-shell .nav h4{
  font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
  padding:12px 10px 5px;color:var(--sub2);font-weight:700;
}
html.has-shell .nav a{
  padding:0 10px;height:32px;border-radius:var(--r-sm);border-left-color:transparent;
  font-size:12.5px;font-weight:500;position:relative;
}
html.has-shell .nav a.on{
  background:var(--raise);color:var(--accent);font-weight:650;
  box-shadow:inset 0 0 0 1px var(--line);
}
html.has-shell .nav a.on::before{
  content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent);
}
html.has-shell .nav a .cnt{background:transparent;padding:0}
html.has-shell .nav .grp{margin-top:10px;border-top:1px solid var(--line);padding-top:4px}

/* 侧栏底部状态条：给「连的是本机实时库 / 离线快照」一个**常驻**位置
   （客户端都有这么一条；网页形态下 CSS 隐藏，不占位置） */
html.has-shell .navfoot{
  display:flex;align-items:center;gap:7px;margin-top:auto;
  padding:10px 10px 12px;border-top:1px solid var(--line);
  font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;
}
html.has-shell .navfoot .nfdot{
  width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;
}
html.has-shell .navfoot.off .nfdot{background:var(--warn)}

/* ★v25 卡片悬停：改回「上浮」，但比参考站轻（4px vs games.gg 的 8px）。
   v24 及以前这里写的是「客户端只用描边、不用位移」，理由是「位移会让网格跟着抖」。
   **该理由不成立**：transform 走合成层、不触发重排，网格不会抖；真正会抖的是改 margin/height。
   参考站用的是 `-translate-y-2` + `shadow-2xl`，用户 2026-10-23 拍板采纳位移反馈。
   保留描边变化做「主信号」（深浅主题都可读），位移+阴影只做「次信号」（体感）。 */
html.has-shell .card:hover,
html.has-shell .mcard:hover{transform:translateY(-4px);border-color:var(--sub2);box-shadow:0 10px 26px var(--sh1)}
html.has-shell .card{border-radius:var(--r-xl)}
html.has-shell .mcard{border-radius:var(--r-lg)}
html.has-shell .filter-bar{background:var(--sunken);border-radius:var(--r-lg)}
/* 页脚那段「数据取自…」的长说明，在客户端里收窄弱化（长文页脚是网站味重灾区） */
html.has-shell .foot{font-size:11px;line-height:1.62;opacity:.85}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb, var(--txt) 22%, transparent)}
::-webkit-scrollbar-corner{background:transparent}

/* ================= ★v16-A 分页条 + 「不显示数量」=================
   用户 2026-10-16 口径：「不显示数量，避免出问题（一页显示 50 个，设置多页
   类似 [截图] 这样的页面跳转功能）」。

   ★ 为什么是「隐藏」而不是「删掉」侧栏那几个 <span class="cnt">：
     ① 那几个数是**库总量 / 已载量**口径，正是本轮「300 vs 19590」互相打架的来源，
        所以**不许出现在可见 UI 上**（页头 sub、顶栏 svc 同理，数字挪进 title）；
     ② 但它们同时是 refreshCounts() 的**内部状态**（我的游戏 / 下载管理还要用），
        删元素会连带打断一批既有断言（含反证 M37 的锚点 `c-lib` 这个 id）。
     ⇒ 结论：**元素保留、CSS 隐藏**，数量只作为内部状态维护，且**不再对外展示**。
     这条口径必须跟断言一起改，不能悄悄让断言「继续绿」。
     ★ 写这段注释时**不能把那个 id 原样抄进来** —— 反证脚本的启动自检要求
       `_sub1` 的 old 串在源文件里恰好出现 1 次；注释里再抄一遍就会变成 2 次，
       替换会打在注释上、真代码没动，于是「打坏了却不变红」= 盲区。
       （这条自检第一次跑就把我这个错抓了出来，见 _counterproof.py 文件头的硬教训①。） */

<script>
/* ★v13：原为 const，因新增「在线数据更新」需整体替换数据源（`D = 新快照`）而改为 let。
   全站读取方一律不动 —— 仍是 `D.xxx` / `T.xxx`。 */

/* ===== ★v9 主题切换 =====
   首帧的 data-theme 已由 <head> 里的同步脚本定好（防闪），这里只做两件事：
     ① 把按钮文案对齐当前主题  ② 点按钮 → 切换 + 写入 localStorage。
   注意：切换只改 <html data-theme>，不重建 DOM —— CSS 变量会自动重算，
   所以不会丢当前 Tab、筛选条件或滚动位置。 */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const b = document.getElementById('themeBtn');
  if(b) b.textContent = (t === 'dark') ? '☀️ 日间' : '🌙 夜间';
  try{ localStorage.setItem('gi-theme', t); }catch(e){}
}
(function(){
  const b = document.getElementById('themeBtn');
  if(b) b.addEventListener('click', function(){
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
})();

const TABS = {
  home:     {t:'首页',      kind:'home'},   /* ★v8 新增：轮播 + 三块精选（用户需求⑤） */
  pcNew:    {t:'PC 新游',   kind:'pc'},
  pcHot:    {t:'PC 热游',   kind:'pc'},
  /* ★v8：排行榜改为「列表 + 分榜」——rankBoard 标记走独立渲染分支（用户需求②）
     ★v10：分榜改为 4 个（PC新游/PC热游/手机新游/手机热游），且该分支不再挂搜索与筛选 */
  pcRank:   {t:'排行榜', kind:'pc', rank:true, rankBoard:true},
  pcTrainer:{t:'PC 修改器', kind:'pc'},
  pcMod:    {t:'PC MOD',    kind:'pc'},
  mNew:     {t:'手游新游',  kind:'mb'},
  mEvent:   {t:'手游活动',  kind:'mb'},
  mPlay:    {t:'手游可玩端游', kind:'pc'},   /* ★ 与 PC 端游同一套卡片骨架 + 同一套网格 */
  /* ★v12：移除 `report`（端游可视报告）—— 用户 2026-10-15 要求先拿掉报告模块。
     data.js 里的 `report` 键保留不动（无引用即不渲染），重跑构建脚本即可恢复。 */

  /* ★v15 本机三页（用户 2026-10-16 新需求）：
       lib       —— 全量游戏库（实时，走 /api/library/browse 分页）
       myGames   —— 扫盘得到的本机游戏 + 与库匹配（壳提供扫盘能力，浏览器里为空态）
       downloads —— 统一下载管理（真直链走内置下载器，网盘走复制 + 唤起客户端） */
  lib:      {t:'游戏库',   kind:'lib'},
  myGames:  {t:'我的游戏', kind:'mine'},
  downloads:{t:'下载管理', kind:'dl'},
};

/* ---------------- 排序 / 筛选定义（结构参考 PC 游戏工作台） ---------------- */
const gv = (x,k)=> x[k]===undefined||x[k]===null? -1 : x[k];
const SORTS = {
  pcNew:  [ {k:'ts',nm:'最新上架',lb:'NEW'}, {k:'score',nm:'评分最高',lb:'SCORE'}, {k:'size',nm:'容量最大',lb:'SIZE'}, {k:'hot',nm:'热度最高',lb:'HOT'}, {k:'name',nm:'名称',lb:'A-Z'} ],
  pcHot:  [ {k:'hot',nm:'热度最高',lb:'HOT'}, {k:'score',nm:'评分最高',lb:'SCORE'}, {k:'ts',nm:'最新上架',lb:'NEW'}, {k:'name',nm:'名称',lb:'A-Z'} ],
  /* pcRank 不在这里 —— 排行榜由「分榜」自带排序，见 RANK_BOARDS */
  pcTrainer:[ {k:'version',nm:'版本最新',lb:'VER'}, {k:'name',nm:'名称',lb:'A-Z'} ],
  pcMod:  [ {k:'pv',nm:'浏览最多',lb:'PV'}, {k:'name',nm:'名称',lb:'A-Z'} ],
  mNew:   [ {k:'ts',nm:'资讯最新',lb:'NEW'}, {k:'launch',nm:'上线时间',lb:'DATE'},
            {k:'hot',nm:'热度最高',lb:'HOT'}, {k:'score',nm:'评分最高',lb:'SCORE'}, {k:'name',nm:'名称',lb:'A-Z'} ],
  /* ★v16-E：mEvent 原来**没有**「评分最高」/「热度最高」两个排序 ——
     实测 41/131 条带 `score`、98/131 带 `hot`，有数据却排不了。
     （排序会把无分的沉底：CMP.score 取 scoreV，缺分即 0。） */
  mEvent: [ {k:'ts',nm:'最新',lb:'NEW'}, {k:'hot',nm:'热度最高',lb:'HOT'},
            {k:'score',nm:'评分最高',lb:'SCORE'}, {k:'cat',nm:'按类目',lb:'CAT'}, {k:'name',nm:'名称',lb:'A-Z'} ],
  /* ★v16-E：mPlay 的评分来自**端游库评分**（`libScore`，上游已按 0<score<=10 清洗过），
     原来一条都没读 ⇒ 这页 60 条卡全是「无评分」的白板。
     `recent` 是社区库最近更新时间（unix 秒），新增「最近更新」。 */
  mPlay:  [ {k:'score',nm:'评分最高',lb:'SCORE'}, {k:'configs',nm:'配置最多',lb:'CFG'},
            {k:'recent',nm:'最近更新',lb:'NEW'}, {k:'fps',nm:'帧数',lb:'FPS'}, {k:'name',nm:'名称',lb:'A-Z'} ],
};
const CMP = {
  ts:(a,b)=> String(gv(b,'ts')).localeCompare(String(gv(a,'ts'))),
  score:(a,b)=> (gv(b,'scoreV'))-(gv(a,'scoreV')),
  size:(a,b)=> (gv(b,'sizeGB'))-(gv(a,'sizeGB')),
  launch:(a,b)=> (gv(b,'launchTs'))-(gv(a,'launchTs')),
  hot:(a,b)=> ((gv(b,'hotV')>=0?gv(b,'hotV'):gv(b,'hot')))-((gv(a,'hotV')>=0?gv(a,'hotV'):gv(a,'hot'))),
  pv:(a,b)=> (gv(b,'pv'))-(gv(a,'pv')),
  configs:(a,b)=> (gv(b,'configs'))-(gv(a,'configs')),
  version:(a,b)=> String(gv(b,'version')).localeCompare(String(gv(a,'version'))),
  fps:(a,b)=> String(gv(b,'fps')).localeCompare(String(gv(a,'fps'))),
  /* ★v16-E：手游「最近更新」。mPlay 的 `recent` 是 unix **秒**（量级 1e9），
     与 mNew 的 `ts`（ISO 串）不是一回事 ⇒ 用**数值**比较器，别塞进 ts 那条字符串比较。 */
  recent:(a,b)=> (Number(gv(b,'recent'))||0)-(Number(gv(a,'recent'))||0),
  cat:(a,b)=> String(gv(a,'cat')).localeCompare(String(gv(b,'cat'))),
  name:(a,b)=> String(gv(a,'title')||gv(a,'game')).localeCompare(String(gv(b,'title')||gv(b,'game')),'zh'),
};

/* 筛选组：field 取值 / opts 值 → 展示名 */
const FILTERS = {
  pcNew:  [ {k:'srcKey',lb:'来源',field:'srcKey',opts:[['xd','XD'],['jidi','机地']]},
            {k:'genre', lb:'品类',field:'genre',top:9} ],
  pcHot:  [ {k:'srcKey',lb:'来源',field:'srcKey',opts:[['xd','XD'],['jidi','机地']]},
            {k:'genre', lb:'品类',field:'genre',top:9} ],
  /* ★v10：pcRank 不再是「筛选页」—— 它由 4 个分榜自带数据池，

  pcTrainer:[ {k:'srcKey',lb:'来源',field:'srcKey',auto:true} ],

     原因（实测）：原选项是 [MOD / 修改器]，但本 Tab 的池子只取 MOD ——
     全库 8,943 条里修改器最高 pv 仅 3,409，**进不了 Top60**，所以「修改器」按钮
     点一下必然是「没有匹配结果」。而且「修改器」本来就有独立 Tab（pcTrainer，
     来源 trainers.json），同页再放一个永远筛出空集的按钮是纯误导。 */
  pcMod:  [],

             opts:[['taptap','TapTap'],['haoyou','好游快爆'],['x7','小七']]},
