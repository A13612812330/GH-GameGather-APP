/* ---------------- 状态 ---------------- */
/* ★v8：默认落地页改为首页（轮播 + 精选） */
let cur='home', kw='', sortK=null;
let curList = [];       // ★ 当前渲染出的列表（弹窗按序号取数据，保证与屏幕所见一致）
let fx = {};            // {组key: Set(值)}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== ★v15 本机侧状态 =====
   LOCAL —— 扫盘结果与分页游标（我的游戏 / 游戏库共用）。
   DL_JOBS —— 下载管理里的任务表。
   两者都放在全局，切 Tab 不丢（与 cur/kw/fx 同一套约定）。 */
const LOCAL = {
  games: [],        // 扫盘得到的本机游戏（壳给，浏览器里恒为空）
  scanned: false,   // 是否已扫过（区分「没扫」与「扫了没有」）
  scanning: false,
  /* showAll：扫到的候选里混着大量非游戏快捷方式（实测 113 条里 112 条来自快捷方式，
     7-Zip / 飞书 / 播放器…）⇒ 默认只显示「匹配到资源」的，其余收在开关后面。
     口径依据见 renderMyGames 顶部的注释。 */
  showAll: false,
  /* ★v16-A：`limit`/`offset` 已从状态里移除 —— 页长改由 pgOf('lib').size 统一管，
     偏移由页码算出来（真·服务端分页，见 libLoad）。留着两套页长参数必然漂移。 */
  lib: { items:[], total:0, sort:'updated', scope:'pc', loading:false, q:'', loaded:false },
  /* ★v16-A：各实时 Tab 的**上游总量**（按需扩容用）。不对用户展示 —— 分页条只报
     「共 N 条」= 你正在看的这张列表的条数；上游总量只作为「还能不能往下翻」的上界。 */
  liveTot: {},
  note: '',         // 扫盘失败/不支持时给用户的说明
  /* ★v16-D：本机游戏 ↔ 库记录的**手动关联表**（localStorage 持久化）。
     键的口径：优先 `sid:<steam appid>`（Steam 侧最硬），否则 `nm:<归一化名>`。
     存的是**库记录的快照**而不是 id —— 重新扫描时**零请求**就能把关联套回去，
     不依赖上游那一次请求还成功（上游会 429 / 会改 id）。
     用户原话：「记得本地的游戏我需要进行能够关联，通过游戏名/游戏在steam的id等方式」。 */
  links: {},
  pendingLink: null,   // 正在等用户在搜索弹窗里挑一条来关联的本机游戏
  adding: false,       // 搜索弹窗处于「手动加入我的游戏」模式（不是关联）
};
let DL_JOBS = [];   // 下载任务（进行中 + 已完成）

function resetState(tab){
  cur=tab; kw=''; fx={};
  const s=SORTS[tab]; sortK = s? s[0].k : null;
}

/* ================= ★v20 Tab 记忆（借鉴迅雷游戏助手的 sideNavTabMemory）=================
   它的做法：每个侧栏 tab 记住**上次停留的路径**，切走再切回回到原处。
   我们是单页 + `goTab()`，没有路由 ⇒ 等价物 = 记住每个 tab 的
     **搜索词 / 筛选集合 / 排序键 / 滚动位置**（分页 `PG[tab]` 本来就记着）。

   ★ 为什么值得做：改之前 `goTab()` 一律 `resetState(tab)` + `scrollTop=0` ——
     用户在「修改器」里筛了 3 个条件、翻到第 4 页，去首页看一眼再回来，**全没了**。
     这是桌面客户端最基本的体面（Steam / Playnite 都不会这样）。

   ★ 一个刻意的取舍：**再点当前 tab = 回顶部，但不清筛选**。
     迅雷/Steam 都是这个行为 —— 「回顶部」是定位动作，「清筛选」是重置动作，
     把它俩绑在一起会让用户不敢点。 */
const TABMEM = {};                   /* tab → {kw, fx, sort, scroll} */
function tabMemSave(){
  if(!cur) return;
  const m = document.getElementById('main');
  const fxCopy = {};
  for(const k of Object.keys(fx || {})) fxCopy[k] = Array.from(fx[k] || []);
  TABMEM[cur] = { kw: kw, fx: fxCopy, sort: sortK, scroll: m ? (m.scrollTop || 0) : 0 };
}
function tabMemRestore(tab){
  const m = TABMEM[tab];
  if(!m){ resetState(tab); return 0; }          /* 从没去过 ⇒ 按默认来 */
  cur = tab;
  kw = m.kw || '';
  fx = {};
  for(const k of Object.keys(m.fx || {})) fx[k] = new Set(m.fx[k] || []);
  const s = SORTS[tab];
  sortK = m.sort || (s ? s[0].k : null);
  return m.scroll || 0;
}
function fxHas(group, val){
  const s=fx[group]; return !s || s.size===0 || s.has(val);
}
function fxToggle(group, val){
  const s=fx[group] || (fx[group]=new Set());
  if(s.has(val)) s.delete(val); else s.add(val);
}

/* ================= ★v16-A 分页（全站一份实现）=================
   用户 2026-10-16：「不显示数量…一页显示 50 个，设置多页类似 [截图] 这样的页面跳转功能」。

   ★ 关键取舍：**分页作用在「最终渲染列表」上（客户端切片）**，而不是把
     服务端分页塞进每个 Tab。原因：
       · 列表页现在还带**客户端筛选 + 搜索 + 排序**（FILTERS / SEARCH_FIELDS / SORTS）；
         一旦改成服务端分页，筛选就只能作用于当前页，用户会看到「筛出来的数忽多忽少」，
         比现在更难解释。
       · 上游各接口**都支持 offset/limit**（实测：library 19,590 / mods 8,594 /
         trainers 2,852 / mobilehub 1,690 全带 total），所以「按需扩容」是可行的 ——
         翻到已加载范围之外时再补一批（见 pgEnsure），用户感觉不到分页边界。
     ★ 因此「共 N 条」取的是**当前列表（筛完后）的条数**，不是上游总量 ——
       这样它跟页码永远自洽。上游总量只在需要扩容时用作上界，且**不对用户展示**
       （① 的诉求就是「别让用户看到互相打架的两个数」）。 */
const PAGE_SIZES = [20, 50, 100];
const PG_DEF = 50;
const PG = {};                       /* tab → {page,size}，懒建 */
function pgOf(tab){
  if(!PG[tab]) PG[tab] = { page: 1, size: PG_DEF };
  return PG[tab];
}
function pgReset(tab){ const p = pgOf(tab); p.page = 1; }

/** 页码窗口：首页、末页、当前 ±2，其余折成省略号（与参考截图的观感一致）。 */
function pgWindow(page, pages){
  const out = [];
  for(let i = 1; i <= pages; i++){
    if(i === 1 || i === pages || (i >= page - 2 && i <= page + 2)) out.push(i);
    else if(out[out.length - 1] !== '…') out.push('…');
  }
  return out;
}
/** 分页条 HTML。total = 当前列表条数（不是上游总量）。 */
function pagerHTML(tab, total, unit){
  const p = pgOf(tab);
  const pages = Math.max(1, Math.ceil((total || 0) / p.size));
  const size = p.size;
  const page = Math.min(p.page, pages);
  const opts = PAGE_SIZES.map(n =>
    `<option value="${n}"${n === size ? ' selected' : ''}>${n}条/页</option>`).join('');
  const nums = pgWindow(page, pages).map(v => v === '…'
    ? '<span class="gap">…</span>'
    : `<button type="button" class="pg${v === page ? ' on' : ''}" data-pg="${v}">${v}</button>`).join('');
  return `<div class="pager" data-pgroot="${tab}">`
    + `<span class="ptot">共 <b>${(total || 0).toLocaleString()}</b> ${unit || '条'}</span>`
    + `<select data-pgsize aria-label="每页条数">${opts}</select>`
    + `<button type="button" class="pbtn2" data-pg="prev"${page <= 1 ? ' disabled' : ''}>上页</button>`
    + nums
    + `<button type="button" class="pbtn2" data-pg="next"${page >= pages ? ' disabled' : ''}>下页</button>`
    + `<span class="ptot">前往</span>`
    + `<input type="number" min="1" max="${pages}" value="${page}" data-pgjump aria-label="跳转页码">`
    + `<span class="ptot">页</span>`
    + `</div>`;
}
/** 绑事件。onGo(page) 由调用方负责重渲染（各 Tab 的重渲染方式不一样）。 */
function bindPager(root, tab, total, onGo){
  const box = (root || document).querySelector('.pager[data-pgroot="' + tab + '"]');
  if(!box) return;
  const p = pgOf(tab);
  const pages = Math.max(1, Math.ceil((total || 0) / p.size));
  const go = n => {
    n = parseInt(n, 10);
    if(!Number.isFinite(n)) n = 1;
    n = Math.max(1, Math.min(pages, n));
    if(n === p.page) return;
    p.page = n;
    onGo(n);
  };
  box.querySelectorAll('[data-pg]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.pg;
    go(v === 'prev' ? p.page - 1 : (v === 'next' ? p.page + 1 : v));
  }));
  const sel = box.querySelector('[data-pgsize]');
  if(sel) sel.addEventListener('change', () => {
    p.size = parseInt(sel.value, 10) || PG_DEF;
    p.page = 1;              /* 换页长必须回第 1 页，否则会落进空页 */
    onGo(1);
  });
  const jp = box.querySelector('[data-pgjump]');
  if(jp) jp.addEventListener('change', () => go(jp.value));
}
/** 按当前 tab 的 page/size 切一段。 */
function pgSlice(list, tab){
  const p = pgOf(tab);
  const start = (p.page - 1) * p.size;
  return list.slice(start, start + p.size);
}

/* ---- 「按需扩容」：翻到已加载范围之外时，从上游补一批 ----
   为什么需要它：pcNew/pcHot/pcMod/pcTrainer/mPlay 这 5 个 Tab 的初始加载量是
   **写死的 300 条**（v15 为了首屏速度），而它们背后的上游分别是 19,590 / 8,594 /
   2,852 / 1,690 条。不做扩容的话，分页条只能报「共 300 条」——
   那正是用户 ① 抱怨的那个「App 只有 300」。
   ⇒ 这里让分页条报**上游总量**，并在用户翻到边界外时补货，用户感觉不到边界。 */
const LIVE_SRC = {
  pcNew:     () => '/api/library/browse?scope=pc&sort=updated&limit=100',
  pcHot:     () => '/api/library/browse?scope=pc&sort=hot&limit=100',
  pcMod:     () => '/api/mods/list?limit=100&sort=pv',
  pcTrainer: () => '/api/trainers/list?limit=100',
  mPlay:     () => '/api/mobilehub/list?limit=100&sort=configs',
};
const LIVE_MAP = { pcNew: livePC, pcHot: livePC, pcMod: liveMOD, pcTrainer: liveTR, mPlay: liveMH };

/** 把 D[tab] 补到至少够 page*size 条。返回是否真的有变化。 */
async function pgEnsure(tab){
  const src = LIVE_SRC[tab];
  if(!src) return false;
  const p = pgOf(tab);
  const need = p.page * p.size;
  let grew = false, guard = 0;
  while(((D[tab] || []).length < need) && guard++ < 10){
    const loaded = (D[tab] || []).length;
    const tot = LOCAL.liveTot[tab] || 0;
    if(tot && loaded >= tot) break;                       /* 已经到底了 */
    const j = await liveJson(src() + '&offset=' + loaded);
    const items = (j && j.items) || [];
    if(j && Number(j.total)) LOCAL.liveTot[tab] = Number(j.total);
    if(!items.length) break;
    D[tab] = (D[tab] || []).concat(items.map(LIVE_MAP[tab]));
    grew = true;
  }
  if(grew) refreshCounts();
  return grew;
}
/** 当前 Tab 的「可达总量」：无筛选时用上游总量，有筛选/搜索时用命中数。 */
function pgTotal(tab, filtered, hasCond){
  if(hasCond) return filtered;
  const live = Number(LOCAL.liveTot[tab]) || 0;
  if(LIVE_SRC[tab] && live > filtered) return live;
  return filtered;
}

/* ================= ★v16-B 全局搜索弹窗 =================
   用户 2026-10-16 ②：「补充全局搜索入口弹窗，且搜索后也是弹窗显示」。

   ★ 取数：优先**服务端搜索** `/api/library?q=`（覆盖全库 19,590 款，带 offset 翻页）；
     拿不到服务（线上 demo / 断网）时**回落到内置快照** —— 用同一套 searchScore 加权，
     所以「搜得到什么」的口径在两种模式下一致，不会出现「联网能搜到、断网搜不到」的错觉。
   ★ 分页复用列表页那一套 pagerHTML/bindPager（同一份实现），页长档位也共用。 */
const SSEARCH = { q:'', page:1, total:0, items:[], loading:false, ran:false, snap:false };

function smaskEl(){ return document.getElementById('smask'); }

function openSearch(prefill){
  const m = smaskEl();
  if(!m) return;
  m.classList.add('on'); m.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  const q = document.getElementById('sq');
  if(q){
    if(prefill != null) q.value = prefill;
    try{ q.focus(); }catch(e){ /* jsdom / 无头环境下 focus 可能不可用 */ }
  }
  /* ★v16-B 修正（2026-10-16 成品实拍发现）：
     带 prefill 打开时**必须直接搜**。原来只把关键词填进输入框就完事，而真正触发
     搜索的是 `input` 事件的 280ms 防抖 —— **程序化赋 value 不会派发 input**
     ⇒ 用户看到的是「框里有字、下面却是空态」，第一眼就是「搜索坏了」。
     （实拍证据：`openSearch('剑星')` 后结果区仍是空态插图。）
     ★ 这条能漏过 633 条断言，是因为断言只测了「值填进去了」，没测「搜没搜」。 */
  if(prefill != null && String(prefill).trim()) searchRun(String(prefill).trim(), 1);
  else searchRender();                  /* 空手打开才给空态 */
}
function closeSearch(){
  const m = smaskEl();
  linkModeEnd();      /* ★v16-D：Esc / ✕ 关掉搜索 = 放弃本次「关联 / 加入」 */
  if(!m || !m.classList.contains('on')) return;
  m.classList.remove('on'); m.setAttribute('aria-hidden', 'true');
  /* 详情弹窗可能还开着（搜索 → 点结果 → 看详情），这时不能让背景滚起来 */
  const mask = document.getElementById('mask');
  if(!mask || !mask.classList.contains('on')) document.body.style.overflow = '';
  const q = document.getElementById('sq');
  if(q) q.value = '';
  SSEARCH.q = ''; SSEARCH.items = []; SSEARCH.total = 0; SSEARCH.ran = false;
  pgReset('search');
}

/** 执行搜索。page 缺省用 pgOf('search').page（分页条翻页时就是靠这个）。
 *  返回 Promise，便于测试 await 后断言 DOM。 */
async function searchRun(q, page){
  const S = SSEARCH;
  const k = String(q == null ? S.q : q).trim();
  S.q = k; S.ran = true;
  pgOf('search').page = Math.max(1, page | 0 || 1);
  if(!k){ S.items = []; S.total = 0; S.loading = false; searchRender(); return; }
  const size = pgOf('search').size;
  const off = (pgOf('search').page - 1) * size;
  S.loading = true; searchRender();

  const base = (typeof dlBoot === 'function') ? await dlBoot().catch(() => null) : null;
  let items = null, total = 0;
  if(base){
    try{
      const r = await fetch(base + '/api/library?q=' + encodeURIComponent(k)
        + '&limit=' + size + '&offset=' + off, { cache: 'no-store' });
      if(r.ok){
        const j = await r.json();
        if(j && j.ok){ items = (j.items || []).map(livePC); total = Number(j.count) || 0; }
      }
    }catch(e){ /* 静默回落快照 */ }
  }
  if(items === null){
    /* 快照兜底：在快照的各列表里用同一套加权找一遍（快照本来就没有全量库，
       所以这里能搜到的范围就是快照范围 —— 文案里必须如实说明，不能假装全量）。 */
    const kl = k.toLowerCase();
    const pool = [], seen = new Set();
    ['pcNew','pcHot','pcRank','pcMod','pcTrainer','mPlay','mNew','mEvent'].forEach(t => {
      (D[t] || []).forEach(a => {
        const key = a.title || a.game || '';
        if(key && !seen.has(key) && searchScore(a, kl) > 0){ seen.add(key); pool.push(a); }
      });
    });
    total = pool.length;
    items = pool.slice(off, off + size);
    S.snap = true;
  }else{
    S.snap = false;
  }
  S.items = items; S.total = total; S.loading = false;
  searchRender();
}

function searchRender(){
  const st = document.getElementById('sstat'), list = document.getElementById('slist'), foot = document.getElementById('sfoot');
  if(!st || !list || !foot) return;
  const S = SSEARCH;
  /* ★v16-D：关联 / 加入模式下必须先讲清「点一条会发生什么」——
     否则用户会以为自己在浏览，点下去却把本机那条绑上了别的游戏。 */
  const modeTip = (LOCAL.pendingLink || LOCAL.adding)
    ? '<b>' + (LOCAL.pendingLink ? '关联模式' : '加入模式') + '</b> · '
      + (LOCAL.pendingLink
          ? '点一条结果即与「' + esc(LOCAL.pendingLink.name || '') + '」绑定'
          : '点一条结果即加入「我的游戏」（不依赖扫盘结果）')
      + '　·　Esc 取消　'
    : '';
  if(S.loading) st.innerHTML = modeTip + '搜索中…';
  else if(!S.ran || !S.q) st.innerHTML = modeTip + '输入关键词开始搜索 · 覆盖本机实时全量库';
  else st.innerHTML = modeTip + '「<b>' + esc(S.q) + '</b>」共 <b>' + (S.total || 0).toLocaleString() + '</b> 条结果'
    + (S.snap ? '<span style="opacity:.75">（未连接本机服务，当前只在内置快照范围内搜索）</span>' : '');

  list.innerHTML = S.items.length
    ? S.items.map((a, i) => {
        const cover = a.cover
          ? `<img src="${esc(a.cover)}" alt="" referrerpolicy="no-referrer" onload="reveal(this)" onerror="this.remove()">`
          : '🎮';
        const meta = [];
        (a.genres || []).slice(0, 3).forEach(g => meta.push(`<span>${esc(g)}</span>`));
        if(a.size) meta.push(`<span>${esc(a.size)}</span>`);
        if(a.dateLabel) meta.push(`<span>${esc(a.dateLabel)}</span>`);
        const sc = Number(a.score) > 0 ? `<div class="sv">★ ${esc(fmtScore(a.score))}</div>` : '';
        return `<div class="srow" data-si="${i}">
          <div class="sc">${cover}</div>
          <div class="sb"><div class="st">${esc(a.title || '')}</div>
            <div class="sm">${meta.join('')}</div></div>
          ${sc}</div>`;
      }).join('')
    : (S.ran && S.q
        ? `<div class="sempty"><div class="big">🔍</div>没有匹配的游戏<br>换个关键词，或到「游戏库」按品类浏览</div>`
        : `<div class="sempty"><div class="big">⌨️</div>试试输入游戏名（中英文都行）<br>例如「赛博朋克」「Elden」「米哈游」</div>`);

  /* 分页条与列表页共用同一套组件；页长也共用档位（改这里会同步改 offset 的算法） */
  foot.innerHTML = (S.total > pgOf('search').size) ? pagerHTML('search', S.total) : '';
  if(S.total > pgOf('search').size){
    bindPager(foot, 'search', S.total, () => searchRun(S.q, pgOf('search').page));
  }
  list.querySelectorAll('[data-si]').forEach(r => r.addEventListener('click', () => {
    searchPick(SSEARCH.items[Number(r.dataset.si)]);   /* ★v16-D：详情 / 关联 / 加入 一个分派点 */
  }));
  const q = document.getElementById('sq');
  if(q && document.activeElement !== q){ /* 翻页后保持输入框有焦点，方便继续改词 */ }
  syncImgs(list);
}

/* 顶栏入口 + Ctrl/Cmd+K + Esc。挂一次即可。 */
(function bindSearchUI(){
  const b = document.getElementById('searchBtn');
  if(b) b.addEventListener('click', () => openSearch());
  const x = document.getElementById('sx');
  if(x) x.addEventListener('click', () => closeSearch());
  const m = smaskEl();
  if(m) m.addEventListener('mousedown', e => { if(e.target === m) closeSearch(); });
  const q = document.getElementById('sq');
  if(q){
    let tm = null;
    q.addEventListener('input', e => {
      const v = e.target.value;
      clearTimeout(tm);
      /* 与列表页同样是 280ms 防抖（同一个取舍：不防抖会把「派发 input 立刻读 DOM」的同步断言打散） */
      tm = setTimeout(() => searchRun(v, 1), 280);
    });
    q.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ clearTimeout(tm); searchRun(q.value, 1); }
    });
  }
  document.addEventListener('keydown', e => {
    const sm = smaskEl();
    const open = sm && sm.classList.contains('on');
    if((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){
      e.preventDefault();
      if(open) closeSearch(); else openSearch();
      return;
    }
    if(e.key === 'Escape' && open){ e.preventDefault(); closeSearch(); }
  });
})();

/* ---------------- 图片：容器定比 ＋ 一律 cover 铺满（★v7） ---------------- */
/* ★v8：去掉 loading="lazy"。
   原因（实测）：无头 Chrome 在 `--virtual-time-budget` 下不产生正常渲染帧，
   **懒加载图几乎不会触发加载** —— `--dump-dom` 导出显示 mEvent 98 张图
   `complete=false / naturalWidth=0`、截图里整片空白，而同一批 URL 用纯 HTTP 请求
   全是 200（1080×608）。这会让「视觉验收」这个 v7 才建立起来的能力整体失真，
   代价远大于省下的带宽；单 Tab 最多 153 张图，直接全量加载。
   （若将来数据量级放大，再换成 IntersectionObserver 自管懒加载，别退回原生 lazy。） */
function cover(src, cls, tagHtml, badgeHtml){
  const ph = `<div class="ph">🎮</div>`;
  const t = tagHtml||'', b = badgeHtml||'';
  if(!src) return `<div class="cv ${cls}">${ph}${t}${b}</div>`;
  return `<div class="cv ${cls}">${ph}
    <img decoding="async" referrerpolicy="no-referrer" src="${esc(src)}" alt=""
      onload="reveal(this)" onerror="this.remove()">${t}${b}</div>`;
}
/* 图片就位：藏掉占位 + 打 .ready 标记。**不做任何比例判断**（填充方式由 CSS 的 object-fit 定死）。
   ★v8 语义变更：这已是**纯优化**动作 —— 图的可见性由 CSS（`img{z-index:1}` 压在占位 `.ph` 之上）
   决定，即使本函数因「缓存命中、load 早于入树」而没跑到，图也照样看得见。
   这正是修掉「图加载完了却一直透明」的关键：**别让可见性依赖回调**。
   ★ 空值防御必需：缓存命中时 onload 可能早于节点入树触发，那时 previousElementSibling
     为 null；若在读取处直接抛错，整段逻辑会静默中断（v5 的坑，见 SOP §1.2.2）。 */
/* ★v16-F：活动图**逐图**适配（用户 ⑦「如果是游戏icon/正方形的图片则再优化下完整显示」）。
   实测（`_actfit.py`，2026-10-16，各取 60 张真图量宽高）：
     · 活动图 **12/60 是 256×256 的正方 icon**（明日方舟：终末地 / 三角洲行动 /
       无畏契约：源能行动 / 元气骑士 …），在 `.mth.wd`（16:10）里被 `cover` 裁掉 **37.5%**；
     · 另外 48/60 是横版 banner（ar ≥ 1.5），当前 16:10 对它们的最狠裁切是 37.5%、均值 15.4%；
     · 新游 icon 59/59 全是 1:1，而容器本来就是 1:1 ⇒ **零裁切**，这页不用动。
   ★ 为什么是「逐图判」而不是「改容器比例」：同批实测的对照表 ——
     容器改 1:1 ⇒ 横版图均值裁切从 15.4% 飙到 35%（修好 20%、弄坏 80%）；
     容器改 4:3 ⇒ 最狠 25% 但均值 24.9%（把大多数图都弄坏了）。
     ⇒ 没有哪个**统一**比例能同时照顾两簇，只能按每张图自己的形状决定。
   ★ 阈值 1.18 的依据：实测两簇分别是 **1.00**（icon）与 **≥1.5**（横版），
     1.18 落在两簇之间的空档里 ⇒ 不会把横版误判成 icon。 */
function fitThumb(img){
  const box = img.parentElement;
  if(!box || !box.classList || !box.classList.contains('mth')) return;
  if(!box.classList.contains('wd')) return;      /* 新游卡本来就是 1:1（实测 59/59 零裁切） */
  const w = Number(img.naturalWidth) || 0, h = Number(img.naturalHeight) || 0;
  if(!w || !h) return;                          /* 图没解出来（缓存/失败）⇒ 保持原样，不赌 */
  const ar = w / h;
  box.classList.toggle('fit', ar >= 0.85 && ar <= 1.18);
}

function reveal(img){
  const ph = img.previousElementSibling;
  if(ph && ph.classList && ph.classList.contains('ph')) ph.classList.add('gone');
  img.classList.add('ready');
  /* ★v16-F：放在 reveal 里而不是换一个 onload 名字 ——
     全站 `.mth img` / `.cv img` / `.hpic img` 的 onload 都是 `reveal(this)`，
     换名字会连带打破一批既有断言，还会多出一条「有的图走这条、有的图走那条」的岔路。 */
  fitThumb(img);
}
/* 渲染后补跑一遍：浏览器对「已在缓存里的图」可能不派发 load，或在节点还没挂到
   文档树上时就派发 —— 两种情况都会漏掉 reveal，症状是「图不出现 / 占位不消失」。
   对已 complete 且还没标记 ready 的图主动补跑，把偶发变成必然。 */
function syncImgs(root){
  const scope = root || document;
  scope.querySelectorAll('.cv img, .mth img, .hpic img, .hsitem img').forEach(im=>{
    if(!im.complete || !im.naturalWidth) return;
    reveal(im);
  });
}
/* ★v8 标题拆分（用户需求①：中文名 + 英文名用（）包含）
   库里 title 是「中文名/英文名/中文别名」的自由拼接（实测样本）：
     `007 初露锋芒/007 First Light`
     `侠盗猎车手5传承版/GTA5传承版/Grand Theft Auto V Legacy`
     `极限竞速：地平线5/Forza Horizon 5/支持网络联机`
     `【mod】极致细致的果/体+动态x器官`     ← 这里的 `/` 不是分隔符！
   规则（**只按「段是否含 CJK」分类，不做词义猜测**）：
     · 含 CJK 的段 → 按原序用「 / 」连成主名
     · 不含 CJK 的段 → 合并进括号（多个英文名用「 / 」连）
   两条护栏（防误拆，是这套规则的关键）：
     ① 一个纯英文段都没有 ⇒ **整体不动**（否则 `红色警戒2/红警2` 会被拆坏）；
     ② 全是英文段（主名为空）⇒ 也**整体不动**（否则会输出 `AAA/BBB（AAA / BBB）` 这种重复）。
   返回 {main, en, changed}。 */
function nameParts(t){
  const s = String(t||'').trim();
  if(s.indexOf('/') < 0) return {main:s, en:'', changed:false};
  const segs = s.split('/').map(x=>x.trim()).filter(Boolean);
  if(segs.length < 2) return {main:s, en:'', changed:false};
  const CJK = /[\u4e00-\u9fff]/;
  const zh = segs.filter(x=>CJK.test(x));
  const en = segs.filter(x=>!CJK.test(x));
  if(!en.length || !zh.length) return {main:s, en:'', changed:false};
  return {main:zh.join(' / '), en:en.join(' / '), changed:true};
}
/* 卡片标题 HTML：中文名 +（英文名）。英文名小半号、灰度降一档（样式见 .ctitle .en） */
function titleHTML(t){
  const p = nameParts(t);
  if(!p.changed) return esc(p.main);
  return `${esc(p.main)}<span class="en">（${esc(p.en)}）</span>`;
}

/* ---------------- 卡片：统一骨架 ---------------- */
/* ★ 统一原则：PC 端游 5 个 Tab（新游/热游/排行/修改器/MOD）+ 手游「可玩端游」
   全部走同一个 cardShell()，因此外框 / 缩略图比例 / 行距 / 行高完全一致。 */
/* 标签配色：游戏两源 + 资讯四源 + 修改器五源（保证每个 Tab 的左上标签都有色，不缺档） */
const SRC_CLS = {xd:'src-xd',jidi:'src-jidi',steam:'src-steam',
                 taptap:'src-taptap',haoyou:'src-haoyou',x7:'src-x7',
                 gamersky:'src-gamersky',gcores:'src-gcores',
                 cheat_table:'src-ce',fling:'src-fling',community:'src-community',
                 xiaoxing:'src-xiaoxing',gcm:'src-gcm'};

const fmtHot = n => {
  const v = Number(n)||0;
  if(v >= 10000) return (v/10000).toFixed(v>=100000?0:1)+'万';
  return String(v);
};
/* 帧数原文本太长（如「帧数不显示，轻微卡顿」）→ 角标只取可量化的那一段 */
function fpsShort(s){
  const t = String(s||'');
  const m = t.match(/(\d+)\s*[-~—至]\s*(\d+)/); if(m) return m[1]+'-'+m[2];
  const m2 = t.match(/(\d+)\s*帧/);             if(m2) return m2[1]+' 帧';
  return '';
}
/* 《游戏名》xx活动 → 去掉开头的《游戏名》，只留「活动标题」 */
function subOf(a){
  const t = String(a.title||''), g = String(a.game||'');
  if(!g) return t;
  const pre = '《'+g+'》';
  if(t.startsWith(pre)){
    const rest = t.slice(pre.length).replace(/^[\s·，,、:：\-—]+/,'');
    return rest || t;
  }
  return t;
}

/**
 * 统一卡片骨架（自上而下四段，高度全部固定）：
 *   ① 缩略图（16:9 定比）  ② 标题（正文两行预留）  ③ 元信息行（一行）  ④ 底栏（一行，贴底对齐）
 * 字段由各 Tab 按同一顺序填入 ⇒ 6 个 Tab 的卡片外形完全一致。
 */
const srcTag = a => ({cls:SRC_CLS[a.srcKey]||'', text:a.src});

/* ★v5：卡片不再 onclick 直接跳走，改成携带 (tab, 序号) → openDetail() 弹窗
   弹窗里再给「打开原页」按钮，避免误点就跑掉
   ★v8：o.titleHtml 供「中文名 +（英文名）」这种带标记的标题用；o.tab 供首页跨 Tab 卡片用 */
/* ===== ★v25 元信息胶囊「+N」折叠（参考 games.gg 的平台徽标折叠）=====
   问题：`.cmeta` 与 `.crow.bottom` 都是 `flex-wrap:nowrap; overflow:hidden`
   ⇒ 胶囊放不下时**被整条静默裁掉**，用户只看到「标签少了几个」，不知道还有内容。
   v17 的规避办法是「把最重要的胶囊排在第一位」（见 cardPC 里 mgPill 的注释）——
   那是**排序规避**，不是**告知**；v25 改成显式折叠：放不下的收进 `+N`，title 列出被折叠的文案。

   ★ 为什么挂在 bindMain 末尾而不是 render 里：折叠依据是 `clientWidth`，
     必须等 DOM 入树、布局算完才有值。
   ★ 为什么 jsdom 里天然不生效：jsdom 没有布局，`clientWidth` 恒为 0 ⇒ 直接早退。
     所以**既有断言（含数 pill 个数的）不受影响**，这是刻意保留的性质，别改成 offsetParent 判据。
   ★ 先量后改：循环里只做「隐藏尾项 + 更新计数」，最后一次性写 title，
     避免边改边量导致的抖动。 */
function foldMeta(root){
  if(!root || !root.querySelectorAll) return;
  root.querySelectorAll('.cmeta, .crow.bottom').forEach(box=>{
    if(!box.clientWidth) return;                 /* jsdom / 隐藏容器：不折 */
    const kids=[...box.children];
    if(kids.length<3) return;
    const fits=()=>box.scrollWidth<=box.clientWidth+1;
    kids.forEach(k=>{ if(k.style.display==='none') k.style.display=''; });
    const old=box.querySelector('[data-fold]'); if(old) old.remove();
    if(fits()) return;                           /* 放得下，不动 */
    const n=kids.length;
    let from=n;
    const chip=document.createElement('span');
    chip.className='pill foldn'; chip.dataset.fold='1';
    box.appendChild(chip);
    while(from>1 && !fits()){
      from--;
      kids[from].style.display='none';
      chip.textContent='+'+(n-from);
    }
    if(!fits()){                                 /* 极窄仍放不下 ⇒ 回退成原来的裁剪行为 */
      chip.remove();
      kids.forEach(k=>{ k.style.display=''; });
      return;
    }
    chip.title='另有 '+(n-from)+' 项：'+kids.slice(from).map(k=>k.textContent.trim()).join('、');
  });
}
/* 窗口尺寸变化后重算 —— 卡片列数会随宽度变，折叠结果必须跟着变（防抖 140ms） */
let _foldT=0;
addEventListener('resize',()=>{
  clearTimeout(_foldT);
  _foldT=setTimeout(()=>foldMeta(document.getElementById('main')),140);
});

function cardShell(o){
  const tag   = o.tag   ? `<span class="tag ${o.tag.cls||''}">${esc(o.tag.text)}</span>` : '';
  const badge = o.badge ? `<span class="badge-tr ${o.badgeCls||''}">${esc(o.badge)}</span>` : '';
  const rank  = o.rank!=null ? `<span class="rankno">NO.${o.rank}</span>` : '';
  return `<div class="card ${o.cls||''}" data-d="${o.tab||cur}" data-i="${o.idx}" title="${esc(o.tip||o.title||'')}">
    ${cover(o.img,'',tag,badge+rank)}
    <div class="cbody">
      <div class="ctitle">${o.titleHtml || esc(o.title)}</div>
      <div class="cmeta">${o.meta||''}</div>
      <div class="crow bottom">${o.bottom||''}</div>
    </div></div>`;
}

function cardPC(a,i,showRank,tab,merged){
  /* ★v17：跨源同款合并的标记。**必须排在 meta 的第一位** ——
     `.cmeta` 是 `flex-wrap:nowrap; overflow:hidden`，排在后面的胶囊会被整条裁掉
     （★实测：放在 resPills 之后**完全看不见**，实拍图里那行只有「动作/热度/资源」四个）。
     文案也刻意短成 `⊕ +N 同款`：它自己也会占宽度，写全「⊕ 另有 N 条同款」会把别的挤出去；
     完整来源名单走 title，悬停可见。 */
  const mgPill = (merged && merged.length)
    ? `<span class="pill mg" title="同款已在别的来源收录，已合并显示：${esc(merged.join('、'))}">⊕ +${merged.length} 同款</span>`
    : '';
  return cardShell({
    idx:i, tab, title:a.title, titleHtml:titleHTML(a.title), tip:a.title, img:a.cover,
    tag:srcTag(a), badge:a.score, rank:showRank? i+1 : null,
    meta: mgPill +
         `<span class="pill">${esc(a.genre||'—')}</span>` +
         (a.hot?`<span class="pill hot">热度 ${fmtHot(a.hot)}</span>`:'') +
         resPills(a),
    bottom:(a.size?`<span class="pill">${esc(a.size)}</span>`:'')+`<span>${esc(a.date||'—')}</span>`,
  });
}

/* ★v16-C：资源角标 —— 让用户**点之前**就知道这款游戏有没有 MOD / 存档 / 修改器。
   用户 2026-10-16 ④：「优化游戏获取，点击则自动进行获取」。
   ★ 数据来自库里**自带**的 `res: {mod, saves, trainers}` 字段（`livePC` 透传）——
     **零请求**，不进弹窗、不打源站，所以不会遇到 429。
   ★ 只在**有值**时出角标：`res` 缺失（sort=updated 路径不带这个字段）时**不猜**，
     宁可不出角标 —— 出了却不准比不出更糟（用户会以为「没有 MOD」）。 */
function resPills(a){
  const r = a && a.res;
  if(!r) return '';
  const out = [];
  const n = v => Number(v) || 0;
  if(n(r.mod))      out.push(`<span class="pill rz" title="库内 MOD 条数">🧩 ${fmtHot(n(r.mod))}</span>`);
  if(n(r.trainers)) out.push(`<span class="pill rz" title="库内修改器条数">🛠 ${fmtHot(n(r.trainers))}</span>`);
  if(n(r.saves))    out.push(`<span class="pill rz" title="库内存档条数">💾 ${fmtHot(n(r.saves))}</span>`);
  return out.join('');
}
function cardTrainer(a,i,tab){
  return cardShell({
    idx:i, tab, title:a.title, titleHtml:titleHTML(a.title), tip:`${a.title} / ${a.en}`, img:a.cover,
    tag:srcTag(a), badge:a.version,
    meta:`<span class="pill">${esc(a.en||'—')}</span>`,
    bottom:a.steamId?`<span class="pill">Steam ${esc(a.steamId)}</span>`:`<span>修改器</span>`,
  });
}
function cardMod(a,i,tab){
  return cardShell({
    idx:i, tab, title:a.title, titleHtml:titleHTML(a.title), tip:a.title, img:a.cover,
    /* ★v10：左上角改挂**来源**，与其它 Tab 一致（每个 Tab 的 tag 都是来源）。
       原实现挂的是 a.kind='MOD' —— 那是**类型**不是来源，导致 60 张卡长得一模一样、
       页面上完全看不出数据取自哪里（用户问「获取源是哪些」正是问这个）。
       本 Tab 单一来源 = 机地，数据层已写入 src/srcKey。 */
    tag: srcTag(a), badge:a.pv?`👁 ${fmtHot(a.pv)}`:'',
    meta:`<span class="pill">${esc(a.game||'—')}</span>`,
    bottom:`<span class="ell">@${esc(a.author||'匿名')}</span>` +
           (a.nlink>0?`<span class="pill ok">${a.nlink} 链接</span>`:''),
  });
}
/* 可玩端游：与 PC 端游同一骨架，只把「来源」换成「可玩档位」、字段换成模拟器维度的实测值 */
function cardPlay(a,i,tab){
  /* ★v16-E：把 `libScore`（端游库评分）与容量 / 资源角标摆出来 ——
     这一页原来 60 张卡一个评分都没有，而评分**上游早就给了**（见 liveMH 注释）。
     评分放 meta 首位的**高亮 pill**，`badge` 仍留给帧数（帧数才是「可玩端游」这页的主轴）。 */
  const sc = Number(a.score) > 0
    ? `<span class="pill score" title="${esc(a.scoreLab || '评分')}">★ ${esc(fmtScore(a.score))}</span>` : '';
  return cardShell({
    idx:i, tab, title:a.title, titleHtml:titleHTML(a.title), tip:`${a.title}｜${a.tier||''} · ${a.fps||''}`, img:a.cover,
    tag:{cls:a.tierKey==='ok'?'tier':'tier gray', text:a.tier||'待测'},
    badge:fpsShort(a.fps),
    meta:sc + `<span class="pill ok">配置 ${a.configs} 套</span>` +
         (a.devices?`<span class="pill">${a.devices} 台实测</span>`:'') +
         resPills(a),
    bottom:(a.size?`<span class="pill">${esc(a.size)}</span>`:'') + (a.chip?`<span class="pill">${esc(a.chip)}</span>`:'') +

function mThumb(src, cls, emoji){

const fmtScore = v => (Number(v)||0).toFixed(1);

/* ★v6 手游新游卡（对齐参考图 + 右侧全兜底）
   ① 右侧大号数字**定宽 76px 右对齐**：评分(绿★) > 热度(橙🔥) > 占位「—」
      —— 那两条「上游无评分无热度」的记录来自好游快爆独家（无 engagement 字段），
         用「—」占位而不是留空，保证 153 张卡的右列位置完全一致
   ② 游戏名 / 标签行 / 时效行各自单行省略 ⇒ 名称长短、标签个数都不改变卡片高度
   ★v8 两处调整（用户需求③）：
     · **时间只出现一次** —— 标题行后缀只保留状态词（定档 / 预约中 / 已上线），
       不再拼 `定档 10/9`；日期统一由标签下的绿色时效行承载。
     · **平台标签移到卡片右上角**（`.mtop`），不再混在标签行里；最多显示 2 个，
       其余折叠成 `+N`，标签再多也不改变卡片高度与正文宽度。 */
function cardMNew(a,i,tab){
  const hasScore = Number(a.score) > 0;
  let right;
  if(hasScore){
    right = `<div class="mscore" title="评分"><span class="ic">★</span><span class="v">${esc(fmtScore(a.score))}</span></div>`;
  }else if(a.hot){
    right = `<div class="mscore hm" title="${esc(a.hotLabel||'热度')}"><span class="ic">🔥</span><span class="v">${esc(fmtHot(a.hot))}</span></div>`;
  }else{
    right = `<div class="mscore none" title="上游暂无评分 / 热度数据">—</div>`;
  }
  /* 平台标签 → 右上角；超出上限折叠为 +N */
  const plats = (a.sources && a.sources.length)
    ? a.sources.map(s=>`<span class="pill ${SRC_CLS[s.key]||''}">${esc(s.src)}</span>`)
    : (a.src ? [`<span class="pill ${SRC_CLS[a.srcKey]||''}">${esc(a.src)}</span>`] : []);
  const MAXP = 2;
  const kept = plats.slice(0, MAXP), extra = plats.length - kept.length;
  const top = plats.length
    ? `<div class="mtop">${kept.join('')}${
        extra > 0 ? `<span class="pill more" title="${esc(plats.length + ' 个来源')}">+${extra}</span>` : ''
      }</div>`
    : '';
  /* 上游标签偶发被整条过滤掉（好游快爆推荐位污染），此时回落到类目，保证标签行不空。
     ★v16-E：标签本身**就是筛选入口**（用户 ⑥「我需要游戏标签可以进行筛选」）——
       用与筛选栏同一套协议（`data-fg` / `data-fv`），所以点标签 = 勾选那个标签，
       不需要另写一套「标签点击」逻辑（另写必然与筛选栏漂移）。 */
  const tlist = (a.tags && a.tags.length) ? a.tags.slice(0,3) : [a.cat||'手游'];
  const tags = tlist.map(t=>{
    const isTag = !!(a.tags && a.tags.length);
    return isTag
      ? `<span class="pill tap" data-fg="tags" data-fv="${esc(t)}" title="按标签「${esc(t)}」筛选">${esc(t)}</span>`
      : `<span class="pill">${esc(t)}</span>`;
  }).join('');
  const st = String(a.status||'').trim();          /* ★v8：只用状态词，不带日期 */
  const pre = st && st !== '已上线';
  return `<div class="mcard nw" data-d="${tab||cur}" data-i="${i}" title="${esc(a.game)}">
    ${top}
    ${mThumb(a.img,'sq','📱')}
    <div class="mbd">
      <div class="mrow">
        <span class="mt">${esc(a.game)}</span>
        ${st?`<span class="mst${pre?' pre':''}">${esc(st)}</span>`:''}
        ${hasScore && a.hot ? `<span class="mhot" title="${esc(a.hotLabel)}">🔥${esc(fmtHot(a.hot))}</span>` : ''}
      </div>
      <div class="mtags">${tags}</div>
      <div class="msub gn" title="${esc(a.note)}">${esc(a.note||a.launchText||'')}</div>
    </div>
    ${right}</div>`;
}
/* 手游活动（★v8：用户需求④补「上线/开始时间」）
   · 类目从标题行移到右上角（与新游卡的平台标签同一位置，两类卡视觉对齐）
   · 时间放游戏名右侧，绿色定宽 —— 卡上不再有重复的时间字段 */
function cardMEvent(a,i,tab){
  const t = a.launchText || a.dateText || a.tlDate || '';

     放右上角 `.mtop` 而不是新开一行：卡片高度是**定死**的（`.mcard{height:106px}`），
     多一行会把正文挤掉（这正是「时间只出现一次」那轮踩过的坑）。 */
  const top = [];

  else if(a.hot) top.push(`<span class="pill hot" title="${esc(a.hotLabel||'热度')}">🔥 ${esc(fmtHot(a.hot))}</span>`);
  const cat = top.length ? `<div class="mtop">${top.join('')}</div>` : '';
  /* ★v16-F：根上加 `ev` 类 —— 活动卡在这轮要单独放大标题、抬高卡高（见 CSS），
     而 `.mcard` 同时被新游卡用着，不能直接改基类去影响它。 */
  return `<div class="mcard ev" data-d="${tab||cur}" data-i="${i}" title="${esc(a.title)}">
    ${cat}
    ${mThumb(a.img,'wd','🎉')}
    <div class="mbd">
      <div class="mtl">
        <div class="mt">${esc(a.game||a.title)}</div>
        ${t?`<span class="mtime" title="上线 / 开始时间">${esc(t)}</span>`:''}
      </div>

}

/* ---------------- 筛选栏 ---------------- */
/* ★v16-E：`field` 可能是**数组**（手游 `tags`：一条游戏挂 8~11 个标签）。
   原实现直接把字段值当 Map 键 ⇒ 数组是引用类型、**每个数组都是不同的键**，
   于是要么铺出几百个按钮、要么一个都点不动（没有任何两个数组 `===`）。
   ⇒ 数组要**摊平**逐个计数；口径与 listSection 的 `Array.isArray(v) ? v.some(…)` 对齐。
   （同时把原来重复算两遍的 `counts` 循环去掉 —— 它和 `seen` 数的是同一件事。） */
function optsFor(tab, grp, list){
  if(grp.opts) return grp.opts.map(([v,lb])=>({v,lb}));
  // auto：从当前数据里取 distinct 值（数组字段逐个元素计数）
  const seen=new Map();
  for(const a of list){
    const v=a[grp.field];
    if(v===undefined||v===null||v==='') continue;
    const vals = Array.isArray(v) ? v : [v];
    for(const x of vals){
      if(x===undefined||x===null||x==='') continue;
      seen.set(x,(seen.get(x)||0)+1);
    }
  }
  let arr=[...seen.entries()].map(([v,n])=>({v,lb:String(v),n}));
  arr.sort((a,b)=>b.n-a.n || a.lb.localeCompare(b.lb, 'zh'));
  if(grp.top) arr=arr.slice(0,grp.top);
  return arr.map(x=>({v:x.v,lb:x.lb}));
}
/* ★v16-E：卡片上的**标签 pill 也是筛选入口**（用户 ⑥「我需要游戏标签可以进行筛选」）。
   两个必须注意的点：
     ① 标签长在 `.mcard[data-d]` **里面** ⇒ 不 `stopPropagation` 就会顺带弹出详情弹窗
        （document 级委托按 `.mcard[data-d]` 判「点了卡片」）；
     ② `refreshList()`（搜索框输入时）会**重建 #listbox** ⇒ 标签节点被换掉、监听器一起没了。
        所以这个绑定必须在 `render()` 与 `refreshList()` **两处**都调用 —— 抽成函数防漂移，
        并且用 `__tap` 做**幂等**：重复绑定会让一次点击 `fxToggle` 两次（toggle 自反）= 等于没点。 */
function bindTagPills(root){
  (root || document).querySelectorAll('.pill.tap[data-fg]').forEach(b=>{
    if(b.__tap) return;
    b.__tap = 1;
    b.addEventListener('click', e=>{
      e.stopPropagation(); e.preventDefault();
      fxToggle(b.dataset.fg, b.dataset.fv); pgReset(cur); render();
    });
  });
}

    sort:(a,b)=>(hotPct(b)-hotPct(a)) || (Number(b.hot)-Number(a.hot)),
    txt:a=>fmtHot(a.hot), hm:true,
    name:a=>a.game || a.title, chip:a=>a.hotLabel || '' },
];

/* 按源归一化：把每条 hot 换算成「在本源内的百分位」0~1（源内最低=0、最高=1）。
   单条源（n<=1）记 1，避免除零。用**对象引用**当 key —— D.mNew 里的对象是唯一实例。 */
let _HOT_PCT = null;
function hotPctMap(){
  if(_HOT_PCT) return _HOT_PCT;
  _HOT_PCT = new Map();
  const g = {};
  (D.mNew||[]).forEach(a=>{
    if(!(Number(a.hot) > 0)) return;
    const k = a.srcKey || a.src || '?';
    (g[k] = g[k] || []).push(a);
  });
  Object.keys(g).forEach(k=>{
    const arr = g[k].slice().sort((x,y)=>Number(x.hot)-Number(y.hot));
    const n = arr.length;
    arr.forEach((a,idx)=>_HOT_PCT.set(a, n <= 1 ? 1 : idx/(n-1)));
  });
  return _HOT_PCT;
}
const hotPct = a => hotPctMap().get(a) || 0;

const RN_G = ['g1','g2','g3'];

/* ★v10：不再接收外部 list —— 每个榜从**自己那个 Tab 的池子**取数。
   于是 data-d = 该 Tab、data-i = 该 Tab 内的下标，openDetail 走 D[tab][i]，必然对上。 */
/* ★v27：新增可选参数 fold —— 首页传 {fold:5}（只露 Top 5，其余折叠），
   深链页 `goTab('pcRank')` 不传 ⇒ **全量 12 行、行为与 v26 完全一致**。
   展开状态按「榜名」记在 RB_OPEN 里，切走再回来仍是展开态（不写 localStorage：
   这是纯浏览偏好，关掉重开回到「只看 Top 5」更符合「快速扫一眼」的用途）。 */
const RB_OPEN = {};
function rankBoardsHTML(opt){
  const fold = (opt && opt.fold) || 0;
  const out = RANK_BOARDS.map(b=>{
    const src = D[b.tab] || [];
    const rows = src.filter(b.has).sort(b.sort).slice(0, b.top);
    if(!rows.length) return '';
    const open = !!RB_OPEN[b.nm];
    /* 超出 fold 的行**照常渲染**，只多挂一个 `.rb`（默认 display:none）：
       行数与数据一条不缩水 ⇒ 「48 行」口径、深链页、既有断言全都不受影响。 */
    const body = rows.map((a,k)=>{
      const gi = src.indexOf(a);                 /* 弹窗按该 Tab 的下标取数 */
      const nm = b.name ? b.name(a) : a.title;
      const chip = b.chip ? b.chip(a) : '';
      const hid = (fold && k >= fold) ? ' rb' : '';
      return `<div class="rrow${hid}" data-d="${b.tab}" data-i="${gi}" title="点击查看 ${esc(nm)} 详情">
        <span class="rno ${RN_G[k]||''}">${k+1}</span>
        ${cover(a.cover || a.img, 'rth')}
        <span class="rgname">${titleHTML(nm)}</span>
        ${chip?`<span class="rpill">${esc(chip)}</span>`:''}
        <span class="rval ${b.hm?'hm':''}${b.dim?' dim':''}">${esc(b.txt(a))}${b.unit?`<span class="u">${esc(b.unit)}</span>`:''}</span>
      </div>`;
    }).join('');
    const more = (fold && rows.length > fold)
      ? `<button type="button" class="rbmore" data-rbmore="${esc(b.nm)}" data-rbfold="${fold}" data-rbtotal="${rows.length}">${open ? `收起（只显示 Top ${fold}）` : `展开全部 ${rows.length} 条`}</button>`
      : '';
    return `<div class="rankboard${open?' open':''}" data-rbk="${esc(b.nm)}">
      <div class="rbhead"><span class="rbic">${b.ic}</span><h3>${b.nm}</h3><span class="rbsub">${b.sub}</span></div>
      <div class="rlist">${body}</div>${more}
    </div>`;
  }).join('');
  return out
    ? `<div class="rankboards">${out}</div>`
    : `<div class="empty"><div class="big">🏆</div>榜单暂无可排的数据</div>`;
}

/* ---------------- ★v8 首页（用户需求⑤）：大图轮播 + 三块精选 ----------------
   轮播条目取自真实数据（PC 热游按热度 / PC 新游按上架 / 手游新游按热度），
   **不新造内容**；每条都带 (tab, 下标)，点「查看详情」走同一个弹窗。 */
const HERO_MS = 5000;
let heroIdx = 0, heroTimer = null;

function heroItems(){
  const pick = (tab, n, cmp, ok) => (D[tab]||[])
    .map((a,i)=>({a,i}))
    .filter(x=>!ok || ok(x.a))
    .sort((x,y)=>cmp(x.a,y.a))
    .slice(0,n)
    .map(x=>({tab, a:x.a, i:x.i}));
  const byHot = (a,b)=>Number(b.hot||0)-Number(a.hot||0);
  const byTs  = (a,b)=>String(b.ts||'').localeCompare(String(a.ts||''));
  return [
    ...pick('pcHot', 3, byHot, a=>Number(a.hot)>0).map(x=>({...x, badge:'PC 热游', cls:'hot'})),
    ...pick('pcNew', 3, byTs).map(x=>({...x, badge:'PC 新游', cls:''})),
    ...pick('mNew',  3, byHot, a=>Number(a.hot)>0).map(x=>({...x, badge:'手游新游', cls:'mb'})),
  ];
}
/* 小工具：从游戏记录里取「中文名 / 英文名（括号）」与可展示指标 */
function heroMeta(it){
  const a = it.a;
  const p = nameParts(a.title || a.game || '');
  const stats = [];
  if(it.tab === 'mNew'){
    if(Number(a.score) > 0) stats.push(['评分', fmtScore(a.score), '']);
    if(Number(a.hot) > 0)   stats.push([a.hotLabel || '热度', fmtHot(a.hot), 'up']);
    (a.sources||[]).forEach(s=>stats.push(['来源', s.src, 'dim']));
  }else{
    if(Number(a.scoreV) > 0) stats.push(['评分', Number(a.scoreV).toFixed(1), '']);
    if(Number(a.hot) > 0)    stats.push(['热度', fmtHot(a.hot), 'up']);
    if(a.size)               stats.push(['容量', a.size, 'dim']);
    if(a.genre)              stats.push(['品类', a.genre, 'dim']);
  }
  return {
    title: p.main, en: p.changed ? p.en : '',
    cover: a.cover || a.img || '',
    srcKey: a.srcKey || (a.sources && a.sources[0] && a.sources[0].key) || '',
    srcName: a.src || (a.sources || []).map(s=>s.src).join(' + ') || '',
    tags: (a.tags || []).slice(0,2),
    cat: a.genre || a.cat || '',
    intro: a.intro || '',
    stats,
    url: a.url || '',
  };
}
function renderHome(){
  const items = heroItems();
  const slides = items.map((it,k)=>{
    const m = heroMeta(it);
    const pic = m.cover
      ? `<div class="ph">🎮</div>
         <img decoding="async" referrerpolicy="no-referrer"
              src="${esc(m.cover)}" alt="" onload="reveal(this)" onerror="this.remove()">
         <span class="hsrc ${SRC_CLS[m.srcKey]||''}">${esc(m.srcName||'—')}</span>`
      : `<div class="ph">🎮</div>`;
    const stats = m.stats.map(s=>
      `<div><span class="k">${esc(s[0])}</span><span class="v ${s[2]}">${esc(s[1])}</span></div>`).join('');
    return `<div class="hslide${k===0?' on':''}" data-slide="${k}">
      <div class="hpic">${pic}</div>
      <div class="hinfo">
        <div class="htagrow">
          <span class="hbadge ${it.cls}">${it.badge}</span>
          ${m.cat?`<span class="pill">${esc(m.cat)}</span>`:''}
          ${m.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}
        </div>
        <div class="hname">${esc(m.title)}${m.en?`<span class="en">（${esc(m.en)}）</span>`:''}</div>
        <div class="hstat">${stats}</div>
        ${m.intro?`<div class="hintro">${esc(m.intro)}</div>`:''}
        <div class="hbtns">
          <button type="button" data-hero-d="${it.tab}" data-hero-i="${it.i}">查看详情</button>
          ${m.url?`<a class="sec" href="${esc(m.url)}" target="_blank" rel="noopener">打开原页</a>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  /* ★v9：右侧两张预览小卡 —— 取「下一张 / 下下张」（循环），随主图一起切 */
  const N = items.length;
  const sets = items.map((_,k)=>{
    const card = x=>{
      const mm = heroMeta(x);
      return `<div class="hsitem" data-hero-d="${x.tab}" data-hero-i="${x.i}" title="点击查看 ${esc(mm.title)} 详情">
        <div class="ph">🎮</div>
        ${mm.cover?`<img decoding="async" referrerpolicy="no-referrer" src="${esc(mm.cover)}" alt="" onload="reveal(this)" onerror="this.remove()">`:''}
        <span class="cap"><span class="bd">${x.badge}</span>${esc(mm.title)}</span>
      </div>`;
    };
    return `<div class="hside-set${k===0?' on':''}" data-set="${k}">${
      [items[(k+1)%N], items[(k+2)%N]].map(card).join('')}</div>`;
  }).join('');

  const dots = items.map((_,k)=>`<i class="${k===0?'on':''}" data-hero-dot="${k}"></i>`).join('');
  const hero = N ? `<div class="hero" id="hero">
    <div class="hmain" id="heroSlides">
      ${slides}
      <div class="hctrl">
        <button type="button" data-hero-nav="-1" aria-label="上一张">‹</button>
        <div class="hdots" id="heroDots">${dots}</div>
        <button type="button" data-hero-nav="1" aria-label="下一张">›</button>
      </div>
      <div class="hprog" id="heroProg"></div>
    </div>
    <div class="hside" id="heroSide">${sets}</div>
  </div>` : '';

  const sec = (ic, nm, sub, tab, rows, list, kind) => `<div class="hsec">
    <div class="hsechd"><span class="ic">${ic}</span><h3>${nm}</h3><span class="sub">${sub}</span>
      <button class="more" type="button" data-go="${tab}">查看全部 ›</button></div>
    <div class="hseclist ${kind}">${rows.map(r=>list(r.a, r.i, tab)).join('')}</div>
  </div>`;

  const wrap = (tab, n, cmp, ok) => (D[tab]||[])
    .map((a,i)=>({a,i})).filter(x=>!ok || ok(x.a)).sort((x,y)=>cmp(x.a,y.a)).slice(0,n);
  const byHot = (a,b)=>Number(b.hot||0)-Number(a.hot||0);
  const byTs  = (a,b)=>String(b.ts||'').localeCompare(String(a.ts||''));

  /* ★v10：数量必须与 CSS 的**固定列数**配对，否则又会出现孤行：
     PC 两块各 10 张（5 列 × 2 行）；手游块 6 张（3 列 × 2 行）。 */
  const pcNew  = wrap('pcNew', 10, byTs);
  const pcHot  = wrap('pcHot', 10, byHot, a=>Number(a.hot)>0);
  const mbNew  = wrap('mNew', 6, byHot, a=>Number(a.hot)>0);

  /* ★v26：排行榜从「独立 Tab」下沉到**首页底部**（用户 2026-10-23 口径：
     「排行榜放在首页下（移除排行榜的独立入口）」）。
     · 数据池原样复用 RANK_BOARDS（各榜仍取自己那个 Tab 的池子）⇒ **零重写**，
       所以每行的 `data-d` 天然指向正确的 Tab，点榜行 = 点那个 Tab 的同一条。
     · 分节头复用 `.hsechd`，但**不放「查看全部」** —— 已经没有任何「全部榜」的页面可去了，
       放一个 `data-go` 按钮就是把用户送回一个入口已删除的页面。
     · 4 榜 × Top 12 与原来排行榜页完全一致（侧栏计数口径也是 48），不新增也不缩水。
     · ★v27：首页**默认只露各榜 Top 5**，其余 7 行折叠（「展开全部 12 条」）。
       理由：首页此时已有 26 张精选卡 + 48 行榜，而榜首几条与上方精选本来就是同一批游戏
       ⇒ 全量铺开只是把同样几张卡重复一遍，页面却被拉得很长。
       折叠**不删数据**（DOM 仍 48 行），深链页 `#pcRank` 也仍是全量 12 行。
     · 副标题里保留了「手机热游按源内百分位归一化」这半句 —— 入口删掉后，
       原来 `noticeFor('pcRank')` 那段口径说明在首页已不可见，
       而「手机热游榜为什么不是按原始数值排」恰恰是四个榜里**唯一会被误解**的一条。 */
  const rankSec = `<div class="hsec hrank">
    <div class="hsechd"><span class="ic">🏆</span><h3>排行榜</h3>
      <span class="sub">4 个分榜 · 默认各 Top 5（可展开全部 12）· 手机热游按源内百分位归一化（原始数值照常展示）</span></div>
    ${rankBoardsHTML({fold:5})}
  </div>`;

  return hero
    + sec('🎮','PC 新游 · 精选','最新上架 · Top 10','pcNew', pcNew, (a,i,t)=>cardPC(a,i,false,t), 'pc')
    + sec('🔥','PC 热游 · 精选','按热度 · Top 10','pcHot', pcHot, (a,i,t)=>cardPC(a,i,false,t), 'pc')
    + sec('📱','手游新游 · 精选','按热度（三源合并） · Top 6','mNew', mbNew, (a,i,t)=>cardMNew(a,i,t), 'mb')
    + rankSec;
}
function heroGo(k){
  const slides = document.querySelectorAll('#heroSlides .hslide');
  if(!slides.length) return;
  const n = slides.length;
  heroIdx = ((k % n) + n) % n;
  slides.forEach((el,i)=>el.classList.toggle('on', i === heroIdx));
  /* ★v9：右侧两张预览小卡跟着主图一起切 */
  document.querySelectorAll('#heroSide .hside-set').forEach((el,i)=>el.classList.toggle('on', i === heroIdx));
  document.querySelectorAll('#heroDots i').forEach((el,i)=>el.classList.toggle('on', i === heroIdx));
  syncImgs(document.getElementById('heroSlides'));
  syncImgs(document.getElementById('heroSide'));
}
function stopHero(){ if(heroTimer){ clearInterval(heroTimer); heroTimer = null; } }
function startHero(){
  stopHero();
  const root = document.getElementById('hero');
  if(!root) return;
  heroGo(0);
  const tick = ()=>{ heroTimer = setInterval(()=>heroGo(heroIdx+1), HERO_MS); };
  tick();
  /* 悬停暂停：用户在看某一条时不该被切走 */
  root.addEventListener('mouseenter', stopHero);
  root.addEventListener('mouseleave', ()=>{ stopHero(); tick(); });
}

/* ---------------- 渲染 ---------------- */
/* ===== ★v13 搜索重做（NEXT P0-1）================================================
   原实现：`list.filter(a => JSON.stringify(a).toLowerCase().includes(k))`
     —— 把整条记录序列化后做子串匹配。三个毛病：
     ① 搜 `http` 会命中**每一条**（URL 参与匹配）；
     ② 命中的是哪个字段、为什么命中，用户无从得知；
     ③ 无权重 —— 主名命中和简介命中一视同仁。

   现改为：**显式字段白名单 + 命中字段加权**。
     · 只在这些字段里找（不再把整条记录扔进去）；
     · 字段按「用户搜索意图」从强到弱排在 SEARCH_FIELDS 里，
       命中越靠前的字段得分越高，结果按得分降序（同分保持原有顺序，sort 是稳定的）。
   注意：**不加高亮**（那要动卡片渲染层，风险外溢），本轮只解决「搜得到 / 排序合理」。 */
const SEARCH_FIELDS = [
  ['title', 'game', 'full'],                    /* ① 游戏主名 —— 最强信号 */
  ['en', 'enName', 'alias', 'aliases'],         /* ② 英文名 / 别名 */
  ['publisher', 'author', 'src', 'srcName'],    /* ③ 厂商 / 作者 / 来源 */
  ['genre', 'cat', 'tags'],                     /* ④ 品类 / 标签 */
  ['intro', 'note', 'launchText'],              /* ⑤ 简介 / 备注 —— 最弱 */
];
function searchScore(a, k) {
  for (let i = 0; i < SEARCH_FIELDS.length; i++) {
    for (const f of SEARCH_FIELDS[i]) {
      const v = a[f];
      if (v === undefined || v === null || v === '') continue;
      const arr = Array.isArray(v) ? v : [v];
      for (const x of arr) {
        if (String(x).toLowerCase().includes(k)) return SEARCH_FIELDS.length - i;
      }
    }
  }
  return 0;
}

function render(){
  const main=document.getElementById('main'), cfg=TABS[cur];
  /* ★v11：把当前 Tab 写到 #main 上，作为「按 Tab 自适应卡位比例」的 CSS 锚点
     —— `#main[data-tab="pcNew"]{--th-ar:16 / 9}`，其余 Tab 走 #main 默认的 3/2。
     原有控制流一律不动，本行只新增一个属性。 */
  main.dataset.tab = cur;

  /* ★v15 本机三页走各自的分支（它们不是「快照列表」，各有各的取数方式）。
     早退必须在这里、在拼 head 之前 —— 否则会先渲染出一个对本页无意义的页头。 */
  if(cur==='lib'){       renderLib(main);       return; }
  if(cur==='myGames'){   renderMyGames(main);   return; }
  if(cur==='downloads'){ renderDownloads(main); return; }

  const head=`<div class="crumb"><h2>${cfg.t}</h2>
    <span class="srcbadge real">● 真实数据</span></div>`;

  stopHero();                                   /* ★ 离开首页前先停掉轮播计时器 */
  if(cur==='home'){
    main.innerHTML = head + renderHome() + footNote();
    bindMain(main); syncImgs(main); startHero();
    return;
  }

  const all = D[cur] || [];
  /* ★v13：原来的 `groups` / `list` 两个局部变量已随「筛选+搜索+排序」下沉到
     listSection()，render 这一层不再需要它们（留着就是死代码）。 */

  /* ★v10：排行榜 = 4 个分榜页，**整体绕过「搜索 + 筛选 + 排序栏」**（用户口径：不要搜索/品类筛选）。
     每榜自带池子与排序，所以这里既不过滤也不渲染 filterBar。
     —— 早退必须放在这一步、而不是继续往下走：否则会渲染出一个对本页毫无作用的搜索框。 */
  if(cfg.rankBoard){
    curList = all;                       /* 保留：本页已无 data-d="pcRank" 的行，仅作兜底 */
    main.innerHTML = head + noticeFor(cur) + rankBoardsHTML() + footNote();
    bindMain(main);
    syncImgs(main);
    return;
  }

  const bar = filterBar(cur, all);
  const sec = listSection(cur, all);
  /* ★v13：结果网格外面多包了一层 `#listbox` —— 它没有样式，纯粹是「可单独替换的锚点」，
     供搜索时只换列表、不重建外壳（详见 refreshList 与 bindMain 里的说明）。
     ★v16-A：分页条（sec.pager）放在 #listbox **外面** ——
     翻页要重建的是列表本身与分页条自己的高亮态，而搜索只换 #listbox；
     两者各管各的，互不干扰。 */
  main.innerHTML = head + noticeFor(cur) + bar
                 + `<div id="listbox">${sec.grid}</div>` + (sec.pager || '') + footNote();
  updateCount(sec.n, sec.total);
  /* ★v16-A：翻页回调分两步 —— **先同步 render()**，再视需要异步补货。
     只写 `await pgEnsure(); render();` 的话，翻页会整体退到一个微任务之后，
     用户点「下页」与实际出页之间会有一帧空档（本地内存分页时这一帧纯属白等）。
     同步那一步在「数据已加载」时就是全部工作；只有翻到边界外才会再补一批。 */
  bindPager(main, cur, sec.total, () => {
    render();
    if(LIVE_SRC[cur]) pgEnsure(cur).then(grew => { if(grew && cur) render(); });
  });
  bindMain(main);
  syncImgs(main);      /* ★v6：对「已在缓存里、没派发 load」的图补跑一次自适应 */
}

/* ================= ★v15 本机三页：游戏库 / 我的游戏 / 下载管理 =================
   用户 2026-10-16 口径（四条一起给的）：
     ·「我需要的是全都能够通过 exe 进行直链下载」
     ·「最好增加一个功能，下载管理进行统一管理」
     ·「最好是增加一个我的游戏，可以进行扫盘获取到游戏的启动器，并对应进行匹配，
        如果能够获取到对应的游戏，则提供下载弹窗（修改器，Mod，存档等）」
     ·「其次游戏还是 demo，数量很少并未实时同步」

   这三页的取数方式与前面 9 个 Tab 完全不同（不是快照数组），所以各自独立渲染：
     游戏库    /api/library/browse 分页（全量 21,251 款，实时）—— 解决「数量很少、不实时」
     我的游戏  Electron 主进程扫盘（Steam 库 / 快捷方式 / 常见目录）→ 与游戏库按名匹配
                → 命中即给下载弹窗 —— 解决「扫盘 + 匹配」
     下载管理  统一收口所有下载任务 —— 解决「统一管理」

   ★★ 关键设计：这三页在**浏览器 / 线上 demo** 下必须优雅降级。
      壳能力（window.__SHELL__）与「直链下载」都只在 exe 里有；
      没有时显示**明确空态与原因**，不报错、不留点了没反应的死按钮。 */

/* ---------- 壳桥：一次性探测，之后所有本机能力都从这里走 ---------- */
const SHELL = (typeof window !== 'undefined' && window.__SHELL__

/* ---------- ★v18 管理页入口（独立窗口） ----------
   通道：壳的 `__SHELL_ADMIN__`（preload 暴露，只认动作名 'open'/'focus'/'close'/'toggle'，
   页面拿不到任意 URL）。**只在有壳时显示** —— 与「不许出现点了必然报错的按钮」同一条纪律
   （对照 `olReady()` 三条件：地址填了 + 本次会话测过 + 显式勾选，缺一不渲染）。

   ⚠️ 判据用 `__SHELL_ADMIN__` 而**不是** `SHELL`：`__SHELL_ADMIN__` 是 v18 壳才有的全局，
   v15/v16 的旧壳（以及包内可能残留的旧 main.js）没有它 ⇒ 那种情况下打开会静默失败，
   所以宁可整条不显示。 */
const ADMIN_OPEN = (typeof window !== 'undefined' && typeof window.__SHELL_ADMIN__ === 'function')

(function wireAdminNav(){

})();

/* 窗口按钮是**系统画的**（Electron titleBarOverlay），颜色不跟着 CSS 变量走 ⇒
   主题一变就显式同步一次。用观察器而不是去改 applyTheme()，
   这样主题逻辑保持零侵入，也不需要让 applyTheme 提前引用 SHELL（那会踩 TDZ）。 */
if(SHELL && typeof SHELL.setTitlebar === 'function'){
  const syncTitlebar = () =>
    SHELL.setTitlebar(document.documentElement.getAttribute('data-theme') === 'dark');
  syncTitlebar();
  new MutationObserver(syncTitlebar)
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

const fmtBytes = n => {
  const v = Number(n) || 0;
  if(v >= 1073741824) return (v/1073741824).toFixed(2) + ' GB';
  if(v >= 1048576)    return (v/1048576).toFixed(1) + ' MB';
  if(v >= 1024)       return (v/1024).toFixed(0) + ' KB';
  return v + ' B';
};
const jobPct = j => j.total ? Math.min(100, Math.round(j.got / j.total * 100)) : 0;
function shellSay(m){ if(typeof svcFlash === 'function') svcFlash(m); }

/* ======================= 1) 游戏库（实时全量） ======================= */
const LIB_SORTS  = [['updated','最近更新'],['hot','热度最高'],['score','评分最高'],['size','容量最大'],['title','名称']];
const LIB_SCOPES = [['pc','PC 端游'],['mob','手游可玩'],['all','全部']];

/* ================= ★v17 列表层合并：同一款游戏的跨源条目只出一条 =================
   用户 2026-10-16 口径：「如果多平台的相同游戏则合并成一个即可，取相同内容」。

   ★ 为什么需要：上游 `/api/library/browse` 是**双源混排**的（`xd-*` + `jidi-*`），
     同一款游戏在两源各有一条是常态。实测搜「剑星」返回 3 条：
       `jidi-171085167 剑星` · `xd-14170 剑星/Stellar Blade voices38` · `xd-13480 剑星-虚拟机版/…`
     后两条前者与机地那条是**同款**，后者是**同源变体**（不同的资源包）。

   ★ 归一口径（`libNormName`）：取 `/` 前段（`剑星/Stellar Blade` → 剑星）→ 去空白 →
     去连接性符号 → 小写。归一后同名的**只保留第一条**，其余名字挂成主条上的
     「⊕ 另有 N 条同款」胶囊。
     · 为什么不并同源变体：变体的**名字段本身就不同**（`剑星-虚拟机版` ≠ `剑星`），
       归一后不同组 —— 这与上游 `twin.twinOf` 的 `sameGame` 闸门同向（宁可退回不合并）。
     · ⚠️ 这是**页内合并**：跨页的同款（第 1 页末尾与第 2 页开头）不会并到一起。
       理由见下面 libMergeIndex 的注释。

   ★★ 只动**渲染**，不动 `L.items` —— `curList` 仍按**页内下标**取数（openDetail 靠它），
     把数组压掉了下标就会整体错位，那是「点 A 开 B」的静默错（比不合并危险得多）。 */
function libNormName(s){
  return String(s || '').split('/')[0]
    .replace(/\s+/g, '')
    .replace(/[·・:：\-—_+（）()【】\[\]®™|]/g, '')
    .toLowerCase();
}
/** 扫一遍本页，给出「该跳过哪些下标」与「主条上要标的同款名字」。
 *  ⚠️ 为什么只在本页内合并：跨页去重需要知道**后面所有页**的内容（19,590 条），
 *     那要么把整库拉下来（一次 19,590 条，与本 App 的分页设计相悖），要么让服务端
 *     改 browse 的语义（那是上游项目的事，不在本项目范围内）。页内合并是**诚实的近似**：
 *     它保证「同一屏里不会出现两条一模一样的游戏」，这正是用户看到重复的那一屏。 */
function libMergeIndex(items){
  const seen = new Map(), skip = new Set(), note = new Map();
  (items || []).forEach((x, i) => {
    const k = libNormName(x && (x.title || x.game));
    if (!k) return;
    if (seen.has(k)){
      skip.add(i);
      const at = seen.get(k);
      const arr = note.get(at) || [];
      const nm = String(x.title || '').split('/')[0].trim();
      arr.push(nm || x.source || '另一条');
      note.set(at, arr);
    } else {
      seen.set(k, i);
    }
  });
  return { skip: skip, note: note };
}

function renderLib(main){
  const L = LOCAL.lib;
  if(!main) main = document.getElementById('main');
  curList = L.items;                    /* = 服务端返回的**当前页**（openDetail 按页内下标取数） */
  const segS = LIB_SCOPES.map(([k,n])=>`<button type="button" data-lscope="${k}" class="${L.scope===k?'on':''}">${n}</button>`).join('');
  const segO = LIB_SORTS.map(([k,n])=>`<button type="button" data-lsort="${k}" class="${L.sort===k?'on':''}">${n}</button>`).join('');
  /* ★v16-A：页头**不再报数字**（① 口径）。原来这里是「共 19,590 款 · 已载 300」——
     两个数并列本身就自相矛盾，而且跟顶栏、侧栏各说各话。
     现在条数只在**底部分页条**出现一次，且只描述这张列表。 */
  const sub = L.loading ? '读取中…' : '';
  /* ★v17：渲染前先做**页内跨源合并**（同一款游戏只出一条）。
     ⚠️ 下标必须用**原数组下标** —— cardPC 的 i 会被写进卡片的 data-i，openDetail 靠它取数。 */
  const MG = libMergeIndex(L.items);
  const cards = [];
  L.items.forEach((a, i) => {
    if (MG.skip.has(i)) return;
    cards.push(cardPC(a, i, false, 'lib', MG.note.get(i)));
  });
  const body = cards.length
    ? `<div class="grid pc">${cards.join('')}</div>`
    : `<div class="empty"><div class="big">🗂️</div>${L.loading ? '正在读取实时库…' : (HAS_SHELL || DL_BASE ? '没有结果' : '未连接到本机资源服务')}
        <br><span style="font-size:12px">${HAS_SHELL || DL_BASE ? '试试换个关键词或排序' : '游戏库是实时数据，需要本机服务（打包后的 exe 自带）'}</span></div>`;

  main.innerHTML =
    phHead('游戏库', '● 实时', sub, `<div class="seg">${segS}</div><div class="seg">${segO}</div>`) +
    `<div class="pbar"><span class="pic">🔍</span><input id="libq" class="pin" placeholder="搜索游戏名 / 别名 / 厂商…" value="${esc(L.q)}"></div>` +
    `<div id="listbox">${body}</div>` +
    (L.loaded ? pagerHTML('lib', L.total, '款') : '') +
    footNote();
  bindLib(main);
  syncImgs(main);
  if(!L.items.length && !L.loading && !L.loaded) libLoad(1);
}

function bindLib(main){
  /* ★v16-A：切范围 / 换排序 / 改搜索词 —— 三件事都必须**回第 1 页并重新取数**。
     原来的「清空 items 再 renderLib」在服务端分页下不够：还要把页码复位，
     否则下一次 libLoad 会拿旧页码算 offset，取回一片空白。 */
  main.querySelectorAll('[data-lscope]').forEach(b => b.addEventListener('click', () => {
    LOCAL.lib.scope = b.dataset.lscope; LOCAL.lib.items = []; LOCAL.lib.loaded = false;
    pgReset('lib'); renderLib(main);
  }));
  main.querySelectorAll('[data-lsort]').forEach(b => b.addEventListener('click', () => {
    LOCAL.lib.sort = b.dataset.lsort; LOCAL.lib.items = []; LOCAL.lib.loaded = false;
    pgReset('lib'); renderLib(main);
  }));
  const q = document.getElementById('libq');
  if(q){
    let tm = null;
    q.addEventListener('input', e => {
      LOCAL.lib.q = e.target.value;
      clearTimeout(tm);
      tm = setTimeout(() => {
        LOCAL.lib.items = []; LOCAL.lib.loaded = false; curList = [];
        pgReset('lib'); renderLib(main);
      }, 280);
    });
  }
  /* ★v16-A：原「加载更多」按钮已随分页条下线（加载更多与页码跳转是两套互斥的心智模型，
     同时存在会让用户不知道该点哪个）。 */
  bindPager(main, 'lib', LOCAL.lib.total, () => libLoad(pgOf('lib').page));
}

/** 取「第 page 页」。★v16-A 起是**服务端分页**：limit/offset 都由页码算出来。
 *  上游 `limit` 上限是 100（实测传 300/500 都只回 100），而页长选项最大就是 100 ⇒ 不会超。 */
async function libLoad(page){
  const L = LOCAL.lib;
  if(L.loading) return;
  const p = pgOf('lib');
  if(page) p.page = Math.max(1, page | 0);
  const size = p.size;
  const off = (p.page - 1) * size;
  L.loading = true;
  const main = document.getElementById('main');
  const base = (typeof dlBoot === 'function') ? await dlBoot().catch(() => null) : null;
  if(!base){
    L.loading = false; L.loaded = true; D.libTotal = 0;
    refreshCounts();
    if(cur === 'lib') renderLib(main);
    return;
  }
  const path = L.q
    ? `/api/library?q=${encodeURIComponent(L.q)}&limit=${size}&offset=${off}`
    : `/api/library/browse?scope=${L.scope}&sort=${L.sort}&limit=${size}&offset=${off}`;
  let j = null;
  try{ const r = await fetch(base + path, { cache:'no-store' }); if(r.ok) j = await r.json(); }catch(e){ /* 保持原样 */ }
  L.loading = false; L.loaded = true;
  if(j && j.ok){
    L.items = (j.items || []).map(livePC);
    /* ★ 搜索与浏览的「总量」不是同一个字段（实测）：
         browse → `total` 就是当前 scope 的库总量；
         /api/library?q= → `total` 仍是**整库**量（19,590），命中数在 `count`。
       用错字段会让「共 N 条」在搜索时显示成 19,590 —— 用户会以为搜索没生效。 */
    L.total = L.q ? (Number(j.count) || 0) : (Number(j.total) || L.items.length);
    if(!L.q) D.libTotal = Number(j.total) || L.items.length;
  }else{
    L.items = []; L.total = 0;
  }
  refreshCounts();
  if(cur === 'lib') renderLib(main);
}

/* ======================= 2) 我的游戏（扫盘 + 匹配） ======================= */
/* ★v16-D：行模板抽成**纯函数**（只吃数据、吐字符串）。两个理由：
   ① `renderMyGames` 里现在有三段条件（是否匹配 / 关联依据 / 按钮组），塞在一行里读不动；
   ② **可测**：`HAS_SHELL` 是 `const`，jsdom 里渲染不出带壳的行 ——
      抽出来就能直接对「已匹配行 / 未匹配行」两种模板做断言，
      不必为了测试去把 HAS_SHELL 改成变量（那就是在给测试让路，不是让实现更好）。
   `gi` = **LOCAL.games 里的稳定下标**（不是页内下标）：页内下标会随分页 /
   showAll 切换而变，绑事件那一刻与点下去那一刻可能不是同一条。 */
function mgRowHTML(x, idx, gi){
  const matched = !!x.hit;
  const nm = x.hit ? (x.hit.title || x.name) : x.name;
  const cover = x.hit && x.hit.cover ? `<img src="${esc(x.hit.cover)}" alt="" referrerpolicy="no-referrer" onload="reveal(this)" onerror="this.remove()">` : '';
  const via = VIA_TXT[x.via] || '';
  const viaCls = x.via === 'appid' ? ' sid' : (x.via === 'manual' ? ' man' : '');
  return `<div class="mgrow${matched ? ' ok' : ''}"${matched ? ` data-d="myGames" data-i="${idx}"` : ''}>
        <div class="mthumb"><div class="ph">${matched ? '🎮' : '📄'}</div>${cover}</div>
        <div class="mbd">
          <div class="mtt">${esc(nm)}</div>
          <div class="mmt">
            <span class="msrc">${esc(x.source || '本机')}</span>
            ${x.steamId ? `<span title="Steam AppID（最硬的关联键）">Steam ${esc(x.steamId)}</span>` : ''}
            ${via ? `<span class="mvia${viaCls}" title="与库记录的关联依据">${via}</span>` : ''}
            ${x.exe ? `<span title="${esc(x.exe)}">${esc(String(x.exe).split(/[\\/]/).pop())}</span>` : ''}
            ${x.dir ? `<span title="${esc(x.dir)}">${esc(String(x.dir).replace(/\\[^\\]*$/, ''))}</span>` : ''}
          </div>
        </div>
        <div class="mact">${matched
          ? `<button type="button" class="pbtn primary sm" data-d="${'myGames'}" data-i="${idx}">资源与下载</button>
             <button type="button" class="pbtn sm mglink" data-mgunlink="${gi}" title="解除关联（不会删除游戏本身）">解除</button>`
          : `<span class="pmiss">未匹配到资源</span>
             <button type="button" class="pbtn sm" data-mglink="${gi}" title="到全量库里挑一款与它关联">关联到库…</button>`}</div>
      </div>`;
}

function renderMyGames(main){
  if(!main) main = document.getElementById('main');
  const G = LOCAL.games || [];
  const hits = G.filter(x => x.hit);
  /* ★v15 关键口径：扫盘会连带捞到一堆**非游戏的快捷方式**（实测 113 条候选里
     112 条来自桌面/开始菜单：7-Zip、飞书、格式播放器…）。靠文件名黑名单**永远列不全**
     （还能叫「次元鲨·适配工作台」这种）。
     ⇒ 默认只显示「**匹配到资源**」的 —— 匹配到即意味着上游全量库里有同名条目，
       等于用「库里有没有这个游戏」反向确认了它是不是游戏。
        其余候选收在「显示全部候选」开关后面，需要时再展开，一个都不丢。 */
  const showAll = !!LOCAL.showAll;
  const list = showAll ? G : hits;

  /* ★v16-A：分页。`curList` 必须是**当前页里命中项**的顺序 ——
     行上的 data-i 是「页内第几个命中」，弹窗按 curList[idx] 取数。 */
  const totalN = list.length;
  const pageList = pgSlice(list, 'myGames');
  const pageHits = pageList.filter(x => x.hit).map(x => x.hit);
  D.myGames = pageHits;
  curList = pageHits;

  let right = '';
  if(HAS_SHELL){
    const canScan = LOCAL.scanned && G.length > hits.length;
    right = `<button type="button" class="pbtn primary" id="mgscan">${LOCAL.scanning ? '扫描中…' : (LOCAL.scanned ? '重新扫描' : '开始扫描')}</button>`
          + `<button type="button" class="pbtn sm" id="mgadd" title="不扫盘，直接从全量库挑一款加进来">＋ 手动加入</button>`
          + (canScan ? `<button type="button" class="pbtn sm" id="mgtoggle">${showAll ? '只看已匹配' : '显示全部候选'}</button>` : '');
  }

  /* ★v16-A：页头**不报数字**（① 口径）。原来写「候选 67 条 · 匹配到资源 6 款」，
     与本轮「不显示数量」的口径冲突；状态改为纯文字，条数只由底部分页条给一次。 */
  const sub = LOCAL.scanned
    ? (G.length ? (showAll ? '已显示全部候选' : '只显示匹配到资源的') : '没有找到已安装的游戏')
    : (LOCAL.scanning ? '正在扫描本机…' : '尚未扫描');

  let body;
  if(!HAS_SHELL){
    body = `<div class="empty"><div class="big">💻</div>扫盘需要桌面版
      <br><span style="font-size:12px">「我的游戏」通过本机文件系统查找已安装的游戏，网页版没有这个权限。<br>打包后的 exe 里可用。</span></div>`;
  }else if(!LOCAL.scanned){
    body = `<div class="empty"><div class="big">💻</div>点右上角「开始扫描」
      <br><span style="font-size:12px">会查找：Steam 库（libraryfolders.vdf）· 桌面与开始菜单快捷方式 · 常见游戏目录<br>只读，不修改任何文件；结果只留在本机。</span></div>`;
  }else if(!G.length){
    body = `<div class="empty"><div class="big">🔍</div>没有找到已安装的游戏
      <br><span style="font-size:12px">${esc(LOCAL.note || '检查过的位置都没命中，可以到「游戏库」直接浏览全量。')}</span></div>`;
  }else if(!list.length){
    body = `<div class="empty"><div class="big">🔍</div>扫到的候选里，没有一款匹配到资源
      <br><span style="font-size:12px">点右上角「显示全部候选」可以看到它们（多半是工具类快捷方式）。<br>也可以到「游戏库」直接浏览全量 PC 端游。</span></div>`;
  }else{
    let hi = -1;
    body = `<div class="mglist">` + pageList.map(x => {
      const matched = !!x.hit;
      const idx = matched ? (++hi) : -1;
      /* ★v16-D：关联按钮用**LOCAL.games 里的稳定下标**（不是页内下标）——
         页内下标会随分页 / showAll 切换而变，绑事件那一刻与点下去那一刻可能不是同一条。 */
      return mgRowHTML(x, idx, G.indexOf(x));
    }).join('') + `</div>`;
  }

  main.innerHTML = phHead('我的游戏', LOCAL.scanned ? '● 已扫描' : '', sub, right) + body
    + (LOCAL.scanned && totalN ? pagerHTML('myGames', totalN, '条') : '') + footNote();
  const b = document.getElementById('mgscan');
  if(b) b.addEventListener('click', () => scanMyGames());
  const ad = document.getElementById('mgadd');
  if(ad) ad.addEventListener('click', () => addGameStart());
  /* ★v16-D：关联 / 解除关联。两者都必须 stopPropagation ——
     匹配行本身带 data-d 会被 document 级委托接住当「打开详情」，
     不挡住的话点「解除」会顺带弹出下载弹窗。 */
  main.querySelectorAll('[data-mglink]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation(); e.preventDefault();
    linkStart(Number(el.dataset.mglink));
  }));
  main.querySelectorAll('[data-mgunlink]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation(); e.preventDefault();
    const g = G[Number(el.dataset.mgunlink)];
    if(!g) return;
    linkDel(g);
    delete g.hit; delete g.via;
    /* 解除后若开着「只看已匹配」，这条会从列表消失 —— 这是对的（它确实不再匹配）。
       通知一声，免得用户以为游戏被删了。 */
    renderMyGames(document.getElementById('main'));
    shellSay('已解除关联');
  }));
  const tg = document.getElementById('mgtoggle');
  if(tg) tg.addEventListener('click', () => {
    LOCAL.showAll = !LOCAL.showAll;
