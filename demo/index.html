/* ================= ★v14 下载与资源（本体 / Mod / 修改器 / 存档）=================
   用户口径：「APP 内容为什么只有那么点，其次现在点击游戏并没有我要的下载弹窗
   （游戏工作台的本体/mod/修改器/存档）」。

   ★ 这一块**不是 demo 自己造的**，是把上游工作台（game-aggregator）那套
     「统一下载弹窗」接到了情报站的详情卡上。四个模块的取数与上游**同一个口径**：

       本体    GET /api/download?url=<源站详情页>
                 · 机地 topic → 走话题资源接口，回 sections（本体/Mod/修改器 三专区条数）
                 · XD  → 跟随 /plus/download.php 的 302 拿真实网盘地址（部分游戏要登录）
       Mod     GET /api/mods/match?t=<游戏名>&kind=mod&limit=200
       修改器  GET /api/mods/match?kind=modifier   +   GET /api/trainers/match
                 ⚠️ 后者（GCM / GTrainers 清单）**只有元数据、没有下载地址**，
                    必须与前者视觉分开，否则用户会把来源名当成下载按钮。
       存档    GET /api/saves-yx/match（游侠存档区，**可下载的存档包**）
             + GET /api/saves/match   （Ludusavi 路径库，回答的是「放哪」不是「下什么」）

   ★★ 可用性是**探测出来的，不是假定的**：
     纯静态部署（线上 demo / GitHub Pages）没有本机服务，
     `dlBoot()` 探不到 ⇒ 整个区块 from DOM 移除，不留下点不动的死按钮。
     被本机服务托管时（打包后的 exe）走同源，file:// 直开时回落 127.0.0.1:8123。
*/
const DL_TABS = [
  {k:'body',    nm:'本体',   ic:'📦'},
  {k:'mod',     nm:'Mod',    ic:'🧩'},
  {k:'modifier',nm:'修改器', ic:'🛠'},
  {k:'save',    nm:'存档',   ic:'💾'},
];
/* 一屏先铺几条；剩下的折起来 —— 赛博朋克2077 单是 Mod 就 719 条，全铺会拖垮弹窗 */
const DL_CAP = 8;
/* 只有这两种形态能被 /api/download 解析（与上游 parseDetailUrl 同一口径）：
     机地 /topic/detail/<数字>    ·    XD /game/<数字>.html
   ⚠️ 机地的 /post/detail/<数字> **不在白名单里** —— 传进去服务端直接回 400。
   ★v17 修正：XD 侧必须同时认 **xdgame.com 与 xdgamer.com**。实测两个域**并存**：
        · 本地快照 `data.js` 里 350 处全是 `https://www.xdgame.com/game/…`；
        · 本机实时库 `/api/library/browse` 返回的全是 `https://www.xdgamer.com/game/…`（**带 r**）。
      原正则只认前者 ⇒ 从「游戏库 / 全局搜索」打开的详情**一律取不到源站详情页**，
      下载块会给出「这一条没有源站详情页」，本轮新增的详情补水也会整块不出现。
      上游 `parseDetailUrl` 三个域（jidiyouxi / xdgamer / xdgame）都认，这里与它对齐。 */
const DL_URL_RE = /^https?:\/\/(?:www\.)?(?:jidiyouxi\.com\/topic\/detail\/\d+|xdgame(?:r)?\.com\/game\/\d+\.html)/;

let DL_BASE = null;   /* null=还没探 | '' = 探过但不可用 | 其它 = 服务根 */
let DL_BOOT = null;   /* 探测 Promise（只探一次） */
let dlSt = null;      /* 当前弹窗的下载会话；关弹窗/换游戏一律作废 */

function dlBoot(){
  if(DL_BOOT) return DL_BOOT;
  DL_BOOT = (async () => {
    if (typeof fetch !== 'function') { DL_BASE = ''; return ''; }   /* jsdom 等无 fetch 环境 */
    const cands = [];
    if (/^https?:$/.test(location.protocol)) cands.push(location.origin);   /* 同源：最稳 */
    /* ★v18：**先问壳要它真实的监听端口**。
       壳的上游端口不是常量 —— `server.js` 的 `listen(port, triesLeft)` 在端口被占时**会自动 +1**，
       `GAMEHUB_PORT` 也可被外部改掉。而情报站是从**包内 file://** 直开的，
       若只认死 8123，就会去敲**另一个人的实例**（或干脆敲不通），自己壳里那个上游反倒没人读。
       ⇒ 壳自述的 `listenPort` 排在最前；取不到（浏览器 / 旧壳没有这个字段）就原样退回老候选，
         所以**这条改动对无壳环境零影响**。 */
    if (SHELL && typeof SHELL.describe === 'function') {
      try {
        const d = await SHELL.describe();
        const lp = d && Number(d.listenPort);
        if (lp > 0) cands.push('http://127.0.0.1:' + lp);
      } catch (_) { /* 自述失败 ⇒ 退回下面的默认候选，不影响任何既有路径 */ }
    }
    cands.push('http://127.0.0.1:8123');                                    /* file:// 直开的兜底 */
    for (const b of cands) {
      try {
        const ctl = typeof AbortController === 'function' ? new AbortController() : null;
        const tm = ctl ? setTimeout(() => ctl.abort(), 2500) : null;
        const r = await fetch(b + '/api/health', { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
        if (tm) clearTimeout(tm);
        if (!r.ok) continue;
        const j = await r.json().catch(() => null);
        if (j && j.ok) { DL_BASE = b; return b; }
      } catch (_) { /* 换下一个候选 */ }
    }
    DL_BASE = '';
    return '';
  })();
  return DL_BOOT;
}

async function dlJson(path, ms){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 30000);
  try {
    const r = await fetch(dlSt.base + path, { cache: 'no-store', signal: ctl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}

/** 从一条卡片记录里挖出「能喂给 /api/download 的源站详情页」与「用于匹配的游戏名」。
 *  ★ 游戏名取 `/` 前段：pcNew 的 title 是「007 初露锋芒/007 First Light」，
 *    整串拿去匹配是匹配不到的（上游库里的键是中文名）。 */
function dlCtxOf(a){
  const cands = [a.jidiUrl, a.url, a.alt, a.postUrl, a.libUrl];
  let url = '';
  for (const u of cands) {
    if (typeof u === 'string' && DL_URL_RE.test(u)) { url = u; break; }
  }
  const nm = String(a.game || a.title || '').split('/')[0].trim();
  /* ★v21：上游的**真实索引键**是 `L:<libId>`（实测：`L:xd-191` → mod 717 条 / 5ms）。
     列表记录里这个 id 叫 `resId`，匹配结果里叫 `libId` ⇒ 两种都认。
     ★ 为什么必须改用键：按名匹配会**缺**（实测 trainers：按名 3 条、按键 22 条），
       而「工作台网页有资源、客户端没有」的主因就是这个 —— 两边取数方式不同。
     拿不到键就留空，下游自动回落按名匹配 —— **两条路都保留**。 */
  const rid = String((a && (a.resId || a.libId)) || '').trim();
  return { name: nm, url: url, key: rid ? ('L:' + rid) : '' };
}

/** 把占位块换成真内容；探不到服务就把整块摘掉 */
async function dlHydrate(tab, a){
  const box = document.getElementById('dlBlock');
  if (!box) return;
  const base = await dlBoot();
  if (!base) { box.remove(); return; }
  const ctx = dlCtxOf(a);
  if (!ctx.name && !ctx.url) { box.remove(); return; }
  dlSt = { base: base, ctx: ctx, tab: 'body', cnt: {}, data: {}, busy: {}, exp: {} };
  dlPaint();
  /* 三个便宜的（本地索引，毫秒级）先并行发出去，页签上的数字尽早填上；
     最贵的 /api/download（跟随 302，实测 3~8 秒）只等当前页签。 */
  dlLoad(dlSt.tab);
  if (ctx.name) { dlLoad('mod'); dlLoad('modifier'); dlLoad('save'); }
}

/* ================= ★v17 详情页补水（对齐工作台 /api/detail/merged） =================
   动机：demo 的详情弹窗此前是**纯静态**的 —— 只有本地快照里的字段（评分 / 热度 / 标签），
     没有截图、没有介绍全文、没有配置要求。工作台详情抽屉这些都有，用户 2026-10-16 口径：
     「点击后详情页也优化下；同步工作台的详情页内容，不需要手机模拟器配置这些。」

   做法：沿用 dlBoot() 的**探测式**契约 —— 探到本机服务就补水，探不到就整块摘掉
     （纯静态部署的线上 demo 不会多出死块，与 #dlBlock 同一策略）。

   ★ 一把拿全：/api/detail/merged 已经**在服务端做了双源合并**（截图按 fetchers/shots.js 的
     idOf 去重相加；介绍 / 版本一边有就用那边，**不做拼接**），并在 `merge` 块里给了溯源
     （`on` / `twin` / `sources` / `shotsAdded` / `filled`）⇒ 前端**不自己判**哪些是补来的，
     只按 merge 显示徽标。理由见上游那份实现的注释：去重口径必须与 fetchers/shots.js 同处一地，
     抄一份进浏览器必然漂移 —— 而代价是「同一张截图出现两次」，肉眼极难发现。

   ★★ 唯一**不做**的一块：「手机模拟器配置」（工作台 #bhSlot / bannerhub 机型清单）。
     用户明确说「不需要手机模拟器配置这些」⇒ 本次同步**整块略过**，不是「暂时没做」。

   ★ 会话序号 DD_SEQ：异步回包可能晚于「用户已关窗 / 已换另一款游戏」。不校验就会把 A 的
     截图写进 B 的详情页（上游 dFullStore 串台那类坑：界面完全正常、零报错，最难发现）。
     两道闸门：① `seq !== DD_SEQ` 直接丢弃；② ddSet 里再验 `document.body.contains(el)`。
*/
let DD_SEQ = 0;
let DD_REL = [];        /* 「同分类更多」当前这批（点了要能不依赖坐标地开详情） */
/* 补水占位块的 id 清单 —— ddHydrate 探不到服务时用它把整组**一次摘干净**。
   ⚠️ 必须与 openDetailRec 里那五个 `<div id="dd…">` 一一对应（少一个就会留个空壳）。 */
const DD_SLOTS = ['ddDesc','ddGal','ddReq','ddRel','ddTwin'];

/** 源站详情页 URL —— 专供 /api/detail/merged（必须是上游 parseDetailUrl 认的那种）。
 *  ★ 与 dlCtxOf() 的分工：那个把 postUrl / libUrl 也算候选（下 MOD 帖、开游戏页），
 *    这个**只认详情页两种形态** —— 传别的进去服务端直接回 400。 */
function ddUrlOf(a){
  const cands = [a.url, a.alt, a.jidiUrl];
  for (const u of cands){
    if (typeof u === 'string' && DL_URL_RE.test(u)) return u;
  }
  return '';
}

/* 配置要求的字段序与标签**对齐上游 public/index.html 的 REQ_ORDER / REQ_LABEL**：
     {os:系统, cpu:CPU, ram:内存, gpu:显卡, dx:DirectX, net:网络, storage:存储, note:附注}
   「同一语义只留一份实现」是项目铁律，但前端拿不到那个模块 —— 只能对齐口径并在源头标注出处。 */
const DD_REQ_LABEL = {os:'系统', cpu:'CPU', ram:'内存', gpu:'显卡', dx:'DirectX', net:'网络', storage:'存储', note:'附注'};
const DD_REQ_ORDER = ['os','cpu','ram','gpu','dx','net','storage','note'];
function ddReqCol(title, req, cls){
  const rows = DD_REQ_ORDER.filter(k => req && req[k])
    .map(k => `<div class="rr"><i>${esc(DD_REQ_LABEL[k] || k)}</i><span>${esc(String(req[k]))}</span></div>`).join('');
  if (!rows) return '';
  return `<div class="rc ${cls || ''}"><div class="rc-h">${esc(title)}</div>${rows}</div>`;
}

/** 独立的 JSON 取件器。
 *  ★ 为什么不用 dlJson()：那个读的是全局 `dlSt.base`，而 dlSt 是**下载会话**——
 *    详情补水与下载块是两个独立会话，共用一个全局会把彼此的 base 覆盖掉。 */
async function ddJson(base, path, ms){
  if (typeof fetch !== 'function') return null;
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const t = ctl ? setTimeout(() => ctl.abort(), ms || 20000) : null;
  try {
    const r = await fetch(base + path, { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
    if (!r.ok) return null;
    return await r.json();
  } catch (_) { return null; }
  finally { if (t) clearTimeout(t); }
}

/** 写一个占位块；html 为空 ⇒ 把**整个块**从 DOM 摘掉（不留空壳、不留死按钮）。 */
function ddSet(id, html){
  const el = document.getElementById(id);
  if (!el || !document.body.contains(el)) return;
  if (!html) { el.remove(); return; }
  el.innerHTML = html;
}

const DD_SRC_NM = {jidi:'机地', xdgamer:'XDGAME', xdgame:'XDGAME'};

/** 详情页补水主流程。`seq` 由 openDetailRec 递增后传入。 */
async function ddHydrate(a, seq){
  const base = await dlBoot();
  if (seq !== DD_SEQ) return;
  const url = ddUrlOf(a);
  if (!base || !url){
    /* 探不到本机服务（线上静态部署）或这条记录没有源站详情页 ⇒ 把整组占位**摘掉**，
       不留一排空 div（与 #dlBlock 同一契约：静态部署零副作用）。 */
    DD_SLOTS.forEach(id => ddSet(id, ''));
    return;
  }

  const j = await ddJson(base, '/api/detail/merged?url=' + encodeURIComponent(url), 20000);
  if (seq !== DD_SEQ) return;              /* 用户已换游戏 / 关窗 */
  if (!j || !j.ok || !j.detail) return;
  const det = j.detail, mg = j.merge || null;
  const tag = (s) => s ? `<span class="dfrom">来自${esc(DD_SRC_NM[s] || s)}</span>` : '';

  /* ① 游戏介绍 / 版本介绍。机地页面从来没有「版本介绍」、XD 页面没有源站配置要求 ——
        这两处互补由**服务端**补齐（并回填 descFrom / versionFrom 供这里标注来源口径）。 */
  const desc = det.desc || det.description || '';
  const ver  = det.version || '';
  ddSet('ddDesc',
    (desc ? `<div class="dblock"><h4><span class="ic"></span>游戏介绍${tag(det.descFrom)}</h4><p>${esc(desc)}</p></div>` : '') +
    (ver  ? `<div class="dblock"><h4><span class="ic"></span>版本介绍${tag(det.versionFrom)}</h4><p>${esc(ver)}</p></div>` : ''));

  /* ② 游戏预览画廊。截图已在服务端按 idOf 去重相加 ⇒ 这里**不做任何 URL 改写**
        （尺寸规则只存在于上游 fetchers/shots.js）。并入的张数如实标注 ——
        那是「双源合并」唯一可见的凭证，不标用户只会觉得「图怎么变多了」。 */
  const shots = (det.shots || []).map(s => (typeof s === 'string' ? {t:s, f:s} : s)).filter(s => s && s.t && s.f);
  const addN = (mg && mg.shotsAdded > 0 && mg.twin) ? mg.shotsAdded : 0;
  ddSet('ddGal', shots.length ? `<div class="dblock" data-gal data-i="0">
    <h4><span class="ic"></span>游戏预览${addN ? `<span class="dfrom">含${esc(DD_SRC_NM[mg.twin.source] || '另一源')} ${addN} 张</span>` : ''}<span class="cnt">${shots.length} 张</span></h4>
    <div class="dgal-vp">
      <div class="dgal-trk">${shots.map((s, i) => `<div class="dgal-sld"><img src="${esc(s.f)}" alt="游戏截图 ${i + 1}" loading="${i ? 'lazy' : 'eager'}" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none'"></div>`).join('')}</div>
      <button type="button" class="dgal-nav prev" data-gal-step="-1" aria-label="上一张截图" disabled>❮</button>
      <button type="button" class="dgal-nav next" data-gal-step="1" aria-label="下一张截图">❯</button>
      <div class="dgal-num" aria-live="polite">1 / ${shots.length}</div>
    </div>
    <div class="dgal-thumbs">${shots.map((s, i) => `<button type="button" class="dgal-th${i ? '' : ' on'}" data-gal-go="${i}" aria-label="查看第 ${i + 1} 张截图"><img src="${esc(s.t)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'"></button>`).join('')}</div>
  </div>` : '');

  /* ③ 配置要求。源站有就先用源站的（机地独有 game_sys_reqs），再并行补「推荐配置」一栏；
        源站没有就把整块交给 /api/pcreq。★ 两套口径**不逐字段混搭** —— 混进一张表，用户
        没法判断哪一行可信（上游 v10.25 明确否掉过字段级合并，这里沿用同一决定）。 */
  if (det.requirements && Object.keys(det.requirements).length){
    ddSet('ddReq', `<div class="dblock"><h4><span class="ic"></span>配置要求<span class="cnt">源站提供</span></h4>
      <div class="dreq" id="ddReqBox">${ddReqCol('最低配置', det.requirements)}</div>
      <div class="dhint" id="ddReqHint">来自源站详情页的<b>最低配置</b>要求，供参考；实际体验受画质设置与驱动影响。</div></div>`);
  } else {
    ddSet('ddReq', `<div class="dblock"><h4><span class="ic"></span>配置要求<span class="cnt">查询中…</span></h4>
      <div class="dhint" id="ddReqHint">源站详情页未提供配置要求，正在从 Steam 官方接口查询…</div></div>`);
  }
  ddReqFill(base, a, det, seq);

  /* ④ 另一源收录（合并的凭证）。merge.twin 来自服务端**已过 sameGame 闸门**的孪生条目，
        前端不再自己判 —— 否则就是「同一语义两份实现」那类漂移。 */
  if (mg && mg.on && mg.twin && mg.twin.url){
    const tw = mg.twin, nm2 = DD_SRC_NM[tw.source] || '另一源';
    ddSet('ddTwin', `<div class="dblock"><h4><span class="ic"></span>另一源收录<span class="cnt">已合并</span></h4>
      <div class="dtwin"><div class="bd">
        <div class="tt">${esc(tw.title || '')}</div>
        <div class="mm">${esc(nm2)} 也收录了这款游戏；上方的截图${addN ? `（已并入 ${addN} 张）` : ''}与介绍已按去重口径合并为一份。</div>
        <a href="${esc(tw.url)}" target="_blank" rel="noopener">打开${esc(nm2)}详情页</a>
      </div></div></div>`);
  } else { ddSet('ddTwin', ''); }

  /* ⑤ 同分类更多（独立请求；失败静默，不留空块） */
  ddRelated(base, a, det, seq);
}

/** 配置要求：补「推荐配置」一栏（源站给了最低配置时），或整个由 /api/pcreq 提供（源站没有时）。 */
async function ddReqFill(base, a, det, seq){
  const nm = String(a.game || a.title || det.title || '').split('/')[0].trim();
  if (!nm && !a.cover) return;
  /* ★ cover 要挑**带 Steam appid 的那张**：源站详情页封面常是自家 /uploads/ 形态，
     里面没有 appid，直接拿去问必然命中不到；本地库封面才是 Steam CDN 形态（97.2% 命中）。 */
  const covs = [a.cover, a.img, det.cover].filter(Boolean);
  const cov = covs.find(u => /\/steam\/apps\/\d+\//.test(String(u))) || covs[0] || '';
  const qs = '?t=' + encodeURIComponent(nm) + (a.id ? '&id=' + encodeURIComponent(a.id) : '')
           + (cov ? '&cover=' + encodeURIComponent(cov) : '');
  const r = await ddJson(base, '/api/pcreq' + qs, 20000);
  if (seq !== DD_SEQ) return;
  const root = document.getElementById('ddReq');
  if (!root || !document.body.contains(root)) return;
  const box = document.getElementById('ddReqBox');
  const hint = document.getElementById('ddReqHint');
  const cnt = root.querySelector('.cnt');
  if (r && r.hit){
    if (box){
      box.insertAdjacentHTML('beforeend', ddReqCol('推荐配置', r.rec, 'rec'));
      if (cnt) cnt.textContent = '源站 + Steam 官方';
      if (hint) hint.insertAdjacentHTML('afterbegin', `<span class="dfrom" style="margin:0 6px 0 0">推荐配置来自 Steam 官方</span> `);
    } else {
      const label = r.src === 'jidi' ? '机地' : 'Steam 官方';
      root.querySelector('.dblock').innerHTML =
        `<h4><span class="ic"></span>配置要求<span class="cnt">${esc(label)}</span></h4>
         <div class="dreq">${ddReqCol('最低配置', r.min)}${ddReqCol('推荐配置', r.rec, 'rec')}</div>
         <div class="dhint">数据来自 <b>${esc(label)}</b>${r.name ? '（' + esc(String(r.name)) + '）' : ''}，为 <b>PC(Windows)</b> 端配置。</div>`;
    }
    return;
  }
  /* 两边都没有 ⇒ 只有「源站没给配置」的那种空块需要换文案（源站那一栏照留） */
  if (!box){
    ddSet('ddReq', `<div class="dblock"><h4><span class="ic"></span>配置要求<span class="cnt">暂无数据</span></h4>
      <div class="dhint">源站与 Steam 官方接口都<b>没有这款游戏的配置要求</b>（多为独立小游戏 / 未上架 Steam 的作品）。</div></div>`);
  }
}

/** 同分类更多（上游 data/related.js 多因子打分：类型交集 IDF 加权 + 系列名 + 评分 / 容量接近度）。 */
async function ddRelated(base, a, det, seq){
  const nm = String(a.game || a.title || det.title || '').split('/')[0].trim();
  if (!nm) return;
  const g = (det.genres && det.genres[0]) || (a.genres && a.genres[0]) || a.cat || '';
  const r = await ddJson(base,
    '/api/library/related?t=' + encodeURIComponent(nm) + (g ? '&g=' + encodeURIComponent(g) : '') + '&limit=6', 15000);
  if (seq !== DD_SEQ) return;
  const items = ((r && r.items) || []).filter(x => x && x.title);
  if (!items.length) { ddSet('ddRel', ''); return; }
  DD_REL = items;
  ddSet('ddRel', `<div class="dblock"><h4><span class="ic"></span>同分类更多<span class="cnt">${items.length} 款</span></h4>
    <div class="drel">${items.map((x, i) => {
      const parts = String(x.title || '').split('/');
      const t = (parts[0] || '').trim(), en = (parts[1] || '').trim();
      const meta = [x.genres && x.genres[0], x.size].filter(Boolean).join(' · ') || en || '—';
      return `<button type="button" class="drelit" data-rel-i="${i}">
        <span class="th">${x.cover ? `<img src="${esc(x.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</span>
        <span class="bd"><span class="tt">${esc(t)}</span><span class="mm">${esc(meta)}</span></span>
      </button>`;
    }).join('')}</div></div>`);
}

/** 画廊翻页（点箭头 / 点缩略图共用）。索引夹在 [0, n-1]，两端按钮置灰。 */
function ddGalGo(g, i){
  const n = g.querySelectorAll('.dgal-sld').length;
  if (!n) return;
  i = Math.max(0, Math.min(n - 1, i));
  g.dataset.i = String(i);
  const trk = g.querySelector('.dgal-trk');
  if (trk) trk.style.transform = 'translateX(' + (-i * 100) + '%)';
  const num = g.querySelector('.dgal-num');
  if (num) num.textContent = (i + 1) + ' / ' + n;
  g.querySelectorAll('.dgal-th').forEach((b, k) => b.classList.toggle('on', k === i));
  const p = g.querySelector('.dgal-nav.prev'), q = g.querySelector('.dgal-nav.next');
  if (p) p.disabled = (i === 0);
  if (q) q.disabled = (i === n - 1);
}

/* 画廊 / 同分类的点击委托（document 级，只绑一次 —— 弹窗内容会整块重渲染，绑在节点上会丢） */
document.addEventListener('click', e => {
  const step = e.target.closest('[data-gal-step]');
  if (step){
    const g = step.closest('[data-gal]');
    if (g) ddGalGo(g, Number(g.dataset.i || 0) + Number(step.dataset.galStep));
    return;
  }
  const go = e.target.closest('[data-gal-go]');
  if (go){
    const g = go.closest('[data-gal]');
    if (g) ddGalGo(g, Number(go.dataset.galGo));
    return;
  }
  const rl = e.target.closest('[data-rel-i]');
  if (rl){
    const it = DD_REL[Number(rl.dataset.relI)];
    if (it) openDetailRec(it, 'lib');   /* 「同分类更多」的条目来自库，没有 Tab 坐标 ⇒ 走 lib 口径 */
  }
});

async function dlLoad(k, force){
  const st = dlSt;
  if (!st || st.busy[k]) return;
  if (!force && st.data[k] !== undefined) return;
  if (!force) {
    /* ★v16-C：命中缓存就直接铺，不再打源站（同一款游戏反复开关弹窗不该重复等 3~8 秒） */
    const c = dlCacheGet(st, k);
    if (c !== undefined) {
      st.data[k] = c; st.cnt[k] = dlCountOf(k, c);
      if (dlSt === st) dlPaint();
      return;
    }
  }
  st.busy[k] = true;
  if (st.tab === k) dlPaint();
  try {
    if (k === 'body') st.data[k] = await dlFetchBody(st);
    else if (k === 'mod' || k === 'modifier') st.data[k] = await dlFetchMods(st, k);
    else st.data[k] = await dlFetchSave(st);
  } catch (e) {
    st.data[k] = { err: String((e && e.message) || e).slice(0, 120) };
  }
  st.busy[k] = false;
  st.cnt[k] = dlCountOf(k, st.data[k]);
  /* ★ 只缓存**成功**结果。失败（尤其 429）不缓存 ——
     否则「重试」会取回同一份失败，按钮就变成了摆设。 */
  const d = st.data[k];
  if (d && !d.err && !(k === 'body' && (d.rateLimited || d.transient))) dlCacheSet(st, k, d);
  if (dlSt === st) dlPaint();
}

/* ★v16-C：结果缓存。TTL 10 分钟。
   动机（都是实测）：① `/api/download` 单次 3~8 秒（要跟随 302），
   ② 机地来源现在被源站 **HTTP 429** 限流，缓存能显著减少触发；③ 用户会反复开关同一款游戏。 */
const DL_CACHE = new Map();
const DL_TTL = 10 * 60 * 1000;
function dlCacheKey(st, k){ return k + '|' + (st.ctx.name || '') + '|' + (st.ctx.url || ''); }
function dlCacheGet(st, k){
  const key = dlCacheKey(st, k), hit = DL_CACHE.get(key);
  if (!hit) return undefined;
  if (Date.now() - hit.at > DL_TTL) { DL_CACHE.delete(key); return undefined; }
  return hit.data;
}
function dlCacheSet(st, k, data){ DL_CACHE.set(dlCacheKey(st, k), { at: Date.now(), data: data }); }

function dlCountOf(k, d){
  if (!d || d.err) return null;
  if (k === 'body') return d.noSrc ? null : (d.items || []).filter(x => x.real).length;
  if (k === 'save') return (d.files || []).length;
  if (k === 'modifier') return (d.items || []).length + (d.trainers || []).length;
  return (d.items || []).length;
}

async function dlFetchBody(st){
  if (!st.ctx.url) return { noSrc: true };
  const j = await dlJson('/api/download?url=' + encodeURIComponent(st.ctx.url), 45000);
  if (!j || !j.ok) return { err: (j && j.error) || '读取失败' };
  /* ★★v16-C：把各分区里的 error **透出来**（2026-10-16 实测发现的口径事故）。
     实测：机地来源的「本体」现在一律回
         sections[i].error = "取 env 失败 HTTP 429 @ /topic/list"，而 items 是空的。
     旧实现只看 `items.length === 0` ⇒ 页面显示「这款游戏暂时没有可直接打开的网盘地址」——
     **把「源站限流」说成了「这游戏没有本体」**。用户 ④ 那句
     「为什么有很多游戏都有本体，但是 APP 点击后无游戏本体可以下载」，
     看到的正是这条被说错的文案（工作台那边读的是本地索引，不受 429 影响，于是两边对不上）。
     ⇒ 这里把「临时故障（限流 / 超时 / 连接失败）」与「真的没有资源」分开标记，
       页面分别给不同文案，并且临时故障一定给「重试」。 */
  const errs = (j.sections || []).map(s => String(s.error || '')).filter(Boolean);
  if (errs.length) {
    const all = errs.join(' ');
    j.secErr = errs[0];
    j.rateLimited = /429|限流|rate.?limit/i.test(all);
    j.transient = /HTTP\s*\d{3}|timeout|超时|ECONN|fetch failed|socket/i.test(all);
  }
  return j;
}

async function dlFetchMods(st, kind){
  const nm = st.ctx.name;
  const key = st.ctx.key;
  /* ★v21：**精确索引优先**（键的来历见 `dlCtxOf`）。
     收益是「准 + 快」：实测 `L:xd-191` 取 mod 717 条 / 5ms，而按名匹配会缺条目。
     ⚠️ 键取不到、或它返回 0 ⇒ **静默回落按名匹配** —— 绝不因为新路挂了就报 0。 */
  if (key) {
    const cat = (kind === 'modifier') ? 'trainers' : 'mod';
    try {
      const r = await dlJson('/api/res/items?cat=' + cat + '&key=' + encodeURIComponent(key), 20000);
      const items = (r && r.items) || [];
      if (kind !== 'modifier' && items.length) {
        return { items: items, count: items.length, exact: true };
      }
      if (kind === 'modifier' && items.length) {
        /* 修改器页签是**两段**：机地社区帖（可点） + trainers 清单（无下载地址）。
           精确键只解决**后半段**；前半段仍走按名匹配 —— 那是社区帖的唯一来源。 */
        let posts = [];
        try {
          const j = await dlJson('/api/mods/match?t=' + encodeURIComponent(nm) + '&kind=modifier&limit=200', 20000);
          posts = (j && j.items) || [];
        } catch (_) { /* 社区帖拿不到不影响清单那半段 */ }
        return { items: posts, count: posts.length, trainers: items, exact: true };
      }
    } catch (_) { /* 精确键失败 ⇒ 落到下面的按名匹配 */ }
  }
  if (!nm) return { items: [], count: 0 };
  const j = await dlJson('/api/mods/match?t=' + encodeURIComponent(nm) + '&kind=' + kind + '&limit=200', 20000);
  const items = (j && j.items) || [];
  if (kind !== 'modifier') return { items: items, count: (j && j.count) || items.length };
  /* 修改器：机地社区帖（可点） + GCM/GTrainers 清单（**没有下载地址**）—— 两段分开 */
  let trainers = [];
  try {
    const t = await dlJson('/api/trainers/match?t=' + encodeURIComponent(nm), 20000);
    trainers = (t && t.items) || [];
  } catch (_) { /* GCM 拿不到不影响社区帖那半段 */ }
  return { items: items, count: (j && j.count) || items.length, trainers: trainers };
}

async function dlFetchSave(st){
  const nm = st.ctx.name;
  const key = st.ctx.key;
  let files = [], loc = null;
  /* ★v21：存档文件同样**精确键优先**（`cat=saves`） */
  if (key) {
    try {
      const r = await dlJson('/api/res/items?cat=saves&key=' + encodeURIComponent(key), 20000);
      files = (r && r.items) || [];
    } catch (_) { /* 回落 */ }
  }
  if (!files.length && nm) {
    try {
      const a = await dlJson('/api/saves-yx/match?t=' + encodeURIComponent(nm), 20000);
      files = (a && a.items) || [];
    } catch (_) { /* 存档包拿不到，继续取位置 */ }
  }
  /* 「存档位置」只有按名查这一条路（它按游戏名索引，没有 libId 键） */
  if (nm) {
    try {
      const b = await dlJson('/api/saves/match?t=' + encodeURIComponent(nm), 20000);
      loc = (b && b.hit) || null;
    } catch (_) { /* 位置库拿不到，不影响文件那半段 */ }
  }
  return { files: files, loc: loc };
}

function dlPaint(){
  const st = dlSt;
  const box = document.getElementById('dlBlock');
  if (!st || !box) return;
  const tabs = DL_TABS.map(m => {
    const n = st.cnt[m.k];
    /* ★v16-C：数字位有三种状态 ——
       `·` 还没取（或取不到数）｜`…` 正在取（用户能看到「自动获取」真的在跑）｜数字 已就绪 */
    const badge = st.busy[m.k] ? '…' : ((n === undefined || n === null) ? '·' : String(n));
    return `<button type="button" class="dlm${st.tab === m.k ? ' on' : ''}" data-dlm="${m.k}">${m.ic} ${m.nm}<i>${badge}</i></button>`;
  }).join('');
  const busyN = DL_TABS.filter(m => st.busy[m.k]).length;
  /* 用户 ④「点击则自动进行获取」⇒ 这里必须让「自动」这件事**看得见**：
     打开弹窗那一刻四路已经在并发跑，标题右侧如实报「自动获取中 n/4」。 */
  const cntTxt = busyN ? `自动获取中 ${DL_TABS.length - busyN}/${DL_TABS.length}` : '本体 / Mod / 修改器 / 存档';
  const d = st.data[st.tab];
  /* ★v21：载入文案要**分页签说话**。
     「本体」那一栏走 `/api/download?url=`，上游要**跟随 302 去抓源站页面**，实测 jidi 源 **8.1 秒**、
     xdgame 源 2 ms；而 Mod / 修改器 / 存档现在走精确键，**5~150 ms** 就回来了。
     ⇒ 一直在空白处写「正在读取…」会让人以为卡死；写清「大概等多久 + 可以先看别的」就变成了可解释的等待。 */
  const loadTxt = (st.tab === 'body')
    ? '<div class="dl-empty">正在读取源站（约 5~10 秒）…<br><span style="font-size:11.5px">嫌慢可以先点上面的 Mod / 修改器 / 存档，那几栏是毫秒级的</span></div>'
    : '<div class="dl-empty">正在读取…</div>';
  const body = (d === undefined) ? loadTxt : dlTabHTML(st.tab, d);
  box.innerHTML = `<h4><span class="ic"></span>下载与资源<span class="cnt">${cntTxt}</span></h4>
    <div class="dlmod">${tabs}</div><div class="dlbody">${body}</div>`;
  box.querySelectorAll('.dlm').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.dlm;
    if (!dlSt || dlSt.tab === k) return;
    dlSt.tab = k; dlPaint(); dlLoad(k);
  }));
  box.querySelectorAll('[data-dlmore]').forEach(b => b.addEventListener('click', () => {
    if (!dlSt) return;
    dlSt.exp[dlSt.tab] = true; dlPaint();
  }));
  /* ★v16-C：重试。**必须同时清缓存**，否则会取回同一份失败结果（按钮变摆设）。
     ★ 属性名是 `data-dlretryk`（retry **k**ey = 页签键），**刻意**与下载管理页的
       `data-dlretry`（值是**任务 id**）区分开 —— 两者都被 document 级委托接住，
       同名会让「重试某个下载任务」与「重试取某个页签数据」撞在一个选择器上。 */
  box.querySelectorAll('[data-dlretryk]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.dlretryk;
    if (!dlSt) return;
    DL_CACHE.delete(dlCacheKey(dlSt, k));
    delete dlSt.data[k];
    delete dlSt.cnt[k];
    dlSt.busy[k] = false;
    dlPaint(); dlLoad(k, true);
  }));
}

function dlRowsHTML(rows){
  return rows.join('');
}

function dlMoreHTML(total, shown, k){
  if (total <= shown) return '';
  const st = dlSt;
  if (st && st.exp[k]) return '';
  return `<button type="button" class="dlmore" data-dlmore>展开全部 ${total} 条</button>`;
}

function dlTabHTML(k, d){
  if (!d) return '';
  /* ★v16-C：整体失败也给重试（原来只有一行红字，用户没有任何可做的动作） */
  if (d.err) return `<div class="dl-empty"><div class="big">⚠️</div>${esc(d.err)}
    <div class="dlretry"><button type="button" class="pbtn sm" data-dlretryk="${esc(k)}">重试</button></div></div>`;
  const st = dlSt;
  const all = (k === 'save') ? (d.files || []) : (d.items || []).filter(x => k !== 'body' || x.real);
  const capped = (st && st.exp[k]) ? all : all.slice(0, DL_CAP);
  let rows = [];

  if (k === 'body') {
    if (d.noSrc) return '<div class="dl-empty"><div class="big">📦</div>这一条没有源站详情页<br><span style="font-size:11px">本体下载要跟着源站页面解析，没有出口。<br>Mod / 修改器 / 存档 不受影响，点上面的页签看</span></div>';
    if (!all.length) {
      /* ★v16-C：临时故障与「真的没有」必须分开说 ——
         这是 ④ 的核心：把 429 说成「没有本体」等于对用户撒谎。 */
      if (d.rateLimited || d.transient) {
        return `<div class="dl-empty"><div class="big">⏳</div>源站暂时<b>限流</b>，本体清单没取到
          <br><span style="font-size:11px">这是<b>源站的临时限制</b>，<b>不是</b>这款游戏没有本体。<br>
          过几分钟点「重试」通常就好了；Mod / 修改器 / 存档 不受影响。<br>
          <span style="opacity:.8">${esc(d.secErr || '')}</span></span>
          <div class="dlretry"><button type="button" class="pbtn sm" data-dlretryk="body">重试</button></div></div>`;
      }
      const why = d.needAuth ? '源站要求<b>登录 / 权限</b>才给网盘地址' : '这款游戏暂时<b>没有可直接打开的网盘地址</b>';
      return `<div class="dl-empty"><div class="big">${d.needAuth ? '🔒' : '📭'}</div>${why}<br><span style="font-size:11px">Mod / 修改器 / 存档 请点上面的页签</span>
        <div class="dlretry"><button type="button" class="pbtn sm" data-dlretryk="body">重试</button></div></div>`;
    }
    rows = capped.map(it => {
      const md = [];
      if (it.server) md.push(esc(it.server));
      if (it.author) md.push(esc(it.author));
      if (it.dpv) md.push('浏览 ' + fmtHot(it.dpv));
      if (it.date) md.push(esc(it.date));
      const lk = [dlBtns(it.real, it.postTitle || it.title || it.name, it.server || '网盘')];
      if (it.pwd) lk.push(`<a class="na">提取码 ${esc(it.pwd)}</a>`);
      if (it.postUrl) lk.push(`<a class="sec" href="${esc(it.postUrl)}" target="_blank" rel="noopener">原帖</a>`);
      return `<div class="dlrow"><div class="bd">
        <div class="tt">${esc(it.postTitle || it.title || it.name || '下载')}</div>
        ${md.length ? `<div class="mt">${md.map(x => `<span>${x}</span>`).join('')}</div>` : ''}
        <div class="lk">${lk.join('')}</div></div></div>`;
    });
  }

  if (k === 'mod' || k === 'modifier') {
    if (!all.length && !(d.trainers || []).length) {
      return `<div class="dl-empty"><div class="big">🧩</div>本机资源库里没有这款游戏的${k === 'mod' ? ' Mod' : '修改器'}<br><span style="font-size:11px">机地社区帖与 GCM 清单都没命中</span></div>`;
    }
    rows = capped.map(it => {
      const lks = (it.links || []).map(l => dlBtns(l.url, it.title, l.kind || '下载'));
      if (it.url) lks.push(`<a class="sec" href="${esc(it.url)}" target="_blank" rel="noopener">原帖</a>`);
      const md = [];
      if (it.author) md.push(esc(it.author));
      if (it.pv) md.push('浏览 ' + fmtHot(it.pv));
      if (it.game) md.push(esc(it.game));
      return `<div class="dlrow"><div class="bd">
        <div class="tt">${esc(it.title || '')}</div>
        ${md.length ? `<div class="mt">${md.map(x => `<span>${x}</span>`).join('')}</div>` : ''}
        <div class="lk">${lks.length ? lks.join('') : '<a class="na">帖内无直链</a>'}</div></div></div>`;
    });
    /* GCM / GTrainers：**只有元数据没有下载地址** —— 单开一段并写明，绝不画成可点的按钮 */
    const tr = d.trainers || [];
    if (tr.length) {
      rows.push(`<div class="dlnote" style="margin:10px 0 6px">GCM / GTrainers 清单 · 共 ${tr.length} 条 —— 这一源<b>只提供元数据，没有下载地址</b></div>`);
      rows.push(...tr.slice(0, DL_CAP).map(x => {
        const md = [esc(x.zh || x.name || '')];
        if (x.version) md.push('版本 ' + esc(x.version));
        if (x.source) md.push(esc(x.source));
        return `<div class="dlrow"><div class="bd">
          <div class="tt">${esc(x.name || x.zh || '')}</div>
          <div class="mt">${md.map(y => `<span>${y}</span>`).join('')}</div>
          <div class="lk"><a class="na">无下载地址</a></div></div></div>`;
      }));
    }
  }

  if (k === 'save') {
    const loc = d.loc;
    if (!all.length && !loc) {
      return '<div class="dl-empty"><div class="big">💾</div>本机资源库里没有这款游戏的存档<br><span style="font-size:11px">游侠存档区与 Ludusavi 路径库都没命中</span></div>';
    }
    if (all.length) {
      rows.push(`<div class="dlnote" style="margin:0 0 6px">存档<b>文件</b>（游侠补丁网）· 共 ${all.length} 条</div>`);
      rows.push(...capped.map(it => {
        const f = it.files || {};
        const lk = [];
        /* ★v15：游侠存档的 `direct` 是**真直链**（实测形如
           https://patch1.ventacorius.com/2024/ALI213-2077-243487.rar）⇒ 交给壳直接下。 */
        if (f.direct) lk.push(dlBtns(f.direct, it.game || it.title, '存档包'));
        for (const n of (f.netdisk || [])) lk.push(dlBtns(n.url, it.game || it.title, n.kind || '网盘'));
        if (f.ed2k) lk.push(dlBtns(f.ed2k, it.game || it.title, 'eD2K'));
        if (it.sourceUrl) lk.push(`<a class="sec" href="${esc(it.sourceUrl)}" target="_blank" rel="noopener">原页</a>`);
        const md = [];
        if (it.game) md.push(esc(it.game));
        if (it.size) md.push(esc(it.size));
        if (it.date) md.push(esc(it.date));
        return `<div class="dlrow"><div class="bd">
          <div class="tt">${esc(String(it.title || '').split('_')[0] || '存档')}</div>
          ${md.length ? `<div class="mt">${md.map(x => `<span>${x}</span>`).join('')}</div>` : ''}
          <div class="lk">${lk.length ? lk.join('') : '<a class="na">无下载通道</a>'}</div></div></div>`;
      }));
    }
    /* 位置库回答的是「放哪」，不是「下什么」—— 按用户口径：降级为底部注释区，不占主区 */
    if (loc && (loc.paths || []).length) {
      rows.push(`<div class="dlnote" style="margin:10px 0 6px">存档<b>位置</b>（Ludusavi 路径库）· ${esc(loc.title || loc.name || '')}</div>`);
      rows.push(...loc.paths.slice(0, 4).map(p =>
        `<div class="dlrow"><div class="bd"><div class="mt" style="margin:0"><span style="word-break:break-all">${esc(p.shown || p.raw || '')}</span></div></div></div>`));
    }
  }

  return dlRowsHTML(rows) + dlMoreHTML(all.length, capped.length, k);
}

function openDetail(tab, i){
  /* ★v8：跨 Tab 取数 —— 首页的轮播 / 精选卡片带着**自己所属的 tab**，
     此时 cur 是 'home'，curList 里没有它们，必须回落到原始数组取。
     同 Tab 内仍用 curList（= 筛选+搜索+排序后的屏幕所见列表），保证「点第 3 张开第 3 条」。 */
  const a = (tab === cur) ? (curList || [])[i] : (D[tab] || [])[i];
  if(!a) return;
  openDetailRec(a, tab);
}

/* ★v16-B：抽出「拿记录直接开弹窗」的那一段 —— 全局搜索弹窗的结果**不属于任何 Tab**，
   没有 (tab, i) 这个坐标可用（它来自 /api/library 的实时结果，不进 D[]）。
   ⇒ 搜索弹窗一律走 openDetailRec(a, 'lib')。行为与点卡片完全一致（同一段代码），
     不是「另写一份弹窗」—— 那种做法必然与主弹窗漂移。 */
function openDetailRec(a, tab){
  const d = detailOf(tab, a);
  const u = esc(d.img || '');

  const hero = d.img
    ? `<img class="dbg" src="${u}" alt="" aria-hidden="true" referrerpolicy="no-referrer" onerror="this.style.display='none'">
       <img class="dfg" src="${u}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
    : `<div class="phbig">🎮</div>`;

  const big = d.big ? `<div class="sline">
      <span class="sbig${d.big.hm ? ' hm' : ''}${d.big.dim ? ' dim' : ''}${d.big.small ? ' sm' : ''}">${esc(String(d.big.v))}${d.big.unit ? `<span class="u">${esc(d.big.unit)}</span>` : ''}</span>
      <span class="smeta">${esc(d.big.lab || '')}
        ${(d.big.chips || []).map(c => `<i class="${c[1] || ''}">${esc(c[0])}</i>`).join('')}</span>
    </div>` : '';

  const kvRows = (d.kv || []).filter(r => r[1] !== '' && r[1] !== null && r[1] !== undefined);
  const kv = kvRows.length
    ? `<div class="dkv">` + kvRows.map(r =>
        `<div class="it"><div class="k">${esc(r[0])}</div><div class="v">${esc(String(r[1]))}</div></div>`).join('') + `</div>`
    : '';

  const blocks = (d.blocks || []).map(b => `<div class="dblock">
      <h4><span class="ic"></span>${esc(b.h)}${b.cnt ? `<span class="cnt">${esc(b.cnt)}</span>` : ''}</h4>
      ${b.text ? `<p>${esc(b.text)}</p>` : ''}
      ${b.tags ? `<div class="dtags">` + b.tags.map(t => `<span class="pill ${t.cls || ''}">${esc(t.t)}</span>`).join('') + `</div>` : ''}
    </div>`).join('');

  const links = (d.links || []).length
    ? `<div class="dblock"><h4><span class="ic"></span>平台直达<span class="cnt">${d.links.length} 个</span></h4>
        <div class="dlinks">` + d.links.map((l, k) =>
        `<a class="${k ? 'sec' : ''}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.t)}</a>`).join('') + `</div></div>`
    : '';

  const seq = ++DD_SEQ;                 /* ★v17：本次会话号（异步补水回包时校验，防串台） */
  const dlgEl = document.getElementById('dlg');
  dlgEl.innerHTML = `
    <div class="dtop">
      ${hero}
      <div class="dgrad"></div>
      <button class="dclose" id="dx" type="button" aria-label="关闭">✕</button>
      ${d.src && d.src.nm ? `<span class="dsrc ${DSRC_CLS[a.srcKey] || ''}">${esc(d.src.nm)}</span>` : ''}
      <div class="dhtitle">
        <h2>${esc(d.title || '')}</h2>
        ${d.en ? `<div class="hen">${esc(d.en)}</div>` : ''}
      </div>
    </div>
    <div class="dbody">
      <!-- ★v17 吸顶小标题条（对齐工作台 .d-mini）：滚过大图后显形，由下面的滚动监听切 .on。
           ⚠️ 本段在模板字符串内部：注释里**不能出现反引号**，否则会提前闭合模板串、整段脚本语法都过不了。 -->
      <div class="dmini" id="dMini">
        ${d.img ? `<span class="th"><img src="${u}" alt="" referrerpolicy="no-referrer" onerror="this.remove()"></span>` : ''}
        <span class="tt">${esc(d.title || '')}</span>
        ${d.src && d.src.nm ? `<span class="sb">${esc(d.src.nm)}</span>` : ''}
      </div>
      ${d.notice ? `<div class="dnotice">${d.notice}</div>` : ''}
      ${big}
      ${kv}

  dlgEl.onscroll = () => {

     所以纯静态部署（线上 demo）不会多出任何东西，也不会留下点不动的死按钮。
     ★v17：详情页内容补水（ddHydrate）同一个契约；两者互不依赖，各自独立发请求。 */
  dlHydrate(tab, a);

/* ★v8 统一的换页入口（侧栏点击与首页「查看全部」共用），负责同步高亮 + 状态记忆
   ★v20：不再无条件 `resetState` —— 每个 tab 记住自己的搜索/筛选/排序/滚动位置（见 TABMEM）。 */
function goTab(tab){
  if(!TABS[tab]) return;
  const same = (tab === cur);
  tabMemSave();                                  /* 先把**离开这个 tab 时**的状态存下来 */
  document.querySelectorAll('.nav a').forEach(x=>x.classList.toggle('on', x.dataset.tab === tab));

    cur = tab;
  }else{
    y = tabMemRestore(tab);
  }
  render();
  const m = document.getElementById('main');
  if(m){
    m.scrollTop = y;

       隔一帧再兜一次；再不行也不纠缠（用户手动滚一下即可）。 */
    if(y) requestAnimationFrame(()=>{ try{ m.scrollTop = y; }catch(e){} });
  }
}

/* ===== ★v13 在线数据更新（用户 2026-10-15 拍板）=============================
   用户口径：「exe 里的数据，启动时从线上拉最新的」。

   策略（网络与离线的取舍）：
     ① 首屏**先用内置 data.js 渲染** —— 快，且断网也能看；
     ② 再**异步**拉线上最新 data.js；
     ③ 仅当线上的 `meta.builtAt` **比内置新**时才替换数据源并重渲染
        —— 重渲染只重建 `#main`，当前 Tab / 搜索词 / 筛选 / 排序都在全局变量里，**状态不丢**；
     ④ 任何异常（断网、404、JSON 坏）一律**静默回落内置快照**，绝不白屏。

   取数通道：Electron 壳里走 `window.__SHELL_FETCH__`（主进程代取，天然绕开 file:// 的 CORS）；
             浏览器里走普通 fetch（线上部署时与 index.html 同域，不受 CORS 限制）。 */
const REMOTE_DATA_URL = 'https://game-intel-client.app.workbuddy.host/data.js';

/* 顶部服务态那一行（`<div class="svc"><i></i><span>…</span></div>`）的两种写法：
   · svcFlash(msg)      —— 临时闪一下，4 秒后还原到**当前常驻文案**
   · svcPin(html,title) —— 常驻改写（实时层接入成功后用），此后所有临时提示都还原到它

   ★ 为什么要有 svcPin（2026-10-16）：
     原来「已接入实时库 · PC 侧 N 条」也是走 svcFlash 的 —— 闪 4 秒就还原成
     「数据快照 · 2026-10-15 18:25」。于是**常驻**文案反而在暗示「数据是旧的、没实时同步」，
     与用户本轮的核心诉求（「数量很少并未实时同步」）正好相反。
     ⇒ 接入成功后改为常驻实时态；内置快照时间退到 title（悬停可见），信息一条不丢。

   ★ token 的作用：挡住「先 flash 后 pin」的还原竞态 ——
     refreshFromRemote() 与 refreshLive() 是**并发**的：若前者先 flash（记住旧文案并起 4 秒定时器），
     后者随后 pin，则定时器到点会把常驻实时态**覆盖回快照**。有了 token，
     期间只要被 pin 过（或又有新 flash），这次还原就作废。 */
let svcBase = null;     /* 当前常驻文案；null = 还没 pin 过，常驻的就是 HTML 里写死那句 */
let svcTok = 0;         /* 每次 flash / pin 递增，定时器只在「仍是自己那次」时才还原 */

function svcFlash(msg){
  const el = document.querySelector('.svc span');
  if(!el) return;
  const back = (svcBase != null) ? svcBase : el.innerHTML;
  const tok = ++svcTok;
  el.innerHTML = msg;
  setTimeout(function(){
    if(tok !== svcTok) return;       /* 期间被 pin 或被新的 flash 顶掉 ⇒ 放弃还原 */
    el.innerHTML = (svcBase != null) ? svcBase : back;
  }, 4000);
}

/* 常驻改写：实时层接入成功后调用一次，把顶栏那一行**永久**切成实时态 */
/* ★v16-G：侧栏底部常驻状态（只在桌面客户端形态可见，见 §v16-G ④）。
   ★ 与 svcPin 的分工：svcPin 管**顶栏那行**（带详情/时间戳），navSet 只管**侧栏那一句**
     短状态 —— 两处都必须有，但不能互相抄：顶栏是给「我想知道到底怎么回事」的人看的，
     侧栏是给「扫一眼现在什么状态」的人看的。 */
function navSet(text, ok){
  const t = document.getElementById('navState');
  if(t) t.textContent = text;
  const f = document.getElementById('navfoot');
  if(f) f.classList.toggle('off', ok === false);
}

function svcPin(html, title){
  const el = document.querySelector('.svc span');
  if(!el) return;
  svcBase = html;
  svcTok++;                          /* 作废所有在途的 flash 还原 */
  el.innerHTML = html;
  if(title != null) el.title = title;
}

async function refreshFromRemote(){
  try{
    let text = null;
    if(typeof window.__SHELL_FETCH__ === 'function'){
      text = await window.__SHELL_FETCH__(REMOTE_DATA_URL);            /* Electron 壳 */
    }else{
      const r = await fetch(REMOTE_DATA_URL + '?t=' + Date.now(), { cache:'no-store' });
      if(r.ok) text = await r.text();                                   /* 浏览器 */
    }
    if(!text) return;

    /* data.js 是 `window.__DEMO_DATA__ = {…};`，取首尾大括号当成 JSON 解析 */
    const i = text.indexOf('{'), j = text.lastIndexOf('}');
    if(i < 0 || j <= i) return;
    const nd = JSON.parse(text.slice(i, j + 1));
    if(!nd || !nd.meta || !nd.meta.builtAt) return;

    const oldT = (D.meta && D.meta.builtAt) || '';
    if(String(nd.meta.builtAt) <= String(oldT)) return;   /* 不比内置新 ⇒ 什么都不做 */

    D = nd;
    T = nd.totals || {};
    window.__DEMO_DATA__ = D;
    const b = document.getElementById('builtAt');
    if(b) b.textContent = nd.meta.builtAt;
    render();
    svcFlash('数据已更新 · ' + nd.meta.builtAt);
  }catch(e){
    /* 网络异常 ⇒ 静默沿用内置快照（离线可用是本设计的硬要求） */
  }
}

/* ===== ★v15 本机数据层（取代 v14 的「PC 工作台」跳转导航）=================
   用户 2026-10-16 口径两条：
     ① 「移除，这个是单独的项目」→ 不再把用户跳到上游网页；
     ② 「游戏还是 demo，数量很少并未实时同步」→ 数据要接**全量实时库**。

   所以这一段的职责从「跳转」变成了「**取数**」：
     · 探到本机服务 ⇒ PC 侧各 Tab 换成实时全量（/api/library/browse 等）；
     · 探不到        ⇒ 一切照旧，继续用内置 data.js 快照，**不报错、不留死链接**。

   ★ 为什么复用 `dlBoot()` 的探测结果：详情弹窗那边已经在探同一个服务根，
     再探一遍纯属浪费（还会让「服务刚起来/刚挂掉」时两处结论打架）。
     这里只**读**它的结论，不改变「只探一次」的性质。 */
function liveBase(){
  if(typeof DL_BOOT === 'undefined' || !DL_BOOT) return Promise.resolve(null);
  return (typeof DL_BASE === 'string' && DL_BASE) ? Promise.resolve(DL_BASE) : DL_BOOT;
}
async function liveJson(path){
  const base = await liveBase();
  if(!base) return null;
  try{
    const r = await fetch(base + path, { cache:'no-store' });
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

/* ---- 实时全量：把上游原始形状映射成 demo 卡片形状（字段对照见 _build_data.py）---- */
const LIVE_SRC_TAG = { xdgamer:'XD', jidi:'机地', steam:'STEAM', mh:'手机库' };
const LIVE_SRC_KEY = { xdgamer:'xd', jidi:'jidi', steam:'steam', mh:'jidi' };

/* 上游 `/api/library/browse` 的 limit **上限是 100**（实测：传 300/500 都只回 100 条，
   而 total 照常报 19,590）⇒ 想多拿必须靠 offset 翻页。
   `pages` 页拼接，遇到不满一页就说明到底了，提前收手。
   ★ 顺带把接口报的 `total` 带回来 —— 侧栏「游戏库」的计数就是它，
     这样**首屏就有一个真实的全量数字**，不必等用户点进游戏库页才有数（零额外请求）。 */
const LIVE_PAGE = 100;
async function livePage(path, pages){
  const out = [];
  let total = 0;
  for(let i = 0; i < pages; i++){
    const j = await liveJson(path + '&offset=' + (i * LIVE_PAGE));
    const items = (j && j.items) || [];
    if(j && Number(j.total)) total = Number(j.total);
    out.push(...items);
    if(items.length < LIVE_PAGE) break;
  }
  return { items: out, total: total };
}

function livePatchLib(tab, list){
  if(!Array.isArray(list) || !list.length) return 0;
  D[tab] = list;
  return list.length;
}

/* 一次拉齐 PC 侧全量。**并发**发请求，任一失败不影响其它（各自回落快照）。 */
async function refreshLive(){
  if(typeof dlBoot !== 'function') return;
  const base = await dlBoot().catch(()=>null);
  if(!base){
    /* ★v16-G：侧栏底部常驻状态也要如实写「离线」——
       只在顶栏说「数据快照」而侧栏还亮着绿点，就是两处口径打架（本轮刚在 ① 上吃过教训）。 */
    navSet('内置快照 · 未连本机库', false);
    return;                       /* 无服务 ⇒ 静默保持快照 */
  }

  const [pNew, pHot, rank, mods, trainers, mh] = await Promise.all([
    /* pcNew / pcHot 各翻 3 页 = 300 条（快照只有 60 条，这是「数量很少」的主要解药） */
    livePage('/api/library/browse?scope=pc&sort=updated&limit=100', 3),
    livePage('/api/library/browse?scope=pc&sort=hot&limit=100', 3),
    liveJson('/api/rank?limit=120'),
    liveJson('/api/mods/list?limit=300&sort=pv'),
    liveJson('/api/trainers/list?limit=300'),
    liveJson('/api/mobilehub/list?limit=300&sort=configs'),
  ]);

  /* ★v16-A：把上游总量记进 LOCAL.liveTot —— 它**不对用户展示**，
     只用来回答「还能不能往下翻」以及分页条的上界（见 pgTotal / pgEnsure）。
     ① 的诉求就是「别让用户看到互相打架的两个数」，所以这里只存不显。 */
  if(pNew.total) D.libTotal = pNew.total;
  const totOf = (j) => (j && Number(j.total)) || 0;
  LOCAL.liveTot.pcNew     = totOf(pNew);
  LOCAL.liveTot.pcHot     = totOf(pHot);
  LOCAL.liveTot.pcMod     = totOf(mods);
  LOCAL.liveTot.pcTrainer = totOf(trainers);
  LOCAL.liveTot.mPlay     = totOf(mh);

  /* ★ 排序与字段的对应关系（实测，别想当然）：
       sort=updated 的返回**不带 hot 字段**（11 个字段），sort=hot 才带（14 个字段）。
       而 `RANK_BOARDS` 的「PC 热游榜」取的是 `D.pcHot`（= sort=hot）⇒ 热度有值 ✅；
       「PC 新游榜」取 `D.pcNew` 且只要求 `dateLabel` ⇒ 也成立 ✅。 */
  const n1 = pNew.items.length ? livePatchLib('pcNew', pNew.items.map(a=>livePC(a))) : 0;
  const n2 = pHot.items.length ? livePatchLib('pcHot', pHot.items.map(a=>livePC(a))) : 0;
  const n3 = rank && rank.list ? livePatchLib('pcRank', rank.list.map(a=>livePC(a))) : 0;
  const n4 = mods && mods.items ? livePatchLib('pcMod', mods.items.map(a=>liveMOD(a))) : 0;
  const n5 = trainers && trainers.items ? livePatchLib('pcTrainer', trainers.items.map(a=>liveTR(a))) : 0;
  const n6 = mh && mh.items ? livePatchLib('mPlay', mh.items.map(a=>liveMH(a))) : 0;

  const n = n1 + n2 + n3 + n4 + n5 + n6;
  if(!n) return;

  /* 侧栏计数 + 当前页只重渲染一次（状态都在全局变量里，不丢） */
  refreshCounts();
  render();
  /* ★ 用 svcPin 而**不是** svcFlash：实时态必须常驻。
     闪一下就走的话，常驻文案会退回「数据快照 · 2026-10-15 18:25」，
     等于在说「这是旧数据」—— 与本轮「要实时同步」的诉求正好相反。 */
  /* ★★ v16-A：可见文案里**不再出现任何数字**（用户 2026-10-16 ① 口径：
     「不显示数量，避免出问题」）。
     背景：v15 这里写的是「已载 1520 条（库共 19590 款）」—— 两个数并列，
     而侧栏又写着「游戏库 19590」，三处数字口径不同，非常容易被读成「库变小了」。
     ⇒ 可见文案只留「实时库已接入」这个**状态**，具体条数退到 tooltip 与分页条
     （分页条的「共 N 条」永远只描述**你正在看的这张列表**，不与库总量混排）。 */
  svcPin('实时库已接入',
         '数据源：本机实时库（127.0.0.1:8123）· 每页 100 条 × 翻页取满'
         + '　·　本次共取回 ' + n + ' 条'
         + (D.libTotal ? '（库共 ' + D.libTotal + ' 款）' : '')
         + '　·　断网时回落到内置快照 ' + ((D.meta && D.meta.builtAt) || '--'));
  /* ★v16-G：侧栏那句常驻短状态跟顶栏**同时**写 —— 两处口径必须一致，
     所以放在 svcPin 之后紧接着写，而不是散在别处各自猜（那必然漂移）。 */
  navSet('本机实时库 · 已连接', true);
}

/* 上游 → demo 卡片形状（PC 游戏）*/
function livePC(a){
  const g = Array.isArray(a.genres) ? a.genres : [];
  const src = a.source || '?';
  return {
    title: a.title || '', cover: a.cover || '',
    genre: g[0] || '未分类', genres: g.slice(0, 6).map(String),
    score: (a.score === null || a.score === undefined) ? '' : a.score,
    scoreV: Number(a.score) || 0,
    size: a.size || '', sizeGB: size2gb(a.size),
    date: a.dateLabel || '', ts: a.dateLabel || '',
    src: LIVE_SRC_TAG[src] || src, srcKey: LIVE_SRC_KEY[src] || 'other',
    hot: Number(a.hot) || 0, hasHot: Number(a.hot) ? 1 : 0,
    url: a.url || '', alt: a.jidiUrl || '',
    kindTxt: 'PC 端游', intro: '',
    /* ★v16-D：`appid` 必须**透传**，不能再写死空串。
       实测：`sort=hot` / `sort=score` / `/api/library?q=` 三条路径**都返回 appid**
       （剑星 3489700、赛博朋克 1091500），只有 `sort=updated` 不带（11 个字段 vs 14 个）。
       本机扫盘拿到的是 Steam appid ⇒ 这是「本机游戏 ↔ 库记录」最硬的关联键，
       丢掉它就只能靠名字瞎猜（实测名字关联会出「Run → Runehaven」这种假阳性）。 */
    recId: a.id || '', appid: a.appid ? String(a.appid) : '', jidiId: a.jidiId || '', jidiUrl: a.jidiUrl || '',
    srcRaw: src, published: '', updated: '',
    /* ★v16-C：库里**自带**资源计数（`res: {mod, saves, trainers}` + `resId`）——
       「点游戏之前就知道它有没有本体 / MOD / 存档」的**零请求**数据源。
       注意它同样只在 hot / score / 搜索路径返回，`sort=updated` 没有 ⇒ 允许为 null。 */
    res: a.res || null, resId: a.resId || '',
    /* ★ 实时特有：详情弹窗据此直接调 /api/download（不必再靠 URL 反推） */
    liveId: a.id || '',
  };
}
function liveMOD(a){
  const links = Array.isArray(a.links) ? a.links : [];
  return {
    title: a.title || '', game: a.game || '', cover: a.cover || '',
    author: a.author || '', pv: Number(a.pv) || 0,
    kind: a.kind === 'modifier' ? '修改器' : 'MOD',
    kindKey: a.kind || 'mod', kindTxt: a.kind === 'modifier' ? '修改器' : 'MOD',
    postUrl: '', libUrl: a.libUrl || '', libSrc: '',
    src: '机地社区', srcKey: 'jidi',
    url: links[0] ? links[0].url : '',
    nlink: links.length, intro: String(a.content || '').slice(0, 400),
    liveId: a.id || '', liveLinks: links,
  };
}
function liveTR(a){
  return {
    title: a.zh || a.name || '', en: a.name || '',
    cover: a.libCover || '', version: a.version || '',
    src: a.siteLabel || a.source || '修改器', srcKey: a.source === 'fling' ? 'fling' : 'community',
    url: a.officialUrl || a.libUrl || '', steamId: a.steamId || '',
    ts: '', kindTxt: 'PC 修改器', intro: '',
    liveId: a.k || '', liveLibId: a.libId || '',
  };
}
/* ★v16-E：补上**上游本来就返回、但一直被丢掉**的字段（用户 ⑥「爬取评分 / 综合评分」）。
   实测 `/api/mobilehub/list` 每条都带：
     · `libScore` —— 该手游可玩的那个**端游**在库里的评分（上游已按 `0 < score <= 10` 清洗过，
       见 game-aggregator/server.js 的 projectMobile）。8.4 / 9.2 这类值是真实评分，不是我们造的。
     · `libSize`  —— 端游库的容量文本（'16.4GB'）。
     · `hasTr` / `hasSv` —— 该游戏在库里有没有修改器 / 存档。
     · `recent`   —— 社区库最近更新（unix **秒**）。
   ⇒ 这四项**一个额外请求都没打**，纯粹是把已有数据接进 UI —— 这正是用户口径里的
     「**先零新增获取**」（爬取兜底是下一步，本页先用零新增把覆盖率拉满）。
   ⚠️ `dl` 字段**刻意不用**：它在构建脚本里是 `cur.dl += g.n`（社区库累计条数），
      语义与 `configs` 重叠且上游没给明确口径 —— 我们有「宁可不显示也不猜」的红线，
      绝不给它编一个「下载量」标签。 */
function liveMH(a){
  const sc = Number(a.libScore) || 0;
  const tr = Number(a.recent) || 0;
  return {
    title: a.libTitle || a.name, full: a.name, alias: (a.alt || [])[0] || '',
    cover: a.libCover || '',
    tier: (a.tiers && a.tiers[0]) || a.tier || '待测',
    tierKey: (a.tiers && a.tiers[0]) === '可玩' ? 'ok' : 'pending',
    fps: a.bestLabel || '', configs: Number(a.configs) || 0,
    devices: (a.devices || []).length, chip: (a.chips || []).join(' / '),
    url: a.libUrl || '', kindTxt: '手游可玩端游', intro: '',
    score: sc || '', scoreV: sc, scoreLab: '端游库评分',
    size: a.libSize || '', sizeGB: size2gb(a.libSize),
    recent: tr, ts: tr,
    res: (a.hasTr || a.hasSv) ? { trainers: a.hasTr ? 1 : 0, saves: a.hasSv ? 1 : 0 } : null,
    recId: a.libId || '', appid: '',
    liveId: a.libId || '',
  };
}
/* size 文本（'640MB' / '1.7GB'）→ GB 数，供「容量最大」排序。
   ★ 与 _build_data.py 的 size_gb() 同规则：只认 MB / GB，无单位返回 0。 */
function size2gb(s){
  const m = String(s || '').match(/([\d.]+)\s*(GB|MB|TB)/i);
  if(!m) return 0;
  const v = parseFloat(m[1]) || 0, u = m[2].toUpperCase();
  return u === 'TB' ? v * 1024 : (u === 'MB' ? v / 1024 : v);
}

/* 侧栏计数：抽成函数，供首屏与实时刷新**共用一份实现**（防两处漂移）。
   ★v15：新增 lib / myGames / downloads 三个本机 Tab 的计数。 */
function refreshCounts(){
  ['home','pcNew','pcHot','pcRank','pcTrainer','pcMod','mNew','mEvent','mPlay'].forEach(k=>{
    const el=document.getElementById('c-'+k);
    if(!el) return;
    if(k === 'home'){ el.textContent = heroItems().length; return; }
    if(k === 'pcRank'){
      el.textContent = RANK_BOARDS.reduce((n,b)=>{
        const src = D[b.tab] || [];
        return n + Math.min(b.top, src.filter(b.has).length);
      }, 0);
      return;
    }
    el.textContent = (D[k]||[]).length;
  });
  const cl=document.getElementById('c-lib');   if(cl) cl.textContent = (D.libTotal!=null? D.libTotal : '—');
  const cm=document.getElementById('c-myGames'); if(cm) cm.textContent = (LOCAL.games||[]).length || '—';
  const cd=document.getElementById('c-downloads'); if(cd) cd.textContent = (DL_JOBS||[]).length || '—';
}

/* ★v8：默认落地在首页 */
resetState('home');
linkLoad();            /* ★v16-D：先把本机游戏的**手动关联表**读回来（零请求、离线可用） */
olLoad();              /* ★v16-H：读回 OpenList **配置**（地址/令牌/目录/实验开关）。
                          `probed` 不落盘 ⇒ 读回后 olReady() 仍是 false，
                          必须本次会话真的「连接测试」成功过才算数。 */
dlJobsLoad();          /* ★v24：读回**下载任务表**（重启后历史还在）。
                          必须在首次 render/refreshCounts **之前** —— 否则侧栏计数先按 0 画一次。 */
render();
refreshCounts();
refreshFromRemote();   /* ★v13：不 await —— 绝不阻塞首屏 */
refreshLive();         /* ★v15：再叠实时全量（比快照新则覆盖对应 Tab） */
</script>
