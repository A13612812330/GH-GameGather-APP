}

/* ---------------- ★v10 排行榜：4 个分榜 ----------------
   用户口径：**不要搜索、不要品类筛选**，只要 PC 新游 / PC 热游 / 手机新游 / 手机热游 四个榜。

   与原实现的三点差别：
     ① 榜的维度从「最新上架 / 热度 / 容量」换成「端 × 冷热」—— 容量榜整块取消。
     ② 数据池 = **各自 Tab 的池子**（pcNew / pcHot / mNew），不再是独立的 pcRank 池。
        这样行上的 `data-d`（tab）天然对齐 openDetail 的取数路径，点榜行 = 点那个 Tab 的同一条。
     ③ 本页**不挂搜索、不挂筛选**：四个榜跨 3 个 Tab、来源口径也不一致
        （PC 是 XD / 机地，手游是 TapTap / 好游 / 小七），一套筛选器套上去必然有榜被筛空。

   ⚠️ 手机热游榜的**口径坑**（实测，别绕过去）：
     mNew 的 `hot` 跨源**差 3 个数量级** —— TapTap 关注最高 822 万 / 好游快爆预约 143 万 /
     小七预约 2.2 万；hotLabel 还有 5 种粒度（关注 / 预约 / 评论）。
     直接按 hot 混排 ⇒ 前 12 名会被 TapTap 关注全部占满，榜就退化成「TapTap 关注榜」。
     所以做**按源归一化**：先把每条换算成「在本源内的百分位 0~1」再混排，
     行内标注原始口径，**原始数值照常展示、不篡改**。
*/
const RANK_BOARDS = [
  { nm:'PC 新游榜', ic:'🆕', tab:'pcNew', top:12,
    sub:'上架日期降序 · Top 12',
    has:a=>!!a.ts,
    sort:(a,b)=>String(b.ts||'').localeCompare(String(a.ts||'')),
    txt:a=>a.date || '—', dim:true },

  { nm:'PC 热游榜', ic:'🔥', tab:'pcHot', top:12,
    sub:'热度降序 · Top 12',
    has:a=>Number(a.hot) > 0,
    sort:(a,b)=>Number(b.hot)-Number(a.hot),
    txt:a=>fmtHot(a.hot), hm:true },

  { nm:'手机新游榜', ic:'📱', tab:'mNew', top:12,
    sub:'上线时间降序 · Top 12',
    has:a=>!!(a.launchTs || a.ts),
    sort:(a,b)=>(Number(b.launchTs)||0)-(Number(a.launchTs)||0) ||
                String(b.ts||'').localeCompare(String(a.ts||'')),
    txt:a=>a.launchText || a.suffix || a.status || '—', dim:true,
    name:a=>a.game || a.title, chip:a=>a.cat || '' },

  { nm:'手机热游榜', ic:'⚡', tab:'mNew', top:12,
    sub:'各源热度归一化后混排 · Top 12',
    has:a=>Number(a.hot) > 0,
    sort:(a,b)=>(hotPct(b)-hotPct(a)) || (Number(b.hot)-Number(a.hot)),
    txt:a=>fmtHot(a.hot), hm:true,
    name:a=>a.game || a.title, chip:a=>a.hotLabel || '' },
];

/* 按源归一化：把每条 hot 换算成「在本源内的百分位」0~1（源内最低=0、最高=1）。
   单条源（n<=1）记 1，避免除零。用**对象引用**当 key —— D.mNew 里的对象是唯一实例。 */
let _HOT_PCT = null;
function hotPctMap(){
  if(_HOT_PCT) return _HOT_PCT;
  _HOT_PCT = new Map();
  const g = {};
  (D.mNew||[]).forEach(a=>{
    if(!(Number(a.hot) > 0)) return;
    const k = a.srcKey || a.src || '?';
    (g[k] = g[k] || []).push(a);
  });
  Object.keys(g).forEach(k=>{
    const arr = g[k].slice().sort((x,y)=>Number(x.hot)-Number(y.hot));
    const n = arr.length;
    arr.forEach((a,idx)=>_HOT_PCT.set(a, n <= 1 ? 1 : idx/(n-1)));
  });
  return _HOT_PCT;
}
const hotPct = a => hotPctMap().get(a) || 0;

const RN_G = ['g1','g2','g3'];

/* ★v10：不再接收外部 list —— 每个榜从**自己那个 Tab 的池子**取数。
   于是 data-d = 该 Tab、data-i = 该 Tab 内的下标，openDetail 走 D[tab][i]，必然对上。 */
function rankBoardsHTML(){
  const out = RANK_BOARDS.map(b=>{
    const src = D[b.tab] || [];
    const rows = src.filter(b.has).sort(b.sort).slice(0, b.top);
    if(!rows.length) return '';
    const body = rows.map((a,k)=>{
      const gi = src.indexOf(a);                 /* 弹窗按该 Tab 的下标取数 */
      const nm = b.name ? b.name(a) : a.title;
      const chip = b.chip ? b.chip(a) : '';
      return `<div class="rrow" data-d="${b.tab}" data-i="${gi}" title="点击查看 ${esc(nm)} 详情">
        <span class="rno ${RN_G[k]||''}">${k+1}</span>
        ${cover(a.cover || a.img, 'rth')}
        <span class="rgname">${titleHTML(nm)}</span>
        ${chip?`<span class="rpill">${esc(chip)}</span>`:''}
        <span class="rval ${b.hm?'hm':''}${b.dim?' dim':''}">${esc(b.txt(a))}${b.unit?`<span class="u">${esc(b.unit)}</span>`:''}</span>
      </div>`;
    }).join('');
    return `<div class="rankboard">
      <div class="rbhead"><span class="rbic">${b.ic}</span><h3>${b.nm}</h3><span class="rbsub">${b.sub}</span></div>
      <div class="rlist">${body}</div>
    </div>`;
  }).join('');
  return out
    ? `<div class="rankboards">${out}</div>`
    : `<div class="empty"><div class="big">🏆</div>榜单暂无可排的数据</div>`;
}

/* ---------------- ★v8 首页（用户需求⑤）：大图轮播 + 三块精选 ----------------
   轮播条目取自真实数据（PC 热游按热度 / PC 新游按上架 / 手游新游按热度），
   **不新造内容**；每条都带 (tab, 下标)，点「查看详情」走同一个弹窗。 */
const HERO_MS = 5000;
let heroIdx = 0, heroTimer = null;

function heroItems(){
  const pick = (tab, n, cmp, ok) => (D[tab]||[])
    .map((a,i)=>({a,i}))
    .filter(x=>!ok || ok(x.a))
    .sort((x,y)=>cmp(x.a,y.a))
    .slice(0,n)
    .map(x=>({tab, a:x.a, i:x.i}));
  const byHot = (a,b)=>Number(b.hot||0)-Number(a.hot||0);
  const byTs  = (a,b)=>String(b.ts||'').localeCompare(String(a.ts||''));
  return [
    ...pick('pcHot', 3, byHot, a=>Number(a.hot)>0).map(x=>({...x, badge:'PC 热游', cls:'hot'})),
    ...pick('pcNew', 3, byTs).map(x=>({...x, badge:'PC 新游', cls:''})),
    ...pick('mNew',  3, byHot, a=>Number(a.hot)>0).map(x=>({...x, badge:'手游新游', cls:'mb'})),
  ];
}
/* 小工具：从游戏记录里取「中文名 / 英文名（括号）」与可展示指标 */
function heroMeta(it){
  const a = it.a;
  const p = nameParts(a.title || a.game || '');
  const stats = [];
  if(it.tab === 'mNew'){
    if(Number(a.score) > 0) stats.push(['评分', fmtScore(a.score), '']);
    if(Number(a.hot) > 0)   stats.push([a.hotLabel || '热度', fmtHot(a.hot), 'up']);
    (a.sources||[]).forEach(s=>stats.push(['来源', s.src, 'dim']));
  }else{
    if(Number(a.scoreV) > 0) stats.push(['评分', Number(a.scoreV).toFixed(1), '']);
    if(Number(a.hot) > 0)    stats.push(['热度', fmtHot(a.hot), 'up']);
    if(a.size)               stats.push(['容量', a.size, 'dim']);
    if(a.genre)              stats.push(['品类', a.genre, 'dim']);
  }
  return {
    title: p.main, en: p.changed ? p.en : '',
    cover: a.cover || a.img || '',
    srcKey: a.srcKey || (a.sources && a.sources[0] && a.sources[0].key) || '',
    srcName: a.src || (a.sources || []).map(s=>s.src).join(' + ') || '',
    tags: (a.tags || []).slice(0,2),
    cat: a.genre || a.cat || '',
    intro: a.intro || '',
    stats,
    url: a.url || '',
  };
}
function renderHome(){
  const items = heroItems();
  const slides = items.map((it,k)=>{
    const m = heroMeta(it);
    const pic = m.cover
      ? `<div class="ph">🎮</div>
         <img decoding="async" referrerpolicy="no-referrer"
              src="${esc(m.cover)}" alt="" onload="reveal(this)" onerror="this.remove()">
         <span class="hsrc ${SRC_CLS[m.srcKey]||''}">${esc(m.srcName||'—')}</span>`
      : `<div class="ph">🎮</div>`;
    const stats = m.stats.map(s=>
      `<div><span class="k">${esc(s[0])}</span><span class="v ${s[2]}">${esc(s[1])}</span></div>`).join('');
    return `<div class="hslide${k===0?' on':''}" data-slide="${k}">
      <div class="hpic">${pic}</div>
      <div class="hinfo">
        <div class="htagrow">
          <span class="hbadge ${it.cls}">${it.badge}</span>
          ${m.cat?`<span class="pill">${esc(m.cat)}</span>`:''}
          ${m.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}
        </div>
        <div class="hname">${esc(m.title)}${m.en?`<span class="en">（${esc(m.en)}）</span>`:''}</div>
        <div class="hstat">${stats}</div>
        ${m.intro?`<div class="hintro">${esc(m.intro)}</div>`:''}
        <div class="hbtns">
          <button type="button" data-hero-d="${it.tab}" data-hero-i="${it.i}">查看详情</button>
          ${m.url?`<a class="sec" href="${esc(m.url)}" target="_blank" rel="noopener">打开原页</a>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  /* ★v9：右侧两张预览小卡 —— 取「下一张 / 下下张」（循环），随主图一起切 */
  const N = items.length;
  const sets = items.map((_,k)=>{
    const card = x=>{
      const mm = heroMeta(x);
      return `<div class="hsitem" data-hero-d="${x.tab}" data-hero-i="${x.i}" title="点击查看 ${esc(mm.title)} 详情">
        <div class="ph">🎮</div>
        ${mm.cover?`<img decoding="async" referrerpolicy="no-referrer" src="${esc(mm.cover)}" alt="" onload="reveal(this)" onerror="this.remove()">`:''}
        <span class="cap"><span class="bd">${x.badge}</span>${esc(mm.title)}</span>
      </div>`;
    };
    return `<div class="hside-set${k===0?' on':''}" data-set="${k}">${
      [items[(k+1)%N], items[(k+2)%N]].map(card).join('')}</div>`;
  }).join('');

  const dots = items.map((_,k)=>`<i class="${k===0?'on':''}" data-hero-dot="${k}"></i>`).join('');
  const hero = N ? `<div class="hero" id="hero">
    <div class="hmain" id="heroSlides">
      ${slides}
      <div class="hctrl">
        <button type="button" data-hero-nav="-1" aria-label="上一张">‹</button>
        <div class="hdots" id="heroDots">${dots}</div>
        <button type="button" data-hero-nav="1" aria-label="下一张">›</button>
      </div>
      <div class="hprog" id="heroProg"></div>
    </div>
    <div class="hside" id="heroSide">${sets}</div>
  </div>` : '';

  const sec = (ic, nm, sub, tab, rows, list, kind) => `<div class="hsec">
    <div class="hsechd"><span class="ic">${ic}</span><h3>${nm}</h3><span class="sub">${sub}</span>
      <button class="more" type="button" data-go="${tab}">查看全部 ›</button></div>
    <div class="hseclist ${kind}">${rows.map(r=>list(r.a, r.i, tab)).join('')}</div>
  </div>`;

  const wrap = (tab, n, cmp, ok) => (D[tab]||[])
    .map((a,i)=>({a,i})).filter(x=>!ok || ok(x.a)).sort((x,y)=>cmp(x.a,y.a)).slice(0,n);
  const byHot = (a,b)=>Number(b.hot||0)-Number(a.hot||0);
  const byTs  = (a,b)=>String(b.ts||'').localeCompare(String(a.ts||''));

  /* ★v10：数量必须与 CSS 的**固定列数**配对，否则又会出现孤行：
     PC 两块各 10 张（5 列 × 2 行）；手游块 6 张（3 列 × 2 行）。 */
  const pcNew  = wrap('pcNew', 10, byTs);
  const pcHot  = wrap('pcHot', 10, byHot, a=>Number(a.hot)>0);
  const mbNew  = wrap('mNew', 6, byHot, a=>Number(a.hot)>0);

  return hero
    + sec('🎮','PC 新游 · 精选','最新上架 · Top 10','pcNew', pcNew, (a,i,t)=>cardPC(a,i,false,t), 'pc')
    + sec('🔥','PC 热游 · 精选','按热度 · Top 10','pcHot', pcHot, (a,i,t)=>cardPC(a,i,false,t), 'pc')
    + sec('📱','手游新游 · 精选','按热度（三源合并） · Top 6','mNew', mbNew, (a,i,t)=>cardMNew(a,i,t), 'mb');
}
function heroGo(k){
  const slides = document.querySelectorAll('#heroSlides .hslide');
  if(!slides.length) return;
  const n = slides.length;
  heroIdx = ((k % n) + n) % n;
  slides.forEach((el,i)=>el.classList.toggle('on', i === heroIdx));
  /* ★v9：右侧两张预览小卡跟着主图一起切 */
  document.querySelectorAll('#heroSide .hside-set').forEach((el,i)=>el.classList.toggle('on', i === heroIdx));
  document.querySelectorAll('#heroDots i').forEach((el,i)=>el.classList.toggle('on', i === heroIdx));
  syncImgs(document.getElementById('heroSlides'));
  syncImgs(document.getElementById('heroSide'));
}
function stopHero(){ if(heroTimer){ clearInterval(heroTimer); heroTimer = null; } }
function startHero(){
  stopHero();
  const root = document.getElementById('hero');
  if(!root) return;
  heroGo(0);
  const tick = ()=>{ heroTimer = setInterval(()=>heroGo(heroIdx+1), HERO_MS); };
  tick();
  /* 悬停暂停：用户在看某一条时不该被切走 */
  root.addEventListener('mouseenter', stopHero);
  root.addEventListener('mouseleave', ()=>{ stopHero(); tick(); });
}

/* ---------------- 渲染 ---------------- */
/* ===== ★v13 搜索重做（NEXT P0-1）================================================
   原实现：`list.filter(a => JSON.stringify(a).toLowerCase().includes(k))`
     —— 把整条记录序列化后做子串匹配。三个毛病：
     ① 搜 `http` 会命中**每一条**（URL 参与匹配）；
     ② 命中的是哪个字段、为什么命中，用户无从得知；
     ③ 无权重 —— 主名命中和简介命中一视同仁。

   现改为：**显式字段白名单 + 命中字段加权**。
     · 只在这些字段里找（不再把整条记录扔进去）；
     · 字段按「用户搜索意图」从强到弱排在 SEARCH_FIELDS 里，
       命中越靠前的字段得分越高，结果按得分降序（同分保持原有顺序，sort 是稳定的）。
   注意：**不加高亮**（那要动卡片渲染层，风险外溢），本轮只解决「搜得到 / 排序合理」。 */
const SEARCH_FIELDS = [
  ['title', 'game', 'full'],                    /* ① 游戏主名 —— 最强信号 */
  ['en', 'enName', 'alias', 'aliases'],         /* ② 英文名 / 别名 */
  ['publisher', 'author', 'src', 'srcName'],    /* ③ 厂商 / 作者 / 来源 */
  ['genre', 'cat', 'tags'],                     /* ④ 品类 / 标签 */
  ['intro', 'note', 'launchText'],              /* ⑤ 简介 / 备注 —— 最弱 */
];
function searchScore(a, k) {
  for (let i = 0; i < SEARCH_FIELDS.length; i++) {
    for (const f of SEARCH_FIELDS[i]) {
      const v = a[f];
      if (v === undefined || v === null || v === '') continue;
      const arr = Array.isArray(v) ? v : [v];
      for (const x of arr) {
        if (String(x).toLowerCase().includes(k)) return SEARCH_FIELDS.length - i;
      }
    }
  }
  return 0;
}

function render(){
  const main=document.getElementById('main'), cfg=TABS[cur];
  /* ★v11：把当前 Tab 写到 #main 上，作为「按 Tab 自适应卡位比例」的 CSS 锚点
     —— `#main[data-tab="pcNew"]{--th-ar:16 / 9}`，其余 Tab 走 #main 默认的 3/2。
     原有控制流一律不动，本行只新增一个属性。 */
  main.dataset.tab = cur;
  const head=`<div class="crumb"><h2>${cfg.t}</h2>
    <span class="srcbadge real">● 真实数据</span></div>`;

  stopHero();                                   /* ★ 离开首页前先停掉轮播计时器 */
  if(cur==='home'){
    main.innerHTML = head + renderHome() + footNote();
    bindMain(main); syncImgs(main); startHero();
    return;
  }

  const all = D[cur] || [];
  /* ★v13：原来的 `groups` / `list` 两个局部变量已随「筛选+搜索+排序」下沉到
     listSection()，render 这一层不再需要它们（留着就是死代码）。 */

  /* ★v10：排行榜 = 4 个分榜页，**整体绕过「搜索 + 筛选 + 排序栏」**（用户口径：不要搜索/品类筛选）。
     每榜自带池子与排序，所以这里既不过滤也不渲染 filterBar。
     —— 早退必须放在这一步、而不是继续往下走：否则会渲染出一个对本页毫无作用的搜索框。 */
  if(cfg.rankBoard){
    curList = all;                       /* 保留：本页已无 data-d="pcRank" 的行，仅作兜底 */
    main.innerHTML = head + noticeFor(cur) + rankBoardsHTML() + footNote();
    bindMain(main);
    syncImgs(main);
    return;
  }

  const bar = filterBar(cur, all);
  const sec = listSection(cur, all);
  /* ★v13：结果网格外面多包了一层 `#listbox` —— 它没有样式，纯粹是「可单独替换的锚点」，
     供搜索时只换列表、不重建外壳（详见 refreshList 与 bindMain 里的说明）。 */
  main.innerHTML = head + noticeFor(cur) + bar
                 + `<div id="listbox">${sec.grid}</div>` + footNote();
  updateCount(sec.n, all.length);
  bindMain(main);
  syncImgs(main);      /* ★v6：对「已在缓存里、没派发 load」的图补跑一次自适应 */
}

/* ---------------- ★v13 结果列表：筛选 + 搜索 + 排序 + 建网格 ----------------
   抽成独立函数，是因为它现在有**两个调用方**、且必须共用同一份实现（否则两处必然漂移）：
     · render()       —— 整页渲染（切 Tab / 点排序 / 点筛选）
     · refreshList()  —— 只换结果列表（搜索框输入时）
   返回 { grid, n }：grid 是可直接塞进 #listbox 的片段，n 是命中条数。 */
function listSection(tab, all){
  const cfg = TABS[tab];
  let list = all.slice();

  // 筛选（★v5：字段可能是数组，如手游多平台 srcKeys）
  for(const g of (FILTERS[tab]||[])){
    const set=fx[g.k];
    if(set && set.size) list = list.filter(a=>{
      const v=a[g.field];
      return Array.isArray(v) ? v.some(x=>set.has(x)) : set.has(v);
    });
  }

  /* 搜索（★v13：字段白名单 + 加权，取代 JSON.stringify 全量匹配） */
  let sc = null;                       /* 命中打分表；无搜索词时为 null（不参与排序） */
  if(kw){
    const k = kw.trim().toLowerCase();
    if(k){
      sc = new Map();
      const hit = [];
      for(const a of list){
        const s = searchScore(a, k);
        if(s > 0){ sc.set(a, s); hit.push(a); }
      }
      list = hit;
    }
  }

  // 排序（分榜页没有排序按钮，榜单自带排序）
  const cmp=CMP[sortK];
  if(cmp) list.sort(cmp);
  /* ★v13：搜索命中按得分降序。**放在 cmp 之后**，且 Array#sort 是稳定的 ⇒
     同分结果保留用户选的排序，只把「主名命中」这类强信号顶到前面。 */
  if(sc) list.sort((a,b)=>sc.get(b)-sc.get(a));

  let grid;
  if(!list.length){
    grid=`<div class="empty"><div class="big">🔍</div>没有匹配的结果<br><span style="font-size:12px">试试清空筛选或搜索词</span></div>`;
  }else{
    const body=list.map((a,i)=>{
      if(tab==='pcNew'||tab==='pcHot') return cardPC(a,i,false,tab);
      /* ★v10：pcRank 已在 render 的 rankBoard 分支里早退，不会再走到这里 */
      if(tab==='pcTrainer')return cardTrainer(a,i,tab);
      if(tab==='pcMod')    return cardMod(a,i,tab);
      if(tab==='mPlay')    return cardPlay(a,i,tab);     /* ★ 与 PC 端游同骨架 */
      if(tab==='mEvent')   return cardMEvent(a,i,tab);
      return cardMNew(a,i,tab);
    }).join('');
    grid=`<div class="grid ${cfg.kind==='mb'?'mb':'pc'}">${body}</div>`;
  }

  curList = list;                      /* ★ 弹窗按序号取数据 */
  return { grid, n: list.length };
}

/* ★v13：只重刷结果列表，**不动 #main 的外壳**（页头 / 提示条 / 筛选栏 / 页脚一律原样留着）。
   这是「搜索框不再丢焦点」的根治办法 —— 详见 bindMain 里那段说明。 */
function refreshList(){
  const main=document.getElementById('main'); if(!main) return;
  const box=main.querySelector('#listbox');
  if(!box) return;                     /* 首页 / 排行榜页没有列表区，直接退出 */
  const all = D[cur] || [];
  const sec = listSection(cur, all);
  box.innerHTML = sec.grid;
  updateCount(sec.n, all.length);
  syncImgs(box);
}

/* 结果计数（`显示 N / 共 M 条`）—— render 与 refreshList 共用 */
function updateCount(n, total){
  const fc=document.getElementById('fcount');
  if(fc) fc.textContent = `显示 ${n} / 共 ${total} 条`;
}

/* 统一的交互绑定（列表页与报告页共用；报告页也必须走这里，否则折叠点击不会生效） */
function bindMain(main){
  const inp=document.getElementById('kw');
  if(inp){
    /* ★v13：搜索框不再整页重渲染。
       原实现（v8~v12）：
         kw = e.target.value; render();
         const n=document.getElementById('kw'); if(n){ n.focus(); n.setSelectionRange(p,p); }
       —— 两个毛病其实是**同一个根因**：
         · render() 会重建整个 #main，输入框节点本身也被替换 ⇒ 焦点与光标必然丢失，
           于是只能在渲染后「把焦点和光标手工捞回来」，这就是那两行 hack；
         · 而重建的代价远不止输入框 —— 页头 / 提示条 / 筛选栏 / 页脚全部重算并重新绑定，
           长列表下每敲一个字都要跑一遍。
       现在改为只替换 #listbox（见 refreshList）：输入框节点原样保留，
       ⇒ **焦点与光标天然不丢，hack 整段删除**；筛选栏也不重建，不会出现重复绑定。

       ★ 刻意**不做防抖**：防抖只是把「渲染太频繁」这个表象压下去，根因是「渲染范围过大」；
         而且防抖会把 DOM 更新推到定时器里 —— 输入与结果不再同步，
         依赖「派发 input 后立即读 DOM」的同步断言会读到旧 DOM。根治范围问题后，同步更新不再有代价。 */
    inp.addEventListener('input', e=>{
      kw = e.target.value;
      refreshList();
    });
  }
  main.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{ sortK=b.dataset.sort; render(); }));
  main.querySelectorAll('[data-fg]').forEach(b=>b.addEventListener('click',()=>{
    fxToggle(b.dataset.fg, b.dataset.fv); render();
  }));
  /* ★v8 首页：轮播翻页 / 指示点 / 条目「查看详情」/ 区块「查看全部」 */
  main.querySelectorAll('[data-hero-nav]').forEach(b=>b.addEventListener('click',()=>{
    stopHero(); heroGo(heroIdx + Number(b.dataset.heroNav));
  }));
  main.querySelectorAll('[data-hero-dot]').forEach(d=>d.addEventListener('click',()=>{
    stopHero(); heroGo(Number(d.dataset.heroDot));
  }));
  main.querySelectorAll('[data-hero-d]').forEach(b=>b.addEventListener('click',()=>{
    openDetail(b.dataset.heroD, Number(b.dataset.heroI));
  }));
  main.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>goTab(b.dataset.go)));
}

function footNote(){
  return `<div class="foot"><b>Demo 说明</b>：数据为 ${esc((D.meta&&D.meta.builtAt)||'')} 从本机真实源抽取的<b>快照</b>，非实时、非编造。
    正式版将改为只读 BFF 契约层 <code>/api/cli/intel/*</code>（既有路由一行不改，只加只读出口）；端游报告走 GitHub Pages 旁路。<br>
    <b>图片处理</b>：<b>卡片与轮播</b>一律「容器定比 + <code>object-fit:cover</code> 满幅」——
    卡位统一，方图进 16:9 会裁掉上下约 44%（这是「满幅统一」的代价，取舍见 <code>图片适配对照.html</code>）；
    <b>详情弹窗的大图尺寸完全由 CSS 决定</b>（宽图铺满整宽、方图 / 竖图限高后完整显示），不做任何比例判断 ——
    旧写法用 <code>onload</code> 读原图宽高判比例，图片命中缓存时该回调可能早于节点入树触发而静默失效，方形图会退回
    <code>cover</code> 被裁成一条横带，这就是「弹窗大图被截」的根因。
    所有图片统一带 <code>referrerpolicy="no-referrer"</code>（实测 TapTap 图床对 localhost 来源头返回 HTTP 567）。<br>
    <b>交互</b>：首页为<b>大图轮播</b>（5 秒自动切换、悬停暂停、箭头 / 指示点手动翻页）+ PC 新游 / PC 热游 / 手游新游三块精选；
    <b>排行榜</b>为 <b>PC 新游 / PC 热游 / 手机新游 / 手机热游</b> 四个分榜（各 Top 12，不设搜索与筛选）；
    <b>所有卡片与排行榜行点击均弹窗</b>显示详情（不再直接跳走），弹窗内含大图、评分 / 热度、参数字段、平台直达按钮。<br>
    <b>未实现（Demo 范围外）</b>：实时取数、跨源统一搜索、exe／apk 壳、更新链路、离线快照兜底。</div>`;
}

/* ================= 详情弹窗（★v6：版式对齐 PC 游戏工作台详情抽屉） =================
   结构（自上而下）：hero 大图 + 渐变 + 标题压图 + 来源徽标
                   → 黄色口径提示条 → 大号数字行 → KV 卡片网格 → 分区块（介绍/标签）
                   → 平台直达按钮组 → 底部说明
   ★ 与 v5 的差别：v5 只有「标题 + 标签 + 5 格 KV + 一个链接」，用户反馈「内容太少了」；
     本版把各 Tab 的原项目字段尽可能带出（PC 端游 9 格 KV + 最多 4 个直达入口）。      */
/* 取值兜底：空/0/undefined 一律显示 "—"（注意：别用 T 这个名字，顶部已有 const T = D.totals） */
const nz = (v, d) => (v === undefined || v === null || v === '' || v === 0) ? (d === undefined ? '—' : d) : v;

/* 各来源徽标配色（弹窗右上角） */
const DSRC_CLS = {xd:'src-xd', jidi:'src-jidi', steam:'src-steam',
                  taptap:'src-taptap', haoyou:'src-haoyou', x7:'src-x7',
                  gamersky:'src-gamersky', gcores:'src-gcores'};

function detailOf(tab, a){
  const scls = SRC_CLS[a.srcKey] || '';
  const nm = nameParts(a.title || a.game || '');

  /* ---------------- 手游新游（三源合并卡） ---------------- */
  if(tab === 'mNew'){
    const plats = (a.sources || []);
    let big;
    if(Number(a.score) > 0){
      big = {v: fmtScore(a.score), lab: '评分（源站评分 · 满分 10）',
             chips: [['收录 ' + (a.n || 1) + ' 条', ''],
                     ...(a.hot ? [['热度 ' + fmtHot(a.hot) + '（' + (a.hotLabel || '') + '）', 'wn']] : [])]};
    }else if(a.hot){
      big = {v: fmtHot(a.hot), hm: true, lab: '热度（' + (a.hotLabel || '关注 / 预约数') + '）',
             chips: [['收录 ' + (a.n || 1) + ' 条', '']]};
    }else{
      big = {v: '—', dim: true, lab: '上游暂无评分 / 热度数据',
             chips: [['收录 ' + (a.n || 1) + ' 条', '']]};
    }
    return {
      img: a.img, title: a.game || a.title, en: '',
      src: {nm: plats.map(p => p.src).join(' + ') || a.src, cls: scls},
      notice: '本卡由<b>同一游戏</b>在三源（TapTap / 好游快爆 / 小七）的资讯记录<b>合并</b>而成，多平台会并列多个来源标签；下方列出全部原始链接。',
      big,
      kv: [
        ['上线状态', nz(a.status)],
        ['上线时间', nz(a.launchText || a.tlDate)],
        ['热度', a.hot ? fmtHot(a.hot) : ''],
        ['热度口径', a.hotLabel || ''],
        ['评分', Number(a.score) > 0 ? fmtScore(a.score) : ''],
        ['类目', nz(a.cat)],
        ['发行商', a.publisher || ''],
        ['收录来源', plats.map(p => p.src).join(' + ')],
        ['收录条数', (a.n || 1) + ' 条'],
      ],
      blocks: [
        a.intro ? {h: '游戏简介', text: a.intro} : null,
        (a.tags || []).length ? {h: '游戏标签', cnt: a.tags.length + ' 个',
                                 tags: a.tags.map(t => ({t}))} : null,
      ].filter(Boolean),
      links: (a.links || []).map((x, k) => ({t: '打开 ' + x.src + ' 原页', url: x.url, sec: k > 0})),
      foot: '上线时间取自各源预约 / 上线时间戳；好游快爆无时间戳的记录用其时间轴日期（<code>timelineDate</code>），不推算年份。',
    };
  }

  /* ---------------- 手游活动 ---------------- */
  if(tab === 'mEvent'){
    return {
      img: a.img, title: a.game || a.title, en: subOf(a),
      src: {nm: a.src || '', cls: scls},
      big: null,
      kv: [
        ['所属游戏', nz(a.game)],
        ['类目', nz(a.cat)],
        ['资讯时间', nz(a.dateText)],
        ['收录来源', nz(a.src)],
        ['上线状态', nz(a.status)],
        ['上线时间', nz(a.launchText || a.tlDate)],
      ],
      blocks: [{h: '活动标题', text: a.title}],
      links: a.url ? [{t: '打开原页', url: a.url}] : [],
      foot: '活动<b>不合并</b>：同一游戏的不同活动是不同事件，逐条展示。',
    };
  }

  /* ---------------- 手游可玩端游 ---------------- */
  if(tab === 'mPlay'){
    /* ★v6：帧数原文常是整句（「帧数不显示，轻微卡顿」），量不出区间时不要拿半截句子当大数字 */
    const fs = fpsShort(a.fps);
    let big = null;
    if(fs){
      big = {v: fs, lab: '实测帧数', chips: [['配置 ' + a.configs + ' 套', 'gn']]};
    }else if(a.configs){
      big = {v: String(a.configs), lab: '实测配置套数', chips: [[a.fps || '帧数未标注', 'wn']]};
    }
    return {
      img: a.cover, title: a.title,
      en: a.full && a.full !== a.title ? a.full : (a.alias || ''),
      src: {nm: a.tier || '待测', cls: a.tierKey === 'ok' ? 'src-gcores' : ''},
      big,
      kv: [
        ['可玩档位', nz(a.tier)],
        ['实测帧数', nz(a.fps)],
        ['配置套数', nz(a.configs)],
        ['实测设备', a.devices ? a.devices + ' 台' : ''],
        ['代表芯片', a.chip || ''],
        ['英文别名', a.alias || ''],
        ['游戏全名', a.full || ''],
      ],
      blocks: [],
      links: a.url ? [{t: '打开原页', url: a.url}] : [],
      foot: '来自本机 <code>mobilehub.json</code> 的「模拟器可玩性」实测数据（3,264 条游戏 / 16,148 套配置）。',
    };
  }

  /* ---------------- PC 修改器 ---------------- */
  if(tab === 'pcTrainer'){
    return {
      img: a.cover, title: a.title, en: a.en || '',
      src: {nm: a.src || '修改器', cls: scls},
      big: a.version ? {v: a.version, unit: '', lab: '修改器版本', small: true,
                        chips: a.steamId ? [['Steam ' + a.steamId, '']] : []} : null,
      kv: [
        ['中文名', nz(a.title)],
        ['英文名', a.en || ''],
        ['修改器版本', nz(a.version)],
        ['Steam ID', nz(a.steamId)],
        ['来源', nz(a.src)],
        ['类型', '修改器'],
      ],
      blocks: [],
      links: a.url ? [{t: '打开修改器页', url: a.url}] : [],
      foot: '修改器数据来自本机 <code>trainers.json</code>（3,660 条 / 5 个来源），Demo <b>按来源轮询取样</b>避免单一来源淹没。',
    };
  }

  /* ---------------- PC MOD ---------------- */
  if(tab === 'pcMod'){
    return {
      img: a.cover, title: a.title, en: a.game || '',
      /* ★v10：来源是「机地」（单一源），不是「MOD」——MOD 是类型。 */
      src: {nm: a.src || '机地', cls: SRC_CLS[a.srcKey] || ''},
      big: a.pv ? {v: fmtHot(a.pv), lab: '浏览量',
                   chips: [['附带链接 ' + (a.nlink || 0) + ' 条', '']]} : null,
      kv: [
        ['所属游戏', nz(a.game)],
        ['类型', nz(a.kind)],
        ['来源', nz(a.src, '机地')],
        ['作者', nz(a.author, '匿名')],
        ['浏览量', a.pv ? fmtHot(a.pv) : ''],
        ['附带链接', a.nlink ? a.nlink + ' 条' : ''],
      ],
      blocks: [],
      /* ★v10：「原帖」与「游戏页」是**两个不同的东西**，必须分别给。
         原实现写成 `url = libUrl or url`，把机地原帖覆盖成了匹配到的库页面 ⇒
         弹窗上那个「打开原帖」实际打开的是 **XD 的游戏页**（实测 Top60 里 51 条有 libUrl）。
         现在 postUrl（机地原帖）与 libUrl（库页面）各自独立。 */
      links: [
        a.postUrl ? {t: '打开原帖（机地）', url: a.postUrl} : null,
        a.libUrl ? {t: '打开游戏页（' + (a.libSrc === 'xd' ? 'XD' : '机地') + '）', url: a.libUrl} : null,
      ].filter(Boolean).map((l, k) => Object.assign(l, {sec: k > 0})),
      foot: 'MOD 帖采集自 <b>机地</b>（单一来源）；「游戏页」是匹配到的端游库条目，两者不是同一页。'
          + '「附带链接」指该帖附带的网盘 / 下载链接条数，仅展示不跳转网盘。',
    };
  }

  /* ---------------- PC 端游（新游 / 热游 / 排行） ---------------- */
  const links = [
    a.url ? {t: '打开源站详情页', url: a.url} : null,
    a.alt ? {t: '打开机地详情页', url: a.alt} : null,
    (a.jidiUrl && a.jidiUrl !== a.alt) ? {t: '打开机地（跨源）', url: a.jidiUrl} : null,
    a.appid ? {t: 'Steam 商店页', url: 'https://store.steampowered.com/app/' + a.appid + '/'} : null,
  ].filter(Boolean).map((l, k) => Object.assign(l, {sec: k > 0}));
  return {
    img: a.cover, title: nm.main, en: nm.en,
    src: {nm: a.src || '', cls: scls},
    notice: 'PC 端游来自本机 game-aggregator 的 <b>xdgamer + jidi</b> 游戏库（19,239 条），<b>不含 Steam 商店源</b>；Steam 链接为按封面 AppID 拼出的商店页。',
    big: Number(a.score) > 0
      ? {v: a.score, unit: '/ 10', lab: '玩家评分', small: false,
         chips: [a.hot ? ['热度 ' + fmtHot(a.hot), 'wn'] : null, [a.src + ' 收录', '']].filter(Boolean)}
      : (a.hot ? {v: fmtHot(a.hot), hm: true, lab: '热度（入库热度值）', chips: [[a.src + ' 收录', '']]} : null),
    kv: [
      ['游戏类型', (a.genres && a.genres.length) ? a.genres.join(' / ') : (a.genre || '')],
      ['游戏大小', nz(a.size)],
      ['上线日期', nz(a.date)],
      ['源更新时间', a.updated || ''],
      ['源发布时间', a.published || ''],
      ['入库来源', nz(a.src)],
      ['Steam AppID', a.appid ? String(a.appid) : ''],
      ['跨源机地 ID', a.jidiId || ''],
      ['库内记录 ID', a.recId || ''],
    ],
    blocks: [],
    links,
    foot: '全部字段取自本机 <code>games.json</code> 的既有字段（未新增抓取）：<code>appid</code> / <code>jidiId</code> / <code>publishTs</code> / <code>updatedTs</code>。',
  };
}

function openDetail(tab, i){
  /* ★v8：跨 Tab 取数 —— 首页的轮播 / 精选卡片带着**自己所属的 tab**，
     此时 cur 是 'home'，curList 里没有它们，必须回落到原始数组取。
     同 Tab 内仍用 curList（= 筛选+搜索+排序后的屏幕所见列表），保证「点第 3 张开第 3 条」。 */
  const a = (tab === cur) ? (curList || [])[i] : (D[tab] || [])[i];
  if(!a) return;
  const d = detailOf(tab, a);
  const u = esc(d.img || '');

  const hero = d.img
    ? `<img class="dbg" src="${u}" alt="" aria-hidden="true" referrerpolicy="no-referrer" onerror="this.style.display='none'">
       <img class="dfg" src="${u}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
    : `<div class="phbig">🎮</div>`;

  const big = d.big ? `<div class="sline">
      <span class="sbig${d.big.hm ? ' hm' : ''}${d.big.dim ? ' dim' : ''}${d.big.small ? ' sm' : ''}">${esc(String(d.big.v))}${d.big.unit ? `<span class="u">${esc(d.big.unit)}</span>` : ''}</span>
      <span class="smeta">${esc(d.big.lab || '')}
        ${(d.big.chips || []).map(c => `<i class="${c[1] || ''}">${esc(c[0])}</i>`).join('')}</span>
    </div>` : '';

  const kvRows = (d.kv || []).filter(r => r[1] !== '' && r[1] !== null && r[1] !== undefined);
  const kv = kvRows.length
    ? `<div class="dkv">` + kvRows.map(r =>
        `<div class="it"><div class="k">${esc(r[0])}</div><div class="v">${esc(String(r[1]))}</div></div>`).join('') + `</div>`
    : '';

  const blocks = (d.blocks || []).map(b => `<div class="dblock">
      <h4><span class="ic"></span>${esc(b.h)}${b.cnt ? `<span class="cnt">${esc(b.cnt)}</span>` : ''}</h4>
      ${b.text ? `<p>${esc(b.text)}</p>` : ''}
      ${b.tags ? `<div class="dtags">` + b.tags.map(t => `<span class="pill ${t.cls || ''}">${esc(t.t)}</span>`).join('') + `</div>` : ''}
    </div>`).join('');

  const links = (d.links || []).length
    ? `<div class="dblock"><h4><span class="ic"></span>平台直达<span class="cnt">${d.links.length} 个</span></h4>
        <div class="dlinks">` + d.links.map((l, k) =>
        `<a class="${k ? 'sec' : ''}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.t)}</a>`).join('') + `</div></div>`
    : '';

  document.getElementById('dlg').innerHTML = `
    <div class="dtop">
      ${hero}
      <div class="dgrad"></div>
      <button class="dclose" id="dx" type="button" aria-label="关闭">✕</button>
      ${d.src && d.src.nm ? `<span class="dsrc ${DSRC_CLS[a.srcKey] || ''}">${esc(d.src.nm)}</span>` : ''}
      <div class="dhtitle">
        <h2>${esc(d.title || '')}</h2>
        ${d.en ? `<div class="hen">${esc(d.en)}</div>` : ''}
      </div>
    </div>
    <div class="dbody">
      ${d.notice ? `<div class="dnotice">${d.notice}</div>` : ''}
      ${big}
      ${kv}
      ${blocks}
      ${links}
      ${d.foot ? `<div class="dfoot">${d.foot}</div>` : ''}
    </div>`;

  const mask = document.getElementById('mask');
  mask.classList.add('on'); mask.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  syncImgs(document.getElementById('dlg'));
}
function closeDetail(){
  const mask = document.getElementById('mask');
  if(!mask.classList.contains('on')) return;
  mask.classList.remove('on'); mask.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  document.getElementById('dlg').innerHTML = '';
}
/* 弹窗交互：遮罩点击 / 关闭按钮 / ESC（只绑一次） */
(function bindModal(){
  const mask = document.getElementById('mask');
  mask.addEventListener('click', e=>{
    if(e.target.id === 'mask' || e.target.id === 'dx' || e.target.closest('#dx')) closeDetail();
  });
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeDetail(); });
})();
/* ★v8 统一的换页入口（侧栏点击与首页「查看全部」共用），负责同步高亮 + 滚动复位 */
function goTab(tab){
  if(!TABS[tab]) return;
  document.querySelectorAll('.nav a').forEach(x=>x.classList.toggle('on', x.dataset.tab === tab));
  resetState(tab);
  const m = document.getElementById('main'); if(m) m.scrollTop = 0;
  render();
}

/* 卡片 / 排行行点击 → 弹窗（事件委托，绑在 document 上只执行一次） */
document.addEventListener('click', e=>{
  const el = e.target.closest('.card[data-d], .mcard[data-d], .rrow[data-d]');
  if(!el) return;
  const i = Number(el.dataset.i);
  if(!Number.isNaN(i)) openDetail(el.dataset.d, i);
});

/* 侧栏计数 */
['home','pcNew','pcHot','pcRank','pcTrainer','pcMod','mNew','mEvent','mPlay'].forEach(k=>{
  const el=document.getElementById('c-'+k);
  if(!el) return;
  if(k === 'home'){ el.textContent = heroItems().length; return; }
  /* ★v10：排行榜页摆的是「4 个分榜」，侧栏计数就该是**榜上实际行数**。
     继续显示已弃用的 pcRank 池（80 条）会与页面对不上。 */
  if(k === 'pcRank'){
    el.textContent = RANK_BOARDS.reduce((n,b)=>{
      const src = D[b.tab] || [];
      return n + Math.min(b.top, src.filter(b.has).length);
    }, 0);
    return;
  }
  el.textContent = (D[k]||[]).length;
});

document.querySelectorAll('.nav a').forEach(a=>{
  a.addEventListener('click', e=>{ e.preventDefault(); goTab(a.dataset.tab); });
});

/* ===== ★v13 在线数据更新（用户 2026-10-15 拍板）=============================
   用户口径：「exe 里的数据，启动时从线上拉最新的」。

   策略（网络与离线的取舍）：
     ① 首屏**先用内置 data.js 渲染** —— 快，且断网也能看；
     ② 再**异步**拉线上最新 data.js；
     ③ 仅当线上的 `meta.builtAt` **比内置新**时才替换数据源并重渲染
        —— 重渲染只重建 `#main`，当前 Tab / 搜索词 / 筛选 / 排序都在全局变量里，**状态不丢**；
     ④ 任何异常（断网、404、JSON 坏）一律**静默回落内置快照**，绝不白屏。

   取数通道：Electron 壳里走 `window.__SHELL_FETCH__`（主进程代取，天然绕开 file:// 的 CORS）；
             浏览器里走普通 fetch（线上部署时与 index.html 同域，不受 CORS 限制）。 */
const REMOTE_DATA_URL = 'https://game-intel-client.app.workbuddy.host/data.js';

/* 顶部「数据快照」那一行的轻提示：复用既有 .svc 元素，4 秒后还原，不新增 DOM 结构 */
function svcFlash(msg){
  const el = document.querySelector('.svc span');
  if(!el) return;
  const old = el.innerHTML;
  el.innerHTML = msg;
  setTimeout(function(){ el.innerHTML = old; }, 4000);
}

async function refreshFromRemote(){
  try{
    let text = null;
    if(typeof window.__SHELL_FETCH__ === 'function'){
      text = await window.__SHELL_FETCH__(REMOTE_DATA_URL);            /* Electron 壳 */
    }else{
      const r = await fetch(REMOTE_DATA_URL + '?t=' + Date.now(), { cache:'no-store' });
      if(r.ok) text = await r.text();                                   /* 浏览器 */
    }
    if(!text) return;

    /* data.js 是 `window.__DEMO_DATA__ = {…};`，取首尾大括号当成 JSON 解析 */
    const i = text.indexOf('{'), j = text.lastIndexOf('}');
    if(i < 0 || j <= i) return;
    const nd = JSON.parse(text.slice(i, j + 1));
    if(!nd || !nd.meta || !nd.meta.builtAt) return;

    const oldT = (D.meta && D.meta.builtAt) || '';
    if(String(nd.meta.builtAt) <= String(oldT)) return;   /* 不比内置新 ⇒ 什么都不做 */

    D = nd;
    T = nd.totals || {};
    window.__DEMO_DATA__ = D;
    const b = document.getElementById('builtAt');
    if(b) b.textContent = nd.meta.builtAt;
    render();
    svcFlash('数据已更新 · ' + nd.meta.builtAt);
  }catch(e){
    /* 网络异常 ⇒ 静默沿用内置快照（离线可用是本设计的硬要求） */
  }
}

/* ★v8：默认落地在首页 */
resetState('home');
render();
refreshFromRemote();   /* ★v13：不 await —— 绝不阻塞首屏 */
</script>
